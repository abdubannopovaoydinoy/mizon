ikriga qarab startapning mahsuloti yoki biznes-modelini tubdan o'zgartirish.","Пивот","Резкое изменение продукта или бизнес-модели стартапа в ответ на реакцию рынка.","Pivot","A fundamental change in a startup's product or business model based on market feedback."],["biz","Mahsulot-bozor mosligi","Mahsulot bozorning haqiqiy ehtiyojini qondirib, mijozlar tomonidan faol ishlatilayotgan holat.","Соответствие продукта рынку","Состояние, когда продукт удовлетворяет реальную потребность рынка и активно используется клиентами.","Product-market fit","The state in which a product satisfies a real market need and customers actively use it."],["biz","Strategik ittifoq","Kompaniyalarning umumiy maqsadlar uchun birlashmasdan hamkorlik qilishi.","Стратегический альянс","Сотрудничество компаний ради общих целей без слияния в одну организацию.","Strategic alliance","A partnership in which companies cooperate on shared goals without merging."],["biz","Biznes etikasi","Tadbirkorlik faoliyatida to'g'ri va noto'g'ri xatti-harakatni belgilovchi axloqiy me'yorlar.","Деловая этика","Нравственные нормы, определяющие правильное и неправильное поведение в предпринимательской деятельности.","Business ethics","The moral principles that guide what is right and wrong behavior in business."],["biz","Manfaatdor tomonlar","Kompaniya faoliyatidan ta'sirlanadigan yoki unga ta'sir qiladigan shaxslar va guruhlar.","Заинтересованные стороны","Лица и группы, на которых влияет деятельность компании или которые влияют на неё.","Stakeholders","The people and groups affected by a company or able to influence it."],["biz","Ko'k okean strategiyasi","Raqobat bo'lmagan yangi bozor maydonini yaratish orqali o'sishga erishish yondashuvi.","Стратегия голубого океана","Подход к росту через создание нового рыночного пространства, где нет конкуренции.","Blue ocean strategy","A growth approach that creates a new market space where competition is irrelevant."],["biz","Soxta ustav kapital","Biznes boshlashda tashkilotga dastlab kiritilgan hissalar yig'indisi: ustav kapitali.","Уставный капитал","Сумма вкладов учредителей, внесённая при создании организации и гарантирующая интересы кредиторов.","Share capital","The total amount contributed by founders when a company is formed."],["biz","Aylanma mablag'lar","Kompaniya kundalik faoliyati uchun ishlatadigan va tez pulga aylanadigan aktivlar.","Оборотные средства","Активы компании, используемые в текущей деятельности и быстро превращающиеся в деньги.","Working capital","The short-term assets a company uses to fund its day-to-day operations."],["biz","Tannarx","Mahsulot ishlab chiqarish va sotish uchun sarflangan xarajatlar yig'indisi.","Себестоимость","Сумма затрат, связанных с производством и продажей продукции.","Cost of goods","The total cost of producing and selling a product."],["biz","Mijoz segmenti","Bir xil ehtiyoj va xulq-atvorga ega bo'lgan mijozlar guruhi.","Клиентский сегмент","Группа клиентов с одинаковыми потребностями и поведением.","Customer segment","A group of customers with similar needs and behavior."],["xal","Bojxona tarifi","Chegaradan o'tuvchi tovarlarga solinadigan boj stavkalari ro'yxati.","Таможенный тариф","Перечень ставок пошлин, взимаемых с товаров при пересечении границы.","Tariff","A tax charged on imported goods when they cross a border."],["xal","Kvota","Muayyan tovarni import yoki eksport qilishning miqdoriy chegarasi.","Квота","Количественное ограничение на ввоз или вывоз определённого товара.","Quota","A legal limit on the quantity of a good that may be imported or exported."],["xal","Bojxona ittifoqi","Ichki bojlar bekor qilinib, uchinchi davlatlarga yagona tarif qo'llanadigan davlatlar birlashmasi.","Таможенный союз","Объединение стран с отменой внутренних пошлин и единым тарифом для третьих стран.","Customs union","A group of countries with no internal tariffs and a common tariff on outside imports."],["xal","To'g'ridan-to'g'ri xorijiy investitsiyalar (TXI)","Xorijiy investorning boshqa mamlakat korxonasini nazorat qilish maqsadidagi uzoq muddatli mablag' qo'yilmasi.","Прямые иностранные инвестиции (ПИИ)","Долгосрочные вложения иностранного инвестора в предприятие другой страны с целью контроля над ним.","Foreign direct investment (FDI)","A long-term investment by a foreign investor that gives lasting control of a business abroad."],["xal","Valyuta bozori (Forex)","Valyutalar sotib olinadigan va sotiladigan global bozor.","Валютный рынок (Форекс)","Глобальный рынок, на котором покупаются и продаются валюты.","Foreign exchange market (Forex)","The global market where currencies are bought and sold."],["xal","Inkoterms","Xalqaro savdo shartnomalarida yetkazib berish majburiyatlarini belgilovchi standart shartlar.","Инкотермс","Стандартные условия поставки, определяющие обязанности продавца и покупателя в международных контрактах.","Incoterms","Standard international trade terms defining seller and buyer duties for delivery, costs, and risk."],["xal","Valyuta konvertatsiyasi","Milliy valyutani boshqa valyutaga erkin almashtirish imkoniyati.","Конвертируемость валюты","Возможность свободно обменивать национальную валюту на другие валюты.","Currency convertibility","The ease with which a currency can be freely exchanged for other currencies."],["xal","Maxsus iqtisodiy zona (MIZ)","Investorlarga soliq va bojxona imtiyozlari beriladigan, alohida huquqiy rejimli hudud.","Особая экономическая зона (ОЭЗ)","Территория с особым правовым режимом и налоговыми и таможенными льготами для инвесторов.","Special economic zone (SEZ)","A designated area with special tax and customs incentives to attract investment."],["xal","Protektsionizm","Mahalliy ishlab chiqaruvchilarni raqobatdan himoya qiluvchi davlat siyosati.","Протекционизм","Государственная политика защиты отечественных производителей от иностранной конкуренции.","Protectionism","Government policy that shields domestic producers from foreign competition."],["xal","Demping","Tovarni eksport bozorida o'z tannarxi yoki ichki narxidan past narxda sotish.","Демпинг","Продажа товара на экспортном рынке по цене ниже себестоимости или внутренней цены.","Dumping","Selling goods abroad at a price below their cost or home-market price."],["xal","Xalqaro valyuta fondi (XVF)","A'zo davlatlarning valyuta barqarorligi va to'lov balansiga yordam beruvchi xalqaro moliyaviy tashkilot.","Международный валютный фонд (МВФ)","Международная организация, поддерживающая валютную стабильность и платёжные балансы стран-членов.","International Monetary Fund (IMF)","An international organization that promotes monetary stability and lends to countries with balance-of-payments problems."],["xal","Osiyo taraqqiyot banki (OTB)","Osiyo-Tinch okeani mintaqasida iqtisodiy rivojlanishni moliyalashtiruvchi ko'p tomonlama bank.","Азиатский банк развития (АБР)","Многосторонний банк, финансирующий экономическое развитие стран Азиатско-Тихоокеанского региона.","Asian Development Bank (ADB)","A multilateral bank financing economic development across Asia and the Pacific."],["xal","Yevroosiyo iqtisodiy ittifoqi (EOII)","Rossiya, Qozog'iston va boshqa a'zolar tovar, xizmat, kapital va ishchi kuchi erkin harakatlanadigan integratsiya birlashmasi.","Евразийский экономический союз (ЕАЭС)","Интеграционное объединение с свободным движением товаров, услуг, капитала и рабочей силы между странами-членами.","Eurasian Economic Union (EAEU)","A regional bloc allowing free movement of goods, services, capital, and labor among its members."],["xal","Kapital va moliya hisobi","To'lov balansida investitsiya va moliyaviy aktivlar oqimini ko'rsatuvchi qism.","Счёт операций с капиталом и финансовых операций","Раздел платёжного баланса, показывающий потоки инвестиций и финансовых активов.","Capital and financial account","The part of the balance of payments showing cross-border investment and financial asset flows."],["xal","Savdo urushi","Davlatlarning bir-biriga qarshi o'zaro tarif va cheklovlar joriy qilishi.","Торговая война","Взаимное введение странами тарифов и ограничений друг против друга.","Trade war","A conflict where countries raise tariffs and restrictions against each other's goods."],["xal","Embargo","Muayyan davlat bilan savdoni yoki ayrim tovarlar aylanmasini rasman taqiqlash.","Эмбарго","Официальный запрет на торговлю с определённой страной или на оборот отдельных товаров.","Embargo","An official ban on trade with a particular country or in certain goods."],["xal","Sanksiyalar","Davlat yoki shaxslarga nisbatan qo'llanadigan iqtisodiy va moliyaviy cheklovlar.","Санкции","Экономические и финансовые ограничения, вводимые против государств или лиц.","Sanctions","Economic and financial restrictions imposed on countries, companies, or individuals."],["xal","Erkin savdo zonasi","Ishtirokchi davlatlar o'zaro bojlarni bekor qilib, tashqi tarifni mustaqil belgilaydigan hudud.","Зона свободной торговли","Группа стран, отменивших взаимные пошлины, но сохранивших собственные тарифы для третьих стран.","Free trade area","A group of countries that remove tariffs among themselves but keep their own outside tariffs."],["xal","Umumiy bozor","A'zo davlatlar o'rtasida tovar, xizmat, kapital va ishchi kuchi erkin aylanadigan integratsiya bosqichi.","Общий рынок","Этап интеграции со свободным движением товаров, услуг, капитала и рабочей силы.","Common market","An integration stage with free movement of goods, services, capital, and labor among members."],["xal","Qayd etilgan valyuta kursi","Davlat tomonidan belgilangan va saqlab turiladigan kurs.","Фиксированный валютный курс","Курс, устанавливаемый и поддерживаемый государством на заданном уровне.","Fixed exchange rate","A rate set and maintained by the government at a chosen level."],["xal","Forvard kontrakt","Aktivni kelgusida oldindan kelishilgan narxda sotib olish yoki sotish bo'yicha shartnoma.","Форвардный контракт","Договор о покупке или продаже актива в будущем по заранее согласованной цене.","Forward contract","An agreement to buy or sell an asset at a set price on a future date."],["xal","Reeksport","Import qilingan tovarni qayta ishlamay boshqa mamlakatga sotish.","Реэкспорт","Вывоз за границу ранее ввезённых товаров без существенной переработки.","Re-export","Selling imported goods onward to another country without significant processing."],["xal","Tranzit","Tovarlarni bir davlat hududi orqali boshqa davlatga olib o'tish.","Транзит","Перевозка товаров через территорию одной страны в другую.","Transit","Moving goods through one country's territory to reach another country."],["xal","Bojxona deklaratsiyasi","Chegaradan o'tuvchi tovar haqida bojxonaga beriladigan rasmiy ma'lumot.","Таможенная декларация","Официальное заявление таможне о товарах, пересекающих границу.","Customs declaration","An official statement to customs describing goods crossing a border."],["xal","Bojxona qiymati","Boj va soliqlarni hisoblash uchun asos bo'ladigan tovar qiymati.","Таможенная стоимость","Стоимость товара, используемая для расчёта таможенных пошлин и налогов.","Customs value","The goods' value used as the basis for calculating duties and taxes."],["xal","Antidemping boji","Demping yo'li bilan kirgan import tovarlarga solinadigan qo'shimcha boj.","Антидемпинговая пошлина","Дополнительная пошлина на импорт, ввозимый по демпинговым ценам.","Anti-dumping duty","An extra tariff on imports sold below fair price to protect local industry."],["xal","Tarifsiz to'siqlar","Kvota, litsenziya va standartlar kabi bojdan boshqa savdo cheklovlari.","Нетарифные барьеры","Ограничения торговли, не являющиеся пошлинами: квоты, лицензии, стандарты.","Non-tariff barriers","Trade restrictions other than tariffs, such as quotas, licenses, and standards."],["xal","Eksport subsidiyasi","Davlat tomonidan eksportchilarga beriladigan moliyaviy yordam.","Экспортная субсидия","Финансовая поддержка государства, предоставляемая экспортёрам.","Export subsidy","Government financial support given to exporters to make their goods cheaper abroad."],["xal","Importni o'rnini bosish","Import tovarlarni mahalliy ishlab chiqarish bilan almashtirish siyosati.","Импортозамещение","Политика замены импортных товаров продукцией отечественного производства.","Import substitution","A policy of replacing imported goods with domestically produced ones."],["xal","Xalqaro mehnat taqsimoti","Mamlakatlarning muayyan tovar va xizmatlar ishlab chiqarishga ixtisoslashuvi.","Международное разделение труда","Специализация стран на производстве определённых товаров и услуг.","International division of labor","Countries specializing in producing particular goods and services and trading them."],["xal","Transmilliy korporatsiya","Bir necha mamlakatda filiallari bo'lgan va yagona markazdan boshqariladigan yirik kompaniya.","Транснациональная корпорация","Крупная компания с филиалами в нескольких странах и единым центром управления.","Multinational corporation","A large company operating in several countries under central management."],["xal","Suveren kredit reytingi","Davlatning qarzlarini to'lash qobiliyatiga reyting agentliklari bergan baho.","Суверенный кредитный рейтинг","Оценка рейтинговыми агентствами способности государства погашать долги.","Sovereign credit rating","A rating agency's assessment of a government's ability to repay its debts."],["xal","Yevropa Ittifoqi (YeI)","Yagona bozor va umumiy siyosatga ega Yevropa davlatlarining iqtisodiy-siyosiy birlashmasi.","Европейский союз (ЕС)","Экономико-политическое объединение европейских стран с единым рынком и общей политикой.","European Union (EU)","A political and economic union of European countries with a single market."],["xal","Yevro","Yevrozona davlatlarining umumiy valyutasi.","Евро","Единая валюта стран еврозоны.","Euro","The common currency of the eurozone countries."],["xal","Shanxay hamkorlik tashkiloti (ShHT)","Xavfsizlik va iqtisodiy hamkorlik bo'yicha Yevroosiyo davlatlari tashkiloti.","Шанхайская организация сотрудничества (ШОС)","Евразийская организация по вопросам безопасности и экономического сотрудничества.","Shanghai Cooperation Organisation (SCO)","A Eurasian organization for security and economic cooperation among member states."],["xal","BRIKS","Braziliya, Rossiya, Hindiston, Xitoy va boshqa yirik rivojlanayotgan iqtisodiyotlar guruhi.","БРИКС","Группа крупных развивающихся экономик, включающая Бразилию, Россию, Индию, Китай и других.","BRICS","A group of large emerging economies including Brazil, Russia, India, and China."],["xal","OPEK","Neft eksport qiluvchi davlatlar ishlab chiqarish va narxni muvofiqlashtiradigan tashkilot.","ОПЕК","Организация стран-экспортёров нефти, координирующая добычу и цены.","OPEC","An organization of oil-exporting countries that coordinates oil production and prices."],["xal","G20","Dunyoning yirik iqtisodiyotlari yetakchilarini iqtisodiy masalalar bo'yicha birlashtiruvchi forum.","Большая двадцатка (G20)","Форум лидеров крупнейших экономик мира по вопросам мировой экономики.","G20","A forum of the world's major economies for coordinating global economic policy."],["xal","Xalqaro valyuta tizimi","Davlatlar o'rtasidagi to'lov va valyuta munosabatlarini tartibga soluvchi qoidalar majmui.","Международная валютная система","Совокупность правил, регулирующих валютные и платёжные отношения между странами.","International monetary system","The set of rules and institutions governing currency exchange and payments between countries."],["xal","Oltin standarti","Pul birligi qiymati ma'lum miqdordagi oltinga bog'langan pul tizimi.","Золотой стандарт","Денежная система, в которой стоимость валюты привязана к определённому количеству золота.","Gold standard","A monetary system in which a currency's value is tied to a fixed amount of gold."],["xal","Zaxira valyuta","Xalqaro hisob-kitoblarda va markaziy banklar zaxirasida keng qo'llanadigan valyuta.","Резервная валюта","Валюта, широко используемая в международных расчётах и резервах центральных банков.","Reserve currency","A currency widely held by central banks and used in international trade."],["xal","Dollarlashuv","Mamlakat ichida AQSh dollaridan to'lov va jamg'arma vositasi sifatida keng foydalanish.","Долларизация","Широкое использование доллара США внутри страны для расчётов и сбережений.","Dollarization","Widespread use of the US dollar for payments and savings inside another country."],["xal","Sotib olish qobiliyati pariteti (SQP)","Turli mamlakatlarda bir xil tovar savatining narxini tenglashtiruvchi kurs nazariyasi.","Паритет покупательной способности (ППС)","Теория, по которой курс уравнивает стоимость одинаковой корзины товаров в разных странах.","Purchasing power parity (PPP)","A theory that exchange rates adjust so identical goods cost the same across countries."],["xal","Konosament","Yuk tashuvchi bergan, yukni qabul qilganini tasdiqlovchi va uning egalik huquqini beruvchi hujjat.","Коносамент","Документ перевозчика, подтверждающий приём груза и дающий право распоряжаться им.","Bill of lading","A carrier's document confirming receipt of cargo and giving title to the goods."],["xal","Invoys","Sotuvchi tomonidan xaridorga yuboriladigan tovar nomi, miqdori va narxi ko'rsatilgan hisob-faktura.","Инвойс","Счёт продавца покупателю с указанием товара, количества и цены.","Commercial invoice","A seller's bill listing the goods, quantities, and prices sold to a buyer."],["xal","Eng qulay davlat rejimi","JST a'zosi bir davlatga berilgan savdo imtiyozini barcha a'zolarga berish tamoyili.","Режим наибольшего благоприятствования","Принцип, по которому торговые льготы одной стране предоставляются всем членам ВТО.","Most-favoured-nation treatment","The WTO principle that any trade advantage given to one member must be given to all."],["xal","Offshor zona","Soliq to'lovlari past yoki mavjud bo'lmagan va kompaniyalar ro'yxatdan o'tishi oson bo'lgan yurisdiksiya.","Офшорная зона","Юрисдикция с низкими или нулевыми налогами и простой регистрацией компаний.","Offshore zone","A jurisdiction with very low taxes and easy company registration for foreign firms."],["xal","Bojxona rejimi","Tovarlarning bojxona hududiga kirishi yoki chiqishida qo'llaniladigan huquqiy shartlar to'plami.","Таможенный режим","Совокупность условий ввоза или вывоза товаров с таможенной территории.","Customs regime","The legal rules under which goods enter or leave a customs territory."],["xal","Umumlashtirilgan imtiyozlar tizimi (GSP)","Rivojlangan davlatlar rivojlanayotgan davlatlar tovarlariga past yoki nol boj stavkalarini qo'llaydigan tizim.","Генеральная система преференций (ГСП)","Система, по которой развитые страны применяют сниженные или нулевые пошлины к товарам развивающихся стран.","Generalized System of Preferences (GSP)","A scheme where rich countries cut or remove tariffs on goods from developing countries."],["xal","Eksportni sug'urtalash","Xorijiy xaridor to'lamasligi xavfidan eksportchini himoya qiluvchi sug'urta turi.","Страхование экспортных кредитов","Страхование, защищающее экспортёра от риска неоплаты со стороны иностранного покупателя.","Export credit insurance","Insurance protecting exporters against the risk that a foreign buyer will not pay."],["fin","Fintech","Moliyaviy xizmatlarni texnologiya yordamida yaxshilovchi va avtomatlashtiruvchi kompaniyalar va yechimlar.","Финтех","Компании и решения, использующие технологии для улучшения и автоматизации финансовых услуг.","Fintech","Companies and solutions that use technology to improve and automate financial services."],["fin","Elektron hamyon","Pulni raqamli shaklda saqlash va to'lovlarni amalga oshirish uchun ilova.","Электронный кошелёк","Приложение для хранения денег в цифровом виде и совершения платежей.","E-wallet","An app that stores money digitally and makes payments."],["fin","QR-to'lov","Do'kondagi yoki ilovadagi QR-kodni skanerlash orqali amalga oshiriladigan to'lov.","QR-платёж","Платёж, выполняемый сканированием QR-кода в магазине или приложении.","QR payment","A payment made by scanning a QR code with a phone."],["fin","Uzcard","O'zbekistonda keng tarqalgan milliy bank to'lov kartalari tizimi.","Uzcard","Национальная система банковских платёжных карт, широко распространённая в Узбекистане.","Uzcard","A widely used national bank card payment system in Uzbekistan."],["fin","Humo","O'zbekistonda ishlaydigan milliy to'lov kartalari va protsessing tizimi.","Humo","Национальная система платёжных карт и процессинга, работающая в Узбекистане.","Humo","A national payment card and processing system operating in Uzbekistan."],["fin","Payme","O'zbekistonda kartadan to'lov, o'tkazma va xizmatlar uchun mashhur mobil to'lov ilovasi.","Payme","Популярное в Узбекистане мобильное приложение для оплаты услуг и переводов с карты.","Payme","A popular Uzbek mobile app for card payments, transfers, and utility bills."],["fin","Click","O'zbekistonda mobil ilova orqali to'lov va pul o'tkazish xizmati.","Click","Сервис мобильных платежей и денежных переводов в Узбекистане.","Click","An Uzbek mobile service for payments and money transfers."],["fin","API","Dasturlar bir-biri bilan ma'lumot almashishi uchun belgilangan interfeys.","API","Набор правил, по которым программы обмениваются данными друг с другом.","API (application programming interface)","A set of rules that lets different software programs exchange data."],["fin","BNPL (hozir xarid qil, keyin to'la)","Xaridni darhol olib, to'lovni bo'lib yoki keyinroq amalga oshirish xizmati.","BNPL (купи сейчас, плати потом)","Услуга, позволяющая получить покупку сразу, а оплатить позже или частями.","Buy now, pay later (BNPL)","A service letting shoppers receive goods now and pay later or in installments."],["fin","P2P kreditlash","Shaxslar o'rtasida bank ishtirokisiz platforma orqali beriladigan qarz.","P2P-кредитование","Займы между частными лицами через платформу без участия банка.","Peer-to-peer lending","Loans made directly between individuals through an online platform."],["fin","Stablecoin","Qiymati dollar kabi aktivga bog'lanib, barqaror saqlanadigan kriptovalyuta.","Стейблкоин","Криптовалюта, стоимость которой привязана к стабильному активу, например доллару.","Stablecoin","A cryptocurrency whose value is pegged to a stable asset such as the US dollar."],["fin","Markaziy bank raqamli valyutasi (CBDC)","Markaziy bank chiqaradigan milliy pulning raqamli shakli.","Цифровая валюта центрального банка (CBDC)","Цифровая форма национальных денег, выпускаемая центральным банком.","Central bank digital currency (CBDC)","A digital form of national money issued by a central bank."],["fin","KYC (mijozni bilish)","Bank mijoz shaxsini aniqlash va tekshirish jarayoni.","KYC (знай своего клиента)","Процедура установления и проверки личности клиента финансовой организацией.","Know your customer (KYC)","The process of verifying a customer's identity before providing financial services."],["fin","AML (pul yuvishga qarshi kurash)","Jinoiy daromadlarni qonuniylashtirishning oldini olish choralari majmui.","AML (противодействие отмыванию денег)","Комплекс мер по предотвращению легализации преступных доходов.","Anti-money laundering (AML)","Rules and measures that prevent criminals from disguising illegal money as legitimate."],["fin","Tokenizatsiya","Aktiv yoki ma'lumotni blokcheynda raqamli token ko'rinishiga o'tkazish.","Токенизация","Преобразование актива или данных в цифровой токен, обычно в блокчейне.","Tokenization","Converting an asset or sensitive data into a digital token."],["fin","Regtech","Moliyaviy qoidalarga rioya etishni texnologiya yordamida osonlashtiruvchi yechimlar.","Регтех","Технологические решения, упрощающие соблюдение финансового регулирования.","Regtech","Technology that helps firms comply with financial regulation more efficiently."],["fin","Insurtech","Sug'urta xizmatlarini texnologiya orqali takomillashtiruvchi yechimlar.","Иншуртех","Технологические решения для совершенствования страховых услуг.","Insurtech","Technology that makes insurance services faster, cheaper, and more personalized."],["fin","Fishing","Soxta xabar yoki sayt orqali shaxsiy va bank ma'lumotlarini aldab olish.","Фишинг","Выманивание личных и банковских данных с помощью поддельных писем и сайтов.","Phishing","Tricking people into revealing personal or banking data via fake messages or websites."],["fin","Ikki bosqichli autentifikatsiya (2FA)","Hisobga kirishda parol bilan birga qo'shimcha tasdiqlash talab qilinadigan himoya.","Двухфакторная аутентификация (2FA)","Защита, при которой для входа помимо пароля нужен дополнительный способ подтверждения.","Two-factor authentication (2FA)","A security method requiring a second proof of identity besides the password."],["fin","Dipfeyk","Sun'iy intellekt yordamida yaratilgan soxta video, ovoz yoki tasvir.","Дипфейк","Поддельное видео, голос или изображение, созданные с помощью искусственного интеллекта.","Deepfake","A fake video, voice, or image created with artificial intelligence."],["fin","Vishing","Telefon qo'ng'irog'i orqali bank xodimi nomidan ma'lumot yoki pul aldab olish.","Вишинг","Телефонное мошенничество, при котором выманивают данные или деньги, представляясь сотрудником банка.","Vishing","Voice-call fraud where scammers pose as bank staff to steal data or money."],["fin","Smishing","SMS orqali yuborilgan zararli havola yoki soxta xabar bilan firibgarlik.","Смишинг","Мошенничество с помощью SMS-сообщений с вредоносными ссылками или поддельными уведомлениями.","Smishing","Fraud using text messages with malicious links or fake alerts."],["fin","Ijtimoiy muhandislik","Odamlarning ishonchidan foydalanib, ma'lumot yoki pul olish usuli.","Социальная инженерия","Метод получения данных или денег путём психологического манипулирования людьми.","Social engineering","Manipulating people psychologically so they reveal information or send money."],["fin","Skimming","Karta ma'lumotlarini maxsus qurilma yordamida yashirincha nusxalash.","Скимминг","Скрытое копирование данных банковской карты с помощью специального устройства.","Card skimming","Secretly copying card data using a hidden device on an ATM or terminal."],["fin","Moliyaviy piramida","Yangi qatnashchilar badallari hisobiga avvalgilarga to'lanadigan, oxir-oqibat qulaydigan firibgarlik sxemasi.","Финансовая пирамида","Мошенническая схема, где выплаты идут за счёт взносов новых участников и она неизбежно рушится.","Ponzi or pyramid scheme","A fraud paying earlier investors with new investors' money until it inevitably collapses."],["fin","Elektron raqamli imzo (ERI)","Hujjatning haqiqiyligi va muallifini tasdiqlovchi elektron identifikator.","Электронная цифровая подпись (ЭЦП)","Электронный реквизит, подтверждающий подлинность документа и личность подписавшего.","Digital signature","An electronic mark that proves a document's authenticity and the signer's identity."],["fin","Sun'iy intellekt asosidagi kredit skoring","Mijozning qarzni qaytarish ehtimolini mashinaviy o'qitish modellari bilan baholash.","Кредитный скоринг на основе ИИ","Оценка вероятности возврата кредита клиентом с помощью моделей машинного обучения.","AI credit scoring","Using machine learning models to estimate a borrower's chance of repaying a loan."],["fin","Kredit skoring","Qarz oluvchining to'lov qobiliyatini ball bilan baholash tizimi.","Кредитный скоринг","Система числовой оценки кредитоспособности заёмщика.","Credit scoring","A numerical system for rating a borrower's creditworthiness."],["fin","Ethereum","Smart-kontraktlarni qo'llab-quvvatlovchi yetakchi blokcheyn platformasi.","Эфириум","Ведущая блокчейн-платформа с поддержкой смарт-контрактов.","Ethereum","A leading blockchain platform that supports smart contracts."],["fin","Kripto birja","Kriptovalyutalar sotib olinadigan, sotiladigan va almashtiriladigan platforma.","Криптобиржа","Платформа для покупки, продажи и обмена криптовалют.","Crypto exchange","A platform where cryptocurrencies are bought, sold, and traded."],["fin","Kripto hamyon","Kriptoaktivlarga egalik qilishni ta'minlovchi shaxsiy kalitlarni saqlovchi dastur yoki qurilma.","Криптокошелёк","Программа или устройство, хранящее закрытые ключи для управления криптоактивами.","Crypto wallet","Software or hardware that stores the private keys controlling cryptoassets."],["fin","Mayning","Hisoblash quvvati yordamida blokcheynda tranzaksiyalarni tasdiqlab, yangi koin olish jarayoni.","Майнинг","Подтверждение транзакций в блокчейне с помощью вычислительной мощности с получением новых монет.","Mining","Using computing power to validate blockchain transactions and earn new coins."],["fin","DeFi (markazlashmagan moliya)","Banksiz, smart-kontraktlar asosida blokcheynda ishlaydigan moliyaviy xizmatlar.","DeFi (децентрализованные финансы)","Финансовые услуги на блокчейне на основе смарт-контрактов без посредников-банков.","Decentralized finance (DeFi)","Financial services run on blockchains through smart contracts without traditional intermediaries."],["fin","NFT","Blokcheynda noyob raqamli obyektga egalikni tasdiqlovchi almashtirib bo'lmaydigan token.","NFT","Невзаимозаменяемый токен, подтверждающий владение уникальным цифровым объектом в блокчейне.","Non-fungible token (NFT)","A unique blockchain token proving ownership of a specific digital item."],["fin","To'lov shlyuzi","Onlayn do'kon va bank o'rtasida karta to'lovlarini xavfsiz uzatuvchi xizmat.","Платёжный шлюз","Сервис, безопасно передающий данные карточных платежей между интернет-магазином и банком.","Payment gateway","A service that securely passes online card payments between a shop and the bank."],["fin","NFC","Telefon yoki kartani yaqinlashtirib kontaktsiz to'lov qilish imkonini beruvchi qisqa masofali aloqa texnologiyasi.","NFC","Технология ближней связи, позволяющая платить бесконтактно, поднося телефон или карту к терминалу.","NFC (near-field communication)","Short-range wireless technology that enables contactless payments by tapping a phone or card."],["fin","Kontaktsiz to'lov","Karta yoki telefonni terminalga tekkizmasdan yaqinlashtirib amalga oshiriladigan to'lov.","Бесконтактный платёж","Оплата, при которой карта или телефон лишь подносятся к терминалу.","Contactless payment","Paying by holding a card or phone near a terminal instead of inserting it."],["fin","Bir martalik parol (OTP)","Bitta tranzaksiya yoki kirish uchun yaroqli, SMS yoki ilova orqali keladigan kod.","Одноразовый пароль (OTP)","Код, приходящий по SMS или в приложении и действительный для одной операции или входа.","One-time password (OTP)","A code valid for a single login or transaction, sent by SMS or an app."],["fin","Biometrik autentifikatsiya","Barmoq izi, yuz yoki ovoz orqali shaxsni tasdiqlash.","Биометрическая аутентификация","Подтверждение личности по отпечатку пальца, лицу или голосу.","Biometric authentication","Verifying identity through fingerprints, face, or voice."],["fin","Shifrlash","Ma'lumotni faqat kalit egasi o'qiy oladigan shaklga o'tkazish.","Шифрование","Преобразование данных в форму, которую может прочитать только владелец ключа.","Encryption","Converting data into code so only authorized holders of a key can read it."],["fin","Kiberxavfsizlik","Axborot tizimlari va ma'lumotlarni hujumlardan himoya qilish chora-tadbirlari.","Кибербезопасность","Меры защиты информационных систем и данных от атак.","Cybersecurity","Measures that protect computer systems and data from attacks."],["fin","Zararli dastur (malware)","Qurilmaga zarar yetkazish yoki ma'lumot o'g'irlash uchun yaratilgan dastur.","Вредоносное ПО (malware)","Программа, созданная для причинения вреда устройству или кражи данных.","Malware","Software designed to damage devices or steal data."],["fin","Ransomware","Ma'lumotlarni shifrlab, ochish uchun to'lov talab qiluvchi zararli dastur.","Программа-вымогатель (ransomware)","Вредоносная программа, шифрующая данные и требующая выкуп за их разблокировку.","Ransomware","Malware that locks data and demands payment to restore access."],["fin","Shaxsiy ma'lumotlarni himoya qilish","Fuqarolarning shaxsiy ma'lumotlarini noqonuniy to'plash va ishlatishdan saqlash.","Защита персональных данных","Обеспечение сохранности личных данных граждан от незаконного сбора и использования.","Data protection","Safeguarding personal data from unauthorized collection, use, or leaks."],["fin","Bulutli hisoblash","Serverlar va dasturlardan internet orqali masofadan foydalanish modeli.","Облачные вычисления","Модель удалённого использования серверов и программ через интернет.","Cloud computing","Using remote servers and software over the internet instead of local hardware."],["fin","Katta ma'lumotlar (Big Data)","Juda katta hajmdagi ma'lumotlar bo'lib, ularni tahlil qilib qaror qabul qilishda foydalaniladi.","Большие данные (Big Data)","Огромные массивы данных, анализируемые для выявления закономерностей и принятия решений.","Big data","Very large datasets analyzed to find patterns and support decisions."],["fin","Mashinaviy o'qitish","Kompyuterlarning ma'lumotlardan o'rganib, aniq dasturlashsiz qaror qabul qilish qobiliyati.","Машинное обучение","Способность компьютеров учиться на данных и принимать решения без явного программирования.","Machine learning","A branch of AI where computers learn patterns from data without explicit programming."],["fin","Chatbot","Mijozlar savollariga avtomatik javob beruvchi dastur.","Чат-бот","Программа, автоматически отвечающая на вопросы клиентов.","Chatbot","A program that answers customers' questions automatically in a chat."],["fin","Super-ilova","To'lov, xizmat va xaridlarni bitta ilovada birlashtiruvchi platforma.","Суперприложение","Платформа, объединяющая платежи, услуги и покупки в одном приложении.","Super app","A single app combining payments, services, and shopping."],["fin","Regulyator sandboksi","Yangi moliyaviy mahsulotlarni tartibga soluvchi nazorati ostida cheklangan sharoitda sinash muhiti.","Регуляторная песочница","Среда для тестирования новых финансовых продуктов в ограниченных условиях под надзором регулятора.","Regulatory sandbox","A supervised environment where firms test new financial products under relaxed rules."],["fin","Tezkor to'lov tizimi","Pulni bir necha soniyada, kun davomida 24/7 o'tkazish imkonini beruvchi tizim.","Система быстрых платежей","Система, позволяющая переводить деньги за секунды в режиме 24/7.","Instant payment system","A system that moves money between accounts within seconds, around the clock."],["fin","Elektron pul","Emitentga to'langan mablag'ga teng, elektron shaklda saqlanadigan pul qiymati.","Электронные деньги","Денежная стоимость в электронной форме, равная внесённым эмитенту средствам.","Electronic money","Monetary value stored electronically and backed by funds paid to the issuer."],["fin","Raqamli bank","Barcha xizmatlarni asosan onlayn va mobil kanallarda ko'rsatuvchi bank.","Цифровой банк","Банк, предоставляющий большинство услуг через онлайн и мобильные каналы.","Digital bank","A bank delivering most services through online and mobile channels."],["fin","Embedded finance","Moliyaviy xizmatlarni nobank ilovalar ichiga integratsiya qilish.","Встроенные финансы","Интеграция финансовых услуг в нефинансовые приложения и сервисы.","Embedded finance","Building financial services such as payments or loans into non-financial apps."],["fin","Core banking","Hisoblar, kreditlar va depozitlarni yuritadigan bankning asosiy axborot tizimi.","Банковская автоматизированная система (core banking)","Основная информационная система банка, ведущая счета, кредиты и депозиты.","Core banking system","A bank's central software that manages accounts, loans, and deposits."],["fin","MyID (raqamli identifikatsiya)","Fuqaroni onlayn xizmatlarda masofadan aniqlash uchun O'zbekistonda qo'llanadigan tizim.","MyID (цифровая идентификация)","Система дистанционной идентификации граждан в онлайн-сервисах, используемая в Узбекистане.","MyID (digital identity)","An Uzbek system for remotely identifying citizens when they use online services."],["fin","Chargeback","Kartadan noto'g'ri yoki firibgarlik bilan yechilgan pulni bank orqali qaytarish jarayoni.","Чарджбэк","Процедура возврата средств по карте, списанных ошибочно или мошенническим путём.","Chargeback","A process in which a bank reverses a disputed or fraudulent card payment."],["fin","Firibgarlikni aniqlash tizimi","G'ayrioddiy operatsiyalarni avtomatik aniqlab, shubhali to'lovlarni to'xtatuvchi dastur.","Система выявления мошенничества","Программа, автоматически обнаруживающая необычные операции и блокирующая подозрительные платежи.","Fraud detection system","Software that spots unusual transactions and blocks suspicious payments."],["fin","Wealthtech","Boylikni boshqarish va investitsiyani texnologiya orqali ommaviylashtiruvchi yechimlar.","Веалтех","Технологические решения для управления капиталом и упрощения доступа к инвестициям.","Wealthtech","Technology that makes investing and wealth management accessible and cheaper."],["fin","Suptech","Nazorat organlariga moliyaviy nazoratni texnologiya bilan amalga oshirishda yordam beruvchi yechimlar.","Суптех","Технологические решения, помогающие регуляторам осуществлять финансовый надзор.","Suptech","Technology that helps financial regulators supervise markets more effectively."],["fin","Ko'p faktorli autentifikatsiya","Shaxsni bir necha mustaqil usul bilan tasdiqlash: bilim, egalik va biometriya.","Многофакторная аутентификация","Подтверждение личности несколькими независимыми способами: знание, владение, биометрия.","Multi-factor authentication","Confirming identity with several independent factors such as a password, device, and fingerprint."],["fin","Ma'lumotlar buzilishi (data breach)","Maxfiy ma'lumotlarning ruxsatsiz oshkor bo'lishi yoki o'g'irlanishi.","Утечка данных","Несанкционированное раскрытие или кража конфиденциальных данных.","Data breach","An incident where confidential data is exposed or stolen without authorization."]];

function mkLoan(){
  const P=(5+Math.floor(Math.random()*11))*1000000,rnd=(a,b)=>a+Math.random()*(b-a);
  const mk=(n,lo,hi,fee)=>{const tot=P*(1+rnd(lo,hi)),m=Math.round(tot/n/1000)*1000,f=fee?Math.round(rnd(1,4))*100000:0;return {m,n,f,t:m*n+f}};
  let a,b,i=0;do{a=mk(12,.12,.3,Math.random()<.5);b=mk(Math.random()<.5?18:24,.15,.45,Math.random()<.3);i++}while((Math.abs(a.t-b.t)/P<.03)&&i<50);
  return {P,a,b,best:a.t<b.t?0:1};
}

function budgetTotals(){

}

  if(a==="addrow"){S.rows.push({id:"x"+Date.now(),name:"",amount:0,type:"maj"});renderRows();save();recalc();const n=$$("#b-rows .name");n[n.length-1]?.focus()}
  else if(a==="del"){S.rows=S.rows.filter(r=>r.id!==t.dataset.id);renderRows();save();recalc()}

/* Lotin alifbosi: yangi (2026-y. qonun: ö ğ ş ç ’) yoki hozirgi (oʻ gʻ ʼ) */
const KEEP=/^(cashback|chatbot|chargeback|benchmark|schyot|pitch|push|match|shop|share|technology)/i;
function uzFix(t){
  return t.replace(/[A-Za-z'\u02bb\u02bc\u2019]+/g,w=>{
    if(S.alpha==="old")return w.replace(/([oOgG])'/g,"$1\u02bb").replace(/'/g,"\u02bc");
    if(KEEP.test(w))return w.replace(/'/g,"\u2019");
    w=w.replace(/([oOgG])'/g,(m,c)=>({o:"ö",O:"Ö",g:"ğ",G:"Ğ"})[c]).replace(/'/g,"\u2019");
    if(/^[A-Z]{2,}$/.test(w))return w;
    return w.replace(/sh/g,"ş").replace(/Sh|SH/g,"Ş").replace(/ch/g,"ç").replace(/Ch|CH/g,"Ç");
  });
}
function fixNode(n){
  if(lang!=="uz")return;
  if(n.nodeType===3){const p=n.parentNode;if(!p||/^(TEXTAREA|SCRIPT|STYLE)$/.test(p.nodeName)||(p.closest&&p.closest("[data-nofix]")))return;
    if(/[A-Za-z]/.test(n.nodeValue)){const v2=uzFix(n.nodeValue);if(v2!==n.nodeValue)n.nodeValue=v2}}
  else if(n.nodeType===1){if(n.hasAttribute("data-nofix"))return;["placeholder","aria-label"].forEach(a=>{const x=n.getAttribute(a);if(x){const y=uzFix(x);if(y!==x)n.setAttribute(a,y)}});n.childNodes.forEach(fixNode)}
}
new MutationObserver(ms=>{if(lang!=="uz")return;ms.forEach(m=>{if(m.type==="characterData")fixNode(m.target);else m.addedNodes.forEach(fixNode)})}).observe(document.getElementById("app"),{childList:true,subtree:true,characterData:true});
S.rows.forEach(r=>{if(/^r[1-7]$/.test(r.id)&&r.sample===undefined)r.sample=true});
renderAll();
boardInit();
