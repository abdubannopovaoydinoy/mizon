vchi omillar: daromad, did, kutishlar, o'rinbosar tovarlar narxi va boshqalar.","Неценовые факторы спроса","Факторы, кроме цены, меняющие спрос: доходы, вкусы, ожидания, цены связанных товаров и другие.","Determinants of demand","Non-price factors that shift demand, such as income, tastes, expectations and the prices of related goods."],["mik","Taklifning narxdan tashqari omillari","Narxdan boshqa, taklifni o'zgartiruvchi omillar: xarajatlar, texnologiya, soliqlar va ishlab chiqaruvchilar soni.","Неценовые факторы предложения","Факторы, кроме цены, меняющие предложение: издержки, технологии, налоги и число производителей.","Determinants of supply","Non-price factors that shift supply, such as input costs, technology, taxes and the number of sellers."],["mik","Talabning o'zgarishi","Narxdan tashqari omillar ta'sirida talab egri chizig'ining siljishi.","Изменение спроса","Сдвиг кривой спроса под влиянием неценовых факторов.","Change in demand","A shift of the entire demand curve caused by a change in a non-price factor."],["mik","Taklifning o'zgarishi","Narxdan tashqari omillar ta'sirida taklif egri chizig'ining siljishi.","Изменение предложения","Сдвиг кривой предложения под влиянием неценовых факторов.","Change in supply","A shift of the entire supply curve caused by a change in a non-price factor."],["mik","Tanqislik","Berilgan narxda talab qilingan miqdor taklif qilingan miqdordan ko'p bo'lgan holat.","Дефицит","Ситуация, когда при данной цене величина спроса превышает величину предложения.","Shortage","A situation where the quantity demanded exceeds the quantity supplied at a given price."],["mik","Ortiqcha taklif","Berilgan narxda taklif qilingan miqdor talab qilingan miqdordan ko'p bo'lgan holat.","Избыток","Ситуация, когда при данной цене величина предложения превышает величину спроса.","Surplus","A situation where the quantity supplied exceeds the quantity demanded at a given price."],["mik","Narx elastikligi","Talab yoki taklif qilingan miqdorning narx o'zgarishiga nisbatan sezgirlik darajasi.","Ценовая эластичность","Степень чувствительности величины спроса или предложения к изменению цены.","Price elasticity","A measure of how strongly the quantity demanded or supplied responds to a change in price."],["mik","Talabning narx bo'yicha elastikligi","Talab qilingan miqdorning foizdagi o'zgarishini narxning foizdagi o'zgarishiga bo'lish natijasi.","Ценовая эластичность спроса","Отношение процентного изменения величины спроса к процентному изменению цены.","Price elasticity of demand","The percentage change in quantity demanded divided by the percentage change in price."],["mik","Taklifning narx bo'yicha elastikligi","Taklif qilingan miqdorning foizdagi o'zgarishini narxning foizdagi o'zgarishiga bo'lish natijasi.","Ценовая эластичность предложения","Отношение процентного изменения величины предложения к процентному изменению цены.","Price elasticity of supply","The percentage change in quantity supplied divided by the percentage change in price."],["mik","Talabning daromad bo'yicha elastikligi","Talab qilingan miqdorning iste'molchi daromadi o'zgarishiga sezgirligi.","Эластичность спроса по доходу","Показатель чувствительности величины спроса к изменению дохода потребителя.","Income elasticity of demand","A measure of how the quantity demanded responds to a change in consumers' income."],["mik","Talabning o'zaro elastikligi","Bir tovar talabining boshqa tovar narxi o'zgarishiga sezgirligi.","Перекрёстная эластичность спроса","Показатель чувствительности спроса на один товар к изменению цены другого товара.","Cross-price elasticity of demand","A measure of how demand for one good responds to a change in the price of another good."],["mik","Elastik talab","Narx o'zgarganda talab qilingan miqdor undan ham ko'proq o'zgaradigan talab.","Эластичный спрос","Спрос, при котором величина спроса меняется в процентном отношении сильнее, чем цена.","Elastic demand","Demand in which the quantity demanded changes proportionally more than the price."],["mik","Noelastik talab","Narx o'zgarganda talab qilingan miqdor kam o'zgaradigan talab.","Неэластичный спрос","Спрос, при котором величина спроса меняется в процентном отношении слабее, чем цена.","Inelastic demand","Demand in which the quantity demanded changes proportionally less than the price."],["mik","Birlik elastiklik","Talab qilingan miqdor narx bilan bir xil foizda o'zgaradigan holat, elastiklik koeffitsiyenti birga teng.","Единичная эластичность","Ситуация, когда величина спроса меняется в той же пропорции, что и цена, а коэффициент равен единице.","Unit elasticity","A case where quantity changes by the same percentage as price, so the elasticity coefficient equals one."],["mik","Mutlaqo noelastik talab","Narx qanday o'zgarmasin, talab qilingan miqdor o'zgarmaydigan talab.","Совершенно неэластичный спрос","Спрос, при котором величина спроса не меняется при любом изменении цены.","Perfectly inelastic demand","Demand in which the quantity demanded does not change at all when the price changes."],["mik","Mutlaqo elastik talab","Narx ozgina o'zgarsa ham talab qilingan miqdor nolgacha tushib ketadigan talab.","Совершенно эластичный спрос","Спрос, при котором малейшее изменение цены ведёт к неограниченному изменению величины спроса.","Perfectly elastic demand","Demand in which any small price rise makes the quantity demanded fall to zero."],["mik","O'rinbosar tovarlar","Biri narxi oshganda ikkinchisiga talab ortadigan, bir-birini almashtira oladigan tovarlar.","Товары-заменители","Товары, взаимозаменяемые в потреблении: при росте цены одного спрос на другой увеличивается.","Substitute goods","Goods that can replace each other, so a price rise of one increases demand for the other."],["mik","Giffen tovari","Narxi oshganda talab ham ortadigan, kam uchraydigan past sifatli tovar.","Товар Гиффена","Редкий товар низшей категории, спрос на который растёт при повышении его цены.","Giffen good","A rare inferior good whose quantity demanded rises when its price rises."],["mik","Veblen tovari","Narxi yuqori bo'lgani sababli obro' ramzi sifatida talab ortadigan hashamatli tovar.","Товар Веблена","Предмет роскоши, спрос на который растёт из-за высокой цены как символа престижа.","Veblen good","A luxury good whose demand rises as its price rises because it signals status."],["mik","Zaruriy tovar","Daromad o'zgarganda talabi kam o'zgaradigan hayot uchun zarur tovar.","Товар первой необходимости","Товар, спрос на который слабо меняется при изменении дохода.","Necessity good","A good whose demand changes little when income changes."],["mik","Hashamatli tovar","Daromad oshganda talabi nisbatan ko'proq ortadigan tovar.","Предмет роскоши","Товар, спрос на который растёт быстрее дохода.","Luxury good","A good whose demand rises proportionally more than income."],["mik","Naflilik","Iste'molchi tovar yoki xizmatni iste'mol qilishdan oladigan qoniqish darajasi.","Полезность","Степень удовлетворения, которую потребитель получает от потребления блага.","Utility","The satisfaction a consumer gets from consuming a good or service."],["mik","Umumiy naflilik","Barcha iste'mol qilingan birliklardan olingan jami qoniqish.","Общая полезность","Суммарное удовлетворение от потребления всех единиц блага.","Total utility","The total satisfaction obtained from consuming all units of a good."],["mik","Marjinal naflilik","Tovarning qo'shimcha bir birligini iste'mol qilishdan olinadigan qo'shimcha qoniqish.","Предельная полезность","Дополнительная полезность от потребления ещё одной единицы блага.","Marginal utility","The additional satisfaction gained from consuming one more unit of a good."],["mik","Marjinal naflilikning kamayish qonuni","Iste'mol ko'paygan sari har bir keyingi birlikdan olinadigan qo'shimcha naflilik kamayadi.","Закон убывающей предельной полезности","С ростом потребления предельная полезность каждой следующей единицы блага уменьшается.","Law of diminishing marginal utility","As consumption increases, the extra utility from each additional unit declines."],["mik","Befarqlik egri chizig'i","Iste'molchiga bir xil naflilik beradigan tovarlar to'plamlarini birlashtiruvchi chiziq.","Кривая безразличия","Линия, объединяющая наборы благ, дающие потребителю одинаковый уровень полезности.","Indifference curve","A curve showing combinations of goods that give the consumer equal satisfaction."],["mik","Befarqlik xaritasi","Iste'molchining turli naflilik darajasiga mos befarqlik egri chiziqlari to'plami.","Карта кривых безразличия","Набор кривых безразличия, отражающих разные уровни полезности потребителя.","Indifference map","A set of indifference curves representing different levels of consumer satisfaction."],["mik","Byudjet cheklovi","Iste'molchi o'z daromadi va narxlar doirasida sotib ola oladigan tovarlar to'plamlari chegarasi.","Бюджетное ограничение","Граница наборов благ, которые потребитель может купить при данном доходе и ценах.","Budget constraint","The limit on bundles of goods a consumer can afford given income and prices."],["mik","Byudjet chizig'i","Daromadning hammasi sarflanganda sotib olinadigan ikki tovar to'plamlarini ko'rsatuvchi chiziq.","Бюджетная линия","Линия, показывающая наборы двух благ, доступные при полном расходовании дохода.","Budget line","A line showing all combinations of two goods affordable when all income is spent."],["mik","Iste'molchi muvozanati","Iste'molchi byudjet cheklovi doirasida eng yuqori naflilikka erishadigan tanlov.","Равновесие потребителя","Выбор набора благ, дающий максимальную полезность при бюджетном ограничении.","Consumer equilibrium","The choice of goods that maximizes utility subject to the budget constraint."],["mik","Marjinal almashtirish normasi","Iste'molchi naflilikni o'zgartirmay bir tovarni ikkinchisiga almashtirishga tayyor bo'lgan nisbat.","Предельная норма замещения","Пропорция, в которой потребитель готов заменить одно благо другим без потери полезности.","Marginal rate of substitution","The rate at which a consumer will trade one good for another while keeping utility constant."],["mik","Daromad effekti","Narx o'zgarganda iste'molchi real xarid qobiliyatining o'zgarishi tufayli talabning o'zgarishi.","Эффект дохода","Изменение спроса из-за изменения реальной покупательной способности при смене цены.","Income effect","The change in consumption caused by a change in real purchasing power after a price change."],["mik","O'rin almashtirish effekti","Narxi oshgan tovardan nisbatan arzonroq tovarga o'tish tufayli talabning o'zgarishi.","Эффект замещения","Изменение спроса из-за перехода к относительно более дешёвым товарам при росте цены.","Substitution effect","The change in consumption from switching to relatively cheaper goods when a price rises."],["mik","Iste'molchi ortiqcha naflari","Iste'molchi to'lashga tayyor bo'lgan narx bilan haqiqatda to'langan narx o'rtasidagi farq.","Излишек потребителя","Разница между максимальной ценой, которую потребитель готов заплатить, и фактической ценой.","Consumer surplus","The difference between what a consumer is willing to pay and the price actually paid."],["mik","Ishlab chiqaruvchi ortiqcha naflari","Haqiqiy sotuv narxi bilan ishlab chiqaruvchi qabul qiladigan minimal narx o'rtasidagi farq.","Излишек производителя","Разница между фактической ценой продажи и минимальной ценой, на которую согласен производитель.","Producer surplus","The difference between the price a producer receives and the minimum price it would accept."],["mik","Umumiy ortiqcha naf","Iste'molchi va ishlab chiqaruvchi ortiqcha naflarining yig'indisi.","Общественный излишек","Сумма излишка потребителей и излишка производителей.","Total surplus","The sum of consumer surplus and producer surplus."],["mik","Sof yo'qotish","Bozor muvozanatidan chetlanish natijasida jamiyat yo'qotadigan umumiy farovonlik.","Чистые потери","Потери общественного благосостояния из-за отклонения рынка от равновесия.","Deadweight loss","The loss of total welfare that results when a market departs from equilibrium."],["mik","Narx shipi","Hukumat belgilagan, narx undan oshib ketmasligi kerak bo'lgan eng yuqori narx.","Потолок цен","Максимальная цена, установленная государством, выше которой продавать запрещено.","Price ceiling","A legal maximum price above which a good cannot be sold."],["mik","Narx pollari","Hukumat belgilagan, narx undan pasaymasligi kerak bo'lgan eng quyi narx.","Минимальная цена","Минимальная цена, установленная государством, ниже которой продавать запрещено.","Price floor","A legal minimum price below which a good cannot be sold."],["mik","Eng kam ish haqi","Qonun bilan belgilangan, mehnatga to'lanishi mumkin bo'lgan eng quyi haq.","Минимальная заработная плата","Установленный законом минимальный размер оплаты труда.","Minimum wage","The lowest wage that employers are legally allowed to pay workers."],["mik","Qisqa davr","Kamida bitta ishlab chiqarish omili o'zgarmas bo'ladigan vaqt oralig'i.","Краткосрочный период","Период, в течение которого хотя бы один фактор производства остаётся неизменным.","Short run","A period in which at least one factor of production is fixed."],["mik","Uzoq davr","Barcha ishlab chiqarish omillarini o'zgartirish mumkin bo'lgan vaqt oralig'i.","Долгосрочный период","Период, в течение которого можно изменить все факторы производства.","Long run","A period long enough for all factors of production to be varied."],["mik","Marjinal mahsulot","Ishlab chiqarish omilining qo'shimcha bir birligi qo'shilganda mahsulotning qo'shimcha o'sishi.","Предельный продукт","Дополнительный выпуск, получаемый при добавлении одной единицы фактора производства.","Marginal product","The extra output produced by adding one more unit of an input."],["mik","Kamayuvchi unumdorlik qonuni","Boshqa omillar o'zgarmaganda, bir omilni ko'paytirish sari uning qo'shimcha mahsuloti kamayib boradi.","Закон убывающей отдачи","При неизменных прочих факторах рост использования одного фактора снижает его предельный продукт.","Law of diminishing returns","Adding more of one input to fixed inputs eventually yields smaller additional output."],["mik","O'rtacha mahsulot","Ishlab chiqarish omilining bir birligiga to'g'ri keladigan mahsulot hajmi.","Средний продукт","Объём выпуска в расчёте на одну единицу используемого фактора.","Average product","Total output divided by the quantity of the input used."],["mik","Umumiy xarajatlar","Firmaning ma'lum hajmda mahsulot ishlab chiqarishga sarflagan barcha xarajatlari yig'indisi.","Общие издержки","Сумма всех затрат фирмы на производство данного объёма продукции.","Total cost","The sum of all costs a firm incurs to produce a given level of output."],["mik","Marjinal xarajat","Qo'shimcha bir birlik mahsulot ishlab chiqarish uchun zarur bo'ladigan qo'shimcha xarajat.","Предельные издержки","Дополнительные затраты на производство ещё одной единицы продукции.","Marginal cost","The extra cost of producing one more unit of output."],["mik","O'rtacha umumiy xarajat","Umumiy xarajatlarni ishlab chiqarilgan mahsulot miqdoriga bo'lish natijasi.","Средние общие издержки","Общие издержки, делённые на объём выпуска.","Average total cost","Total cost divided by the quantity of output produced."],["mik","O'rtacha doimiy xarajat","Doimiy xarajatlarni ishlab chiqarilgan mahsulot miqdoriga bo'lish natijasi.","Средние постоянные издержки","Постоянные издержки, делённые на объём выпуска.","Average fixed cost","Fixed cost divided by the quantity of output produced."],["mik","O'rtacha o'zgaruvchan xarajat","O'zgaruvchan xarajatlarni ishlab chiqarilgan mahsulot miqdoriga bo'lish natijasi.","Средние переменные издержки","Переменные издержки, делённые на объём выпуска.","Average variable cost","Variable cost divided by the quantity of output produced."],["mik","Qaytmas xarajatlar","Allaqachon sarflangan va qaytarib bo'lmaydigan, qarorlarga ta'sir qilmasligi kerak bo'lgan xarajatlar.","Безвозвратные издержки","Уже понесённые невозвратные затраты, которые не должны влиять на будущие решения.","Sunk costs","Costs already incurred that cannot be recovered and should not affect future decisions."],["mik","Aniq xarajatlar","Firma resurslar uchun to'laydigan pul shaklidagi xarajatlar.","Явные издержки","Денежные затраты фирмы на оплату используемых ресурсов.","Explicit costs","Out-of-pocket monetary payments a firm makes for the resources it uses."],["mik","Yashirin xarajatlar","Firma o'z resurslaridan foydalanganda voz kechadigan, pul to'lanmaydigan muqobil daromad.","Неявные издержки","Упущенный доход от использования собственных ресурсов фирмы без денежной оплаты.","Implicit costs","The opportunity cost of using the firm's own resources, with no direct payment."],["mik","Miqyos samarasi","Ishlab chiqarish hajmi o'zgarganda o'rtacha xarajatlarning qanday o'zgarishi.","Эффект масштаба","Изменение средних издержек при изменении масштаба производства.","Economies of scale","The fall in average cost per unit as the scale of production increases."],["mik","Miqyosdan manfiy samara","Ishlab chiqarish hajmi oshganda o'rtacha xarajatlar ham ortib borishi.","Отрицательный эффект масштаба","Рост средних издержек при увеличении масштаба производства.","Diseconomies of scale","The rise in average cost per unit when production grows too large."],["mik","Miqyosga doimiy samara","Ishlab chiqarish hajmi o'zgarsa ham o'rtacha xarajatlar o'zgarmay qoladigan holat.","Постоянная отдача от масштаба","Ситуация, когда средние издержки не меняются при изменении масштаба производства.","Constant returns to scale","A case where average cost stays the same as the scale of production changes."],["mik","Minimal samarali hajm","Uzoq davrda o'rtacha xarajatlar eng past bo'ladigan ishlab chiqarish hajmi.","Минимальный эффективный масштаб","Объём производства, при котором долгосрочные средние издержки минимальны.","Minimum efficient scale","The lowest output level at which long-run average cost is minimized."],["mik","Umumiy daromad","Firmaning mahsulot sotishdan oladigan jami tushumi, narx va miqdor ko'paytmasiga teng.","Общая выручка","Весь доход фирмы от продаж, равный цене, умноженной на количество.","Total revenue","The total income a firm receives from sales, equal to price times quantity."],["mik","Marjinal daromad","Qo'shimcha bir birlik mahsulot sotishdan olinadigan qo'shimcha daromad.","Предельная выручка","Дополнительная выручка от продажи ещё одной единицы продукции.","Marginal revenue","The extra revenue from selling one more unit of output."],["mik","O'rtacha daromad","Umumiy daromadni sotilgan mahsulot miqdoriga bo'lish natijasi.","Средняя выручка","Общая выручка, делённая на количество проданной продукции.","Average revenue","Total revenue divided by the quantity sold."],["mik","Buxgalteriya foydasi","Daromaddan faqat aniq xarajatlarni ayirgandan keyin qoladigan foyda.","Бухгалтерская прибыль","Прибыль, равная выручке за вычетом только явных издержек.","Accounting profit","Total revenue minus explicit costs only."],["mik","Iqtisodiy foyda","Daromaddan aniq va yashirin xarajatlarning hammasini ayirgandan keyin qoladigan foyda.","Экономическая прибыль","Выручка за вычетом всех явных и неявных издержек.","Economic profit","Total revenue minus both explicit and implicit costs."],["mik","Normal foyda","Tadbirkorni biznesda ushlab turish uchun zarur bo'lgan minimal foyda, iqtisodiy foyda nolga teng.","Нормальная прибыль","Минимальная прибыль, удерживающая предпринимателя в бизнесе, при нулевой экономической прибыли.","Normal profit","The minimum return needed to keep an entrepreneur in business, equal to zero economic profit."],["mik","Foydani maksimallashtirish qoidasi","Firma marjinal daromad marjinal xarajatga teng bo'lgan hajmda ishlab chiqarganda foyda eng yuqori bo'ladi.","Правило максимизации прибыли","Фирма получает максимальную прибыль при выпуске, где предельная выручка равна предельным издержкам.","Profit-maximization rule","A firm maximizes profit by producing where marginal revenue equals marginal cost."],["mik","Bozor tuzilmasi","Bozorda sotuvchilar soni, mahsulot turi va kirish to'siqlariga qarab bozorning turi.","Структура рынка","Тип рынка, определяемый числом продавцов, видом продукта и барьерами входа.","Market structure","The type of market defined by the number of firms, product type and barriers to entry."],["mik","Monopolistik raqobat","Ko'p firma o'xshash, lekin farqlangan mahsulot sotadigan va kirish erkin bo'lgan bozor.","Монополистическая конкуренция","Рынок, где много фирм продают похожие, но дифференцированные товары при свободном входе.","Monopolistic competition","A market where many firms sell differentiated products and entry is free."],["mik","Monopsoniya","Bozorda yagona xaridor mavjud bo'lib, u narxga sezilarli ta'sir qiladigan bozor tuzilmasi.","Монопсония","Рыночная структура с единственным покупателем, способным влиять на цену.","Monopsony","A market with a single buyer that has power to influence the price."],["mik","Tabiiy monopoliya","Bitta firma butun bozorga eng past xarajat bilan xizmat ko'rsata oladigan soha.","Естественная монополия","Отрасль, где одна фирма может обслуживать весь рынок с наименьшими издержками.","Natural monopoly","An industry where one firm can supply the whole market at lower cost than several firms."],["mik","Bozorga kirish to'siqlari","Yangi firmalarning bozorga kirishini qiyinlashtiradigan omillar: litsenziya, patent, yuqori xarajatlar.","Барьеры входа на рынок","Факторы, затрудняющие появление новых фирм: лицензии, патенты, высокие затраты.","Barriers to entry","Obstacles that make it hard for new firms to enter a market, such as patents or high costs."],["mik","Bozor hokimiyati","Firmaning o'z mahsuloti narxiga ta'sir qila olish qobiliyati.","Рыночная власть","Способность фирмы влиять на цену своего продукта.","Market power","A firm's ability to influence the price of its product."],["mik","Narx oluvchi","Bozor narxini o'zgartira olmaydigan va uni berilgan deb qabul qiladigan firma yoki xaridor.","Ценополучатель","Фирма или покупатель, не способный влиять на рыночную цену и принимающий её как данность.","Price taker","A firm or buyer that cannot influence the market price and accepts it as given."],["mik","Narx belgilovchi","Mahsulot narxini o'zi belgilay oladigan bozor hokimiyatiga ega firma.","Ценоустановитель","Фирма с рыночной властью, способная самостоятельно устанавливать цену.","Price maker","A firm with market power that can set the price of its product."],["mik","Kartel","Narx va ishlab chiqarish hajmini kelishib, raqobatni cheklaydigan firmalar uyushmasi.","Картель","Соглашение фирм о ценах и объёмах производства с целью ограничения конкуренции.","Cartel","An agreement among firms to fix prices and output in order to restrict competition."],["mik","Maxfiy til biriktirish","Firmalarning narx yoki hajm bo'yicha yashirin kelishuvi.","Тайный сговор","Скрытое соглашение между фирмами о ценах или объёмах выпуска.","Collusion","A secret agreement among firms to fix prices or output."],["mik","Mahsulot differensiatsiyasi","Firmaning o'z mahsulotini raqobatchilar mahsulotidan farqlashi.","Дифференциация продукта","Отличие продукта фирмы от продуктов конкурентов по качеству, бренду или свойствам.","Product differentiation","Making a firm's product different from competitors' products in quality, brand or features."],["mik","O'yinlar nazariyasi","Manfaatlar o'zaro bog'liq bo'lgan ishtirokchilarning strategik qarorlarini o'rganuvchi nazariya.","Теория игр","Теория, изучающая стратегические решения участников с взаимозависимыми интересами.","Game theory","The study of strategic decision-making among participants whose payoffs depend on each other's choices."],["mik","Nash muvozanati","Hech bir ishtirokchi boshqalar strategiyasi o'zgarmaganda o'z strategiyasini o'zgartirishdan foyda ko'rmaydigan holat.","Равновесие Нэша","Ситуация, в которой ни один игрок не выигрывает от смены стратегии при неизменных стратегиях других.","Nash equilibrium","A situation where no player gains by changing strategy while others keep theirs unchanged."],["mik","Mahbus dilemmasi","Ikki ishtirokchi shaxsiy manfaat bilan harakat qilib, ikkalasi uchun yomonroq natijaga erishadigan o'yin.","Дилемма заключённого","Игра, в которой два игрока, действуя в личных интересах, приходят к худшему для обоих результату.","Prisoner's dilemma","A game where two players pursuing self-interest end up with a worse outcome than if they cooperated."],["mik","Dominant strategiya","O'yinchi uchun raqibning tanloviga qaramay eng yaxshi natija beradigan strategiya.","Доминирующая стратегия","Стратегия, лучшая для игрока независимо от выбора соперника.","Dominant strategy","A strategy that is best for a player regardless of what opponents choose."],["mik","To'lov matritsasi","O'yin ishtirokchilarining har bir strategiya kombinatsiyasidagi yutuqlarini ko'rsatuvchi jadval.","Матрица выигрышей","Таблица, показывающая выигрыши игроков при каждой комбинации стратегий.","Payoff matrix","A table showing each player's payoff for every combination of strategies."],["mik","Narx diskriminatsiyasi","Bir xil mahsulotni turli xaridorlarga turli narxda sotish amaliyoti.","Ценовая дискриминация","Продажа одного и того же товара разным покупателям по разным ценам.","Price discrimination","Selling the same good to different buyers at different prices."],["mik","Assimetrik axborot","Bitim tomonlaridan birida ikkinchisiga qaraganda ko'proq ma'lumot bo'lgan holat.","Асимметричная информация","Ситуация, когда одна сторона сделки владеет большей информацией, чем другая.","Asymmetric information","A situation in which one party to a transaction knows more than the other."],["mik","Axloqiy xavf","Sug'urtalangan tomon xavfsizligi kafolatlangani uchun ehtiyotkorlikni kamaytirib, xavfli harakat qilishi.","Моральный риск","Склонность застрахованной стороны вести себя более рискованно, поскольку последствия несёт кто-то другой.","Moral hazard","The tendency to take more risk when someone else bears the cost of the consequences."],["mik","Salbiy tanlov","Yashirin ma'lumot tufayli bozorda sifatsiz tovar yoki yuqori xavfli mijozlar ko'proq qolishi.","Неблагоприятный отбор","Ситуация, когда из-за скрытой информации на рынке преобладают некачественные товары или рискованные клиенты.","Adverse selection","A market problem where hidden information leads to low-quality goods or high-risk buyers dominating."],["mik","Limonlar muammosi","Xaridor sifatni bilmagani sababli sifatli tovarlar bozordan siqib chiqarilishi muammosi.","Проблема лимонов","Ситуация, когда покупатель не может оценить качество, и хорошие товары вытесняются с рынка.","Market for lemons","A problem where buyers cannot judge quality, so good products are driven out of the market."],["mik","Signal berish","Axborotga ega tomon o'z sifati haqidagi ma'lumotni boshqa tomonga yetkazadigan harakati.","Сигнализирование","Действие информированной стороны, передающее другой стороне сведения о её качестве.","Signaling","An action by the informed party that credibly reveals its quality to the other party."],["mik","Principal-agent muammosi","Agent topshiriq beruvchi manfaatlariga zid ravishda o'z manfaatida harakat qilishi muammosi.","Проблема принципала и агента","Проблема, когда агент действует в своих интересах, а не в интересах принципала.","Principal-agent problem","A conflict that arises when an agent acts in their own interest rather than the principal's."],["mik","Tashqi ta'sir","Bitimda ishtirok etmaydigan uchinchi tomonga tushadigan, narxda aks etmaydigan foyda yoki zarar.","Внешний эффект","Выгода или издержки для третьих лиц, не отражённые в цене сделки.","Externality","A cost or benefit imposed on a third party that is not reflected in market prices."],["mik","Salbiy tashqi ta'sir","Bitimda ishtirok etmaganlarga zarar yetkazadigan tashqi ta'sir, masalan ifloslanish.","Отрицательный внешний эффект","Внешний эффект, наносящий ущерб третьим лицам, например загрязнение среды.","Negative externality","A cost imposed on third parties, such as pollution."],["mik","Ijobiy tashqi ta'sir","Bitimda ishtirok etmaganlarga foyda keltiradigan tashqi ta'sir, masalan ta'lim.","Положительный внешний эффект","Внешний эффект, приносящий выгоду третьим лицам, например от образования.","Positive externality","A benefit enjoyed by third parties, such as the spillover from education."],["mik","Jamoat tovari","Hech kimni iste'moldan chetlatib bo'lmaydigan va iste'moli raqobatsiz bo'lgan tovar.","Общественное благо","Благо, от потребления которого нельзя исключить и которое не создаёт конкуренции между потребителями.","Public good","A good that is non-excludable and non-rival in consumption."],["mik","Erkin chavandoz muammosi","Tovardan to'lamasdan foydalanish istagi tufayli jamoat tovarini taqdim etishdagi muammo.","Проблема безбилетника","Проблема, при которой люди пользуются общественным благом, не платя за него.","Free-rider problem","The problem that people use a public good without paying for it."],["mik","Umumiy resurslar fojiasi","Umumiy resurslardan ortiqcha foydalanish tufayli ularning tugab qolishi.","Трагедия общин","Истощение общих ресурсов из-за чрезмерного использования отдельными лицами.","Tragedy of the commons","The overuse and depletion of a shared resource because individuals act in self-interest."],["mik","Taqsimot samaradorligi","Resurslar jamiyat uchun eng qimmatli tovarlarni ishlab chiqarishga yo'naltirilgan holat.","Аллокативная эффективность","Состояние, при котором ресурсы направлены на производство наиболее ценных для общества благ.","Allocative efficiency","A state in which resources are used to produce the goods society values most."],["mik","Ishlab chiqarish samaradorligi","Mahsulot eng kam xarajat bilan ishlab chiqariladigan holat.","Производственная эффективность","Состояние, при котором продукция производится с минимальными издержками.","Productive efficiency","A state in which output is produced at the lowest possible cost."],["mik","Qiyosiy ustunlik","Mamlakat yoki shaxsning tovarni boshqalarga qaraganda past muqobil xarajat bilan ishlab chiqara olishi.","Сравнительное преимущество","Способность производить благо с меньшими альтернативными издержками, чем другие.","Comparative advantage","The ability to produce a good at a lower opportunity cost than others."],["mik","Omillar bozori","Mehnat, yer va kapital kabi ishlab chiqarish omillari sotib olinadigan va sotiladigan bozor.","Рынок факторов производства","Рынок, где покупаются и продаются труд, земля, капитал и другие ресурсы.","Factor market","A market in which factors of production such as labor, land and capital are bought and sold."],["mik","Mehnatning marjinal mahsuloti","Qo'shimcha bir xodim yollanganda mahsulot hajmining qo'shimcha o'sishi.","Предельный продукт труда","Дополнительный выпуск от найма ещё одного работника.","Marginal product of labor","The extra output produced by hiring one more worker."],["mik","Ijara haqi","Yer yoki boshqa cheklangan resursdan foydalanganlik uchun to'lanadigan haq.","Рента","Плата за использование земли или другого ресурса с ограниченным предложением.","Rent","Payment for the use of land or another resource whose supply is limited."],["mik","Iqtisodiy renta","Resurs egasi oladigan, resursni taklif qilish uchun zarur minimal to'lovdan ortiq daromad.","Экономическая рента","Доход владельца ресурса сверх минимума, необходимого для предложения этого ресурса.","Economic rent","Income to a resource owner above the minimum payment needed to supply the resource."],["mik","Subsidiya","Davlat tomonidan ishlab chiqaruvchi yoki iste'molchiga beriladigan moliyaviy yordam.","Субсидия","Финансовая помощь государства производителям или потребителям.","Subsidy","Financial support given by the government to producers or consumers."],["mik","Soliq yuki taqsimoti","Soliq og'irligining sotuvchilar va xaridorlar o'rtasida taqsimlanishi.","Распределение налогового бремени","Распределение налогового бремени между продавцами и покупателями.","Tax incidence","How the burden of a tax is divided between buyers and sellers."],["mik","Egri soliq","Mahsulot narxiga qo'shilib, iste'molchi to'laydigan soliq, masalan aksiz yoki QQS.","Косвенный налог","Налог, включаемый в цену товара и оплачиваемый потребителем, например акциз или НДС.","Indirect tax","A tax included in the price of a good and paid by the consumer, such as VAT or excise."],["mik","Aksiz solig'i","Muayyan tovarlar, masalan tamaki va alkogol, sotilishiga qo'yiladigan egri soliq.","Акцизный налог","Косвенный налог на отдельные товары, например табак и алкоголь.","Excise tax","An indirect tax levied on specific goods such as tobacco and alcohol."],["mik","Muvozanatdan chetlanish","Bozor narxi muvozanat narxidan farq qilib, tanqislik yoki ortiqcha taklif yuzaga kelishi.","Рыночный дисбаланс","Состояние, когда цена отличается от равновесной, вызывая дефицит или избыток.","Market disequilibrium","A state in which the price differs from equilibrium, causing a shortage or a surplus."],["mik","Hukumat muvaffaqiyatsizligi","Davlat aralashuvi resurslar taqsimotini yaxshilash o'rniga yomonlashtirishi.","Провал государства","Ситуация, когда вмешательство государства ухудшает, а не улучшает распределение ресурсов.","Government failure","A situation in which government intervention makes resource allocation worse rather than better."],["mik","Marjinal tahlil","Qarorlarni qo'shimcha foyda va qo'shimcha xarajatlarni solishtirib qabul qilish usuli.","Предельный анализ","Метод принятия решений путём сравнения дополнительной выгоды и дополнительных издержек.","Marginal analysis","Decision-making by comparing the extra benefit with the extra cost of an action."],["mik","Ceteris paribus","Boshqa barcha omillar o'zgarmas deb faraz qilib, bitta omil ta'sirini o'rganish usuli.","При прочих равных условиях","Допущение о неизменности всех остальных факторов при анализе влияния одного фактора.","Ceteris paribus","The assumption that all other relevant factors stay constant while one variable is analyzed."],["mik","Normativ iqtisodiyot","Iqtisodiy jarayonlar qanday bo'lishi kerakligi haqida qiymat baholarini o'z ichiga olgan yondashuv.","Нормативная экономика","Подход, содержащий оценочные суждения о том, какой должна быть экономика.","Normative economics","An approach that makes value judgments about what the economy ought to be."],["mik","Pozitiv iqtisodiyot","Iqtisodiy jarayonlarni qanday bo'lsa, shundayligicha, faktlar asosida tavsiflovchi yondashuv.","Позитивная экономика","Подход, описывающий экономические процессы такими, какие они есть, на основе фактов.","Positive economics","An approach that describes economic behavior as it is, based on facts."],["mik","Talab elastikligi va daromad","Narx elastik bo'lsa, narx pasayganda umumiy daromad ortadi, noelastik bo'lsa kamayadi.","Эластичность спроса и выручка","При эластичном спросе снижение цены увеличивает выручку, а при неэластичном уменьшает её.","Total revenue test","If demand is elastic a price cut raises total revenue, and if inelastic it lowers it."],["mik","Qidiruv xarajatlari","Xaridor yoki sotuvchi bitim uchun ma'lumot izlashga sarflaydigan vaqt va pul.","Издержки поиска","Время и деньги, затрачиваемые на поиск информации для совершения сделки.","Search costs","The time and money spent looking for information needed to make a transaction."],["mik","Tranzaksiya xarajatlari","Bitim tuzish, nazorat qilish va bajarishga ketadigan xarajatlar.","Трансакционные издержки","Затраты на заключение, контроль и исполнение сделок.","Transaction costs","The costs of making, monitoring and enforcing an exchange."],["mik","Koz teoremasi","Tranzaksiya xarajatlari past bo'lsa, tomonlar tashqi ta'sirni o'zaro kelishuv bilan hal qila oladi.","Теорема Коуза","При низких трансакционных издержках стороны могут сами решить проблему внешних эффектов.","Coase theorem","With low transaction costs, parties can bargain privately to solve externality problems."],["mik","Marjinal ijtimoiy xarajat","Qo'shimcha bir birlik ishlab chiqarishning butun jamiyat uchun qo'shimcha xarajati.","Предельные общественные издержки","Дополнительные издержки для всего общества от производства ещё одной единицы блага.","Marginal social cost","The extra cost to society of producing one more unit, including external costs."],["mik","Marjinal ijtimoiy naf","Qo'shimcha bir birlik iste'molning butun jamiyat uchun qo'shimcha foydasi.","Предельная общественная выгода","Дополнительная выгода для всего общества от потребления ещё одной единицы блага.","Marginal social benefit","The extra benefit to society of consuming one more unit, including external benefits."],["sta","Statistika","Ommaviy hodisalar haqidagi ma'lumotlarni yig'ish, qayta ishlash, tahlil qilish va sharhlash bilan shug'ullanadigan fan.","Статистика","Наука о сборе, обработке, анализе и интерпретации данных о массовых явлениях.","Statistics","The science of collecting, processing, analyzing and interpreting data about mass phenomena."],["sta","Bosh to'plam","Tadqiqot ob'ekti bo'lgan barcha birliklarning to'liq majmuasi.","Генеральная совокупность","Полное множество всех единиц, являющихся объектом исследования.","Population","The complete set of all units that are the object of a study."],["sta","Tanlanma","Bosh to'plamdan tadqiqot uchun tanlab olingan qism.","Выборка","Часть генеральной совокупности, отобранная для исследования.","Sample","A subset selected from the population for study."],["sta","O'zgaruvchi","Kuzatuv birliklari bo'yicha turli qiymatlar qabul qiladigan belgi yoki ko'rsatkich.","Переменная","Признак или показатель, принимающий разные значения у разных единиц наблюдения.","Variable","A characteristic that takes different values across observation units."],["sta","Miqdoriy ma'lumotlar","Son bilan ifodalanadigan va o'lchanadigan ma'lumotlar.","Количественные данные","Данные, выраженные числами и поддающиеся измерению.","Quantitative data","Data expressed in numbers that can be measured."],["sta","Sifat ma'lumotlari","Raqamlar bilan emas, toifalar yoki tavsif bilan ifodalanadigan ma'lumotlar.","Качественные данные","Данные, выраженные категориями или описанием, а не числами.","Qualitative data","Data described by categories or labels rather than numbers."],["sta","Nominal shkala","Ob'ektlarni faqat nomi bo'yicha toifalarga ajratadigan, tartibsiz o'lchov shkalasi.","Номинальная шкала","Шкала измерения, разделяющая объекты на категории без какого-либо порядка.","Nominal scale","A measurement scale that sorts objects into categories with no inherent order."],["sta","Tartib shkalasi","Toifalar o'rtasida tartib mavjud, lekin oraliq farqi o'lchanmaydigan shkala.","Порядковая шкала","Шкала, где категории упорядочены, но интервалы между ними не измеряются.","Ordinal scale","A scale whose categories have a meaningful order but unmeasured gaps between them."],["sta","Kesma ma'lumotlar","Bir vaqt nuqtasida turli ob'ektlar bo'yicha yig'ilgan ma'lumotlar.","Пространственные данные","Данные по разным объектам, собранные в один момент времени.","Cross-sectional data","Data collected on many units at a single point in time."],["sta","Panel ma'lumotlar","Bir xil ob'ektlar bo'yicha bir necha davr davomida kuzatilgan ma'lumotlar.","Панельные данные","Данные по одним и тем же объектам, наблюдаемым в течение нескольких периодов.","Panel data","Data that follow the same units over several time periods."],["sta","Chastota","Qiymatning ma'lumotlar qatorida necha marta uchrashini ko'rsatuvchi son.","Частота","Число, показывающее, сколько раз значение встречается в ряду данных.","Frequency","The number of times a value occurs in a data set."],["sta","Nisbiy chastota","Chastotaning kuzatuvlar umumiy soniga nisbati.","Относительная частота","Отношение частоты к общему числу наблюдений.","Relative frequency","The ratio of a value's frequency to the total number of observations."],["sta","Kumulyativ chastota","Berilgan qiymatgacha bo'lgan barcha chastotalar yig'indisi.","Накопленная частота","Сумма всех частот до данного значения включительно.","Cumulative frequency","The running total of frequencies up to a given value."],["sta","Gistogramma","Oraliqlar bo'yicha chastotalarni ustunlar ko'rinishida tasvirlaydigan grafik.","Гистограмма","График, показывающий частоты по интервалам в виде столбцов.","Histogram","A chart showing frequencies over intervals as adjacent bars."],["sta","O'rtacha arifmetik","Barcha qiymatlar yig'indisining ularning soniga bo'linmasi.","Среднее арифметическое","Сумма всех значений, делённая на их количество.","Arithmetic mean","The sum of all values divided by their number."],["sta","Mediana","Tartiblangan qatorni teng ikkiga bo'luvchi o'rtadagi qiymat.","Медиана","Серединное значение упорядоченного ряда, делящее его на две равные части.","Median","The middle value that splits an ordered data set into two equal halves."],["sta","Moda","Ma'lumotlar qatorida eng ko'p uchraydigan qiymat.","Мода","Значение, наиболее часто встречающееся в ряду данных.","Mode","The value that occurs most often in a data set."],["sta","Geometrik o'rtacha","Qiymatlar ko'paytmasidan olingan n-darajali ildiz, o'sish sur'atlari uchun ishlatiladi.","Среднее геометрическое","Корень n-й степени из произведения значений, применяется для темпов роста.","Geometric mean","The n-th root of the product of values, used for growth rates."],["sta","Vaznli o'rtacha","Har bir qiymat o'z og'irligiga ko'paytirilib hisoblanadigan o'rtacha.","Средневзвешенное","Среднее, при расчёте которого каждое значение умножается на свой вес.","Weighted mean","An average in which each value is multiplied by its weight."],["sta","Garmonik o'rtacha","Qiymatlarga teskari sonlarning arifmetik o'rtachasiga teskari miqdor.","Среднее гармоническое","Величина, обратная среднему арифметическому обратных значений.","Harmonic mean","The reciprocal of the arithmetic mean of the reciprocals of the values."],["sta","Dispersiya","Qiymatlarning o'rtachadan chetlanishlari kvadratlarining o'rtacha qiymati.","Дисперсия","Среднее значение квадратов отклонений от среднего.","Variance","The average of the squared deviations from the mean."],["sta","Standart og'ish","Dispersiyaning kvadrat ildizi, ma'lumotlar sochilishini asl birlikda ko'rsatadi.","Стандартное отклонение","Квадратный корень из дисперсии, показывающий разброс данных в исходных единицах.","Standard deviation","The square root of variance, measuring spread in the original units."],["sta","Variatsiya koeffitsienti","Standart og'ishning o'rtachaga nisbati, foizda ifodalanadigan nisbiy sochilish o'lchovi.","Коэффициент вариации","Отношение стандартного отклонения к среднему, выраженное в процентах.","Coefficient of variation","The ratio of standard deviation to the mean, a relative measure of spread."],["sta","Variatsiya kengligi","Eng katta va eng kichik qiymat orasidagi farq.","Размах вариации","Разность между наибольшим и наименьшим значениями.","Range","The difference between the largest and smallest values."],["sta","Kvartil","Tartiblangan qatorni to'rtta teng qismga bo'luvchi qiymatlar.","Квартиль","Значения, делящие упорядоченный ряд на четыре равные части.","Quartile","Values that divide an ordered data set into four equal parts."],["sta","Kvartillararo kenglik","Uchinchi va birinchi kvartillar orasidagi farq.","Межквартильный размах","Разность между третьим и первым квартилями.","Interquartile range","The difference between the third and first quartiles."],["sta","Persentil","Kuzatuvlarning berilgan foizi undan past bo'lgan qiymat.","Перцентиль","Значение, ниже которого лежит заданный процент наблюдений.","Percentile","The value below which a given percentage of observations fall."],["sta","Assimmetriya","Taqsimotning simmetriklikdan chetlanish darajasini ko'rsatuvchi ko'rsatkich.","Асимметрия","Показатель степени отклонения распределения от симметричности.","Skewness","A measure of how asymmetric a distribution is."],["sta","Ekssess","Taqsimot cho'qqisining o'tkirligi yoki yassiligini ifodalovchi ko'rsatkich.","Эксцесс","Показатель остроты или плоскостности вершины распределения.","Kurtosis","A measure of how peaked or heavy-tailed a distribution is."],["sta","Taqsimot","Tasodifiy miqdor qiymatlari va ularning ehtimolliklari o'rtasidagi bog'liqlik.","Распределение","Соответствие между значениями случайной величины и их вероятностями.","Distribution","The relationship between the values of a random variable and their probabilities."],["sta","Normal taqsimot","Qo'ng'iroqsimon, o'rtacha atrofida simmetrik bo'lgan uzluksiz taqsimot.","Нормальное распределение","Непрерывное колоколообразное распределение, симметричное относительно среднего.","Normal distribution","A continuous bell-shaped distribution symmetric around its mean."],["sta","Standart normal taqsimot","O'rtachasi nol va standart og'ishi bir bo'lgan normal taqsimot.","Стандартное нормальное распределение","Нормальное распределение с нулевым средним и единичным стандартным отклонением.","Standard normal distribution","A normal distribution with mean zero and standard deviation one."],["sta","Binomial taqsimot","Bir xil mustaqil sinovlarda muvaffaqiyatlar sonining ehtimollik taqsimoti.","Биномиальное распределение","Распределение вероятностей числа успехов в серии независимых одинаковых испытаний.","Binomial distribution","The distribution of the number of successes in independent identical trials."],["sta","Puasson taqsimoti","Belgilangan vaqt yoki hududda kam uchraydigan hodisalar sonining taqsimoti.","Распределение Пуассона","Распределение числа редких событий за фиксированный период или на участке.","Poisson distribution","The distribution of the number of rare events in a fixed interval."],["sta","Tekis taqsimot","Barcha qiymatlar teng ehtimollikka ega bo'lgan taqsimot.","Равномерное распределение","Распределение, в котором все значения равновероятны.","Uniform distribution","A distribution in which all values are equally likely."],["sta","Eksponensial taqsimot","Hodisalar orasidagi kutish vaqtini tavsiflovchi uzluksiz taqsimot.","Экспоненциальное распределение","Непрерывное распределение, описывающее время ожидания между событиями.","Exponential distribution","A continuous distribution describing the waiting time between events."],["sta","Student taqsimoti","Kichik tanlanmalarda o'rtachani baholash uchun ishlatiladigan, dumi og'ir taqsimot.","Распределение Стьюдента","Распределение с тяжёлыми хвостами, применяемое при оценке среднего по малым выборкам.","Student's t-distribution","A heavy-tailed distribution used to estimate means from small samples."],["sta","Xi-kvadrat taqsimoti","Standart normal miqdorlar kvadratlari yig'indisining taqsimoti.","Распределение хи-квадрат","Распределение суммы квадратов стандартных нормальных величин.","Chi-square distribution","The distribution of a sum of squared standard normal variables."],["sta","Fisher taqsimoti","Ikki xi-kvadrat miqdorning nisbati sifatida hosil bo'ladigan taqsimot.","Распределение Фишера","Распределение, возникающее как отношение двух величин хи-квадрат.","F-distribution","The distribution formed by the ratio of two scaled chi-square variables."],["sta","Ehtimollik","Hodisaning ro'y berish imkoniyatini nol bilan bir orasidagi son bilan o'lchash.","Вероятность","Числовая мера возможности наступления события, от нуля до единицы.","Probability","A number between zero and one measuring how likely an event is."],["sta","Hodisa","Tajriba natijasida ro'y berishi yoki ro'y bermasligi mumkin bo'lgan natija.","Событие","Результат опыта, который может произойти или не произойти.","Event","An outcome of an experiment that may or may not occur."],["sta","Shartli ehtimollik","Boshqa hodisa ro'y bergan sharoitda hodisaning ehtimolligi.","Условная вероятность","Вероятность события при условии, что произошло другое событие.","Conditional probability","The probability of an event given that another event has occurred."],["sta","Bog'liqsiz hodisalar","Birining ro'y berishi ikkinchisining ehtimolligiga ta'sir qilmaydigan hodisalar.","Независимые события","События, наступление одного из которых не влияет на вероятность другого.","Independent events","Events where the occurrence of one does not affect the probability of the other."],["sta","Bayes teoremasi","Yangi ma'lumot asosida hodisaning ehtimolligini qayta hisoblash qoidasi.","Теорема Байеса","Правило пересчёта вероятности события с учётом новой информации.","Bayes' theorem","A rule for updating the probability of an event given new evidence."],["sta","To'liq ehtimollik formulasi","Hodisa ehtimolligini to'liq guruh gipotezalari bo'yicha hisoblash formulasi.","Формула полной вероятности","Формула вычисления вероятности события через полную группу гипотез.","Law of total probability","A formula computing an event's probability by summing over a partition of cases."],["sta","Tasodifiy miqdor","Qiymati tajriba natijasiga bog'liq holda tasodifan aniqlanadigan miqdor.","Случайная величина","Величина, значение которой определяется случаем в зависимости от исхода опыта.","Random variable","A variable whose value is determined by the outcome of a random experiment."],["sta","Matematik kutilma","Tasodifiy miqdorning ehtimolliklar bilan tortilgan o'rtacha qiymati.","Математическое ожидание","Среднее значение случайной величины, взвешенное по вероятностям.","Expected value","The probability-weighted average value of a random variable."],["sta","Ehtimollik zichligi funksiyasi","Uzluksiz tasodifiy miqdorning qiymatlar oralig'iga tushish ehtimolini beruvchi funksiya.","Функция плотности вероятности","Функция, интеграл которой даёт вероятность попадания непрерывной величины в интервал.","Probability density function","A function whose area over an interval gives the probability of a continuous variable falling there."],["sta","Taqsimot funksiyasi","Tasodifiy miqdorning berilgan sondan kichik bo'lish ehtimolini beruvchi funksiya.","Функция распределения","Функция, задающая вероятность того, что случайная величина меньше заданного числа.","Cumulative distribution function","A function giving the probability that a random variable is at most a given value."],["sta","Statistik gipoteza","Bosh to'plam parametrlari yoki taqsimoti haqidagi tekshirilishi kerak bo'lgan taxmin.","Статистическая гипотеза","Проверяемое предположение о параметрах или распределении генеральной совокупности.","Statistical hypothesis","A testable assumption about population parameters or distribution."],["sta","Nolinchi gipoteza","Hech qanday ta'sir yoki farq yo'q deb hisoblovchi dastlabki gipoteza.","Нулевая гипотеза","Исходная гипотеза об отсутствии эффекта или различий.","Null hypothesis","The default hypothesis that there is no effect or difference."],["sta","Alternativ gipoteza","Nolinchi gipoteza rad etilsa qabul qilinadigan, ta'sir mavjudligini bildiruvchi gipoteza.","Альтернативная гипотеза","Гипотеза о наличии эффекта, принимаемая при отклонении нулевой гипотезы.","Alternative hypothesis","The hypothesis that an effect exists, accepted if the null is rejected."],["sta","Statistik mezon","Gipotezani tekshirish uchun tanlanma asosida hisoblanadigan miqdor.","Статистический критерий","Величина, вычисляемая по выборке для проверки гипотезы.","Test statistic","A value computed from sample data to test a hypothesis."],["sta","p-qiymat","Nolinchi gipoteza to'g'ri bo'lganda kuzatilgan yoki undan chetroq natija chiqish ehtimoli.","p-значение","Вероятность получить наблюдаемый или более крайний результат при верной нулевой гипотезе.","P-value","The probability of observing a result at least as extreme if the null is true."],["sta","Ahamiyatlilik darajasi","To'g'ri nolinchi gipotezani rad etishga yo'l qo'yiladigan maksimal ehtimollik.","Уровень значимости","Максимально допустимая вероятность отклонить верную нулевую гипотезу.","Significance level","The maximum accepted probability of rejecting a true null hypothesis."],["sta","I tur xato","To'g'ri bo'lgan nolinchi gipotezani noto'g'ri rad etish.","Ошибка первого рода","Ошибочное отклонение верной нулевой гипотезы.","Type I error","Wrongly rejecting a null hypothesis that is true."],["sta","II tur xato","Noto'g'ri bo'lgan nolinchi gipotezani rad etmasdan qoldirish.","Ошибка второго рода","Неотклонение ложной нулевой гипотезы.","Type II error","Failing to reject a null hypothesis that is false."],["sta","Mezon quvvati","Noto'g'ri nolinchi gipotezani to'g'ri rad etish ehtimoli.","Мощность критерия","Вероятность правильно отклонить ложную нулевую гипотезу.","Statistical power","The probability of correctly rejecting a false null hypothesis."],["sta","Ishonch oralig'i","Noma'lum parametr berilgan ehtimollik bilan tushadigan qiymatlar oralig'i.","Доверительный интервал","Интервал значений, в который неизвестный параметр попадает с заданной вероятностью.","Confidence interval","A range of values that contains the unknown parameter with a stated probability."],["sta","Ishonch darajasi","Ishonch oralig'i parametrni qamrab olish ehtimoli, masalan 95 foiz.","Доверительная вероятность","Вероятность того, что доверительный интервал накрывает параметр, например 95 процентов.","Confidence level","The probability, such as 95 percent, that the interval covers the parameter."],["sta","Standart xato","Tanlanma statistikasining tanlamadan tanlamaga o'zgarish me'yori.","Стандартная ошибка","Мера изменчивости выборочной статистики от выборки к выборке.","Standard error","The standard deviation of a sample statistic across repeated samples."],["sta","Erkinlik darajasi","Hisoblashda erkin o'zgara oladigan qiymatlar soni.","Степени свободы","Число значений, которые могут свободно изменяться при вычислении статистики.","Degrees of freedom","The number of values free to vary when computing a statistic."],["sta","t-mezon","O'rtacha qiymatlarni kichik tanlanmada taqqoslash uchun Student taqsimotiga asoslangan mezon.","t-критерий","Критерий на основе распределения Стьюдента для сравнения средних по малым выборкам.","T-test","A test based on the t-distribution for comparing means in small samples."],["sta","z-mezon","Dispersiya ma'lum yoki tanlanma katta bo'lganda o'rtachani tekshiruvchi normal taqsimotga asoslangan mezon.","z-критерий","Критерий на основе нормального распределения для проверки среднего при известной дисперсии или большой выборке.","Z-test","A normal-distribution test for means when variance is known or the sample is large."],["sta","Xi-kvadrat mezoni","Kuzatilgan va kutilgan chastotalar mosligini yoki belgilar bog'liqligini tekshiruvchi mezon.","Критерий хи-квадрат","Критерий проверки согласия наблюдаемых и ожидаемых частот или связи признаков.","Chi-square test","A test comparing observed and expected frequencies or checking association of categories."],["sta","Dispersion tahlil","Uch va undan ortiq guruh o'rtachalarining tengligini tekshiruvchi usul (ANOVA).","Дисперсионный анализ","Метод проверки равенства средних трёх и более групп (ANOVA).","ANOVA","A method testing whether the means of three or more groups are equal."],["sta","F-mezon","Dispersiyalar nisbatiga asoslangan, modelning umumiy ahamiyatini tekshiruvchi mezon.","F-критерий","Критерий на основе отношения дисперсий, проверяющий значимость модели в целом.","F-test","A test based on a variance ratio, often checking overall model significance."],["sta","Parametrik bo'lmagan mezon","Taqsimot shakli haqida qat'iy taxmin talab qilmaydigan statistik mezon.","Непараметрический критерий","Статистический критерий, не требующий строгих предположений о форме распределения.","Nonparametric test","A statistical test that does not assume a specific distribution shape."],["sta","Korrelyatsiya","Ikki o'zgaruvchi orasidagi chiziqli bog'liqlikning kuchi va yo'nalishi.","Корреляция","Сила и направление линейной связи между двумя переменными.","Correlation","The strength and direction of the linear relationship between two variables."],["sta","Pirson korrelyatsiya koeffitsienti","Chiziqli bog'liqlikni minus birdan bir gacha bo'lgan son bilan o'lchovchi koeffitsient.","Коэффициент корреляции Пирсона","Коэффициент, измеряющий линейную связь числом от минус единицы до единицы.","Pearson correlation coefficient","A coefficient from minus one to one measuring linear association."],["sta","Spirmen korrelyatsiyasi","Qiymatlar o'rinlari (ranglari) asosida hisoblanadigan, monoton bog'liqlik o'lchovi.","Корреляция Спирмена","Мера монотонной связи, вычисляемая по рангам значений.","Spearman correlation","A rank-based measure of monotonic association between two variables."],["sta","Kovariatsiya","Ikki o'zgaruvchining birgalikda qanday o'zgarishini ko'rsatuvchi o'lchov.","Ковариация","Мера того, как две переменные изменяются совместно.","Covariance","A measure of how two variables vary together."],["sta","Determinatsiya koeffitsienti","Modelning natija o'zgaruvchisi o'zgarishining qancha qismini tushuntirishini ko'rsatuvchi R kvadrat.","Коэффициент детерминации","Показатель R-квадрат, отражающий долю вариации результата, объяснённую моделью.","R-squared","The share of variation in the outcome variable explained by the model."],["sta","Tuzatilgan R kvadrat","Modeldagi omillar sonini hisobga olib tuzatilgan determinatsiya koeffitsienti.","Скорректированный R-квадрат","Коэффициент детерминации, скорректированный на число факторов модели.","Adjusted R-squared","R-squared adjusted for the number of predictors in the model."],["sta","Regressiya tahlili","Bir o'zgaruvchining boshqalarga bog'liqligini tenglama ko'rinishida baholash usuli.","Регрессионный анализ","Метод оценки зависимости одной переменной от других в виде уравнения.","Regression analysis","A method estimating how one variable depends on others through an equation."],["sta","Chiziqli regressiya","Bog'liqlikni to'g'ri chiziq tenglamasi bilan ifodalovchi regressiya modeli.","Линейная регрессия","Регрессионная модель, выражающая зависимость уравнением прямой.","Linear regression","A regression model that expresses the relationship as a straight line."],["sta","Ko'p omilli regressiya","Natijaga bir nechta tushuntiruvchi o'zgaruvchi ta'sirini baholovchi regressiya.","Множественная регрессия","Регрессия, оценивающая влияние нескольких объясняющих переменных на результат.","Multiple regression","A regression with several explanatory variables influencing the outcome."],["sta","Eng kichik kvadratlar usuli","Qoldiqlar kvadratlari yig'indisini minimallashtirib parametrlarni baholash usuli.","Метод наименьших квадратов","Метод оценки параметров путём минимизации суммы квадратов остатков.","Ordinary least squares","An estimation method that minimizes the sum of squared residuals."],["sta","Regressiya koeffitsienti","Tushuntiruvchi o'zgaruvchi bir birlikka o'zganda natijaning o'rtacha o'zgarishi.","Коэффициент регрессии","Среднее изменение результата при изменении объясняющей переменной на единицу.","Regression coefficient","The average change in the outcome for a one-unit change in a predictor."],["sta","Qoldiq","Kuzatilgan qiymat bilan model bashorat qilgan qiymat orasidagi farq.","Остаток","Разность между наблюдаемым значением и значением, предсказанным моделью.","Residual","The difference between an observed value and the model's fitted value."],["sta","Xato had","Modelda hisobga olinmagan omillar ta'sirini ifodalovchi tasodifiy tashkil etuvchi.","Случайная ошибка","Случайная составляющая, отражающая влияние не учтённых в модели факторов.","Error term","The random component capturing factors not included in the model."],["sta","Geteroskedastiklik","Xatolar dispersiyasining kuzatuvlar bo'yicha o'zgarib turishi.","Гетероскедастичность","Непостоянство дисперсии ошибок по наблюдениям.","Heteroscedasticity","Non-constant variance of the error term across observations."],["sta","Avtokorrelyatsiya","Xatolar yoki qator hadlarining o'zining oldingi qiymatlari bilan bog'liqligi.","Автокорреляция","Зависимость ошибок или членов ряда от их собственных предыдущих значений.","Autocorrelation","Correlation of errors or series values with their own past values."],["sta","Multikollinearlik","Tushuntiruvchi o'zgaruvchilarning o'zaro kuchli bog'liq bo'lishi.","Мультиколлинеарность","Сильная взаимосвязь между объясняющими переменными модели.","Multicollinearity","Strong correlation among the explanatory variables of a model."],["sta","Dummy o'zgaruvchi","Sifat belgisini nol yoki bir qiymat bilan kodlovchi sun'iy o'zgaruvchi.","Фиктивная переменная","Искусственная переменная, кодирующая качественный признак нулём или единицей.","Dummy variable","An indicator variable coding a qualitative feature as zero or one."],["sta","Endogenlik","Tushuntiruvchi o'zgaruvchining xato had bilan bog'liq bo'lishi, bu baholarni buzadi.","Эндогенность","Связь объясняющей переменной со случайной ошибкой, искажающая оценки.","Endogeneity","Correlation between a regressor and the error term, which biases estimates."],["sta","Instrumental o'zgaruvchi","Endogen omilga bog'liq, lekin xato had bilan bog'liq bo'lmagan yordamchi o'zgaruvchi.","Инструментальная переменная","Вспомогательная переменная, связанная с эндогенным фактором, но не с ошибкой.","Instrumental variable","An auxiliary variable tied to the endogenous regressor but unrelated to the error."],["sta","Logit model","Natija ikki qiymatli bo'lganda ehtimollikni logistik funksiya orqali baholovchi model.","Логит-модель","Модель, оценивающая вероятность бинарного исхода через логистическую функцию.","Logit model","A model estimating the probability of a binary outcome via the logistic function."],["sta","Probit model","Ikki qiymatli natija ehtimolligini normal taqsimot funksiyasi orqali baholovchi model.","Пробит-модель","Модель, оценивающая вероятность бинарного исхода через функцию нормального распределения.","Probit model","A model estimating a binary outcome's probability via the normal CDF."],["sta","Spetsifikatsiya xatosi","Modelga muhim omilni kiritmaslik yoki noto'g'ri shakl tanlash natijasidagi xato.","Ошибка спецификации","Ошибка из-за пропуска существенного фактора или неверного выбора формы модели.","Specification error","An error from omitting key variables or choosing the wrong model form."],["sta","Darbin-Uotson mezoni","Regressiya qoldiqlarida birinchi tartibli avtokorrelyatsiyani tekshiruvchi mezon.","Критерий Дарбина-Уотсона","Критерий проверки автокорреляции первого порядка в остатках регрессии.","Durbin-Watson test","A test for first-order autocorrelation in regression residuals."],["sta","Vaqt qatori","Vaqt bo'yicha ketma-ket davrlarda kuzatilgan ko'rsatkich qiymatlari qatori.","Временной ряд","Последовательность значений показателя, наблюдаемых в последовательные периоды времени.","Time series","A sequence of values of an indicator observed over successive time periods."],["sta","Trend","Vaqt qatorining uzoq muddatli asosiy o'sish yoki kamayish yo'nalishi.","Тренд","Долгосрочная основная тенденция роста или снижения временного ряда.","Trend","The long-term underlying direction of increase or decrease in a series."],["sta","Mavsumiylik","Yil davomida muntazam takrorlanadigan qisqa muddatli tebranishlar.","Сезонность","Регулярно повторяющиеся в течение года краткосрочные колебания.","Seasonality","Regular short-term fluctuations repeating within each year."],["sta","Sirpanuvchi o'rtacha","Tebranishlarni silliqlash uchun ketma-ket oraliqlar bo'yicha hisoblangan o'rtacha.","Скользящая средняя","Среднее по последовательным окнам, применяемое для сглаживания колебаний.","Moving average","An average over successive windows used to smooth fluctuations."],["sta","Eksponensial tekislash","Yangi kuzatuvlarga ko'proq vazn berib qatorni silliqlash va prognoz qilish usuli.","Экспоненциальное сглаживание","Метод сглаживания и прогноза, придающий больший вес недавним наблюдениям.","Exponential smoothing","A smoothing and forecasting method that weights recent observations more."],["sta","Statsionarlik","Qator o'rtachasi, dispersiyasi va avtokovariatsiyasi vaqt o'tishi bilan o'zgarmasligi.","Стационарность","Свойство ряда, при котором среднее, дисперсия и автоковариация не меняются во времени.","Stationarity","A property of a series whose mean, variance and autocovariance stay constant over time."],["sta","Birlik ildiz","Qatorning nostatsionarligini va tasodifiy kezish xossasini bildiruvchi holat.","Единичный корень","Свойство ряда, указывающее на нестационарность и случайное блуждание.","Unit root","A feature indicating a nonstationary, random-walk-like series."],["sta","Kointegratsiya","Nostatsionar qatorlar o'rtasidagi barqaror uzoq muddatli muvozanat bog'liqligi.","Коинтеграция","Устойчивая долгосрочная равновесная связь между нестационарными рядами.","Cointegration","A stable long-run equilibrium relationship among nonstationary series."],["sta","ARIMA modeli","Qatorning o'tmish qiymatlari va xatolari asosida prognoz qiluvchi vaqt qatori modeli.","Модель ARIMA","Модель временного ряда, прогнозирующая по прошлым значениям и ошибкам ряда.","ARIMA model","A time-series model forecasting from past values and past errors."],["sta","Prognozlash","O'tmish ma'lumotlari asosida kelajakdagi qiymatlarni baholash.","Прогнозирование","Оценка будущих значений на основе прошлых данных.","Forecasting","Estimating future values based on past data."],["sta","Indeks","Ko'rsatkichning ikki davr yoki ob'ekt bo'yicha nisbiy o'zgarishini ifodalovchi son.","Индекс","Число, выражающее относительное изменение показателя между периодами или объектами.","Index number","A number expressing the relative change of a variable between periods or units."],["sta","Laspeyres indeksi","Narxlar o'zgarishini bazis davr miqdorlari bilan tortib hisoblanadigan indeks.","Индекс Ласпейреса","Индекс изменения цен, взвешенный по количествам базисного периода.","Laspeyres index","A price index weighted by base-period quantities."],["sta","Paashe indeksi","Narxlar o'zgarishini joriy davr miqdorlari bilan tortib hisoblanadigan indeks.","Индекс Пааше","Индекс изменения цен, взвешенный по количествам текущего периода.","Paasche index","A price index weighted by current-period quantities."],["sta","Fisher indeksi","Laspeyres va Paashe indekslarining geometrik o'rtachasi.","Индекс Фишера","Среднее геометрическое индексов Ласпейреса и Пааше.","Fisher index","The geometric mean of the Laspeyres and Paasche indices."],["sta","Iste'mol narxlari indeksi","Aholi sotib oladigan tovar va xizmatlar savatining narxi o'zgarishini o'lchovchi indeks.","Индекс потребительских цен","Индекс, измеряющий изменение стоимости набора товаров и услуг, покупаемых населением.","Consumer price index","An index measuring the price change of a basket of goods and services bought by households."],["sta","Mutlaq o'sish","Ko'rsatkichning joriy va bazis davr qiymatlari orasidagi ayirma.","Абсолютный прирост","Разность между значениями показателя в текущем и базисном периодах.","Absolute change","The difference between the current and base-period values of an indicator."],["sta","O'sish sur'ati","Joriy davr darajasining bazis davr darajasiga nisbati, foizda.","Темп роста","Отношение уровня текущего периода к уровню базисного периода в процентах.","Growth rate","The ratio of the current-period level to the base-period level, in percent."],["sta","Tasodifiy tanlama","Har bir birlikka tanlanish uchun teng imkoniyat beradigan tanlash usuli.","Случайная выборка","Способ отбора, дающий каждой единице равные шансы попасть в выборку.","Simple random sampling","A selection method giving every unit an equal chance of being chosen."],["sta","Tabaqalashgan tanlama","Bosh to'plam guruhlarga bo'linib, har bir guruhdan tasodifiy tanlanadigan usul.","Стратифицированная выборка","Метод, при котором совокупность делится на группы и из каждой случайно отбирается часть.","Stratified sampling","A method dividing the population into groups and sampling randomly within each."],["sta","Klaster tanlama","Bosh to'plam guruhlarga bo'linib, tasodifan tanlangan guruhlar to'liq o'rganiladigan usul.","Кластерная выборка","Метод, при котором случайно выбираются целые группы, изучаемые полностью.","Cluster sampling","A method randomly selecting whole groups and surveying all units within them."],["sta","Sistematik tanlama","Ro'yxatdan har k-chi birlik tanlanadigan usul.","Систематическая выборка","Метод, при котором из списка отбирается каждая k-я единица.","Systematic sampling","A method selecting every k-th unit from a list."],["sta","Qulaylik tanlamasi","Eng oson ulanadigan birliklardan iborat, tasodifiy bo'lmagan tanlama.","Удобная выборка","Неслучайная выборка из наиболее доступных единиц.","Convenience sampling","A nonrandom sample made of the most easily reachable units."],["sta","Tanlanma xatosi","Tanlanma xarakteristikalarining bosh to'plam xarakteristikalaridan tasodifiy farqi.","Ошибка выборки","Случайное расхождение между характеристиками выборки и генеральной совокупности.","Sampling error","The random difference between sample and population characteristics."],["sta","Siljish","Baholash yoki tanlashdagi muntazam xato, natijani bir tomonga og'diradi.","Смещение","Систематическая ошибка оценки или отбора, сдвигающая результат в одну сторону.","Bias","A systematic error that pushes estimates in one direction."],["sta","Siljimagan baho","Kutilmasi baholanayotgan parametrga teng bo'lgan baho.","Несмещённая оценка","Оценка, математическое ожидание которой равно оцениваемому параметру.","Unbiased estimator","An estimator whose expected value equals the parameter being estimated."],["sta","Asosli baho","Tanlanma hajmi oshgani sari haqiqiy parametrga yaqinlashuvchi baho.","Состоятельная оценка","Оценка, сходящаяся к истинному параметру с ростом объёма выборки.","Consistent estimator","An estimator that converges to the true parameter as the sample grows."],["sta","Samarali baho","Mumkin bo'lgan eng kichik dispersiyaga ega bo'lgan siljimagan baho.","Эффективная оценка","Несмещённая оценка с наименьшей возможной дисперсией.","Efficient estimator","An unbiased estimator with the smallest possible variance."],["sta","Maksimal ehtimollik usuli","Kuzatilgan ma'lumotlar ehtimolligini eng katta qiladigan parametrlarni topish usuli.","Метод максимального правдоподобия","Метод поиска параметров, максимизирующих вероятность наблюдаемых данных.","Maximum likelihood estimation","A method choosing parameters that make the observed data most probable."],["sta","Chetki qiymat","Ma'lumotlarning asosiy qismidan keskin ajralib turuvchi g'ayrioddiy qiymat.","Выброс","Необычное значение, резко отличающееся от основной массы данных.","Outlier","An unusual value that differs sharply from the bulk of the data."],["sta","Markaziy limit teoremasi","Tanlanma o'rtachalari taqsimoti tanlanma hajmi oshgani sari normalga yaqinlashishi haqidagi teorema.","Центральная предельная теорема","Теорема о стремлении распределения выборочных средних к нормальному с ростом объёма выборки.","Central limit theorem","The theorem that sample means become approximately normal as sample size grows."],["sta","Katta sonlar qonuni","Kuzatuvlar soni ortgani sari tanlanma o'rtachasi kutilmaga yaqinlashishi qonuni.","Закон больших чисел","Закон, по которому выборочное среднее приближается к математическому ожиданию с ростом числа наблюдений.","Law of large numbers","The principle that sample averages approach the expected value as observations increase."],["sta","Monte-Karlo usuli","Tasodifiy sonlar bilan ko'p marta simulyatsiya qilib natijani baholash usuli.","Метод Монте-Карло","Метод оценки результата многократным моделированием со случайными числами.","Monte Carlo simulation","A method estimating outcomes by repeated simulation with random numbers."],["sta","Bootstrap","Tanlanmadan qaytarib tanlash orqali baholar aniqligini hisoblash usuli.","Бутстрэп","Метод оценки точности через многократный отбор с возвращением из имеющейся выборки.","Bootstrap","A method assessing estimate accuracy by resampling the data with replacement."],["sta","Ekonometrika","Iqtisodiy nazariyani statistik usullar bilan real ma'lumotlarda tekshiruvchi fan.","Эконометрика","Наука, проверяющая экономическую теорию на реальных данных статистическими методами.","Econometrics","The field that tests economic theory on real data using statistical methods."],["sta","Panel regressiyada qayd etilgan ta'sirlar","Har bir ob'ektning o'zgarmas xususiyatlarini nazorat qiluvchi panel model.","Модель с фиксированными эффектами","Панельная модель, учитывающая неизменные во времени особенности каждого объекта.","Fixed effects model","A panel model controlling for each unit's time-invariant characteristics."],["sta","Farqlar farqi usuli","Ta'sir va nazorat guruhlarining o'zgarishlarini solishtirib siyosat ta'sirini baholash usuli.","Метод разности разностей","Метод оценки эффекта политики через сравнение изменений в экспериментальной и контрольной группах.","Difference-in-differences","A method estimating policy effects by comparing changes in treated and control groups."],["sta","Sababiy ta'sir","Bir omilning boshqasiga haqiqiy ta'siri, oddiy bog'liqlikdan farqli.","Причинно-следственная связь","Реальное влияние одного фактора на другой, в отличие от простой корреляции.","Causality","A genuine effect of one factor on another, beyond mere correlation."],["sta","Aholini ro'yxatga olish","Mamlakatdagi barcha aholi to'g'risida ma'lumotlarni muntazam to'liq yig'ish.","Перепись населения","Периодический сплошной сбор данных обо всём населении страны.","Census","A complete periodic count and survey of all people in a country."],["sta","Tanlanma kuzatuv","Bosh to'plamning faqat bir qismini o'rganib, natijani butunga tatbiq etuvchi kuzatuv.","Выборочное наблюдение","Наблюдение части совокупности с распространением результатов на всю совокупность.","Sample survey","A survey of part of the population with results generalized to the whole."],["sta","Milliy hisoblar tizimi","Mamlakat iqtisodiyotini yagona metodologiya asosida tavsiflovchi makroiqtisodiy ko'rsatkichlar tizimi.","Система национальных счетов","Система макроэкономических показателей, описывающих экономику страны по единой методологии.","System of national accounts","A framework of macroeconomic accounts describing a national economy under common rules."],["sta","Yalpi ichki mahsulot","Mamlakat hududida bir yilda ishlab chiqarilgan barcha yakuniy tovar va xizmatlar qiymati.","Валовой внутренний продукт","Стоимость всех конечных товаров и услуг, произведённых на территории страны за год.","Gross domestic product","The value of all final goods and services produced within a country in a year."],["sta","Rasmiy statistika","Davlat statistika organlari tomonidan belgilangan tartibda tayyorlanadigan va e'lon qilinadigan ma'lumotlar.","Официальная статистика","Данные, подготавливаемые и публикуемые государственными органами статистики в установленном порядке.","Official statistics","Data produced and published by national statistical authorities under set rules."],["sta","Jini koeffitsienti","Daromadlar tengsizligini nol bilan bir orasidagi son bilan o'lchovchi ko'rsatkich.","Коэффициент Джини","Показатель неравенства доходов, принимающий значения от нуля до единицы.","Gini coefficient","A measure of income inequality ranging from zero to one."],["sta","Ishonchlilik darajasi","Tadqiqot natijalarining qayta o'lchashda barqaror takrorlanish darajasi.","Надёжность измерения","Степень устойчивой воспроизводимости результатов при повторных измерениях.","Reliability","The degree to which measurements give consistent results when repeated."],["sta","Statistik jadval","Statistik ma'lumotlarni satr va ustunlarda tartibli joylashtirish shakli.","Статистическая таблица","Форма упорядоченного представления статистических данных в строках и столбцах.","Statistical table","An ordered arrangement of statistical data in rows and columns."],["buh","Buxgalteriya hisobi","Tashkilotning xo'jalik operatsiyalarini uzluksiz qayd etish, umumlashtirish va moliyaviy hisobotda ifodalash tizimi.","Бухгалтерский учёт","Система непрерывной регистрации, обобщения и отражения в финансовой отчётности хозяйственных операций организации.","Accounting","A system for recording, summarizing and reporting an organization's economic transactions in financial statements."],["buh","Aktivlar","Tashkilot nazorat qiladigan va kelajakda iqtisodiy naf keltirishi kutiladigan resurslar.","Активы","Ресурсы, контролируемые организацией, от которых ожидается будущая экономическая выгода.","Assets","Resources controlled by an entity from which future economic benefits are expected."],["buh","Majburiyatlar","O'tgan hodisalardan kelib chiqqan va resurslar chiqib ketishiga olib keladigan tashkilot qarzlari.","Обязательства","Задолженность организации, возникшая из прошлых событий и ведущая к оттоку ресурсов.","Liabilities","Present obligations arising from past events that will lead to an outflow of resources."],["buh","Buxgalteriya balansi","Muayyan sanadagi aktivlar, majburiyatlar va xususiy kapitalni ko'rsatuvchi hisobot.","Бухгалтерский баланс","Отчёт об активах, обязательствах и собственном капитале на определённую дату.","Balance sheet","A statement of assets, liabilities and equity at a specific date."],["buh","Moliyaviy natijalar hisoboti","Davr uchun daromadlar, xarajatlar va foyda yoki zararni ko'rsatuvchi hisobot.","Отчёт о финансовых результатах","Отчёт о доходах, расходах и прибыли или убытке за период.","Income statement","A statement showing revenues, expenses and profit or loss for a period."],["buh","Pul oqimlari hisoboti","Davr ichida pul mablag'larining kirimi va chiqimini faoliyat turlari bo'yicha ko'rsatuvchi hisobot.","Отчёт о движении денежных средств","Отчёт о поступлении и выбытии денежных средств за период по видам деятельности.","Cash flow statement","A statement showing cash inflows and outflows by activity type during a period."],["buh","Xususiy kapital o'zgarishlari hisoboti","Davr davomida kapital moddalarining o'zgarishini ko'rsatuvchi hisobot.","Отчёт об изменениях в капитале","Отчёт, показывающий изменения статей собственного капитала за период.","Statement of changes in equity","A statement showing movements in equity components during a period."],["buh","Moliyaviy hisobotga izohlar","Hisobot raqamlarini tushuntiruvchi qo'shimcha ma'lumot va hisob siyosati bayoni.","Примечания к финансовой отчётности","Дополнительная информация и описание учётной политики, поясняющие данные отчётности.","Notes to financial statements","Additional disclosures explaining figures and accounting policies in the statements."],["buh","Ikkiyoqlama yozuv","Har bir operatsiyani bir schyot debetida va boshqasi kreditida teng summada aks ettirish usuli.","Двойная запись","Метод отражения каждой операции на равную сумму по дебету одного счёта и кредиту другого.","Double-entry bookkeeping","A method recording each transaction as equal debits and credits in two accounts."],["buh","Debet","Schyotning chap tomoni, aktivlar o'sishi va xarajatlarni qayd etadi.","Дебет","Левая сторона счёта, отражающая рост активов и расходов.","Debit","The left side of an account, recording increases in assets and expenses."],["buh","Schyotlar rejasi","Buxgalteriya hisobida qo'llaniladigan schyotlarning tasdiqlangan tizimlashtirilgan ro'yxati.","План счетов","Утверждённый систематизированный перечень счетов, применяемых в бухгалтерском учёте.","Chart of accounts","An approved, organized list of accounts used in an entity's bookkeeping."],["buh","Buxgalteriya schyoti","Muayyan turdagi aktiv, majburiyat yoki operatsiyalarni guruhlab qayd etish shakli.","Бухгалтерский счёт","Форма группировки и учёта определённого вида активов, обязательств или операций.","Account","A record that groups and tracks a specific type of asset, liability or transaction."],["buh","Sintetik schyot","Xo'jalik mablag'lari va manbalarini yirik guruhlar bo'yicha umumlashtirib hisobga oluvchi schyot.","Синтетический счёт","Счёт для обобщённого учёта средств и источников по укрупнённым группам.","Control account","A summary account that totals the balances of detailed subsidiary accounts."],["buh","Analitik schyot","Sintetik schyot ma'lumotlarini ob'ektlar bo'yicha batafsil ochib beruvchi sc
