function trw(s){
  let o="";

}
const CYC=new Map();

const GX=[["mol","Moliya","Moliya — pul mablag'larining shakllanishi, taqsimlanishi va ishlatilishi bilan bog'liq iqtisodiy munosabatlar tizimi.","Финансы","Финансы — система экономических отношений по формированию, распределению и использованию денежных средств.","Finance","Finance is the system of economic relations concerning the creation, allocation and use of money and other funds."],["mol","Pul","Pul — barcha tovar va xizmatlarga ayirboshlanadigan umume'tirof etilgan to'lov va hisob vositasi.","Деньги","Деньги — общепризнанное средство обмена и платежа, которое можно обменять на любые товары и услуги.","Money","Money is a generally accepted medium of exchange and payment for goods and services."],["mol","Pulning funksiyalari","Pulning funksiyalari — qiymat o'lchovi, ayirboshlash vositasi, jamg'arish va to'lov vositasi bo'lishdir.","Функции денег","Функции денег — мера стоимости, средство обращения, средство накопления и средство платежа.","Functions of money","The functions of money are a unit of account, medium of exchange, store of value and means of payment."],["mol","Qiymat o'lchovi","Qiymat o'lchovi — pulning tovar va xizmatlar narxini yagona birlikda ifodalash funksiyasi.","Мера стоимости","Мера стоимости — функция денег, позволяющая выражать цены товаров и услуг в единой единице.","Unit of account","Unit of account is the function of money that lets prices of goods and services be expressed in one common unit."],["mol","Ayirboshlash vositasi","Ayirboshlash vositasi — tovar va xizmatlarni to'g'ridan-to'g'ri ayirboshlashsiz sotib olish imkonini beruvchi pul funksiyasi.","Средство обращения","Средство обращения — функция денег, позволяющая покупать товары и услуги без прямого бартерного обмена.","Medium of exchange","A medium of exchange is anything accepted in payment for goods and services, avoiding the need for barter."],["mol","Qiymatni saqlash vositasi","Qiymatni saqlash vositasi — pulning xarid qobiliyatini kelajakda ishlatish uchun saqlab qo'yish funksiyasi.","Средство сбережения","Средство сбережения — функция денег сохранять покупательную способность для использования в будущем.","Store of value","Store of value is the ability of an asset to keep its purchasing power over time."],["mol","Barter","Barter — tovar va xizmatlarning pul ishtirokisiz bevosita bir-biriga ayirboshlanishi.","Бартер","Бартер — прямой обмен товаров и услуг друг на друга без использования денег.","Barter","Barter is the direct exchange of goods and services for one another without using money."],["mol","Qog'oz pul","Qog'oz pul — davlat tomonidan chiqariladigan va qonun bilan to'lov vositasi deb belgilangan qog'oz banknotalar.","Бумажные деньги","Бумажные деньги — банкноты, выпускаемые государством и признанные законным платёжным средством.","Fiat money","Fiat money is currency that has value because the government declares it legal tender, not because of physical backing."],["mol","Naqd pul","Naqd pul — muomalada bo'lgan banknotalar va tangalar shaklidagi pul.","Наличные деньги","Наличные деньги — деньги в обращении в виде банкнот и монет.","Cash","Cash is money in the form of banknotes and coins used in circulation."],["mol","Naqd pulsiz hisob-kitob","Naqd pulsiz hisob-kitob — to'lovlarni bank hisobvaraqlari orqali pul o'tkazish yo'li bilan amalga oshirish.","Безналичные расчёты","Безналичные расчёты — платежи, осуществляемые переводом средств по банковским счетам без использования наличных.","Cashless payment","Cashless payment is settling transactions by transferring funds between bank accounts without handling physical cash."],["mol","Pul massasi","Pul massasi — iqtisodiyotda muomaladagi barcha to'lov vositalarining umumiy hajmi.","Денежная масса","Денежная масса — совокупный объём всех платёжных средств, находящихся в обращении в экономике.","Money supply","Money supply is the total amount of money circulating in an economy at a given time."],["mol","Likvidlik","Likvidlik — aktivni qiymatini yo'qotmasdan tez va oson naqd pulga aylantirish qobiliyati.","Ликвидность","Ликвидность — способность актива быстро превращаться в наличные деньги без существенной потери стоимости.","Liquidity","Liquidity is how quickly an asset can be converted into cash without losing significant value."],["mol","To'lov qobiliyati","To'lov qobiliyati — korxona yoki shaxsning o'z majburiyatlarini to'liq va o'z vaqtida bajara olish qobiliyati.","Платёжеспособность","Платёжеспособность — способность предприятия или лица полностью и вовремя выполнять свои обязательства.","Solvency","Solvency is the ability of a firm or person to meet long-term financial obligations in full."],["mol","Pulning vaqt qiymati","Pulning vaqt qiymati — bugungi pul miqdori kelajakdagi shu miqdordan qimmatroq bo'lishini bildiruvchi tamoyil.","Временная стоимость денег","Временная стоимость денег — принцип, согласно которому деньги сегодня ценнее такой же суммы в будущем.","Time value of money","Time value of money is the principle that a sum available today is worth more than the same sum later."],["mol","Foiz","Foiz — qarz yoki kredit uchun to'lanadigan haq, asosiy summaning ulushi sifatida ifodalanadi.","Процент","Процент — плата за пользование заёмными средствами, выраженная как доля от основной суммы.","Interest","Interest is the price paid for using borrowed money, expressed as a share of the principal."],["mol","Foiz stavkasi","Foiz stavkasi — qarz olingan mablag' uchun ma'lum davrda to'lanadigan foizning asosiy summaga nisbati.","Процентная ставка","Процентная ставка — отношение платы за заём за определённый период к основной сумме долга.","Interest rate","The interest rate is the cost of borrowing or reward for lending, expressed as a percentage of principal per period."],["mol","Oddiy foiz","Oddiy foiz — faqat dastlabki asosiy summaga hisoblanadigan, o'zi foiz keltirmaydigan foiz.","Простой процент","Простой процент — проценты, начисляемые только на первоначальную сумму без начисления процентов на проценты.","Simple interest","Simple interest is interest calculated only on the original principal, not on previously earned interest."],["mol","Murakkab foiz","Murakkab foiz — asosiy summa va avval hisoblangan foizlar yig'indisiga hisoblanadigan foiz.","Сложный процент","Сложный процент — проценты, начисляемые на основную сумму и на ранее начисленные проценты.","Compound interest","Compound interest is interest calculated on both the principal and the accumulated interest from earlier periods."],["mol","Nominal foiz stavkasi","Nominal foiz stavkasi — inflyatsiya hisobga olinmagan, shartnomada ko'rsatilgan foiz stavkasi.","Номинальная процентная ставка","Номинальная процентная ставка — ставка, указанная в договоре, без учёта инфляции.","Nominal interest rate","The nominal interest rate is the stated rate before adjusting for inflation."],["mol","Real foiz stavkasi","Real foiz stavkasi — inflyatsiya hisobga olingan, haqiqiy daromadlilikni ko'rsatuvchi foiz stavkasi.","Реальная процентная ставка","Реальная процентная ставка — ставка с поправкой на инфляцию, показывающая реальную доходность.","Real interest rate","The real interest rate is the nominal rate adjusted for inflation, showing the true return."],["mol","Samarali foiz stavkasi","Samarali foiz stavkasi — foizni yil davomida bir necha marta qo'shib hisoblashni inobatga olgan yillik haqiqiy stavka.","Эффективная процентная ставка","Эффективная процентная ставка — фактическая годовая ставка с учётом капитализации процентов несколько раз в год.","Effective interest rate","The effective interest rate is the true annual rate once compounding within the year is taken into account."],["mol","Kapitallashtirish","Kapitallashtirish — hisoblangan foizlarni asosiy summaga qo'shib, keyingi foizni ko'paygan summaga hisoblash jarayoni.","Капитализация процентов","Капитализация процентов — присоединение начисленных процентов к основной сумме для последующего начисления на увеличенную базу.","Compounding","Compounding is adding earned interest to the principal so future interest is earned on the larger balance."],["mol","Kelajak qiymat","Kelajak qiymat — bugungi pul summasining ma'lum foiz stavkasida kelajakdagi muayyan sanadagi qiymati.","Будущая стоимость","Будущая стоимость — стоимость сегодняшней суммы денег в определённый момент будущего при заданной ставке.","Future value","Future value is what a sum invested today will be worth at a later date at a given interest rate."],["mol","Joriy qiymat","Joriy qiymat — kelajakda olinadigan pul oqimlarining diskont stavkasi bo'yicha bugungi kunga keltirilgan qiymati.","Приведённая стоимость","Приведённая стоимость — сегодняшняя оценка будущих денежных потоков, дисконтированных по заданной ставке.","Present value","Present value is the current worth of future cash flows discounted at a given rate."],["mol","Diskontlash","Diskontlash — kelajakdagi pul oqimlarini bugungi qiymatga keltirish jarayoni.","Дисконтирование","Дисконтирование — приведение будущих денежных потоков к их стоимости на текущий момент.","Discounting","Discounting is the process of converting future cash flows into their present value."],["mol","Diskont stavkasi","Diskont stavkasi — kelajakdagi pul oqimlarini joriy qiymatga keltirishda qo'llaniladigan foiz stavkasi.","Ставка дисконтирования","Ставка дисконтирования — процентная ставка, применяемая для приведения будущих денежных потоков к текущей стоимости.","Discount rate","The discount rate is the rate used to convert future cash flows into present value."],["mol","Annuitet","Annuitet — teng vaqt oralig'ida to'lanadigan yoki olinadigan bir xil miqdordagi pul to'lovlari ketma-ketligi.","Аннуитет","Аннуитет — серия равных по сумме платежей, выплачиваемых или получаемых через равные промежутки времени.","Annuity","An annuity is a series of equal payments made or received at regular intervals."],["mol","Oddiy annuitet","Oddiy annuitet — to'lovlar har bir davr oxirida amalga oshiriladigan annuitet turi.","Обычный аннуитет","Обычный аннуитет — аннуитет, при котором платежи производятся в конце каждого периода.","Ordinary annuity","An ordinary annuity is an annuity whose payments occur at the end of each period."],["mol","Doimiy renta","Doimiy renta — cheksiz davom etadigan, teng miqdordagi to'lovlar oqimi.","Бессрочный аннуитет","Бессрочный аннуитет — поток равных платежей, продолжающийся бесконечно долго.","Perpetuity","A perpetuity is a stream of equal payments that continues forever."],["mol","Inflyatsiya","Inflyatsiya — narxlar umumiy darajasining barqaror oshishi natijasida pulning xarid qobiliyati pasayishi.","Инфляция","Инфляция — устойчивый рост общего уровня цен, приводящий к снижению покупательной способности денег.","Inflation","Inflation is a sustained rise in the general price level that reduces money's purchasing power."],["mol","Xarid qobiliyati","Xarid qobiliyati — pul birligi bilan sotib olish mumkin bo'lgan tovar va xizmatlar miqdori.","Покупательная способность","Покупательная способность — количество товаров и услуг, которое можно приобрести на денежную единицу.","Purchasing power","Purchasing power is the amount of goods and services that one unit of currency can buy."],["mol","Daromadlilik","Daromadlilik — investitsiyadan olingan foyda miqdorining sarflangan mablag'ga nisbati.","Доходность","Доходность — отношение прибыли от вложения к объёму вложенных средств.","Rate of return","Rate of return is the gain or loss on an investment relative to the amount invested."],["mol","Risk","Risk — kutilgan natijadan chetga chiqish va zarar ko'rish ehtimoli.","Риск","Риск — вероятность отклонения результата от ожидаемого, в том числе возможность понести убытки.","Risk","Risk is the possibility that actual outcomes will differ from expected ones, including the chance of loss."],["mol","Risk va daromadlilik nisbati","Risk va daromadlilik nisbati — yuqori daromad odatda yuqoriroq risk bilan birga keladi degan tamoyil.","Соотношение риска и доходности","Соотношение риска и доходности — принцип, по которому более высокая доходность обычно сопровождается более высоким риском.","Risk-return tradeoff","The risk-return tradeoff is the principle that higher potential return usually comes with higher risk."],["mol","Diversifikatsiya","Diversifikatsiya — riskni kamaytirish uchun mablag'larni turli aktivlar o'rtasida taqsimlash.","Диверсификация","Диверсификация — распределение средств между разными активами для снижения риска.","Diversification","Diversification is spreading investments across different assets to reduce overall risk."],["mol","Tizimli risk","Tizimli risk — butun bozorga ta'sir qiladigan va diversifikatsiya bilan yo'qotib bo'lmaydigan risk.","Систематический риск","Систематический риск — риск, влияющий на весь рынок и не устраняемый диверсификацией.","Systematic risk","Systematic risk is market-wide risk that cannot be eliminated through diversification."],["mol","Tizimsiz risk","Tizimsiz risk — alohida kompaniya yoki tarmoqqa xos bo'lgan, diversifikatsiya bilan kamaytiriladigan risk.","Несистематический риск","Несистематический риск — риск, присущий отдельной компании или отрасли, снижаемый диверсификацией.","Unsystematic risk","Unsystematic risk is company- or industry-specific risk that can be reduced through diversification."],["mol","Kredit riski","Kredit riski — qarz oluvchining majburiyatlarini bajarmasligi natijasida zarar ko'rish xavfi.","Кредитный риск","Кредитный риск — риск потерь из-за невыполнения заёмщиком своих обязательств.","Credit risk","Credit risk is the risk of loss because a borrower fails to repay a debt."],["mol","Likvidlik riski","Likvidlik riski — aktivni o'z vaqtida va qiymatini yo'qotmasdan sota olmaslik xavfi.","Риск ликвидности","Риск ликвидности — риск невозможности вовремя продать актив или выполнить обязательства без существенных потерь.","Liquidity risk","Liquidity risk is the risk of being unable to sell an asset or meet obligations quickly without large losses."],["mol","Valyuta riski","Valyuta riski — valyuta kurslarining o'zgarishi tufayli zarar ko'rish ehtimoli.","Валютный риск","Валютный риск — вероятность потерь из-за изменения валютных курсов.","Currency risk","Currency risk is the possibility of loss caused by changes in exchange rates."],["mol","Foiz riski","Foiz riski — foiz stavkalarining o'zgarishi aktivlar qiymatiga salbiy ta'sir qilish xavfi.","Процентный риск","Процентный риск — риск негативного влияния изменения процентных ставок на стоимость активов.","Interest rate risk","Interest rate risk is the risk that changing interest rates will reduce the value of an investment."],["mol","Xedjlash","Xedjlash — mavjud risklardan himoyalanish uchun qarama-qarshi pozitsiya ochish usuli.","Хеджирование","Хеджирование — защита от рисков путём открытия противоположной позиции.","Hedging","Hedging is taking an offsetting position to protect against potential losses from price changes."],["mol","Sug'urta","Sug'urta — to'lovlar evaziga kutilmagan zararlarni qoplash kafolatini beruvchi moliyaviy himoya vositasi.","Страхование","Страхование — защита имущественных интересов, при которой за взносы страховщик возмещает убытки при наступлении страхового случая.","Insurance","Insurance is financial protection in which premiums are paid in return for compensation of covered losses."],["mol","Moliya tizimi","Moliya tizimi — moliyaviy munosabatlar, bozorlar, institutlar va ular faoliyatini tartibga soluvchi mexanizmlar yig'indisi.","Финансовая система","Финансовая система — совокупность финансовых отношений, рынков, институтов и механизмов их регулирования.","Financial system","The financial system is the set of markets, institutions and rules that channel funds between savers and borrowers."],["mol","Moliya bozori","Moliya bozori — moliyaviy aktivlar sotib olinadigan va sotiladigan, mablag'lar jamg'aruvchilardan qarz oluvchilarga o'tadigan joy.","Финансовый рынок","Финансовый рынок — рынок, где покупаются и продаются финансовые активы и средства перераспределяются от сберегателей к заёмщикам.","Financial market","A financial market is a place where financial assets are bought and sold and funds flow from savers to borrowers."],["mol","Pul bozori","Pul bozori — qisqa muddatli, odatda bir yilgacha bo'lgan moliyaviy vositalar savdo qilinadigan bozor.","Денежный рынок","Денежный рынок — рынок краткосрочных финансовых инструментов, обычно со сроком до одного года.","Money market","The money market is the market for short-term financial instruments, typically maturing within a year."],["mol","Kapital bozori","Kapital bozori — uzoq muddatli qarz va mulkiy qimmatli qog'ozlar savdo qilinadigan bozor.","Рынок капитала","Рынок капитала — рынок, на котором торгуются долгосрочные долговые и долевые ценные бумаги.","Capital market","The capital market is the market where long-term debt and equity securities are traded."],["mol","Birlamchi bozor","Birlamchi bozor — qimmatli qog'ozlar emitent tomonidan investorlarga birinchi marta joylashtiriladigan bozor.","Первичный рынок","Первичный рынок — рынок, на котором эмитент впервые размещает ценные бумаги среди инвесторов.","Primary market","The primary market is where new securities are issued and sold by the issuer to investors for the first time."],["mol","Ikkilamchi bozor","Ikkilamchi bozor — avval chiqarilgan qimmatli qog'ozlar investorlar o'rtasida qayta sotiladigan bozor.","Вторичный рынок","Вторичный рынок — рынок, на котором ранее выпущенные ценные бумаги перепродаются между инвесторами.","Secondary market","The secondary market is where previously issued securities are traded between investors."],["mol","Fond birjasi","Fond birjasi — qimmatli qog'ozlar uyushgan tartibda va belgilangan qoidalar asosida sotiladigan tashkiliy bozor.","Фондовая биржа","Фондовая биржа — организованный рынок, где ценные бумаги торгуются по установленным правилам.","Stock exchange","A stock exchange is an organized marketplace where securities are traded under set rules."],["mol","Valyuta bozori","Valyuta bozori — xorijiy valyutalar sotib olinadigan, sotiladigan va ularning kurslari shakllanadigan bozor.","Валютный рынок","Валютный рынок — рынок купли-продажи иностранной валюты, где формируются валютные курсы.","Foreign exchange market","The foreign exchange market is where currencies are traded and exchange rates are determined."],["mol","Valyuta kursi","Valyuta kursi — bir mamlakat pul birligining boshqa mamlakat pul birligida ifodalangan narxi.","Валютный курс","Валютный курс — цена денежной единицы одной страны, выраженная в денежной единице другой страны.","Exchange rate","The exchange rate is the price of one currency expressed in terms of another."],["mol","Moliyaviy vositachi","Moliyaviy vositachi — jamg'aruvchilar va qarz oluvchilar o'rtasida mablag'larni qayta taqsimlovchi muassasa.","Финансовый посредник","Финансовый посредник — учреждение, перераспределяющее средства между сберегателями и заёмщиками.","Financial intermediary","A financial intermediary is an institution that channels funds between savers and borrowers."],["mol","Tijorat banki","Tijorat banki — omonatlar qabul qiladigan, kredit beradigan va to'lov xizmatlarini ko'rsatadigan kredit tashkiloti.","Коммерческий банк","Коммерческий банк — кредитная организация, принимающая вклады, выдающая кредиты и оказывающая платёжные услуги.","Commercial bank","A commercial bank accepts deposits, makes loans and provides payment services."],["mol","Markaziy bank","Markaziy bank — pul-kredit siyosatini yurituvchi, milliy valyutani chiqaruvchi va bank tizimini tartibga soluvchi davlat banki.","Центральный банк","Центральный банк — государственный банк, проводящий денежно-кредитную политику, эмитирующий валюту и регулирующий банковскую систему.","Central bank","A central bank conducts monetary policy, issues currency and supervises the banking system."],["mol","Pul-kredit siyosati","Pul-kredit siyosati — markaziy bankning pul massasi va foiz stavkalarini boshqarish orqali iqtisodiyotga ta'sir etish chora-tadbirlari.","Денежно-кредитная политика","Денежно-кредитная политика — меры центрального банка по влиянию на экономику через денежную массу и процентные ставки.","Monetary policy","Monetary policy is a central bank's management of money supply and interest rates to influence the economy."],["mol","Qayta moliyalash stavkasi","Qayta moliyalash stavkasi — markaziy bank tijorat banklariga kredit berishda qo'llaydigan asosiy foiz stavkasi.","Ставка рефинансирования","Ставка рефинансирования — основная процентная ставка, по которой центральный банк кредитует коммерческие банки.","Refinancing rate","The refinancing rate is the main rate at which a central bank lends to commercial banks."],["mol","Sug'urta kompaniyasi","Sug'urta kompaniyasi — sug'urta badallarini yig'ib, sug'urta hodisasi yuz berganda zararni qoplaydigan moliyaviy tashkilot.","Страховая компания","Страховая компания — финансовая организация, собирающая страховые взносы и возмещающая убытки при страховом случае.","Insurance company","An insurance company collects premiums and pays compensation when insured events occur."],["mol","Investitsiya fondi","Investitsiya fondi — ko'plab investorlar mablag'larini birlashtirib, qimmatli qog'ozlar portfeliga joylashtiruvchi institut.","Инвестиционный фонд","Инвестиционный фонд — институт, объединяющий средства многих инвесторов и вкладывающий их в портфель ценных бумаг.","Investment fund","An investment fund pools money from many investors and invests it in a portfolio of securities."],["mol","Pensiya fondi","Pensiya fondi — nafaqaga chiqqanda to'lovlar uchun mablag' to'playdigan va investitsiya qiladigan jamg'arma.","Пенсионный фонд","Пенсионный фонд — организация, накапливающая и инвестирующая средства для выплаты пенсий.","Pension fund","A pension fund collects and invests money to pay retirement benefits."],["mol","Mikromoliya tashkiloti","Mikromoliya tashkiloti — kam ta'minlangan aholi va kichik biznesga mayda kreditlar beradigan moliyaviy muassasa.","Микрофинансовая организация","Микрофинансовая организация — учреждение, выдающее небольшие займы малообеспеченному населению и малому бизнесу.","Microfinance institution","A microfinance institution provides small loans to low-income people and small businesses."],["mol","Moliyaviy vosita","Moliyaviy vosita — bir tomonda moliyaviy aktiv, ikkinchi tomonda majburiyat yoki kapital yuzaga keltiruvchi shartnoma.","Финансовый инструмент","Финансовый инструмент — договор, который у одной стороны создаёт финансовый актив, а у другой — обязательство или капитал.","Financial instrument","A financial instrument is a contract that creates a financial asset for one party and a liability or equity for another."],["mol","Qimmatli qog'oz","Qimmatli qog'oz — egasining mulkka yoki daromadga bo'lgan huquqini tasdiqlovchi hujjat.","Ценная бумага","Ценная бумага — документ, удостоверяющий права владельца на имущество или получение дохода.","Security","A security is a tradable financial instrument that represents ownership, debt or rights to income."],["mol","Aksiya","Aksiya — egasiga kompaniya mulkida ulush va dividend olish huquqini beruvchi qimmatli qog'oz.","Акция","Акция — ценная бумага, дающая владельцу долю в собственности компании и право на дивиденды.","Stock","A stock is a security giving its holder a share of company ownership and a claim on dividends."],["mol","Obligatsiya","Obligatsiya — emitentning belgilangan muddatda nominal qiymatni va foizni to'lash majburiyatini tasdiqlovchi qarz qimmatli qog'ozi.","Облигация","Облигация — долговая ценная бумага, подтверждающая обязательство эмитента выплатить номинал и проценты в срок.","Bond","A bond is a debt security in which the issuer promises to repay principal and interest on set dates."],["mol","Kupon","Kupon — obligatsiya bo'yicha davriy to'lanadigan foiz to'lovi.","Купон","Купон — периодическая выплата процентов по облигации.","Coupon","A coupon is the periodic interest payment made to a bondholder."],["mol","Nominal qiymat","Nominal qiymat — qimmatli qog'ozda ko'rsatilgan va so'ndirish vaqtida to'lanadigan qiymat.","Номинальная стоимость","Номинальная стоимость — стоимость, указанная на ценной бумаге и выплачиваемая при погашении.","Face value","Face value is the amount printed on a security that is repaid at maturity."],["mol","So'ndirish muddati","So'ndirish muddati — qarz majburiyati bo'yicha asosiy summa to'liq to'lanishi kerak bo'lgan sana.","Срок погашения","Срок погашения — дата, к которой должна быть полностью выплачена основная сумма долга.","Maturity","Maturity is the date on which the principal of a debt instrument must be repaid."],["mol","Dividend","Dividend — kompaniya foydasining aksiyadorlar o'rtasida taqsimlanadigan qismi.","Дивиденд","Дивиденд — часть прибыли компании, распределяемая между акционерами.","Dividend","A dividend is a portion of a company's profit distributed to its shareholders."],["mol","Derivativ","Derivativ — qiymati boshqa asosiy aktiv narxiga bog'liq bo'lgan moliyaviy shartnoma.","Производный инструмент","Производный инструмент — финансовый контракт, стоимость которого зависит от цены базового актива.","Derivative","A derivative is a financial contract whose value depends on the price of an underlying asset."],["mol","Fyuchers","Fyuchers — aktivni kelajakda oldindan kelishilgan narxda sotib olish yoki sotish bo'yicha standart birja shartnomasi.","Фьючерс","Фьючерс — стандартный биржевой контракт на покупку или продажу актива в будущем по заранее согласованной цене.","Futures contract","A futures contract is a standardized exchange contract to buy or sell an asset at an agreed price on a future date."],["mol","Opsion","Opsion — egasiga aktivni belgilangan narxda sotib olish yoki sotish huquqini beruvchi, ammo majbur qilmaydigan shartnoma.","Опцион","Опцион — контракт, дающий право, но не обязывающий купить или продать актив по установленной цене.","Option","An option is a contract giving the holder the right, but not the obligation, to buy or sell an asset at a set price."],["mol","Depozit","Depozit — bank yoki boshqa muassasaga foiz olish sharti bilan saqlash uchun topshirilgan pul mablag'i.","Депозит","Депозит — денежные средства, переданные банку на хранение с условием получения процентов.","Deposit","A deposit is money placed with a bank for safekeeping, usually earning interest."],["mol","Kredit","Kredit — qarz oluvchiga muayyan muddatga, qaytarish va foiz to'lash sharti bilan beriladigan pul mablag'i.","Кредит","Кредит — денежные средства, предоставляемые заёмщику на определённый срок на условиях возвратности и платности.","Loan","A loan is money lent for a set period on the condition of repayment with interest."],["mol","Ipoteka","Ipoteka — kredit qaytarilishini ta'minlash uchun ko'chmas mulkni garovga qo'yish asosida beriladigan kredit.","Ипотека","Ипотека — кредит, обеспеченный залогом недвижимого имущества.","Mortgage","A mortgage is a loan secured by real estate as collateral."],["mol","Garov","Garov — qarz majburiyati bajarilmaganda kreditor ushlab qolishi mumkin bo'lgan mulk.","Залог","Залог — имущество, которое кредитор вправе удержать при неисполнении должником обязательства.","Collateral","Collateral is property pledged to a lender that can be seized if the borrower defaults."],["mol","Asosiy qarz","Asosiy qarz — foizlarni hisobga olmaganda qarz sifatida olingan yoki investitsiya qilingan dastlabki summa.","Основной долг","Основной долг — первоначальная сумма займа или вложения без учёта процентов.","Principal","Principal is the original amount borrowed or invested, excluding interest."],["mol","Defolt","Defolt — qarzdorning qarz majburiyatlarini o'z vaqtida to'lay olmasligi holati.","Дефолт","Дефолт — неспособность должника вовремя выполнить свои долговые обязательства.","Default","Default is the failure of a borrower to repay a debt on time as agreed."],["mol","Shaxsiy moliya","Shaxsiy moliya — shaxs yoki oilaning daromad, xarajat, jamg'arma va investitsiyalarini boshqarishi.","Личные финансы","Личные финансы — управление доходами, расходами, сбережениями и инвестициями отдельного человека или семьи.","Personal finance","Personal finance is the management of an individual's or family's income, spending, saving and investing."],["mol","Byudjet","Byudjet — ma'lum davr uchun rejalashtirilgan daromadlar va xarajatlar smetasi.","Бюджет","Бюджет — план доходов и расходов на определённый период.","Budget","A budget is a plan of expected income and expenses for a given period."],["mol","Shaxsiy byudjet","Shaxsiy byudjet — shaxs yoki oilaning oylik daromadlari va xarajatlarini rejalashtirish hujjati.","Личный бюджет","Личный бюджет — план ежемесячных доходов и расходов человека или семьи.","Personal budget","A personal budget is a plan for an individual's or household's monthly income and spending."],["mol","Daromad","Daromad — shaxs yoki korxona ma'lum davrda oladigan pul tushumlari.","Доход","Доход — денежные поступления, получаемые человеком или предприятием за определённый период.","Income","Income is the money received by a person or business over a period of time."],["mol","Xarajat","Xarajat — tovar, xizmat yoki faoliyat uchun sarflangan pul mablag'i.","Расход","Расход — денежные средства, затраченные на товары, услуги или деятельность.","Expense","An expense is money spent on goods, services or operations."],["mol","Jamg'arma","Jamg'arma — daromadning iste'molga sarflanmay, kelajak uchun saqlab qo'yilgan qismi.","Сбережения","Сбережения — часть дохода, не потраченная на потребление и отложенная на будущее.","Savings","Savings are the part of income not spent on consumption and set aside for the future."],["mol","Favqulodda zaxira jamg'armasi","Favqulodda zaxira jamg'armasi — kutilmagan holatlar uchun odatda 3–6 oylik xarajatlar miqdorida saqlanadigan mablag'.","Резервный фонд","Резервный фонд — денежный запас, обычно равный расходам за 3–6 месяцев, на случай непредвиденных обстоятельств.","Emergency fund","An emergency fund is a cash reserve, often three to six months of expenses, for unexpected events."],["mol","Sof boylik","Sof boylik — shaxsning barcha aktivlari qiymatidan barcha majburiyatlari ayirilgandagi qoldiq.","Чистая стоимость активов","Чистая стоимость активов — разница между всеми активами человека и всеми его обязательствами.","Net worth","Net worth is the total value of a person's assets minus all liabilities."],["mol","Aktiv","Aktiv — egasiga kelajakda iqtisodiy foyda keltirishi kutiladigan resurs.","Актив","Актив — ресурс, от которого владелец ожидает получить экономические выгоды в будущем.","Asset","An asset is a resource owned that is expected to provide future economic benefits."],["mol","Majburiyat","Majburiyat — shaxs yoki korxonaning boshqalar oldidagi to'lanishi lozim bo'lgan qarzi.","Обязательство","Обязательство — задолженность лица или предприятия перед другими, подлежащая погашению.","Liability","A liability is an amount owed by a person or company to others."],["mol","Pul oqimi","Pul oqimi — ma'lum davrda kirib kelgan va chiqib ketgan pul mablag'lari harakati.","Денежный поток","Денежный поток — движение поступающих и выбывающих денежных средств за определённый период.","Cash flow","Cash flow is the movement of money coming in and going out over a period."],["mol","Sof pul oqimi","Sof pul oqimi — davr mobaynida kirib kelgan va chiqib ketgan pul mablag'lari o'rtasidagi farq.","Чистый денежный поток","Чистый денежный поток — разница между денежными поступлениями и выплатами за период.","Net cash flow","Net cash flow is the difference between cash inflows and cash outflows in a period."],["mol","Moliyaviy rejalashtirish","Moliyaviy rejalashtirish — moliyaviy maqsadlarga erishish uchun daromad, xarajat va investitsiyalarni oldindan belgilash jarayoni.","Финансовое планирование","Финансовое планирование — процесс определения доходов, расходов и инвестиций для достижения финансовых целей.","Financial planning","Financial planning is the process of setting income, spending and investment plans to reach financial goals."],["mol","Moliyaviy savodxonlik","Moliyaviy savodxonlik — pulni boshqarish, byudjet tuzish, jamg'arish va investitsiya qilish bo'yicha bilim va ko'nikmalar.","Финансовая грамотность","Финансовая грамотность — знания и навыки управления деньгами, составления бюджета, сбережения и инвестирования.","Financial literacy","Financial literacy is the knowledge and skills needed to manage money, budget, save and invest."],["mol","Investitsiya","Investitsiya — kelajakda daromad olish maqsadida mablag'larni aktivlarga joylashtirish.","Инвестиция","Инвестиция — вложение средств в активы с целью получения дохода в будущем.","Investment","An investment is putting money into assets in order to earn income or gain in the future."],["mol","Investitsiya portfeli","Investitsiya portfeli — investor egalik qiladigan turli moliyaviy aktivlar majmui.","Инвестиционный портфель","Инвестиционный портфель — совокупность различных финансовых активов, принадлежащих инвестору.","Investment portfolio","An investment portfolio is the collection of financial assets held by an investor."],["mol","Aktivlarni taqsimlash","Aktivlarni taqsimlash — portfel mablag'larini aksiya, obligatsiya va naqd pul kabi turlar o'rtasida bo'lish strategiyasi.","Распределение активов","Распределение активов — стратегия разделения портфеля между акциями, облигациями, наличными и другими классами активов.","Asset allocation","Asset allocation is dividing a portfolio among asset classes such as stocks, bonds and cash."],["mol","Qarz yuki","Qarz yuki — shaxsning oylik daromadiga nisbatan qarz to'lovlarining ulushi.","Долговая нагрузка","Долговая нагрузка — доля долговых платежей в ежемесячном доходе человека.","Debt burden","Debt burden is the share of a person's income that goes to debt payments."],["mol","Kredit tarixi","Kredit tarixi — shaxsning avvalgi kreditlari va ularni qaytarish intizomi haqidagi ma'lumotlar.","Кредитная история","Кредитная история — сведения о прежних кредитах человека и дисциплине их погашения.","Credit history","Credit history is a record of a person's past borrowing and repayment behavior."],["mol","Moliyaviy hisobot","Moliyaviy hisobot — korxonaning moliyaviy holati va faoliyat natijalarini ko'rsatuvchi hisobotlar to'plami.","Финансовая отчётность","Финансовая отчётность — комплект отчётов, показывающих финансовое положение и результаты деятельности предприятия.","Financial statements","Financial statements are reports showing a firm's financial position and performance."],["mol","Balans","Balans — korxonaning ma'lum sanadagi aktivlari, majburiyatlari va xususiy kapitalini aks ettiruvchi hisobot.","Бухгалтерский баланс","Бухгалтерский баланс — отчёт об активах, обязательствах и собственном капитале предприятия на определённую дату.","Balance sheet","A balance sheet reports a firm's assets, liabilities and equity at a specific date."],["mol","Foyda va zararlar to'g'risidagi hisobot","Foyda va zararlar to'g'risidagi hisobot — davr mobaynidagi tushum, xarajat va sof foydani ko'rsatuvchi hisobot.","Отчёт о прибылях и убытках","Отчёт о прибылях и убытках — документ, показывающий выручку, расходы и чистую прибыль за период.","Income statement","An income statement shows revenue, expenses and net profit over a period."],["mol","Pul oqimlari to'g'risidagi hisobot","Pul oqimlari to'g'risidagi hisobot — davr mobaynida pulning kirishi va chiqishini faoliyat turlari bo'yicha ko'rsatuvchi hisobot.","Отчёт о движении денежных средств","Отчёт о движении денежных средств — документ, показывающий поступления и выплаты денег по видам деятельности за период.","Cash flow statement","A cash flow statement shows cash inflows and outflows by operating, investing and financing activities."],["mol","Moliyaviy tahlil","Moliyaviy tahlil — korxonaning moliyaviy holati va natijalarini baholash uchun hisobot ma'lumotlarini o'rganish.","Финансовый анализ","Финансовый анализ — изучение отчётных данных для оценки финансового состояния и результатов предприятия.","Financial analysis","Financial analysis is the study of financial data to assess a firm's condition and performance."],["mol","Moliyaviy koeffitsientlar","Moliyaviy koeffitsientlar — hisobot ko'rsatkichlarining nisbati orqali korxona holatini ifodalovchi mezonlar.","Финансовые коэффициенты","Финансовые коэффициенты — показатели, выражающие состояние предприятия через соотношение статей отчётности.","Financial ratios","Financial ratios are measures that describe a firm's condition by comparing items from its financial statements."],["mol","Joriy likvidlik koeffitsienti","Joriy likvidlik koeffitsienti — joriy aktivlarning qisqa muddatli majburiyatlarga nisbati.","Коэффициент текущей ликвидности","Коэффициент текущей ликвидности — отношение оборотных активов к краткосрочным обязательствам.","Current ratio","The current ratio is current assets divided by current liabilities."],["mol","Tezkor likvidlik koeffitsienti","Tezkor likvidlik koeffitsienti — zaxiralarsiz joriy aktivlarning qisqa muddatli majburiyatlarga nisbati.","Коэффициент быстрой ликвидности","Коэффициент быстрой ликвидности — отношение оборотных активов за вычетом запасов к краткосрочным обязательствам.","Quick ratio","The quick ratio is current assets excluding inventory divided by current liabilities."],["mol","Rentabellik","Rentabellik — korxona faoliyatining foydaliligini ko'rsatuvchi foyda va sarflangan resurslar nisbati.","Рентабельность","Рентабельность — показатель прибыльности деятельности, отношение прибыли к затраченным ресурсам.","Profitability","Profitability is a measure of how much profit a business earns relative to its sales, assets or capital."],["mol","Aktivlar rentabelligi","Aktivlar rentabelligi (ROA) — sof foydaning korxona jami aktivlariga nisbati.","Рентабельность активов","Рентабельность активов (ROA) — отношение чистой прибыли к общей величине активов предприятия.","Return on assets","Return on assets (ROA) is net income divided by total assets."],["mol","Xususiy kapital rentabelligi","Xususiy kapital rentabelligi (ROE) — sof foydaning aksiyadorlar kapitaliga nisbati.","Рентабельность собственного капитала","Рентабельность собственного капитала (ROE) — отношение чистой прибыли к капиталу акционеров.","Return on equity","Return on equity (ROE) is net income divided by shareholders' equity."],["mol","Sotuv rentabelligi","Sotuv rentabelligi — sof foydaning tushumga nisbati, har bir so'm tushumdan qancha foyda qolishini ko'rsatadi.","Рентабельность продаж","Рентабельность продаж — отношение чистой прибыли к выручке, показывающее прибыль с каждой единицы продаж.","Profit margin","Profit margin is net profit divided by revenue, showing how much profit remains from each unit of sales."],["mol","Aylanuvchanlik koeffitsienti","Aylanuvchanlik koeffitsienti — aktivlar yoki zaxiralar ma'lum davrda necha marta to'liq aylanganini ko'rsatadi.","Оборачиваемость","Коэффициент оборачиваемости показывает, сколько раз активы или запасы полностью оборачиваются за период.","Turnover ratio","A turnover ratio shows how many times assets or inventory are used up and replaced in a period."],["mol","Kapital tuzilmasi","Kapital tuzilmasi — korxona faoliyati moliyalashtiriladigan xususiy va qarz kapitali nisbati.","Структура капитала","Структура капитала — соотношение собственного и заёмного капитала, которым финансируется предприятие.","Capital structure","Capital structure is the mix of debt and equity a firm uses to finance its operations."],["mol","Xususiy kapital","Xususiy kapital — korxona aktivlari qiymatidan majburiyatlar ayirilgandan keyin egalariga qoladigan ulush.","Собственный капитал","Собственный капитал — доля владельцев в активах предприятия после вычета обязательств.","Equity","Equity is the owners' residual claim on a firm's assets after liabilities are deducted."],["mol","Qarz kapitali","Qarz kapitali — korxona qaytarish va foiz to'lash sharti bilan jalb qilgan tashqi mablag'lar.","Заёмный капитал","Заёмный капитал — привлечённые предприятием средства, подлежащие возврату с уплатой процентов.","Debt capital","Debt capital is borrowed funds a firm must repay with interest."],["mol","Moliyaviy leverij","Moliyaviy leverij — korxonada qarz mablag'laridan foydalanish orqali xususiy kapital rentabelligini oshirish (yoki riskni kuchaytirish) effekti.","Финансовый рычаг","Финансовый рычаг — эффект использования заёмных средств, усиливающий рентабельность собственного капитала и риск.","Financial leverage","Financial leverage is the use of borrowed funds to magnify returns on equity, and also risk."],["mol","Qarz va xususiy kapital nisbati","Qarz va xususiy kapital nisbati — korxona majburiyatlari summasining xususiy kapitalga nisbati.","Соотношение заёмных и собственных средств","Соотношение заёмных и собственных средств — отношение обязательств предприятия к его собственному капиталу.","Debt-to-equity ratio","The debt-to-equity ratio is total liabilities divided by shareholders' equity."],["mol","Kapitalning o'rtacha tortilgan qiymati","Kapitalning o'rtacha tortilgan qiymati (WACC) — korxona barcha kapital manbalarining ulushlar bo'yicha o'rtacha narxi.","Средневзвешенная стоимость капитала","Средневзвешенная стоимость капитала (WACC) — средняя цена всех источников капитала предприятия с учётом их долей.","Weighted average cost of capital","WACC is the average cost of a firm's debt and equity financing, weighted by their shares."],["mol","Kapital qiymati","Kapital qiymati — korxona kapital manbasidan foydalanganlik uchun to'laydigan talab qilinadigan daromad stavkasi.","Стоимость капитала","Стоимость капитала — требуемая доходность, которую предприятие платит за использование источника финансирования.","Cost of capital","Cost of capital is the return required by providers of funds for financing a firm."],["mol","Sof joriy qiymat","Sof joriy qiymat (NPV) — kelajakdagi pul oqimlarining joriy qiymati bilan boshlang'ich investitsiya o'rtasidagi farq.","Чистая приведённая стоимость","Чистая приведённая стоимость (NPV) — разница между приведённой стоимостью будущих денежных потоков и первоначальными вложениями.","Net present value","Net present value (NPV) is the present value of future cash flows minus the initial investment."],["mol","Ichki daromad normasi","Ichki daromad normasi (IRR) — loyihaning sof joriy qiymatini nolga tenglashtiradigan diskont stavkasi.","Внутренняя норма доходности","Внутренняя норма доходности (IRR) — ставка дисконтирования, при которой чистая приведённая стоимость проекта равна нулю.","Internal rate of return","The internal rate of return (IRR) is the discount rate that makes a project's NPV equal to zero."],["mol","Qoplash muddati","Qoplash muddati — dastlabki investitsiya loyiha pul oqimlari hisobiga to'liq qoplanishi uchun zarur vaqt.","Срок окупаемости","Срок окупаемости — время, необходимое для полного возврата первоначальных вложений за счёт денежных потоков проекта.","Payback period","The payback period is the time needed for a project's cash flows to recover the initial investment."],["mol","Rentabellik indeksi","Rentabellik indeksi — kelajakdagi pul oqimlari joriy qiymatining boshlang'ich investitsiyaga nisbati.","Индекс рентабельности","Индекс рентабельности — отношение приведённой стоимости будущих денежных потоков к первоначальным инвестициям.","Profitability index","The profitability index is the present value of future cash flows divided by the initial investment."],["mol","Kapital byudjetlashtirish","Kapital byudjetlashtirish — uzoq muddatli investitsiya loyihalarini baholash va tanlash jarayoni.","Бюджетирование капиталовложений","Бюджетирование капиталовложений — процесс оценки и отбора долгосрочных инвестиционных проектов.","Capital budgeting","Capital budgeting is the process of evaluating and selecting long-term investment projects."],["mol","Dividend siyosati","Dividend siyosati — foydaning qancha qismini dividend sifatida to'lash va qanchasini qayta investitsiya qilish haqidagi qaror.","Дивидендная политика","Дивидендная политика — решение о том, какую часть прибыли выплатить в виде дивидендов, а какую реинвестировать.","Dividend policy","Dividend policy is the decision on how much profit to pay out as dividends and how much to reinvest."],["mol","Taqsimlanmagan foyda","Taqsimlanmagan foyda — dividend to'langandan keyin korxonada qoldirilgan va qayta investitsiya qilinadigan foyda.","Нераспределённая прибыль","Нераспределённая прибыль — часть прибыли, оставшаяся в компании после выплаты дивидендов и направляемая на развитие.","Retained earnings","Retained earnings are profits kept in the company after dividends and reinvested in the business."],["mol","Aylanma kapital","Aylanma kapital — joriy aktivlar bilan qisqa muddatli majburiyatlar o'rtasidagi farq.","Оборотный капитал","Оборотный капитал — разница между оборотными активами и краткосрочными обязательствами.","Working capital","Working capital is current assets minus current liabilities."],["mol","Joriy aktivlar","Joriy aktivlar — bir yil ichida naqd pulga aylanishi kutiladigan aktivlar.","Оборотные активы","Оборотные активы — активы, которые, как ожидается, превратятся в деньги в течение года.","Current assets","Current assets are assets expected to be converted into cash within one year."],["mol","Qisqa muddatli majburiyatlar","Qisqa muddatli majburiyatlar — bir yil ichida to'lanishi kerak bo'lgan qarzlar.","Краткосрочные обязательства","Краткосрочные обязательства — долги, подлежащие погашению в течение одного года.","Current liabilities","Current liabilities are obligations due within one year."],["mol","Debitorlik qarzi","Debitorlik qarzi — xaridorlar va boshqa shaxslarning korxona oldidagi to'lanmagan qarzi.","Дебиторская задолженность","Дебиторская задолженность — неоплаченные долги покупателей и других лиц перед предприятием.","Accounts receivable","Accounts receivable is money owed to a company by customers for goods or services delivered."],["mol","Kreditorlik qarzi","Kreditorlik qarzi — korxonaning yetkazib beruvchilar va boshqa kreditorlar oldidagi to'lanmagan qarzi.","Кредиторская задолженность","Кредиторская задолженность — неоплаченные долги предприятия перед поставщиками и другими кредиторами.","Accounts payable","Accounts payable is money a company owes to suppliers for goods or services received."],["mol","Tovar-moddiy zaxiralar","Tovar-moddiy zaxiralar — korxonaning ishlab chiqarish yoki sotish uchun saqlaydigan xomashyo va tayyor mahsuloti.","Товарно-материальные запасы","Товарно-материальные запасы — сырьё и готовая продукция, хранимые предприятием для производства или продажи.","Inventory","Inventory is the raw materials and finished goods a company holds for production or sale."],["mol","Pul aylanish sikli","Pul aylanish sikli — xomashyo uchun to'lovdan mahsulot sotuvidan pul tushguncha o'tadigan kunlar soni.","Денежный цикл","Денежный цикл — число дней от оплаты сырья до получения денег от продажи продукции.","Cash conversion cycle","The cash conversion cycle is the number of days between paying for inputs and collecting cash from sales."],["mol","Doimiy xarajatlar","Doimiy xarajatlar — ishlab chiqarish hajmiga bog'liq bo'lmagan, o'zgarmas xarajatlar.","Постоянные затраты","Постоянные затраты — расходы, не зависящие от объёма производства.","Fixed costs","Fixed costs are expenses that do not change with the level of output."],["mol","O'zgaruvchan xarajatlar","O'zgaruvchan xarajatlar — ishlab chiqarish hajmiga qarab o'zgaradigan xarajatlar.","Переменные затраты","Переменные затраты — расходы, изменяющиеся пропорционально объёму производства.","Variable costs","Variable costs are expenses that change in line with the level of output."],["mol","Zararsizlik nuqtasi","Zararsizlik nuqtasi — tushum jami xarajatlarga teng bo'lib, foyda ham zarar ham bo'lmaydigan sotuv hajmi.","Точка безубыточности","Точка безубыточности — объём продаж, при котором выручка равна общим затратам и прибыль равна нулю.","Break-even point","The break-even point is the sales level at which revenue equals total costs and profit is zero."],["mol","Foyda","Foyda — tushum bilan xarajatlar o'rtasidagi ijobiy farq.","Прибыль","Прибыль — положительная разница между выручкой и затратами.","Profit","Profit is the positive difference between revenue and costs."],["mol","Tushum","Tushum — korxonaning tovar va xizmatlarni sotishdan oladigan jami pul mablag'i.","Выручка","Выручка — общая сумма денег, получаемая предприятием от продажи товаров и услуг.","Revenue","Revenue is the total money a company earns from selling goods and services."],["mol","Amortizatsiya","Amortizatsiya — asosiy vositalar va nomoddiy aktivlar qiymatini foydali xizmat muddati davomida xarajatga o'tkazish.","Амортизация","Амортизация — перенос стоимости основных средств и нематериальных активов на расходы в течение срока их службы.","Depreciation","Depreciation is spreading the cost of a long-lived asset over its useful life as an expense."],["mol","Soliq","Soliq — davlat byudjetini shakllantirish uchun jismoniy va yuridik shaxslardan olinadigan majburiy to'lov.","Налог","Налог — обязательный платёж физических и юридических лиц в государственный бюджет.","Tax","A tax is a mandatory payment collected from individuals and firms to fund the government."],["mol","Davlat byudjeti","Davlat byudjeti — davlatning ma'lum yil uchun markazlashtirilgan daromadlari va xarajatlari rejasi.","Государственный бюджет","Государственный бюджет — годовой план централизованных доходов и расходов государства.","Government budget","The government budget is the state's plan of revenues and expenditures for a given year."],["mol","Byudjet taqchilligi","Byudjet taqchilligi — davlat xarajatlarining daromadlardan ortiq bo'lishi.","Дефицит бюджета","Дефицит бюджета — превышение государственных расходов над доходами.","Budget deficit","A budget deficit occurs when government spending exceeds revenue."],["mol","Davlat qarzi","Davlat qarzi — davlatning ichki va tashqi kreditorlar oldidagi jami qarz majburiyatlari.","Государственный долг","Государственный долг — совокупные долговые обязательства государства перед внутренними и внешними кредиторами.","Public debt","Public debt is the total amount a government owes to domestic and foreign creditors."],["mol","Venchur kapitali","Venchur kapitali — yuqori o'sish salohiyatiga ega yosh kompaniyalarga yuqori risk evaziga kiritiladigan investitsiya.","Венчурный капитал","Венчурный капитал — инвестиции в молодые компании с высоким потенциалом роста и повышенным риском.","Venture capital","Venture capital is funding for young, high-growth companies that carries high risk."],["mol","Birlamchi ommaviy taklif","Birlamchi ommaviy taklif (IPO) — kompaniya aksiyalarini birinchi marta keng investorlar doirasiga sotishi.","Первичное публичное размещение","Первичное публичное размещение (IPO) — первая продажа акций компании широкому кругу инвесторов.","Initial public offering","An initial public offering (IPO) is a company's first sale of shares to the public."],["mol","Bozor kapitallashuvi","Kapitallashuv — kompaniya aksiyalarining bozor narxi va ularning umumiy soni ko'paytmasi.","Рыночная капитализация","Рыночная капитализация — рыночная цена акции, умноженная на общее число акций компании.","Market capitalization","Market capitalization is a company's share price multiplied by its total number of shares."],["mol","Aksiya bahosi daromadga nisbati","Aksiya bahosi daromadga nisbati (P/E) — aksiya narxining bitta aksiyaga to'g'ri keladigan foydaga nisbati.","Отношение цены к прибыли","Отношение цены к прибыли (P/E) — цена акции, делённая на прибыль в расчёте на одну акцию.","Price-to-earnings ratio","The price-to-earnings (P/E) ratio is the share price divided by earnings per share."],["mol","Aksiya bo'yicha foyda","Aksiya bo'yicha foyda (EPS) — sof foydaning muomaladagi aksiyalar soniga nisbati.","Прибыль на акцию","Прибыль на акцию (EPS) — чистая прибыль, делённая на число акций в обращении.","Earnings per share","Earnings per share (EPS) is net income divided by the number of shares outstanding."],["mol","Kapital qiymatlar bahosi modeli","Kapital qiymatlar bahosi modeli (CAPM) — aktivning kutilgan daromadini bozor riski (beta) orqali baholovchi model.","Модель оценки капитальных активов","Модель оценки капитальных активов (CAPM) — модель, определяющая ожидаемую доходность актива через рыночный риск (бета).","Capital asset pricing model","CAPM estimates an asset's expected return from the risk-free rate and its sensitivity to market risk (beta)."],["mol","Beta koeffitsienti","Beta koeffitsienti — aktiv daromadining umumiy bozor daromadi o'zgarishiga sezgirligini ko'rsatuvchi o'lchov.","Коэффициент бета","Коэффициент бета — мера чувствительности доходности актива к изменениям доходности рынка в целом.","Beta","Beta measures how sensitive an asset's returns are to movements in the overall market."],["mol","Xavfsiz daromad stavkasi","Xavfsiz daromad stavkasi — nazariy jihatdan risksiz investitsiyadan, masalan davlat obligatsiyasidan, olinadigan daromad.","Безрисковая ставка","Безрисковая ставка — доходность теоретически безрискового вложения, например государственных облигаций.","Risk-free rate","The risk-free rate is the return on an investment with virtually no risk, such as government bonds."],["mol","Moliyaviy texnologiyalar","Moliyaviy texnologiyalar (fintech) — moliyaviy xizmatlarni takomillashtirish va avtomatlashtirish uchun qo'llaniladigan texnologik yechimlar.","Финансовые технологии","Финансовые технологии (финтех) — технологические решения для улучшения и автоматизации финансовых услуг.","Financial technology","Financial technology (fintech) uses technology to improve and automate financial services."],["mol","Elektron to'lov","Elektron to'lov — pul o'tkazmalarini internet yoki mobil ilova orqali raqamli shaklda amalga oshirish.","Электронный платёж","Электронный платёж — перевод денег в цифровой форме через интернет или мобильное приложение.","Electronic payment","An electronic payment is a transfer of money made digitally via the internet or a mobile app."],["mol","Bank kartasi","Bank kartasi — hisobvaraqdagi mablag'lardan to'lov qilish va naqd pul yechish imkonini beruvchi to'lov vositasi.","Банковская карта","Банковская карта — платёжный инструмент для оплаты и снятия наличных со счёта или кредитного лимита.","Bank card","A bank card is a payment instrument for paying and withdrawing cash from an account or credit line."],["mol","Raqamli valyuta","Raqamli valyuta — faqat elektron shaklda mavjud bo'lgan pul turi.","Цифровая валюта","Цифровая валюта — форма денег, существующая только в электронном виде.","Digital currency","Digital currency is a form of money that exists only in electronic form."],["mol","Kriptovalyuta","Kriptovalyuta — kriptografiya va taqsimlangan reyestr texnologiyasiga asoslangan markazlashmagan raqamli pul.","Криптовалюта","Криптовалюта — децентрализованные цифровые деньги, основанные на криптографии и технологии распределённого реестра.","Cryptocurrency","Cryptocurrency is decentralized digital money secured by cryptography and distributed ledger technology."],["mol","Pul yuvish","Pul yuvish — jinoyat yo'li bilan olingan daromadlarning kelib chiqishini qonuniy ko'rsatish.","Отмывание денег","Отмывание денег — легализация доходов, полученных преступным путём, путём сокрытия их происхождения.","Money laundering","Money laundering is disguising the illegal origin of money so that it appears legitimate."],["mol","Moliyaviy inklyuziya","Moliyaviy inklyuziya — aholining barcha qatlamlari uchun moliyaviy xizmatlardan foydalanish imkoniyati.","Финансовая доступность","Финансовая доступность — возможность для всех слоёв населения пользоваться финансовыми услугами.","Financial inclusion","Financial inclusion is access for all people to useful and affordable financial services."],["mol","Pulning qadrsizlanishi","Pulning qadrsizlanishi — inflyatsiya tufayli pulning xarid qobiliyati pasayishi jarayoni.","Обесценение денег","Обесценение денег — снижение покупательной способности денег из-за инфляции.","Currency depreciation","Currency depreciation is a fall in the value of a currency, reducing what it can buy."],["mol","Kreditor","Kreditor — qarz bergan va qarzdan to'lov olish huquqiga ega shaxs yoki tashkilot.","Кредитор","Кредитор — лицо или организация, предоставившие заём и имеющие право требовать его возврата.","Creditor","A creditor is a person or institution that has lent money and is owed repayment."],["mol","Qarzdor","Qarzdor — qarz oluvchi va uni qaytarish majburiyatiga ega shaxs yoki tashkilot.","Должник","Должник — лицо или организация, получившие заём и обязанные его вернуть.","Debtor","A debtor is a person or organization that owes money to a creditor."],["mol","Moliyaviy barqarorlik","Moliyaviy barqarorlik — korxona yoki tizimning iqtisodiy tebranishlarga qaramay o'z majburiyatlarini bajara olish holati.","Финансовая устойчивость","Финансовая устойчивость — способность предприятия или системы выполнять обязательства несмотря на экономические колебания.","Financial stability","Financial stability is the ability of a firm or system to meet obligations despite economic shocks."],["iqt","Iqtisodiyot","Cheklangan resurslardan foydalanib, odamlarning cheksiz ehtiyojlarini qondirish uchun tovar va xizmatlar ishlab chiqarish, taqsimlash va iste'mol qilish tizimi.","Экономика","Система производства, распределения и потребления благ, направленная на удовлетворение безграничных потребностей людей при ограниченных ресурсах.","Economy","The system of producing, distributing and consuming goods and services to satisfy unlimited human wants with limited resources."],["iqt","Iqtisodiyot nazariyasi","Iqtisodiy hodisalar va jarayonlarning umumiy qonuniyatlarini o'rganuvchi fan.","Экономическая теория","Наука, изучающая общие закономерности экономических явлений и процессов.","Economics","The social science that studies how individuals, firms and societies choose to use scarce resources."],["iqt","Mikroiqtisodiyot","Alohida uy xo'jaliklari, firmalar va bozorlarning xatti-harakatini o'rganuvchi iqtisodiyot bo'limi.","Микроэкономика","Раздел экономики, изучающий поведение отдельных домохозяйств, фирм и рынков.","Microeconomics","The branch of economics that studies the behavior of individual households, firms and markets."],["iqt","Makroiqtisodiyot","Milliy iqtisodiyotni yaxlit holda, ya'ni YaIM, ishsizlik va inflyatsiya kabi ko'rsatkichlar orqali o'rganuvchi bo'lim.","Макроэкономика","Раздел экономики, изучающий национальную экономику в целом через ВВП, безработицу, инфляцию и другие показатели.","Macroeconomics","The branch of economics that studies the economy as a whole, including output, unemployment and inflation."],["iqt","Cheklangan resurslar","Ehtiyojlarga nisbatan resurslarning yetishmasligi, bu tanlov qilishni zarur qiladi.","Ограниченность ресурсов","Нехватка ресурсов по сравнению с потребностями, вынуждающая людей делать выбор.","Scarcity","The condition in which resources are insufficient to satisfy all human wants, forcing choices."],["iqt","Imkoniyat qiymati","Biror tanlov qilinganda voz kechilgan eng yaxshi muqobil variantning qiymati.","Альтернативная стоимость","Ценность наилучшей альтернативы, от которой приходится отказаться при принятии решения.","Opportunity cost","The value of the best alternative given up when a choice is made."],["iqt","Ishlab chiqarish omillari","Tovar va xizmatlar yaratish uchun zarur bo'lgan resurslar: yer, mehnat, kapital va tadbirkorlik qobiliyati.","Факторы производства","Ресурсы, необходимые для создания благ: земля, труд, капитал и предпринимательские способности.","Factors of production","The resources used to produce goods and services: land, labor, capital and entrepreneurship."],["iqt","Mehnat","Insonning tovar va xizmatlar yaratishga sarflaydigan jismoniy va aqliy faoliyati.","Труд","Физическая и умственная деятельность человека, направленная на создание благ.","Labor","The physical and mental effort people contribute to producing goods and services."],["iqt","Kapital","Ishlab chiqarishda foydalaniladigan mashina, uskuna, bino va moliyaviy mablag'lar zaxirasi.","Капитал","Запас машин, оборудования, зданий и финансовых средств, используемых в производстве.","Capital","The stock of machinery, equipment, buildings and funds used to produce goods and services."],["iqt","Yer (tabiiy resurslar)","Ishlab chiqarishda ishlatiladigan yer, suv, foydali qazilmalar va boshqa tabiat in'omlari.","Земля (природные ресурсы)","Земля, вода, полезные ископаемые и другие дары природы, используемые в производстве.","Land (natural resources)","The natural resources such as soil, water and minerals that are used in production."],["iqt","Tadbirkorlik","Foyda olish maqsadida tavakkalchilikni zimmaga olib, ishlab chiqarish omillarini birlashtirish faoliyati.","Предпринимательство","Деятельность по объединению факторов производства с принятием риска ради получения прибыли.","Entrepreneurship","The activity of combining resources and bearing risk to create and run a business for profit."],["iqt","Tadbirkor","Tavakkalchilik asosida o'z biznesini tashkil etib, boshqaradigan va daromad oladigan shaxs.","Предприниматель","Лицо, которое на свой риск создаёт и ведёт бизнес ради получения дохода.","Entrepreneur","A person who organizes and runs a business, taking on financial risk in pursuit of profit."],["iqt","Iqtisodiy tizim","Jamiyatda nimani, qanday va kim uchun ishlab chiqarish masalalarini hal qilish usuli.","Экономическая система","Способ решения в обществе вопросов о том, что, как и для кого производить.","Economic system","The way a society decides what, how and for whom to produce."],["iqt","Bozor iqtisodiyoti","Resurslar taqsimoti narxlar, talab va taklif orqali, xususiy mulk asosida amalga oshadigan tizim.","Рыночная экономика","Система, где ресурсы распределяются через цены, спрос и предложение на основе частной собственности.","Market economy","An economic system in which prices, supply and demand and private ownership guide resource allocation."],["iqt","Rejali iqtisodiyot","Ishlab chiqarish va taqsimot davlat rejasi asosida markazdan boshqariladigan iqtisodiy tizim.","Плановая экономика","Экономическая система, где производство и распределение централизованно управляются государственным планом.","Planned economy","An economic system in which the state centrally plans production and distribution."],["iqt","Aralash iqtisodiyot","Bozor mexanizmi va davlat tartibga solishi birga mavjud bo'lgan iqtisodiy tizim.","Смешанная экономика","Экономическая система, сочетающая рыночные механизмы и государственное регулирование.","Mixed economy","An economic system combining private markets with government intervention."],["iqt","An'anaviy iqtisodiyot","Ishlab chiqarish urf-odat va an'analarga asoslangan iqtisodiy tizim turi.","Традиционная экономика","Тип экономической системы, где производство определяется обычаями и традициями.","Traditional economy","An economic system in which production decisions are based on custom and tradition."],["iqt","Iqtisodiy subyektlar","Iqtisodiy qarorlar qabul qiluvchi ishtirokchilar: uy xo'jaliklari, firmalar va davlat.","Экономические агенты","Участники экономики, принимающие решения: домохозяйства, фирмы и государство.","Economic agents","The participants who make economic decisions: households, firms and the government."],["iqt","Uy xo'jaligi","Umumiy byudjet bilan yashab, iste'mol qaror qabul qiluvchi shaxs yoki oila.","Домохозяйство","Лицо или семья с общим бюджетом, принимающие решения о потреблении.","Household","A person or family living together that makes joint consumption and saving decisions."],["iqt","Firma","Foyda olish maqsadida tovar yoki xizmat ishlab chiqaruvchi tashkilot.","Фирма","Организация, производящая товары или услуги с целью получения прибыли.","Firm","An organization that produces goods or services in order to earn profit."],["iqt","Tovar","Ehtiyojni qondirishga qodir va bozorda sotish uchun ishlab chiqarilgan mahsulot.","Товар","Продукт труда, способный удовлетворять потребность и предназначенный для продажи.","Good","A tangible product that satisfies a want and is produced for sale."],["iqt","Xizmat","Moddiy shaklga ega bo'lmagan, ehtiyojni qondiruvchi faoliyat natijasi.","Услуга","Нематериальный результат деятельности, удовлетворяющий потребность.","Service","An intangible activity that satisfies a want, such as teaching or banking."],["iqt","Normal tovar","Iste'molchi daromadi oshganda talab ham ortadigan tovar.","Нормальное благо","Благо, спрос на которое растёт при увеличении дохода потребителя.","Normal good","A good whose demand rises as consumer income increases."],["iqt","Past sifatli tovar","Daromad oshganda talab kamayadigan tovar.","Низкокачественное благо","Благо, спрос на которое снижается при росте дохода.","Inferior good","A good whose demand falls when consumer income rises."],["iqt","O'rin bosuvchi tovarlar","Biri o'rniga ikkinchisini iste'mol qilish mumkin bo'lgan tovarlar, masalan, choy va qahva.","Товары-заменители","Блага, которые можно использовать вместо друг друга, например чай и кофе.","Substitute goods","Goods that can be used in place of one another, so a price rise of one raises demand for the other."],["iqt","To'ldiruvchi tovarlar","Birga iste'mol qilinadigan tovarlar, masalan, avtomobil va benzin.","Товары-дополнители","Блага, которые потребляются вместе, например автомобиль и бензин.","Complementary goods","Goods that are consumed together, so a price rise of one lowers demand for the other."],["iqt","Ommaviy tovar","Undan foydalanishdan hech kimni chetlatib bo'lmaydigan va iste'mol qilganda kamaymaydigan tovar.","Общественное благо","Благо, от потребления которого нельзя исключить никого и которое не убывает при потреблении.","Public good","A good that is non-excludable and non-rivalrous, such as national defense."],["iqt","Xususiy tovar","Faqat to'lagan kishi foydalanadigan va bir kishi iste'moli boshqasiga to'siq bo'ladigan tovar.","Частное благо","Благо, доступное только заплатившему и потребление которого одним лицом исключает потребление другим.","Private good","A good that is both excludable and rivalrous, consumed only by the person who pays for it."],["iqt","Umumiy resurslar","Foydalanishdan chetlatib bo'lmaydigan, lekin iste'mol qilinganda kamayadigan resurslar, masalan, baliq zaxiralari.","Общие ресурсы","Ресурсы, доступ к которым открыт всем, но которые истощаются при использовании, например рыбные запасы.","Common resources","Resources that are non-excludable but rivalrous, such as fish stocks, and prone to overuse."],["iqt","Tekin foydalanuvchi muammosi","Ommaviy tovardan to'lamasdan foydalanishga urinish natijasida yuzaga keladigan muammo.","Проблема безбилетника","Ситуация, когда люди пользуются общественным благом, не оплачивая его.","Free-rider problem","The situation in which people benefit from a good without paying for it."],["iqt","Tashqi samara (eksternaliya)","Bitim ishtirokchilari bo'lmagan uchinchi tomonga ta'sir qiluvchi va narxda aks etmaydigan xarajat yoki naf.","Внешний эффект (экстерналия)","Издержки или выгоды для третьих лиц, не отражённые в рыночной цене сделки.","Externality","A cost or benefit that affects a third party and is not reflected in the market price."],["iqt","Salbiy tashqi samara","Uchinchi tomonga zarar yetkazadigan xarajat, masalan, havoning ifloslanishi.","Отрицательный внешний эффект","Издержки, наносимые третьим лицам, например загрязнение воздуха.","Negative externality","A cost imposed on third parties, such as pollution from a factory."],["iqt","Ijobiy tashqi samara","Uchinchi tomonga foyda keltiradigan ta'sir, masalan, ta'lim va emlashning jamiyatga naf.","Положительный внешний эффект","Выгода для третьих лиц, например польза общества от образования и вакцинации.","Positive externality","A benefit that spills over to third parties, such as the social gain from vaccination."],["iqt","Bozor muvaffaqiyatsizligi","Bozor resurslarni samarali taqsimlay olmaydigan holat.","Провал рынка","Ситуация, когда рынок не обеспечивает эффективного распределения ресурсов.","Market failure","A situation in which the free market fails to allocate resources efficiently."],["iqt","Davlat muvaffaqiyatsizligi","Davlat aralashuvi kutilgan natijani bermay, samarasizlikka olib keladigan holat.","Провал государства","Ситуация, когда государственное вмешательство приводит к неэффективности вместо ожидаемого результата.","Government failure","A situation in which government intervention produces a less efficient outcome than the market."],["iqt","Mulk huquqi","Shaxsning mol-mulkka egalik qilish, foydalanish va tasarruf etish huquqi.","Право собственности","Право лица владеть имуществом, пользоваться им и распоряжаться.","Property rights","The legal rights to own, use and dispose of resources and assets."],["iqt","Xususiy mulk","Alohida shaxs yoki tashkilotga tegishli mol-mulk.","Частная собственность","Имущество, принадлежащее отдельному лицу или организации.","Private property","Assets owned by individuals or private organizations rather than by the state."],["iqt","Davlat mulki","Butun jamiyat nomidan davlat egalik qiladigan mol-mulk.","Государственная собственность","Имущество, которым от имени общества владеет государство.","State property","Assets owned and managed by the government on behalf of society."],["iqt","Xususiylashtirish","Davlat mulkini xususiy shaxslar yoki tashkilotlarga o'tkazish jarayoni.","Приватизация","Процесс передачи государственной собственности в руки частных лиц или организаций.","Privatization","The transfer of state-owned enterprises or assets to private ownership."],["iqt","Mehnat taqsimoti","Ishlab chiqarish jarayonini alohida operatsiyalarga bo'lib, turli ishchilar o'rtasida taqsimlash.","Разделение труда","Разбиение производственного процесса на отдельные операции между разными работниками.","Division of labor","Splitting production into separate tasks performed by different workers to raise productivity."],["iqt","Ixtisoslashuv","Ishlab chiqaruvchi yoki mamlakatning cheklangan turdagi tovar ishlab chiqarishga e'tibor qaratishi.","Специализация","Сосредоточение производителя или страны на выпуске ограниченного круга товаров.","Specialization","Focusing production on a narrow set of goods or tasks in which one is most efficient."],["iqt","Mutlaq ustunlik","Tovarni boshqalarga qaraganda kamroq resurs sarflab ishlab chiqarish qobiliyati.","Абсолютное преимущество","Способность производить товар с меньшими затратами ресурсов, чем другие.","Absolute advantage","The ability to produce a good using fewer resources than another producer."],["iqt","Nisbiy ustunlik","Tovarni past imkoniyat qiymati bilan ishlab chiqarish qobiliyati, savdoning asosi.","Сравнительное преимущество","Способность производить товар с меньшей альтернативной стоимостью, основа торговли.","Comparative advantage","The ability to produce a good at a lower opportunity cost, which forms the basis for trade."],["iqt","Ishlab chiqarish imkoniyatlari chegarasi","Resurslar to'liq ishlatilganda ishlab chiqarish mumkin bo'lgan tovarlar kombinatsiyalarini ko'rsatuvchi egri chiziq.","Кривая производственных возможностей","Кривая, показывающая максимально возможные сочетания товаров при полном использовании ресурсов.","Production possibilities frontier","A curve showing the maximum combinations of goods an economy can produce with its resources."],["iqt","Samaradorlik","Resurslardan eng kam xarajat bilan eng yuqori natijaga erishish darajasi.","Эффективность","Степень достижения наилучшего результата при наименьших затратах ресурсов.","Efficiency","Getting the maximum output from available resources with minimal waste."],["iqt","Unumdorlik","Birlik resurs yoki mehnat vaqti hisobiga ishlab chiqarilgan mahsulot miqdori.","Производительность","Объём продукции на единицу ресурса или рабочего времени.","Productivity","The amount of output produced per unit of input, such as per hour of labor."],["iqt","Iqtisodiy o'sish","Mamlakatda tovar va xizmatlar ishlab chiqarish hajmining vaqt o'tishi bilan ortishi.","Экономический рост","Увеличение объёма производства товаров и услуг в стране с течением времени.","Economic growth","An increase in the total output of goods and services in an economy over time."],["iqt","Iqtisodiy rivojlanish","Iqtisodiy o'sish bilan birga tuzilma, turmush darajasi va institutlarning sifat jihatidan yaxshilanishi.","Экономическое развитие","Качественное улучшение структуры экономики, уровня жизни и институтов наряду с ростом.","Economic development","Qualitative improvement in living standards, economic structure and institutions alongside growth."],["iqt","Yalpi ichki mahsulot (YaIM)","Mamlakat ichida bir yilda ishlab chiqarilgan barcha yakuniy tovar va xizmatlarning bozor qiymati.","Валовой внутренний продукт (ВВП)","Рыночная стоимость всех конечных товаров и услуг, произведённых в стране за год.","Gross domestic product (GDP)","The market value of all final goods and services produced within a country in a year."],["iqt","Yalpi milliy daromad (YaMD)","Mamlakat rezidentlari ichkarida va chetda yaratgan umumiy daromad.","Валовой национальный доход (ВНД)","Совокупный доход резидентов страны, полученный как внутри неё, так и за рубежом.","Gross national income (GNI)","The total income earned by a country's residents, both at home and abroad."],["iqt","Aholi jon boshiga YaIM","YaIMning mamlakat aholisi soniga nisbati, o'rtacha turmush darajasi ko'rsatkichi.","ВВП на душу населения","Отношение ВВП к численности населения, показатель среднего уровня жизни.","GDP per capita","GDP divided by population, used as a measure of average living standards."],["iqt","Nominal YaIM","Joriy narxlarda hisoblangan yalpi ichki mahsulot.","Номинальный ВВП","Валовой внутренний продукт, рассчитанный в текущих ценах.","Nominal GDP","GDP measured at current prices without adjusting for inflation."],["iqt","Real YaIM","Doimiy narxlarda, inflyatsiya ta'siri chiqarib tashlangan yalpi ichki mahsulot.","Реальный ВВП","ВВП в постоянных ценах с исключением влияния инфляции.","Real GDP","GDP adjusted for inflation, reflecting the true change in output."],["iqt","Farovonlik","Odamlarning moddiy va nomoddiy ehtiyojlari qondirilganlik darajasi.","Благосостояние","Степень удовлетворения материальных и нематериальных потребностей людей.","Welfare","The level of material and non-material well-being of individuals in a society."],["iqt","Turmush darajasi","Aholining tovar, xizmat va qulayliklardan foydalanish darajasi.","Уровень жизни","Степень обеспеченности населения благами, услугами и условиями жизни.","Standard of living","The level of goods, services and comforts available to a population."],["iqt","Kambag'allik","Odamlarning asosiy ehtiyojlarini qondirish uchun yetarli daromadga ega bo'lmasligi.","Бедность","Состояние, при котором у людей недостаточно доходов для удовлетворения базовых потребностей.","Poverty","The condition of lacking enough income or resources to meet basic needs."],["iqt","Kambag'allik chegarasi","Aholini kambag'al deb hisoblash uchun belgilangan minimal daromad yoki iste'mol darajasi.","Черта бедности","Минимальный уровень дохода или потребления, ниже которого население считается бедным.","Poverty line","The minimum income level below which a person is considered poor."],["iqt","Daromad tengsizligi","Aholining turli guruhlari o'rtasida daromadlar notekis taqsimlanishi.","Неравенство доходов","Неравномерное распределение доходов между различными группами населения.","Income inequality","The uneven distribution of income among different groups in a population."],["iqt","Jini koeffitsiyenti","Daromad tengsizligini 0 dan 1 gacha o'lchaydigan ko'rsatkich, 0 to'liq tenglikni bildiradi.","Коэффициент Джини","Показатель неравенства доходов от 0 до 1, где 0 означает полное равенство.","Gini coefficient","A measure of income inequality from 0 to 1, where 0 means perfect equality."],["iqt","Lorenz egri chizig'i","Aholi va daromadlarning kumulyativ ulushi orqali daromad taqsimotini ko'rsatuvchi grafik.","Кривая Лоренца","График, показывающий распределение доходов через накопленные доли населения и доходов.","Lorenz curve","A graph showing the cumulative share of income held by cumulative shares of the population."],["iqt","Insoniy kapital","Insonning bilim, malaka va sog'liq ko'rinishidagi, daromad keltiruvchi salohiyati.","Человеческий капитал","Знания, навыки и здоровье человека, приносящие доход.","Human capital","The knowledge, skills and health of people that raise their productivity and earnings."],["iqt","Inson taraqqiyoti indeksi","Umr davomiyligi, ta'lim va daromadni hisobga oluvchi taraqqiyotning umumiy ko'rsatkichi.","Индекс человеческого развития","Сводный показатель развития, учитывающий продолжительность жизни, образование и доход.","Human Development Index","A composite measure of development combining life expectancy, education and income."],["iqt","Mehnat bozori","Ish beruvchilar va ishchilar o'rtasida mehnat xizmatlari oldi-sotdisi amalga oshadigan bozor.","Рынок труда","Рынок, где работодатели и работники обмениваются трудовыми услугами.","Labor market","The market in which employers demand and workers supply labor services."],["iqt","Ish haqi","Ishchining mehnati evaziga oladigan to'lovi.","Заработная плата","Вознаграждение, получаемое работником за свой труд.","Wage","The payment a worker receives in exchange for labor."],["iqt","Ishsizlik","Ish qidirayotgan, ishlashga tayyor, lekin ish topa olmayotgan shaxslar holati.","Безработица","Ситуация, когда трудоспособные люди ищут работу и готовы работать, но не могут её найти.","Unemployment","The condition of people who are willing and able to work and are actively seeking a job but cannot find one."],["iqt","Ishsizlik darajasi","Ishsizlar sonining ishchi kuchiga nisbati foizda.","Уровень безработицы","Доля безработных в рабочей силе, выраженная в процентах.","Unemployment rate","The percentage of the labor force that is unemployed."],["iqt","Friksion ishsizlik","Ish almashtirish yoki yangi ish qidirish jarayonidagi vaqtinchalik ish
