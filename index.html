sizlik.","Фрикционная безработица","Временная безработица, связанная со сменой работы или поиском новой.","Frictional unemployment","Temporary unemployment while workers are between jobs or searching for a new one."],["iqt","Tarkibiy ishsizlik","Iqtisodiyot tuzilmasi yoki texnologiya o'zgarishi tufayli ishchilar malakasi talabga mos kelmasligidan kelib chiqqan ishsizlik.","Структурная безработица","Безработица из-за несоответствия навыков работников изменившейся структуре экономики или технологиям.","Structural unemployment","Unemployment caused by a mismatch between workers' skills and available jobs."],["iqt","Tsiklik ishsizlik","Iqtisodiy tanazzul davrida ishlab chiqarish kamayishi tufayli yuzaga keladigan ishsizlik.","Циклическая безработица","Безработица, возникающая из-за спада производства в период экономического кризиса.","Cyclical unemployment","Unemployment caused by a downturn in the business cycle."],["iqt","Ishchi kuchi","Ishlayotgan va ish qidirayotgan, mehnatga layoqatli aholi qismi.","Рабочая сила","Часть трудоспособного населения, которая работает или ищет работу.","Labor force","All people who are employed or actively looking for work."],["iqt","Bandlik","Ish bilan ta'minlangan, daromad keltiruvchi faoliyat bilan shug'ullanuvchi aholi holati.","Занятость","Состояние населения, занятого деятельностью, приносящей доход.","Employment","The state of being engaged in paid or income-generating work."],["iqt","Norasmiy bandlik","Rasmiy ro'yxatdan o'tmagan, ijtimoiy kafolatlarsiz ish bilan band bo'lish.","Неформальная занятость","Работа без официального оформления и социальных гарантий.","Informal employment","Work carried out without formal registration, contracts or social protection."],["iqt","Yashirin iqtisodiyot","Soliq to'lashdan va ro'yxatdan o'tishdan yashirilgan iqtisodiy faoliyat.","Теневая экономика","Экономическая деятельность, скрытая от налогообложения и государственного учёта.","Shadow economy","Economic activity that is hidden from the authorities to avoid taxes and regulation."],["iqt","Institutlar","Iqtisodiy xatti-harakatni tartibga soluvchi qonunlar, qoidalar va an'analar tizimi.","Институты","Система законов, правил и традиций, регулирующих экономическое поведение.","Institutions","The laws, rules and norms that shape economic behavior and interactions."],["iqt","Operatsion xarajatlar","Bitim tuzish, axborot qidirish va kelishuvlarni nazorat qilish bilan bog'liq xarajatlar.","Трансакционные издержки","Затраты на поиск информации, заключение сделок и контроль их исполнения.","Transaction costs","The costs of searching, negotiating and enforcing an exchange apart from the price itself."],["iqt","Korrupsiya","Mansabdor shaxsning o'z vakolatidan shaxsiy manfaat uchun foydalanishi.","Коррупция","Использование должностным лицом своих полномочий в личных интересах.","Corruption","The abuse of public office for private gain."],["iqt","Iqtisodiyot sektorlari","Iqtisodiyotning faoliyat turiga ko'ra bo'linishi: birlamchi, ikkilamchi va uchlamchi sektor.","Секторы экономики","Деление экономики по видам деятельности на первичный, вторичный и третичный секторы.","Economic sectors","The division of the economy by type of activity into primary, secondary and tertiary sectors."],["iqt","Birlamchi sektor","Qishloq xo'jaligi, o'rmon va konchilik kabi tabiiy resurslarni olish tarmoqlari.","Первичный сектор","Отрасли добычи природных ресурсов: сельское хозяйство, лесное хозяйство, горная добыча.","Primary sector","The sector extracting raw materials from nature, such as agriculture, forestry and mining."],["iqt","Ikkilamchi sektor","Xom ashyoni qayta ishlovchi sanoat va qurilish tarmoqlari.","Вторичный сектор","Промышленность и строительство, перерабатывающие сырьё в готовую продукцию.","Secondary sector","The sector that manufactures and processes raw materials, including industry and construction."],["iqt","Uchlamchi sektor","Savdo, transport, ta'lim, sog'liqni saqlash va moliya kabi xizmat ko'rsatish tarmoqlari.","Третичный сектор","Сфера услуг: торговля, транспорт, образование, здравоохранение и финансы.","Tertiary sector","The service sector, including trade, transport, education, healthcare and finance."],["iqt","Sanoatlashtirish","Iqtisodiyotda sanoatning ulushi va rolini oshirish jarayoni.","Индустриализация","Процесс повышения доли и роли промышленности в экономике.","Industrialization","The process of raising the share of manufacturing and industry in an economy."],["iqt","Raqamli iqtisodiyot","Raqamli texnologiyalar va ma'lumotlarga asoslangan ishlab chiqarish, savdo va xizmatlar tizimi.","Цифровая экономика","Экономика, основанная на цифровых технологиях и данных в производстве, торговле и услугах.","Digital economy","Economic activity based on digital technologies, data and online platforms."],["iqt","Yashil iqtisodiyot","Atrof-muhitga zararni kamaytirib, resurslarni tejab o'sishga erishuvchi iqtisodiyot modeli.","Зелёная экономика","Модель экономики, обеспечивающая рост при сокращении вреда окружающей среде и экономии ресурсов.","Green economy","An economy that grows while reducing environmental harm and using resources efficiently."],["iqt","Hamkorlikdagi iqtisodiyot","Mol-mulk va xizmatlardan raqamli platformalar orqali birgalikda foydalanishga asoslangan iqtisodiyot.","Совместное потребление (экономика совместного пользования)","Модель, где люди совместно используют имущество и услуги через цифровые платформы.","Sharing economy","An economic model in which people share assets and services through digital platforms."],["iqt","Tsirkulyar iqtisodiyot","Resurslarni qayta ishlatish va chiqindilarni kamaytirishga asoslangan iqtisodiy model.","Циркулярная экономика","Экономическая модель, основанная на повторном использовании ресурсов и сокращении отходов.","Circular economy","A model that minimizes waste by reusing, repairing and recycling materials."],["iqt","Bilimga asoslangan iqtisodiyot","Bilim, innovatsiya va axborot asosiy ishlab chiqarish omiliga aylangan iqtisodiyot.","Экономика знаний","Экономика, где знания, инновации и информация становятся главным фактором производства.","Knowledge economy","An economy in which knowledge and innovation are the main drivers of growth."],["iqt","Barqaror rivojlanish","Kelajak avlodlar ehtiyojiga zarar yetkazmasdan, hozirgi ehtiyojlarni qondiradigan rivojlanish.","Устойчивое развитие","Развитие, удовлетворяющее потребности нынешнего поколения без ущерба для потребностей будущих.","Sustainable development","Development that meets present needs without compromising the ability of future generations to meet theirs."],["iqt","Innovatsiya","Yangi mahsulot, texnologiya yoki usulni iqtisodiy faoliyatga joriy etish.","Инновация","Внедрение нового продукта, технологии или метода в хозяйственную деятельность.","Innovation","The introduction of a new product, technology or method into economic activity."],["iqt","Texnologik taraqqiyot","Ishlab chiqarish usullarining takomillashuvi hisobiga unumdorlikning oshishi.","Технологический прогресс","Рост производительности за счёт совершенствования методов производства.","Technological progress","Improvement in production methods that raises output from the same inputs."],["iqt","Iste'mol","Tovar va xizmatlardan ehtiyojni qondirish uchun foydalanish.","Потребление","Использование товаров и услуг для удовлетворения потребностей.","Consumption","The use of goods and services to satisfy wants."],["iqt","Foydalilik (naflilik)","Iste'molchi tovar yoki xizmatdan oladigan qoniqish darajasi.","Полезность","Степень удовлетворения, которое потребитель получает от блага.","Utility","The satisfaction a consumer gets from consuming a good or service."],["iqt","Talab","Iste'molchilar ma'lum narxda sotib olishga tayyor va qodir bo'lgan tovar miqdori.","Спрос","Количество товара, которое потребители готовы и способны купить по определённой цене.","Demand","The quantity of a good consumers are willing and able to buy at a given price."],["iqt","Taklif","Ishlab chiqaruvchilar ma'lum narxda sotishga tayyor bo'lgan tovar miqdori.","Предложение","Количество товара, которое производители готовы продать по определённой цене.","Supply","The quantity of a good producers are willing to sell at a given price."],["iqt","Muvozanat narxi","Talab va taklif miqdori tenglashadigan narx.","Равновесная цена","Цена, при которой величины спроса и предложения совпадают.","Equilibrium price","The price at which the quantity demanded equals the quantity supplied."],["iqt","Narx egiluvchanligi","Narx o'zgarganda talab yoki taklif miqdori qanchalik o'zgarishini ko'rsatuvchi ko'rsatkich.","Эластичность по цене","Показатель того, насколько сильно меняется спрос или предложение при изменении цены.","Price elasticity","A measure of how much quantity demanded or supplied responds to a change in price."],["iqt","Raqobat","Sotuvchilarning iste'molchilar uchun bozorda kurashi.","Конкуренция","Соперничество продавцов за покупателей на рынке.","Competition","The rivalry among sellers to attract buyers in a market."],["iqt","Monopoliya","Bozorda bitta sotuvchi hukmronlik qilib, narxlarni belgilay oladigan bozor tuzilmasi.","Монополия","Рыночная структура, где единственный продавец контролирует рынок и устанавливает цену.","Monopoly","A market with a single seller that has power to set the price."],["iqt","Oligopoliya","Bozorda bir necha yirik firma hukmronlik qiladigan bozor tuzilmasi.","Олигополия","Рыночная структура, где доминирует небольшое число крупных фирм.","Oligopoly","A market dominated by a small number of large firms."],["iqt","Mukammal raqobat","Ko'p sonli kichik sotuvchilar bir xil mahsulot sotadigan va narxga ta'sir qila olmaydigan bozor.","Совершенная конкуренция","Рынок с множеством мелких продавцов однородного товара, не влияющих на цену.","Perfect competition","A market with many small sellers of identical products, none of which can influence the price."],["iqt","Xarajatlar","Ishlab chiqarish uchun sarflangan resurslarning pul ifodasi.","Издержки","Денежное выражение ресурсов, затраченных на производство.","Costs","The monetary value of resources used in production."],["iqt","Masshtab samarasi","Ishlab chiqarish hajmi oshganda birlik mahsulot xarajatining kamayishi.","Эффект масштаба","Снижение издержек на единицу продукции при росте объёма производства.","Economies of scale","The fall in average cost per unit as the scale of production increases."],["iqt","Kamayib boruvchi unumdorlik qonuni","Bir omilni oshirib, boshqalarni o'zgarmas qoldirsak, qo'shimcha mahsulot oxir-oqibat kamayadi.","Закон убывающей отдачи","Если увеличивать один фактор при неизменных остальных, дополнительный выпуск в итоге снижается.","Law of diminishing returns","Adding more of one input while holding others fixed eventually yields smaller additional output."],["iqt","Chekli foydalilik","Qo'shimcha bir birlik tovar iste'moli keltiradigan qo'shimcha naf.","Предельная полезность","Дополнительная польза от потребления ещё одной единицы блага.","Marginal utility","The extra satisfaction from consuming one more unit of a good."],["iqt","Chekli xarajat","Qo'shimcha bir birlik mahsulot ishlab chiqarish uchun qo'shimcha xarajat.","Предельные издержки","Дополнительные затраты на производство ещё одной единицы продукции.","Marginal cost","The additional cost of producing one more unit of output."],["iqt","Iqtisodiy sikl","Iqtisodiy faollikning o'sish va pasayish davrlarining navbatma-navbat takrorlanishi.","Экономический цикл","Повторяющееся чередование периодов подъёма и спада экономической активности.","Business cycle","The recurring pattern of expansion and contraction in economic activity."],["iqt","Retsessiya","Yalpi ichki mahsulot ketma-ket bir necha chorak davomida kamayadigan iqtisodiy pasayish davri.","Рецессия","Период экономического спада, когда ВВП снижается в течение нескольких кварталов подряд.","Recession","A period of declining output, typically two or more consecutive quarters of falling GDP."],["iqt","Deflyatsiya","Narxlarning umumiy darajasi pasayishi.","Дефляция","Снижение общего уровня цен в экономике.","Deflation","A sustained fall in the general price level."],["iqt","Stagflyatsiya","Iqtisodiy turg'unlik, yuqori ishsizlik va inflyatsiyaning bir vaqtda kuzatilishi.","Стагфляция","Одновременное наличие экономического застоя, высокой безработицы и инфляции.","Stagflation","The combination of stagnant growth, high unemployment and high inflation."],["iqt","Iste'mol narxlari indeksi (INI)","Aholi iste'mol qiladigan tovar va xizmatlar savatchasi narxining o'zgarishini ko'rsatuvchi ko'rsatkich.","Индекс потребительских цен (ИПЦ)","Показатель изменения стоимости корзины товаров и услуг, потребляемых населением.","Consumer price index (CPI)","A measure of the average change in prices of a basket of goods and services bought by households."],["iqt","Savdo balansi","Mamlakat eksporti va importi qiymati o'rtasidagi farq.","Торговый баланс","Разница между стоимостью экспорта и импорта страны.","Trade balance","The difference between a country's exports and imports of goods."],["iqt","Eksport","Mamlakatda ishlab chiqarilgan tovar va xizmatlarni chet elga sotish.","Экспорт","Продажа товаров и услуг, произведённых в стране, за рубеж.","Export","Selling domestically produced goods and services to other countries."],["iqt","Import","Chet eldan tovar va xizmatlarni sotib olib kelish.","Импорт","Закупка товаров и услуг за рубежом и ввоз их в страну.","Import","Buying goods and services from other countries."],["iqt","Eksport salohiyati","Mamlakatning chet elga raqobatbardosh mahsulot sotishga qodir bo'lgan imkoniyatlari majmui.","Экспортный потенциал","Совокупность возможностей страны поставлять конкурентоспособную продукцию на внешние рынки.","Export potential","The overall capacity of a country to sell competitive goods and services abroad."],["iqt","Jahon savdo tashkiloti (JST)","Xalqaro savdo qoidalarini belgilovchi va nizolarni hal qiluvchi xalqaro tashkilot.","Всемирная торговая организация (ВТО)","Международная организация, устанавливающая правила торговли и разрешающая споры между странами.","World Trade Organization (WTO)","The international body that sets rules for global trade and settles trade disputes."],["iqt","Globallashuv","Mamlakatlar iqtisodiyotlarining savdo, kapital va texnologiya orqali o'zaro bog'lanishi.","Глобализация","Усиление взаимосвязи национальных экономик через торговлю, капитал и технологии.","Globalization","The growing integration of national economies through trade, capital flows and technology."],["iqt","Iqtisodiy integratsiya","Mamlakatlar o'rtasida savdo to'siqlarini kamaytirib, iqtisodiy hamkorlikni chuqurlashtirish.","Экономическая интеграция","Углубление экономического сотрудничества стран путём снижения торговых барьеров.","Economic integration","Cooperation among countries that reduces trade barriers and links their economies."],["iqt","Erkin iqtisodiy zona","Tadbirkorlar uchun soliq va bojxona imtiyozlari beriladigan maxsus hududiy rejim.","Свободная экономическая зона","Территория с особым режимом, где предпринимателям предоставляются налоговые и таможенные льготы.","Free economic zone","A designated area offering tax and customs incentives to attract business and investment."],["iqt","Bevosita xorijiy investitsiyalar","Xorijiy investorning boshqa mamlakatdagi korxonani nazorat qilish maqsadida kapital kiritishi.","Прямые иностранные инвестиции","Вложение иностранным инвестором капитала в предприятие другой страны с целью контроля над ним.","Foreign direct investment (FDI)","Investment by a foreign investor in a business abroad in order to gain lasting control."],["iqt","Kichik biznes","Xodimlari soni va daromadi cheklangan, kichik hajmdagi tadbirkorlik subyekti.","Малый бизнес","Предприятие с ограниченной численностью работников и доходом.","Small business","A privately owned enterprise with limited employees and revenue."],["iqt","Startap","Yangi g'oya va innovatsion mahsulot asosida tez o'sishni maqsad qilgan yangi kompaniya.","Стартап","Новая компания, ориентированная на быстрый рост на основе инновационной идеи или продукта.","Startup","A newly founded company built around an innovative idea and aiming for rapid growth."],["iqt","Xususiy tadbirkorlik","Xususiy mulk asosida erkin tashkil etiladigan va yuritiladigan tadbirkorlik faoliyati.","Частное предпринимательство","Предпринимательская деятельность, осуществляемая на основе частной собственности.","Private enterprise","Business activity owned and run by private individuals or firms."],["iqt","Davlat-xususiy sheriklik","Davlat va xususiy sektorning infratuzilma loyihalarini birgalikda amalga oshirishi.","Государственно-частное партнёрство","Сотрудничество государства и частного бизнеса в реализации инфраструктурных проектов.","Public-private partnership","A long-term cooperation between government and private firms to deliver public projects."],["iqt","Iqtisodiy islohotlar","Iqtisodiy tizimni takomillashtirish maqsadida amalga oshiriladigan tarkibiy o'zgarishlar.","Экономические реформы","Структурные преобразования, направленные на совершенствование экономической системы.","Economic reforms","Structural policy changes aimed at improving how an economy works."],["iqt","Bozor iqtisodiyotiga o'tish","Rejali tizimdan bozor mexanizmlariga asoslangan iqtisodiyotga bosqichma-bosqich o'tish jarayoni.","Переход к рыночной экономике","Постепенный переход от плановой системы к экономике на основе рыночных механизмов.","Transition to a market economy","The gradual shift from central planning to an economy guided by market mechanisms."],["iqt","Tarkibiy o'zgarishlar","Iqtisodiyot tarmoqlari o'rtasidagi nisbatlarning o'zgarishi.","Структурные изменения","Изменение пропорций между отраслями экономики.","Structural change","A shift in the relative weight of sectors within an economy."],["iqt","Qishloq xo'jaligi","O'simlik va chorvachilik mahsulotlari yetishtirishga asoslangan iqtisodiyot tarmog'i.","Сельское хозяйство","Отрасль экономики, занимающаяся выращиванием растений и животноводством.","Agriculture","The sector producing crops and livestock."],["iqt","Sanoat","Xom ashyoni qayta ishlab, tayyor mahsulot yaratuvchi iqtisodiyot tarmog'i.","Промышленность","Отрасль экономики, перерабатывающая сырьё и производящая готовую продукцию.","Industry","The sector that extracts and processes materials into manufactured goods."],["iqt","Infratuzilma","Iqtisodiyotning ishlashi uchun zarur yo'l, energetika, aloqa kabi asosiy tarmoqlar.","Инфраструктура","Основные системы, необходимые для функционирования экономики: дороги, энергетика, связь.","Infrastructure","The basic physical systems, such as roads, energy and communications, that support economic activity."],["iqt","Boylik","Shaxs yoki mamlakat egalik qiladigan aktivlar va mol-mulkning umumiy qiymati.","Богатство","Совокупная стоимость активов и имущества, которыми владеет лицо или страна.","Wealth","The total value of assets owned by a person or a country."],["iqt","Daromadlarni qayta taqsimlash","Davlatning soliq va ijtimoiy to'lovlar orqali daromadlarni kam ta'minlanganlarga yo'naltirishi.","Перераспределение доходов","Передача государством части доходов малообеспеченным слоям через налоги и социальные выплаты.","Income redistribution","Government transfer of income from some groups to others through taxes and social payments."],["iqt","Ijtimoiy himoya","Aholining zaif qatlamlarini qo'llab-quvvatlash bo'yicha davlat chora-tadbirlari tizimi.","Социальная защита","Система государственных мер поддержки уязвимых слоёв населения.","Social protection","Government programs that support vulnerable groups such as the poor, elderly and unemployed."],["iqt","Ko'rinmas qo'l","Shaxsiy manfaat ko'zlagan odamlarning harakati bozor orqali umumiy foydaga olib kelishi haqidagi Adam Smit g'oyasi.","Невидимая рука","Идея Адама Смита о том, что личный интерес людей через рынок служит общему благу.","Invisible hand","Adam Smith's idea that self-interested individuals unintentionally promote the good of society through markets."],["iqt","Laissez-faire","Davlatning iqtisodiyotga minimal aralashuvini yoqlovchi siyosat.","Laissez-faire (невмешательство)","Политика минимального вмешательства государства в экономику.","Laissez-faire","A policy of minimal government interference in the economy."],["iqt","Merkantilizm","Davlat boyligi oltin va savdo balansining ijobiy qoldig'iga bog'liq deb hisoblovchi iqtisodiy ta'limot.","Меркантилизм","Экономическое учение, считающее богатство государства зависимым от золота и положительного торгового баланса.","Mercantilism","An economic doctrine holding that national wealth depends on accumulating gold and running trade surpluses."],["iqt","Klassik iqtisodiy maktab","Adam Smit, Rikardo kabi olimlar asos solgan, erkin bozor va mehnat qiymatini ta'kidlovchi yo'nalish.","Классическая политэкономия","Направление, основанное Адамом Смитом и Рикардо, подчёркивающее свободный рынок и роль труда.","Classical economics","The school of Smith and Ricardo emphasizing free markets and self-regulating economies."],["iqt","Marksizm","Karl Marks asos solgan, kapitalizmni tanqid qilib, sinfiy kurash va ishlab chiqarish vositalariga jamoat mulkini yoqlovchi ta'limot.","Марксизм","Учение Карла Маркса, критикующее капитализм и выступающее за общественную собственность на средства производства.","Marxism","The theory of Karl Marx criticizing capitalism and advocating collective ownership of the means of production."],["iqt","Neoklassik iqtisodiy maktab","Chekli foydalilik va bozor muvozanatini tahlil qiluvchi XIX asr oxiridagi iqtisodiy yo'nalish.","Неоклассическая школа","Направление конца XIX века, анализирующее предельную полезность и рыночное равновесие.","Neoclassical economics","The school analyzing marginal utility, rational choice and market equilibrium."],["iqt","Keynscha iqtisodiyot","Iqtisodiy tanazzulda davlat xarajatlari orqali yalpi talabni rag'batlantirishni yoqlovchi ta'limot.","Кейнсианство","Учение, выступающее за стимулирование совокупного спроса государственными расходами во время спада.","Keynesian economics","The theory that government spending can raise aggregate demand and end recessions."],["iqt","Monetarizm","Iqtisodiyotni asosan pul massasini nazorat qilish orqali boshqarish mumkin deb hisoblovchi maktab.","Монетаризм","Школа, считающая, что экономикой можно управлять главным образом контролем над денежной массой.","Monetarism","The school holding that controlling the money supply is the main tool of macroeconomic stability."],["iqt","Institutsional iqtisodiyot","Iqtisodiy xulq-atvorni institutlar, qoidalar va an'analar ta'siri orqali tushuntiruvchi yo'nalish.","Институциональная экономика","Направление, объясняющее экономическое поведение влиянием институтов, правил и традиций.","Institutional economics","The approach explaining economic behavior through the role of institutions, rules and norms."],["iqt","Xulq-atvor iqtisodiyoti","Odamlarning iqtisodiy qarorlarida psixologik omillar rolini o'rganuvchi yo'nalish.","Поведенческая экономика","Направление, изучающее роль психологических факторов в экономических решениях людей.","Behavioral economics","The study of how psychological factors shape economic decisions."],["iqt","Ratsional tanlov","Odamlar o'z manfaatini maksimal darajada oshiradigan qaror qabul qiladi degan taxmin.","Рациональный выбор","Предположение, что люди принимают решения, максимизирующие их выгоду.","Rational choice","The assumption that people make decisions that maximize their own benefit."],["iqt","Iqtisodiy inson","Faqat shaxsiy manfaatini ko'zlab, ratsional harakat qiluvchi shaxs modeli.","Человек экономический","Модель человека, действующего рационально и исключительно в личных интересах.","Homo economicus","A model of a rational person who acts solely in self-interest."],["iqt","Pareto samaradorligi","Birovning ahvolini yomonlashtirmay turib, boshqasiniki yaxshilab bo'lmaydigan resurs taqsimoti holati.","Парето-эффективность","Состояние распределения ресурсов, при котором нельзя улучшить положение одного, не ухудшив положение другого.","Pareto efficiency","An allocation in which no one can be made better off without making someone else worse off."],["iqt","Iqtisodiy ko'rsatkichlar","Iqtisodiyot holatini miqdoriy tavsiflovchi YaIM, inflyatsiya, ishsizlik kabi statistik o'lchovlar.","Экономические показатели","Статистические измерители состояния экономики: ВВП, инфляция, безработица и другие.","Economic indicators","Statistics such as GDP, inflation and unemployment that describe the state of the economy."],["iqt","Yalpi talab","Mamlakatdagi barcha iste'molchilar, firmalar, davlat va chet el tomonidan tovar va xizmatlarga umumiy talab.","Совокупный спрос","Общий спрос на товары и услуги со стороны домохозяйств, фирм, государства и заграницы.","Aggregate demand","The total demand for goods and services in an economy at a given price level."],["iqt","Yalpi taklif","Iqtisodiyotdagi barcha ishlab chiqaruvchilar taklif qiladigan tovar va xizmatlarning umumiy hajmi.","Совокупное предложение","Общий объём товаров и услуг, предлагаемых всеми производителями в экономике.","Aggregate supply","The total output of goods and services that firms are willing to produce at a given price level."],["iqt","Mulkdorlik shakllari","Mulkning xususiy, davlat, jamoaviy va aralash kabi turlari.","Формы собственности","Виды собственности: частная, государственная, коллективная и смешанная.","Forms of ownership","The types of ownership such as private, state, collective and mixed."],["iqt","Texnologik ishsizlik","Mashina va avtomatlashtirish ishchilarni siqib chiqarishi natijasidagi ishsizlik.","Технологическая безработица","Безработица, вызванная вытеснением работников машинами и автоматизацией.","Technological unemployment","Job losses caused by machines and automation replacing human labor."],["iqt","Ixtisoslashgan hududlar (klasterlar)","Bir sohadagi o'zaro bog'liq korxonalar jamlangan, hamkorlikda raqobatbardosh bo'lgan hudud.","Кластер","Территориальное объединение взаимосвязанных предприятий одной отрасли, повышающее конкурентоспособность.","Cluster","A geographic concentration of related firms in one industry that gain advantages from proximity."],["iqt","Tashqi qarz","Mamlakat rezidentlarining nerezidentlar oldidagi qarz majburiyatlari yig'indisi.","Внешний долг","Совокупные долговые обязательства резидентов страны перед нерезидентами.","External debt","The total debt a country's residents owe to foreign creditors."],["iqt","To'lov balansi","Mamlakatning boshqa davlatlar bilan ma'lum davrdagi barcha iqtisodiy bitimlarini aks ettiruvchi hisobot.","Платёжный баланс","Отчёт обо всех экономических операциях страны с остальным миром за период.","Balance of payments","A record of all economic transactions between a country and the rest of the world over a period."],["iqt","Muqobil xarajat","Resursni muqobil maqsadda ishlatganda yo'qotiladigan eng yaxshi imkoniyat qiymati.","Упущенная выгода","Доход, которым жертвуют, используя ресурс не по лучшему альтернативному назначению.","Forgone benefit","The benefit lost by using a resource for one purpose instead of its best alternative."],["mak","Yalpi milliy mahsulot (YaMM)","Mamlakat rezidentlari ishlab chiqargan yakuniy tovar va xizmatlar qiymati, ular qayerda faoliyat yuritishidan qat'i nazar.","Валовой национальный продукт (ВНП)","Стоимость конечных товаров и услуг, произведённых резидентами страны, независимо от того, где они работают.","Gross National Product (GNP)","The value of final goods and services produced by a country's residents, regardless of where production takes place."],["mak","YaIM deflyatori","Nominal YaIMning real YaIMga nisbatiga teng bo'lgan, iqtisodiyotdagi umumiy narxlar darajasini o'lchaydigan indeks.","Дефлятор ВВП","Индекс общего уровня цен в экономике, равный отношению номинального ВВП к реальному.","GDP deflator","A price index equal to the ratio of nominal GDP to real GDP, measuring the economy-wide price level."],["mak","Xarid qobiliyati pariteti (XQP)","Turli mamlakatlarda narxlar farqini hisobga olib, valyutalarning haqiqiy xarid qobiliyatini taqqoslash usuli.","Паритет покупательной способности (ППС)","Метод сравнения валют с учётом различий в ценах, отражающий их реальную покупательную способность.","Purchasing power parity (PPP)","A method of comparing currencies that adjusts for price differences so a basket of goods costs the same across countries."],["mak","Yakuniy mahsulot","Oxirgi iste'molchi tomonidan sotib olinadigan va keyingi ishlab chiqarishda ishlatilmaydigan tovar yoki xizmat.","Конечный продукт","Товар или услуга, приобретаемые конечным потребителем и не используемые для дальнейшего производства.","Final good","A good or service bought by the end user rather than used as an input in further production."],["mak","Oraliq mahsulot","Boshqa tovarni ishlab chiqarish uchun xom ashyo yoki yarim tayyor mahsulot sifatida ishlatiladigan tovar.","Промежуточный продукт","Товар, используемый как сырьё или полуфабрикат для производства другого товара.","Intermediate good","A good used as an input in the production of other goods, and not counted separately in GDP."],["mak","Qo'shilgan qiymat","Korxona ishlab chiqarish jarayonida yaratgan, sotuv hajmi bilan oraliq xarajatlar o'rtasidagi farq.","Добавленная стоимость","Стоимость, созданная предприятием в процессе производства, равная выручке за вычетом промежуточных затрат.","Value added","The value a firm creates in production, equal to its output revenue minus the cost of intermediate inputs."],["mak","Sof ichki mahsulot","Yalpi ichki mahsulotdan asosiy kapitalning iste'moli, ya'ni amortizatsiya chiqarib tashlangan qiymati.","Чистый внутренний продукт","ВВП за вычетом потребления основного капитала, то есть амортизации.","Net Domestic Product (NDP)","GDP minus depreciation of capital, showing output after accounting for wear and tear of capital goods."],["mak","Shaxsiy daromad","Uy xo'jaliklari barcha manbalardan olgan, soliqlar to'lanmasdan oldingi jami daromadi.","Личный доход","Совокупный доход домохозяйств из всех источников до уплаты налогов.","Personal income","The total income households receive from all sources before paying personal taxes."],["mak","Ixtiyoriy daromad","Soliqlar to'langandan keyin uy xo'jaligi iste'mol qilish yoki jamg'arish uchun erkin tasarruf etadigan daromad.","Располагаемый доход","Доход домохозяйств после уплаты налогов, который можно потратить или сберечь.","Disposable income","Income remaining after taxes that households can spend or save."],["mak","Ishlab chiqaruvchilar narxlari indeksi","Ishlab chiqaruvchilar sotadigan tovarlar ulgurji narxlarining o'rtacha o'zgarishini ko'rsatuvchi indeks.","Индекс цен производителей","Индекс, показывающий среднее изменение цен, по которым производители продают свою продукцию.","Producer Price Index (PPI)","An index tracking the average change in selling prices received by domestic producers for their output."],["mak","Iste'mol savati","Iste'molchining o'rtacha ehtiyojlarini aks ettiruvchi, INI hisoblash uchun belgilangan tovar va xizmatlar to'plami.","Потребительская корзина","Набор товаров и услуг, отражающий типичные потребности населения и используемый для расчёта ИПЦ.","Consumer basket","A fixed set of goods and services representing typical household purchases, used to compute the CPI."],["mak","Inflyatsiya darajasi","Narxlar umumiy darajasining ma'lum davr, odatda bir yil davomidagi foizdagi o'zgarishi.","Уровень инфляции","Процентное изменение общего уровня цен за определённый период, обычно за год.","Inflation rate","The percentage change in the general price level over a period, usually a year."],["mak","Talab inflyatsiyasi","Yalpi talabning yalpi taklifdan tez o'sishi natijasida yuzaga keladigan narxlar o'sishi.","Инфляция спроса","Рост цен, вызванный превышением совокупного спроса над совокупным предложением.","Demand-pull inflation","Price increases caused by aggregate demand growing faster than the economy's ability to supply goods."],["mak","Xarajatlar inflyatsiyasi","Ishlab chiqarish xarajatlari, masalan ish haqi yoki xom ashyo narxi oshishi sababli yuzaga keladigan inflyatsiya.","Инфляция издержек","Рост цен, вызванный увеличением издержек производства, например зарплат или цен на сырьё.","Cost-push inflation","Inflation caused by rising production costs such as wages or raw materials, which firms pass on in prices."],["mak","Kutilayotgan inflyatsiya","Iqtisodiy agentlar kelajakda narxlar qanchalik o'sishini taxmin qilishi, bu ish haqi va narxlarga ta'sir qiladi.","Инфляционные ожидания","Представления экономических агентов о будущем росте цен, влияющие на зарплаты и ценообразование.","Inflation expectations","Beliefs of households and firms about future inflation, which influence wage and price setting."],["mak","Giperinflyatsiya","Narxlar nnihoyatda tez, odatda oyiga 50 foizdan ortiq o'sib, pul qadrsizlanishi holati.","Гиперинфляция","Чрезвычайно быстрый рост цен, обычно более 50 процентов в месяц, при котором деньги стремительно обесцениваются.","Hyperinflation","Extremely rapid price growth, typically above 50 percent per month, that quickly destroys the value of money."],["mak","Ochiq inflyatsiya","Narxlarning erkin bozorda rasman qayd etiladigan haqiqiy o'sishi.","Открытая инфляция","Рост цен, который проявляется в реальном повышении цен на свободном рынке и фиксируется статистикой.","Open inflation","Inflation that appears openly as rising prices and is recorded in official price statistics."],["mak","Yashirin inflyatsiya","Narxlar nazorat qilinganda rasman o'smay, tovar taqchilligi va navbatlar ko'rinishida namoyon bo'ladigan inflyatsiya.","Скрытая инфляция","Инфляция при регулируемых ценах, проявляющаяся в дефиците товаров и очередях, а не в росте цен.","Repressed inflation","Inflation hidden by price controls, showing up as shortages and queues instead of higher prices."],["mak","Bazaviy inflyatsiya","Oziq-ovqat va energiya kabi o'zgaruvchan narxlarsiz hisoblangan, asosiy narx tendensiyasini ko'rsatuvchi inflyatsiya.","Базовая инфляция","Инфляция без учёта волатильных цен, таких как продовольствие и энергия, отражающая основную ценовую тенденцию.","Core inflation","Inflation excluding volatile items such as food and energy, revealing the underlying price trend."],["mak","Inflyatsiya maqsadi","Markaziy bank narxlar barqarorligi uchun belgilab, erishishga intiladigan inflyatsiyaning rasmiy darajasi.","Инфляционное таргетирование","Режим денежно-кредитной политики, при котором центральный банк стремится удерживать инфляцию вблизи объявленной цели.","Inflation targeting","A monetary policy strategy in which the central bank commits to keeping inflation near a publicly announced target."],["mak","Dezinflyatsiya","Inflyatsiya sur'atining sekinlashishi, ya'ni narxlar hali o'sadi, lekin avvalgidan sekinroq.","Дезинфляция","Замедление темпов инфляции, при котором цены продолжают расти, но медленнее, чем раньше.","Disinflation","A slowdown in the rate of inflation, where prices still rise but more slowly than before."],["mak","Bandlik darajasi","Ish bilan band aholining mehnatga layoqatli aholi umumiy soniga nisbati.","Уровень занятости","Доля занятых в общей численности населения трудоспособного возраста.","Employment rate","The share of the working-age population that is currently employed."],["mak","Strukturaviy ishsizlik","Ishchilar malakasi bilan bo'sh ish o'rinlari talablari o'rtasidagi nomuvofiqlik tufayli yuzaga keladigan ishsizlik.","Структурная безработица","Безработица, вызванная несоответствием между квалификацией работников и требованиями вакантных мест.","Structural unemployment","Unemployment caused by a mismatch between workers' skills or location and the requirements of available jobs."],["mak","Siklik ishsizlik","Iqtisodiy tushkunlik davrida talab kamayishi sababli ish o'rinlari qisqarishidan kelib chiqadigan ishsizlik.","Циклическая безработица","Безработица, возникающая из-за падения совокупного спроса и сокращения рабочих мест во время спада.","Cyclical unemployment","Unemployment caused by weak aggregate demand during economic downturns."],["mak","Mavsumiy ishsizlik","Qishloq xo'jaligi yoki turizm kabi sohalarda yil fasllariga bog'liq ish o'rinlari o'zgarishidan kelib chiqadigan ishsizlik.","Сезонная безработица","Безработица, связанная с сезонными колебаниями занятости в сельском хозяйстве, туризме и других отраслях.","Seasonal unemployment","Unemployment resulting from predictable seasonal changes in labor demand, such as in farming or tourism."],["mak","Tabiiy ishsizlik darajasi","Iqtisodiyot to'liq quvvat bilan ishlaganda saqlanadigan, friksion va strukturaviy ishsizlikdan iborat daraja.","Естественный уровень безработицы","Уровень безработицы при полной занятости, включающий фрикционную и структурную безработицу.","Natural rate of unemployment","The unemployment rate that persists when the economy is at full employment, comprising frictional and structural unemployment."],["mak","To'liq bandlik","Siklik ishsizlik mavjud bo'lmaydigan, faqat tabiiy ishsizlik saqlanib qoladigan iqtisodiy holat.","Полная занятость","Состояние экономики, при котором отсутствует циклическая безработица и остаётся лишь естественная.","Full employment","An economic state with no cyclical unemployment, where only the natural rate of unemployment remains."],["mak","Yashirin ishsizlik","Rasman band hisoblansa-da, haqiqatda mehnati kam foydalaniladigan yoki samarasiz ishlayotgan ishchilar holati.","Скрытая безработица","Ситуация, когда работники формально заняты, но фактически используются неполно или неэффективно.","Hidden unemployment","A situation where people are formally employed or not counted but are underused or have stopped looking for work."],["mak","Ishsizlik nafaqasi","Ishini yo'qotgan shaxslarga davlat tomonidan vaqtincha to'lanadigan pul yordami.","Пособие по безработице","Временная денежная выплата государства лицам, потерявшим работу.","Unemployment benefit","A temporary payment made by the state to people who have lost their jobs."],["mak","Okun qonuni","Real YaIM potensialdan chetga chiqishi bilan ishsizlik darajasining tabiiy darajadan chetga chiqishi o'rtasidagi teskari bog'liqlik.","Закон Оукена","Эмпирическая обратная зависимость между отклонением безработицы от естественного уровня и отклонением реального ВВП от потенциала.","Okun's law","The empirical inverse relationship between deviations of unemployment from its natural rate and deviations of real GDP from potential."],["mak","Fillips egri chizig'i","Inflyatsiya va ishsizlik darajasi o'rtasidagi, qisqa muddatda teskari bo'lgan bog'liqlikni ifodalovchi egri chiziq.","Кривая Филлипса","График, отражающий обратную краткосрочную зависимость между инфляцией и безработицей.","Phillips curve","A curve showing the short-run inverse relationship between inflation and unemployment."],["mak","Iqtisodiy yuksalish","Iqtisodiy sikl fazasi bo'lib, bunda ishlab chiqarish, bandlik va daromadlar o'sadi.","Экономический подъём","Фаза цикла, в которой растут производство, занятость и доходы.","Expansion","A phase of the business cycle in which output, employment and incomes are rising."],["mak","Cho'qqi","Iqtisodiy sikldagi eng yuqori nuqta bo'lib, shundan so'ng iqtisodiy faollik pasaya boshlaydi.","Пик цикла","Высшая точка экономического цикла, после которой экономическая активность начинает снижаться.","Peak","The highest point of the business cycle, after which economic activity begins to decline."],["mak","Tanazzul (retsessiya)","Real YaIM ketma-ket kamida ikki chorak davomida pasayishi bilan tavsiflanadigan iqtisodiy faollik pasayishi davri.","Рецессия","Период спада экономической активности, обычно определяемый как снижение реального ВВП два квартала подряд.","Recession","A period of declining economic activity, commonly defined as two consecutive quarters of falling real GDP."],["mak","Depressiya","Uzoq davom etadigan va chuqur iqtisodiy tushkunlik bo'lib, ishlab chiqarish keskin kamayadi, ishsizlik juda oshadi.","Депрессия","Длительный и глубокий экономический спад с резким падением производства и очень высокой безработицей.","Depression","A prolonged and severe downturn marked by a deep fall in output and very high unemployment."],["mak","Tubsizlik (dno)","Iqtisodiy sikldagi eng past nuqta bo'lib, undan keyin tiklanish boshlanadi.","Дно цикла","Нижняя точка экономического цикла, после которой начинается восстановление.","Trough","The lowest point of the business cycle, after which recovery begins."],["mak","Tiklanish","Tanazzuldan keyin iqtisodiy faollik yana o'sa boshlaydigan sikl fazasi.","Восстановление","Фаза цикла, в которой экономическая активность вновь растёт после спада.","Recovery","The phase of the cycle in which economic activity rises again after a recession."],["mak","Iqtisodiy inqiroz","Moliya, ishlab chiqarish yoki savdoda keskin va chuqur buzilishlar bilan kechadigan iqtisodiy holat.","Экономический кризис","Резкое и глубокое нарушение в производстве, финансах или торговле, сопровождающееся падением экономической активности.","Economic crisis","A sharp and deep disruption in production, finance or trade accompanied by a fall in economic activity."],["mak","Yalpi talab va yalpi taklif modeli","Narxlar umumiy darajasi va real ishlab chiqarish hajmi muvozanatini yalpi talab va taklif kesishuvidan aniqlovchi model.","Модель совокупного спроса и предложения","Модель, определяющая равновесный уровень цен и реальный выпуск в точке пересечения совокупного спроса и предложения.","AD-AS model","A model that determines the equilibrium price level and real output where aggregate demand meets aggregate supply."],["mak","Makroiqtisodiy muvozanat","Yalpi talab yalpi taklifga teng bo'lib, narxlar darajasi va ishlab chiqarish hajmi barqaror bo'ladigan holat.","Макроэкономическое равновесие","Состояние, при котором совокупный спрос равен совокупному предложению, а цены и выпуск стабильны.","Macroeconomic equilibrium","A state where aggregate demand equals aggregate supply, leaving the price level and output stable."],["mak","Potensial ishlab chiqarish","Barcha resurslardan to'liq va samarali foydalanilganda inflyatsiyani tezlashtirmasdan erishish mumkin bo'lgan YaIM hajmi.","Потенциальный выпуск","Максимальный объём ВВП, достижимый при полном использовании ресурсов без ускорения инфляции.","Potential output","The maximum level of GDP an economy can sustain with full use of resources without accelerating inflation."],["mak","Ishlab chiqarish uzilishi","Real YaIM bilan potensial YaIM o'rtasidagi farq bo'lib, iqtisodiyot quvvatidan qanchalik foydalanilmayotganini ko'rsatadi.","Разрыв выпуска","Разница между фактическим реальным ВВП и потенциальным ВВП, показывающая недоиспользование или перегрев экономики.","Output gap","The difference between actual real GDP and potential GDP, showing slack or overheating in the economy."],["mak","Multiplikator","Avtonom xarajatlar bir birlikka o'zgarganda yalpi daromadning necha marta ko'proq o'zgarishini ko'rsatuvchi koeffitsiyent.","Мультипликатор","Коэффициент, показывающий, во сколько раз изменение автономных расходов изменяет совокупный доход.","Multiplier","A coefficient showing how much total income changes for each unit change in autonomous spending."],["mak","Xarajatlar multiplikatori","Iste'mol qilishga chekli moyillikka bog'liq bo'lgan, 1 / (1 - MPC) formulasi bilan topiladigan multiplikator.","Мультипликатор расходов","Мультипликатор, равный 1 / (1 - MPC), зависящий от предельной склонности к потреблению.","Spending multiplier","The multiplier equal to 1 / (1 - MPC), reflecting how much spending is re-spent through the economy."],["mak","Iste'mol funksiyasi","Uy xo'jaliklarining iste'mol xarajatlari ularning ixtiyoridagi daromadga qanday bog'liqligini ifodalovchi funksiya.","Функция потребления","Функция, выражающая зависимость потребительских расходов домохозяйств от располагаемого дохода.","Consumption function","A function expressing how household consumption spending depends on disposable income."],["mak","Jamg'arma funksiyasi","Uy xo'jaliklarining jamg'armalari ularning ixtiyoridagi daromadga qanday bog'liqligini ko'rsatuvchi funksiya.","Функция сбережений","Функция, показывающая зависимость сбережений домохозяйств от располагаемого дохода.","Saving function","A function showing how household saving depends on disposable income."],["mak","Investitsiya funksiyasi","Investitsiya xarajatlarining foiz stavkasi va kutilayotgan foydaga bog'liqligini ifodalovchi funksiya.","Функция инвестиций","Функция, выражающая зависимость инвестиционных расходов от процентной ставки и ожидаемой прибыли.","Investment function","A function expressing how investment spending depends on the interest rate and expected profitability."],["mak","Iste'molga chekli moyillik","Daromad bir birlikka oshganda iste'mol xarajatlarining qo'shimcha o'sish ulushi.","Предельная склонность к потреблению","Доля дополнительного дохода, которая направляется на потребление.","Marginal propensity to consume (MPC)","The fraction of each additional unit of income that is spent on consumption."],["mak","Jamg'arishga chekli moyillik","Daromad bir birlikka oshganda jamg'armaga yo'naltiriladigan qo'shimcha daromad ulushi.","Предельная склонность к сбережению","Доля дополнительного дохода, которая направляется на сбережения.","Marginal propensity to save (MPS)","The fraction of each additional unit of income that is saved rather than spent."],["mak","Iste'molga o'rtacha moyillik","Iste'mol xarajatlarining ixtiyoridagi daromadga nisbati.","Средняя склонность к потреблению","Отношение потребительских расходов к располагаемому доходу.","Average propensity to consume (APC)","The ratio of total consumption spending to disposable income."],["mak","Avtonom iste'mol","Daromad nolga teng bo'lganda ham amalga oshiriladigan, daromadga bog'liq bo'lmagan iste'mol xarajatlari.","Автономное потребление","Потребительские расходы, не зависящие от текущего дохода и осуществляемые даже при нулевом доходе.","Autonomous consumption","Consumption spending that occurs even at zero income and does not depend on current income."],["mak","Yalpi kapital shakllanishi","Asosiy kapitalga qilingan investitsiyalar va tovar-moddiy zaxiralar o'zgarishining yig'indisi.","Валовое накопление капитала","Сумма инвестиций в основной капитал и изменения запасов материальных оборотных средств.","Gross capital formation","Total investment in fixed capital plus changes in inventories within an economy."],["mak","Jamlama xarajatlar","Iste'mol, investitsiya, davlat xaridlari va sof eksportdan iborat, xarajatlar bo'yicha YaIM hisoblash usuli.","Метод расчёта ВВП по расходам","Способ расчёта ВВП как суммы потребления, инвестиций, государственных закупок и чистого экспорта.","Expenditure approach","A way of measuring GDP as the sum of consumption, investment, government purchases and net exports."],["mak","Davlat xaridlari","Davlatning tovar va xizmatlarni sotib olishga qiladigan xarajatlari, transfertlar bundan mustasno.","Государственные закупки","Расходы государства на покупку товаров и услуг, не включающие трансфертные платежи.","Government purchases","Government spending on goods and services, excluding transfer payments."],["mak","Transfert to'lovlari","Davlat tomonidan tovar va xizmat evaziga emas, nafaqa va yordam sifatida to'lanadigan pul mablag'lari.","Трансфертные платежи","Выплаты государства в виде пособий и помощи, не связанные с получением товаров или услуг.","Transfer payments","Government payments such as pensions and benefits made without receiving goods or services in return."],["mak","Sof eksport","Mamlakat eksporti qiymati bilan importi qiymati o'rtasidagi farq.","Чистый экспорт","Разница между стоимостью экспорта и импорта страны.","Net exports","The value of a country's exports minus the value of its imports."],["mak","Fiskal siyosat","Davlatning iqtisodiyotni tartibga solish maqsadida davlat xarajatlari va soliqlarni o'zgartirishi.","Фискальная политика","Использование государством расходов и налогов для регулирования экономики.","Fiscal policy","The government's use of spending and taxation to influence the economy."],["mak","Monetar siyosat","Markaziy bankning pul massasi va foiz stavkalarini boshqarish orqali iqtisodiyotga ta'sir ko'rsatishi.","Денежно-кредитная политика","Деятельность центрального банка по управлению денежной массой и процентными ставками для воздействия на экономику.","Monetary policy","The central bank's management of the money supply and interest rates to influence the economy."],["mak","Kengaytiruvchi siyosat","Iqtisodiy faollikni rag'batlantirish uchun xarajatlarni oshirish, soliqlarni kamaytirish yoki foiz stavkasini pasaytirishdan iborat siyosat.","Стимулирующая политика","Политика роста расходов, снижения налогов или процентных ставок для стимулирования экономики.","Expansionary policy","Policy that raises spending, cuts taxes or lowers interest rates to stimulate economic activity."],["mak","Cheklovchi siyosat","Inflyatsiyani jilovlash uchun xarajatlarni qisqartirish, soliqlarni oshirish yoki foiz stavkasini ko'tarishdan iborat siyosat.","Сдерживающая политика","Политика сокращения расходов, повышения налогов или процентных ставок для снижения инфляции.","Contractionary policy","Policy that cuts spending, raises taxes or increases interest rates to slow inflation."],["mak","Asosiy stavka","Markaziy bank tijorat banklariga kredit berish va pul-kredit siyosatini yuritishda belgilaydigan asosiy foiz stavkasi.","Ключевая ставка","Основная процентная ставка центрального банка, определяющая стоимость денег в экономике.","Key policy rate","The central bank's main interest rate, which sets the cost of money across the economy."],["mak","Majburiy zaxira normasi","Tijorat banklari depozitlarining markaziy bankda saqlashi shart bo'lgan ulushi.","Норма обязательных резервов","Доля депозитов, которую коммерческие банки обязаны хранить в центральном банке.","Reserve requirement","The share of deposits that commercial banks must hold as reserves at the central bank."],["mak","Ochiq bozor operatsiyalari","Markaziy bankning pul massasini boshqarish maqsadida davlat qimmatli qog'ozlarini sotib olishi yoki sotishi.","Операции на открытом рынке","Покупка или продажа центральным банком государственных ценных бумаг для регулирования денежной массы.","Open market operations","The central bank's buying or selling of government securities to adjust the money supply."],["mak","Miqdoriy yumshatish","Markaziy bank iqtisodiyotni rag'batlantirish uchun yirik hajmda aktivlarni sotib olib, pul massasini oshirishi.","Количественное смягчение","Крупномасштабная покупка центральным банком активов для увеличения денежной массы и стимулирования экономики.","Quantitative easing","Large-scale asset purchases by a central bank to expand the money supply and stimulate the economy."],["mak","So'nggi instansiya kreditori","Moliyaviy inqiroz paytida likvidlik yetishmagan banklarga oxirgi chora sifatida qarz beruvchi markaziy bank vazifasi.","Кредитор последней инстанции","Функция центрального банка по предоставлению ликвидности банкам в кризис, когда другие источники недоступны.","Lender of last resort","The central bank's role of providing emergency liquidity to banks when no other source of funds is available."],["mak","Pul agregatlari (M0, M1, M2, M3)","Pul massasining likvidlik darajasi bo'yicha guruhlari, M0 naqd pul, kengroq agregatlar esa depozitlarni qamrab oladi.","Денежные агрегаты (M0, M1, M2, M3)","Группы денежной массы по степени ликвидности: М0 — наличные, более широкие агрегаты включают депозиты.","Monetary aggregates (M0, M1, M2, M3)","Categories of money supply by liquidity, from M0 cash up to broader measures that include deposits."],["mak","Naqd pul massasi (M0)","Aholi qo'lida va banklar kassalarida mavjud bo'lgan naqd pullarning umumiy miqdori.","Наличные деньги (M0)","Общий объём наличных денег в обращении вне банковской системы и в кассах.","Currency in circulation (M0)","The total amount of physical cash held by the public and in circulation."],["mak","Pul bazasi","Muomaladagi naqd pul va tijorat banklarining markaziy bankdagi zaxiralaridan iborat, markaziy bank nazorat qiladigan pul.","Денежная база","Наличные деньги в обращении и резервы коммерческих банков в центральном банке, контролируемые центральным банком.","Monetary base","Currency in circulation plus bank reserves held at the central bank, directly controlled by the central bank."],["mak","Pul multiplikatori","Pul bazasining bir birlikka o'zgarishi pul massasini necha marta o'zgartirishini ko'rsatadigan koeffitsiyent.","Денежный мультипликатор","Коэффициент, показывающий, во сколько раз изменение денежной базы изменяет денежную массу.","Money multiplier","The ratio showing how many times a change in the monetary base changes the total money supply."],["mak","Pul miqdori nazariyasi","Pul massasi o'sishi uzoq muddatda narxlar umumiy darajasi o'sishiga olib keladi, degan nazariya.","Количественная теория денег","Теория, согласно которой в долгосрочном периоде рост денежной массы ведёт к пропорциональному росту уровня цен.","Quantity theory of money","The theory that, in the long run, growth in the money supply leads to proportional growth in the price level."],["mak","Fisher tenglamasi","Pul massasi, uning aylanish tezligi, narxlar darajasi va real ishlab chiqarish orasidagi MV = PY bog'liqlikni ifodalaydi.","Уравнение Фишера","Уравнение MV = PY, связывающее денежную массу, скорость обращения денег, уровень цен и реальный выпуск.","Equation of exchange","The identity MV = PY linking money supply, velocity of money, the price level and real output."],["mak","Pulning aylanish tezligi","Pul birligi ma'lum davrda tovar va xizmatlarni sotib olish uchun o'rtacha necha marta qo'ldan-qo'lga o'tishi.","Скорость обращения денег","Среднее число раз, которое денежная единица переходит из рук в руки при оплате товаров и услуг за период.","Velocity of money","The average number of times a unit of money is spent on goods and services in a period."],["mak","Pulga talab","Aholi va korxonalarning operatsiyalar, ehtiyot va spekulyativ maqsadlarda pul shaklida mablag' saqlashga bo'lgan ehtiyoji.","Спрос на деньги","Потребность домохозяйств и фирм держать средства в денежной форме для сделок, предосторожности и спекуляции.","Money demand","The desire of households and firms to hold wealth in the form of money for transactions, precaution and speculation."],["mak","Nominal va real foiz stavkasi","Real stavka nominal stavkadan inflyatsiya darajasini ayirish bilan topilib, qarzning haqiqiy qiymatini ko'rsatadi.","Номинальная и реальная процентная ставка","Реальная ставка равна номинальной за вычетом инфляции и показывает фактическую стоимость заимствования.","Nominal vs real interest rate","The real rate equals the nominal rate minus inflation and shows the true cost of borrowing or return on saving."],["mak","Fisher effekti","Nominal foiz stavkasi real stavka va kutilayotgan inflyatsiya yig'indisiga teng bo'lishini bildiruvchi qoida.","Эффект Фишера","Положение, по которому номинальная процентная ставка равна сумме реальной ставки и ожидаемой инфляции.","Fisher effect","The principle that the nominal interest rate equals the real rate plus expected inflation."],["mak","Suzuvchi valyuta kursi","Valyuta kursi valyuta bozorida talab va taklif ta'sirida erkin shakllanadigan rejim.","Плавающий валютный курс","Режим, при котором курс валюты свободно формируется на рынке под влиянием спроса и предложения.","Floating exchange rate","A regime in which the currency's value is set freely in the market by supply and demand."],["mak","Qat'iy belgilangan valyuta kursi","Valyuta kursi markaziy bank tomonidan ma'lum darajada belgilanib, shu daraja ushlab turiladigan rejim.","Фиксированный валютный курс","Режим, при котором центральный банк устанавливает курс валюты и поддерживает его на заданном уровне.","Fixed exchange rate","A regime in which the central bank pegs the currency to another currency or asset at a set rate."],["mak","Boshqariladigan suzuvchi kurs","Kurs asosan bozorda shakllanadi, ammo markaziy bank vaqti-vaqti bilan valyuta interventsiyasi orqali ta'sir ko'rsatadi.","Управляемый плавающий курс","Режим, при котором курс формируется рынком, но центральный банк периодически вмешивается для его сглаживания.","Managed float","A regime where the exchange rate is mostly market-determined but the central bank intervenes occasionally."],["mak","Valyuta interventsiyasi","Markaziy bankning valyuta kursiga ta'sir qilish uchun chet el valyutasini sotib olishi yoki sotishi.","Валютная интервенция","Покупка или продажа центральным банком иностранной валюты для воздействия на курс национальной валюты.","Foreign exchange intervention","A central bank's buying or selling of foreign currency to influence its exchange rate."],["mak","Devalvatsiya","Qat'iy belgilangan rejimda milliy valyuta kursining rasmiy ravishda pasaytirilishi.","Девальвация","Официальное снижение курса национальной валюты при фиксированном валютном режиме.","Devaluation","An official lowering of a currency's value under a fixed or pegged exchange rate system."],["mak","Revalvatsiya","Qat'iy belgilangan rejimda milliy valyuta kursining rasmiy ravishda oshirilishi.","Ревальвация","Официальное повышение курса национальной валюты при фиксированном валютном режиме.","Revaluation","An official raising of a currency's value under a fixed or pegged exchange rate system."],["mak","Valyuta qadrsizlanishi","Suzuvchi kurs sharoitida milliy valyutaning boshqa valyutalarga nisbatan bozor ta'sirida arzonlashishi.","Обесценение валюты","Снижение стоимости национальной валюты относительно других валют под влиянием рыночных сил.","Currency depreciation","A fall in a currency's value relative to other currencies due to market forces under a floating regime."],["mak","Valyuta mustahkamlanishi","Suzuvchi kurs sharoitida milliy valyutaning boshqa valyutalarga nisbatan bozor ta'sirida qimmatlashishi.","Укрепление валюты","Рост стоимости национальной валюты относительно других валют под влиянием рыночных сил.","Currency appreciation","A rise in a currency's value relative to other currencies due to market forces under a floating regime."],["mak","Real valyuta kursi","Nominal kursning mamlakatlar o'rtasidagi narxlar farqiga tuzatilgan ko'rinishi bo'lib, raqobatbardoshlikni ko'rsatadi.","Реальный валютный курс","Номинальный курс, скорректированный на разницу цен между странами, отражающий ценовую конкурентоспособность.","Real exchange rate","The nominal exchange rate adjusted for price differences between countries, indicating competitiveness."],["mak","Valyuta zaxiralari","Markaziy bank saqlaydigan chet el valyutasi, oltin va boshqa xalqaro to'lov vositalari zaxirasi.","Международные резервы","Запасы иностранной валюты, золота и других международных платёжных средств, хранимые центральным банком.","Foreign exchange reserves","Foreign currency, gold and other international assets held by a central bank."],["mak","Konvertatsiya","Milliy valyutani chet el valyutasiga yoki aksincha erkin almashtirish imkoniyati.","Конвертируемость валюты","Возможность свободно обменивать национальную валюту на иностранную и наоборот.","Currency convertibility","The ability to freely exchange a national currency for foreign currencies."],["mak","Dollarlashtirish","Mamlakat ichida chet el valyutasi, asosan AQSh dollaridan jamg'arma va to'lov vositasi sifatida keng foydalanilishi.","Долларизация","Широкое использование иностранной валюты, чаще доллара США, внутри страны для сбережений и расчётов.","Dollarization","The widespread use of a foreign currency, typically the US dollar, for savings and payments inside a country."],["mak","Joriy operatsiyalar hisobi","To'lov balansining tovar, xizmat, birlamchi va ikkilamchi daromadlar bo'yicha operatsiyalarni qamrab oluvchi qismi.","Счёт текущих операций","Раздел платёжного баланса, охватывающий торговлю товарами и услугами, первичные и вторичные доходы.","Current account","The part of the balance of payments covering trade in goods and services, primary income and transfers."],["mak","Kapital va moliyaviy hisob","To'lov balansining kapital transfertlari, to'g'ridan-to'g'ri va portfel investitsiyalari kabi moliyaviy oqimlarni aks ettiruvchi qismi.","Счёт операций с капиталом и финансовый счёт","Раздел платёжного баланса, отражающий капитальные трансферты и финансовые потоки, включая прямые и портфельные инвестиции.","Capital and financial account","The part of the balance of payments recording capital transfers and financial flows such as direct and portfolio investment."],["mak","Savdo taqchilligi","Import qiymati eksport qiymatidan ortiq bo'lgan holat.","Торговый дефицит","Ситуация, когда стоимость импорта превышает стоимость экспорта.","Trade deficit","A situation in which the value of imports exceeds the value of exports."],["mak","Savdo profitsiti","Eksport qiymati import qiymatidan ortiq bo'lgan holat.","Торговый профицит","Ситуация, когда стоимость экспорта превышает стоимость импорта.","Trade surplus","A situation in which the value of exports exceeds the value of imports."],["mak","Savdo shartlari","Mamlakat eksport narxlari indeksining import narxlari indeksiga nisbati.","Условия торговли","Отношение индекса экспортных цен страны к индексу импортных цен.","Terms of trade","The ratio of a country's export price index to its import price index."],["mak","To'g'ridan-to'g'ri xorijiy investitsiyalar","Chet ellik investorning boshqa mamlakatdagi korxonani boshqarish huquqini beradigan kapital qo'yilmasi.","Прямые иностранные инвестиции","Вложения иностранного инвестора в предприятие другой страны, дающие ему право контроля над ним.","Foreign direct investment (FDI)","Investment by a foreign investor in a business abroad that gives lasting control or significant influence."],["mak","Portfel investitsiyalari","Chet el aktsiyalari va obligatsiyalariga boshqaruv huquqisiz, daromad olish maqsadida qilinadigan investitsiyalar.","Портфельные инвестиции","Вложения в иностранные акции и облигации ради дохода без получения контроля над компанией.","Portfolio investment","Investment in foreign stocks and bonds made for returns without gaining control of the company."],["mak","Pul o'tkazmalari (remitensiya)","Chet elda ishlayotgan mehnat muhojirlarining o'z vatanidagi oilasiga yuboradigan pul mablag'lari.","Денежные переводы мигрантов","Средства, которые трудовые мигранты, работающие за рубежом, отправляют семьям на родину.","Remittances","Money sent home by migrant workers employed abroad to their families."],["mak","Moliyaviy sanksiyalar","Davlat yoki xalqaro tashkilotlar tomonidan boshqa mamlakatga nisbatan joriy etiladigan savdo, moliya yoki investitsiya cheklovlari.","Санкции","Ограничения в торговле, финансах или инвестициях, вводимые государствами или организациями против другой страны.","Sanctions","Trade, financial or investment restrictions imposed by governments or organizations on another country."],["mak","Proteksionizm","Mahalliy ishlab chiqaruvchilarni chet el raqobatidan bojxona to'lovlari va kvotalar bilan himoya qilish siyosati.","Протекционизм","Политика защиты национальных производителей от иностранной конкуренции с помощью пошлин и квот.","Protectionism","A policy of shielding domestic producers from foreign competition through tariffs, quotas and other barriers."],["mak","Bojxona boji","Import yoki eksport qilinadigan tovarlarga davlat tomonidan solinadigan soliq.","Таможенная пошлина","Налог, взимаемый государством с ввозимых или вывозимых товаров.","Tariff","A tax imposed by a government on imported or exported goods."],["mak","Erkin savdo","Mamlakatlar o'rtasida tovar va xizmatlar almashinuvi bojxona va boshqa to'siqlarsiz amalga oshiriladigan savdo tizimi.","Свободная торговля","Система торговли между странами без таможенных пошлин и других существенных барьеров.","Free trade","A trade system in which goods and services move between countries without tariffs or other major barriers."],["mak","Byudjet profitsiti","Davlat daromadlari xarajatlaridan ortiq bo'lgan holat.","Бюджетный профицит","Ситуация, когда доходы государства превышают его расходы.","Budget surplus","A situation in which government revenue exceeds government spending in a period."],["mak","Strukturaviy byudjet taqchilligi","Iqtisodiyot potensial darajada ishlaganda ham saqlanib qoladigan, sikl ta'siridan tozalangan byudjet taqchilligi.","Структурный дефицит бюджета","Дефицит бюджета, который сохранился бы при потенциальном уровне выпуска, очищенный от влияния цикла.","Structural budget deficit","The deficit that would exist if the economy were at potential output, excluding cyclical effects."],["mak","Davlat qarzi va YaIM nisbati","Davlat qarzining yalpi ichki mahsulotga nisbati, qarz yukining og'irligini baholash ko'rsatkichi.","Отношение государственного долга к ВВП","Показатель долговой нагрузки, равный отношению государственного долга к ВВП страны.","Debt-to-GDP ratio","Government debt divided by GDP, used to assess how heavy the debt burden is."],["mak","Davlat obligatsiyalari","Davlat byudjet taqchilligini qoplash uchun chiqaradigan, belgilangan muddatda qaytariladigan qarz qimmatli qog'ozlari.","Государственные облигации","Долговые ценные бумаги, выпускаемые государством для финансирования дефицита бюджета с погашением в установленный срок.","Government bonds","Debt securities issued by a government to finance its deficit, repaid at a set maturity date."],["mak","Siqib chiqarish effekti","Davlatning qarz olishi foiz stavkasini oshirib, xususiy investitsiyalarni kamaytirishi holati.","Эффект вытеснения","Ситуация, когда государственные заимствования повышают процентные ставки и сокращают частные инвестиции.","Crowding out","A situation in which government borrowing raises interest rates and reduces private investment."],["mak","Soliqlar","Davlat tomonidan jismoniy va yuridik shaxslardan majburiy ravishda undiriladigan to'lovlar.","Налоги","Обязательные платежи, взимаемые государством с физических и юридических лиц.","Taxes","Compulsory payments levied by the government on individuals and businesses."],["mak","Progressiv soliq","Daromad oshgan sari soliq stavkasi ham yuqori bo'ladigan soliq tizimi.","Прогрессивный налог","Налоговая система, в которой ставка растёт по мере роста дохода.","Progressive tax","A tax whose rate rises as the taxpayer's income increases."],["mak","Qo'shilgan qiymat solig'i (QQS)","Ishlab chiqarish va sotish bosqichlarida yaratilgan qo'shilgan qiymatga solinadigan bilvosita soliq.","Налог на добавленную стоимость (НДС)","Косвенный налог, взимаемый с добавленной стоимости на каждом этапе производства и продажи.","Value added tax (VAT)","An indirect tax charged on the value added at each stage of production and sale."],["mak","Avtomatik stabilizatorlar","Qo'shimcha qaror talab qilmay, sikl davomida iqtisodiyot tebranishlarini yumshatuvchi soliq va nafaqa tizimi.","Автоматические стабилизаторы","Элементы налоговой и пособийной системы, которые без дополнительных решений смягчают колебания экономики.","Automatic stabilizers","Tax and benefit features that cushion economic fluctuations automatically without new policy decisions."],["mak","Ricardo ekvivalentligi","Davlat qarzi o'sishi kelajakda soliqlar oshishini kutgan aholini ko'proq jamg'arishga undab, ta'sirni neytrallashtiradi, degan g'oya.","Рикардианская эквивалентность","Идея, что рост госдолга побуждает население больше сберегать в ожидании будущих налогов, нейтрализуя эффект.","Ricardian equivalence","The idea that households save more when government borrows, expecting higher future taxes, offsetting the stimulus."],["mak","IS-LM modeli","Tovar bozori (IS) va pul bozori (LM) bir vaqtda muvozanatda bo'ladigan foiz stavkasi va daromadni aniqlovchi model.","Модель IS-LM","Модель, определяющая ставку процента и доход, при которых одновременно уравновешены товарный (IS) и денежный (LM) рынки.","IS-LM model","A model finding the interest rate and income at which the goods market (IS) and money market (LM) are in equilibrium."],["mak","Keyns iqtisodiy nazariyasi","Iqtisodiyotda yalpi talab yetishmasligi sababli uzoq tanazzul bo'lishi mumkin va davlat aralashuvi zarur, degan yondashuv.","Кейнсианская теория","Подход, по которому недостаток совокупного спроса может вызывать длительный спад, и требуется вмешательство государства.","Keynesian economics","An approach holding that weak aggregate demand can cause prolonged slumps and that government intervention is needed."],["mak","Solou modeli","Jamg'arma, aholi o'sishi va texnologiya orqali uzoq muddatli iqtisodiy o'sishni tushuntiruvchi neoklassik model.","Модель Солоу","Неоклассическая модель, объясняющая долгосрочный экономический рост через сбережения, рост населения и технологии.","Solow growth model","A neoclassical model explaining long-run growth through saving, population growth and technological progress."],["mak","Ishlab chiqarish funksiyasi","Ishlab chiqarish omillari miqdori bilan ishlab chiqarilgan mahsulot hajmi o'rtasidagi bog'liqlikni ifodalovchi funksiya.","Производственная функция","Функция, выражающая зависимость объёма выпуска от количества используемых факторов производства.","Production function","A function relating the quantity of output to the quantities of inputs used in production."],["mak","Mehnat unumdorligi","Bir ishchi yoki bir ish soatiga to'g'ri keladigan ishlab chiqarilgan mahsulot hajmi.","Производительность труда","Объём продукции, приходящийся на одного работника или один отработанный час.","Labor productivity","The amount of output produced per worker or per hour worked."],["mak","Umumiy omillar unumdorligi","Mehnat va kapital hajmi o'sishi bilan tushuntirib bo'lmaydigan, texnologiya va samaradorlik ta'siridagi o'sish qismi.","Совокупная факторная производительность","Часть роста выпуска, не объясняемая ростом труда и капитала и связанная с технологиями и эффективностью.","Total factor productivity","The portion of output growth not explained by labor and capital, reflecting technology and efficiency."],["mak","Inson kapitali","Insonning ta'lim, malaka, tajriba va sog'lig'i orqali egallagan, mehnat unumdorligini oshiruvchi bilim va ko'nikmalari.","Человеческий капитал","Знания, навыки, здоровье и опыт работников, повышающие их производительность.","Human capital","The knowledge, skills, health and experience of workers that raise their productivity."],["mak","Tashqi savdo multiplikatori","Eksport o'zgarishi milliy daromadga multiplikator orqali ta'sir ko'rsatishini bildiradigan, import moyilligini hisobga oluvchi koeffitsiyent.","Мультипликатор внешней торговли","Коэффициент, показывающий влияние изменения экспорта на национальный доход с учётом склонности к импорту.","Foreign trade multiplier","A coefficient showing how a change in exports affects national income, taking the propensity to import into account."],["mak","Iqtisodiy sikl ko'rsatkichlari","Iqtisodiyot holatini baholash va kelgusi o'zgarishlarni oldindan aytish uchun foydalaniladigan statistik ko'rsatkichlar.","Экономические индикаторы цикла","Статистические показатели, используемые для оценки состояния экономики и прогнозирования её изменений.","Economic indicators","Statistics used to assess the current state of the economy and forecast turning points in the business cycle."],["mak","Yetakchi ko'rsatkichlar","Iqtisodiy sikl o'zgarishlaridan oldin o'zgarib, kelgusi tendensiyani oldindan ko'rsatadigan indikatorlar.","Опережающие индикаторы","Показатели, которые меняются раньше экономического цикла и предвосхищают будущие тенденции.","Leading indicators","Indicators that change before the economy does and help predict the future direction of the cycle."],["mak","Kechikuvchi ko'rsatkichlar","Iqtisodiy sikl o'zgarganidan keyin o'zgaradigan va tendensiyani tasdiqlaydigan indikatorlar.","Запаздывающие индикаторы","Показатели, которые меняются после изменения экономического цикла и подтверждают тенденцию.","Lagging indicators","Indicators that change after the economy has changed, confirming a trend already under way."],["mak","Sanoat ishlab chiqarishi indeksi","Sanoat tarmoqlari ishlab chiqarish hajmining baza davrga nisbatan o'zgarishini o'lchaydigan ko'rsatkich.","Индекс промышленного производства","Показатель изменения объёма выпуска промышленности по сравнению с базовым периодом.","Industrial production index","A measure of changes in the output of the industrial sector relative to a base period."],["mak","Xarid menejerlari indeksi (PMI)","Korxona rahbarlari so'rovi asosida iqtisodiy faollik kengayayotganini yoki qisqarayotganini ko'rsatuvchi indeks.","Индекс деловой активности (PMI)","Индекс по опросам менеджеров, показывающий расширение или сокращение деловой активности.","Purchasing Managers' Index (PMI)","A survey-based index showing whether business activity is expanding or contracting."],["mak","Iste'molchilar ishonchi indeksi","Aholining iqtisodiyot va shaxsiy moliyaviy ahvol haqidagi kayfiyatini o'lchaydigan indeks.","Индекс потребительской уверенности","Индекс, измеряющий настроения населения относительно экономики и собственного финансового положения.","Consumer confidence index","An index measuring how optimistic households are about the economy and their own finances."],["mak","Iqtisodiy shok","Iqtisodiyotga kutilmaganda ta'sir etib, ishlab chiqarish yoki narxlarni keskin o'zgartiradigan hodisa.","Экономический шок","Неожиданное событие, резко изменяющее выпуск или цены в экономике.","Economic shock","An unexpected event that suddenly changes output or prices in the economy."],["mak","Taklif shoki","Ishlab chiqarish xarajatlari yoki imkoniyatlarining kutilmagan o'zgarishi bo'lib, yalpi taklif egri chizig'ini siljitadi.","Шок предложения","Неожиданное изменение издержек или возможностей производства, сдвигающее кривую совокупного предложения.","Supply shock","An unexpected change in production costs or capacity that shifts the aggregate supply curve."],["mak","Talab shoki","Iste'mol, investitsiya yoki eksportdagi kutilmagan o'zgarish bo'lib, yalpi talab egri chizig'ini siljitadi.","Шок спроса","Неожиданное изменение потребления, инвестиций или экспорта, сдвигающее кривую совокупного спроса.","Demand shock","An unexpected change in consumption, investment or exports that shifts the aggregate demand curve."],["mak","Narxlarning qattiqligi","Narxlar va ish haqi talab o'zgarishiga tez moslashmay, qisqa muddatda barqaror turib qolishi holati.","Жёсткость цен","Свойство цен и зарплат медленно реагировать на изменения спроса и оставаться неизменными в краткосрочном периоде.","Price stickiness","The tendency of prices and wages to adjust slowly to changes in demand, especially in the short run."],["mak","Ratsional kutishlar","Iqtisodiy agentlar kelajak haqida mavjud barcha axborotdan oqilona foydalanib, taxmin shakllantirishi haqidagi nazariya.","Рациональные ожидания","Теория, согласно которой агенты формируют прогнозы, эффективно используя всю доступную информацию.","Rational expectations","The theory that people form forecasts using all available information efficiently, so errors are random."],["mak","Likvidlik tuzog'i","Foiz stavkalari nolga yaqin bo'lganda pul massasini oshirish talab va xarajatlarni rag'batlantira olmaydigan holat.","Ловушка ликвидности","Ситуация, когда при процентных ставках около нуля увеличение денежной массы не стимулирует спрос и расходы.","Liquidity trap","A situation in which interest rates near zero make added money supply ineffective at stimulating spending."],["mak","Daromadlar taqsimoti","Milliy daromadning aholi guruhlari o'rtasida qanday taqsimlanishi.","Распределение доходов","То, как национальный доход распределяется между различными группами населения.","Income distribution","How a nation's total income is divided among households or population groups."],["mak","Qashshoqlik chegarasi","Insonning asosiy ehtiyojlarini qondirishi uchun zarur eng kam daromad darajasi.","Черта бедности","Минимальный уровень дохода, необходимый для удовлетворения основных потребностей человека.","Poverty line","The minimum income level considered necessary to meet a person's basic needs."],["mak","Norasmiy iqtisodiyot","Davlat hisobi va soliq nazoratidan tashqarida amalga oshiriladigan iqtisodiy faoliyat.","Теневая экономика","Экономическая деятельность, не учитываемая государством и не облагаемая налогами.","Informal economy","Economic activity that takes place outside official records, regulation and taxation."],["mak","Xalqaro Valyuta Jamg'armasi (XVJ)","Xalqaro moliyaviy barqarorlikni qo'llab-quvvatlaydigan va to'lov balansi muammolari bo'lgan mamlakatlarga kredit beradigan tashkilot.","Международный валютный фонд (МВФ)","Организация, поддерживающая международную финансовую стабильность и кредитующая страны с проблемами платёжного баланса.","International Monetary Fund (IMF)","An international organization that promotes global financial stability and lends to countries facing balance of payments problems."],["mak","Jahon banki","Rivojlanayotgan mamlakatlarda qashshoqlikni kamaytirish va rivojlanish loyihalarini moliyalashtiruvchi xalqaro moliya instituti.","Всемирный банк","Международный финансовый институт, финансирующий проекты развития и борьбу с бедностью в развивающихся странах.","World Bank","An international financial institution that funds development projects and poverty reduction in developing countries."],["mik","Bozor muvozanati","Talab va taklif miqdori tenglashadigan va narx o'zgarmay turadigan bozor holati.","Рыночное равновесие","Состояние рынка, при котором объём спроса равен объёму предложения и цена стабильна.","Market equilibrium","A market state in which quantity demanded equals quantity supplied and the price has no tendency to change."],["mik","Muvozanat miqdori","Muvozanat narxida sotib olinadigan va sotiladigan mahsulot miqdori.","Равновесное количество","Количество товара, покупаемое и продаваемое по равновесной цене.","Equilibrium quantity","The quantity of a good bought and sold at the equilibrium price."],["mik","Talab qonuni","Boshqa sharoitlar teng bo'lganda, narx oshsa talab qilingan miqdor kamayadi, narx tushsa ortadi.","Закон спроса","При прочих равных условиях рост цены снижает величину спроса, а снижение цены увеличивает её.","Law of demand","Other things equal, a higher price reduces the quantity demanded and a lower price increases it."],["mik","Taklif qonuni","Boshqa sharoitlar teng bo'lganda, narx oshsa taklif qilingan miqdor ortadi.","Закон предложения","При прочих равных условиях рост цены увеличивает величину предложения.","Law of supply","Other things equal, a higher price increases the quantity supplied."],["mik","Talab egri chizig'i","Narx bilan talab qilingan miqdor o'rtasidagi bog'liqlikni ko'rsatuvchi grafik.","Кривая спроса","График, показывающий связь между ценой товара и величиной спроса на него.","Demand curve","A graph showing the relationship between a good's price and the quantity demanded."],["mik","Taklif egri chizig'i","Narx bilan taklif qilingan miqdor o'rtasidagi bog'liqlikni ko'rsatuvchi grafik.","Кривая предложения","График, показывающий связь между ценой товара и величиной предложения.","Supply curve","A graph showing the relationship between a good's price and the quantity supplied."],["mik","Talab qilingan miqdor","Berilgan narxda iste'molchilar sotib olishni istagan mahsulot miqdori.","Величина спроса","Количество товара, которое потребители хотят купить по данной цене.","Quantity demanded","The amount of a good consumers want to buy at a particular price."],["mik","Taklif qilingan miqdor","Berilgan narxda ishlab chiqaruvchilar sotishni istagan mahsulot miqdori.","Величина предложения","Количество товара, которое производители хотят продать по данной цене.","Quantity supplied","The amount of a good producers want to sell at a particular price."],["mik","Talabning narxdan tashqari omillari","Narxdan boshqa, talabni o'zgartiru
