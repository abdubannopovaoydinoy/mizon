ршить сделку только по указанной цене или лучше.","Limit order","An instruction to buy or sell only at a specified price or better."],["inv","Stop-loss","Narx belgilangan darajaga tushganda pozitsiyani avtomatik yopib, zararni cheklaydigan topshiriq.","Стоп-лосс","Приказ автоматически закрыть позицию при падении цены до заданного уровня, чтобы ограничить убыток.","Stop-loss order","An order that automatically closes a position when the price hits a set level to limit losses."],["inv","Yetakchi kompaniya aksiyasi (blue chip)","Barqaror daromadli, yirik va obro'li kompaniyaning ishonchli aksiyasi.","Голубые фишки","Акции крупных, надёжных компаний с устойчивой прибылью и хорошей репутацией.","Blue-chip stock","A share of a large, well-established and financially sound company."],["inv","O'sish aksiyasi","Foydasi bozor o'rtachasidan tez o'sishi kutilib, odatda dividend bermaydigan kompaniya aksiyasi.","Акция роста","Акция компании, прибыль которой ожидаемо растёт быстрее рынка, обычно с низкими дивидендами.","Growth stock","A share of a company expected to grow faster than the market, often paying little or no dividend."],["inv","Qiymat aksiyasi","Haqiqiy qiymatidan arzon narxda sotilayotgan deb hisoblangan kompaniya aksiyasi.","Акция стоимости","Акция, которая, по мнению инвесторов, торгуется ниже своей реальной стоимости.","Value stock","A share that appears to trade below its intrinsic value."],["inv","Dividend daromadliligi","Yillik dividendning aksiya joriy narxiga nisbati.","Дивидендная доходность","Отношение годового дивиденда к текущей цене акции.","Dividend yield","Annual dividend per share divided by the current share price."],["inv","Dividend to'lash koeffitsiyenti","Sof foydaning dividend sifatida to'lanadigan ulushi.","Коэффициент выплаты дивидендов","Доля чистой прибыли, выплачиваемая акционерам в виде дивидендов.","Payout ratio","The share of net income paid out to shareholders as dividends."],["inv","Aksiyalarni bo'lish (split)","Aksiyalar sonini ko'paytirib, har birining narxini mutanosib kamaytirish.","Сплит акций","Увеличение числа акций с пропорциональным снижением цены каждой при неизменной капитализации.","Stock split","Increasing the number of shares while proportionally lowering each share's price, leaving total value unchanged."],["inv","Aksiyalarni qayta sotib olish","Kompaniyaning o'z aksiyalarini bozordan qaytarib sotib olishi.","Обратный выкуп акций","Покупка компанией собственных акций на рынке.","Share buyback","A company's purchase of its own shares from the market."],["inv","Qimmatli qog'ozlar","Mulkiy yoki qarz huquqini tasdiqlovchi hujjatlar, masalan aksiya va obligatsiyalar.","Ценные бумаги","Документы, удостоверяющие имущественные или долговые права, например акции и облигации.","Securities","Financial instruments such as stocks and bonds that represent ownership or debt claims."],["inv","Markaziy depozitariy","Qimmatli qog'ozlar egaligini hisobga oladigan va saqlaydigan tashkilot.","Центральный депозитарий","Организация, ведущая учёт и хранение прав собственности на ценные бумаги.","Central depository","An institution that records and safeguards ownership of securities."],["inv","Kastodian","Mijozlarning qimmatli qog'ozlarini saqlaydigan va hisobini yurituvchi moliyaviy tashkilot.","Кастодиан","Финансовая организация, хранящая ценные бумаги клиентов и ведущая их учёт.","Custodian","A financial institution that holds and safeguards clients' securities."],["inv","Andrayter","Qimmatli qog'ozlar chiqarilishini tashkil etib, ularni joylashtirish xatarini zimmasiga oladigan tashkilot.","Андеррайтер","Организация, обеспечивающая выпуск ценных бумаг и принимающая на себя риск их размещения.","Underwriter","An institution that manages a securities issue and takes on the risk of selling it."],["inv","Prospekt","Emitent va qimmatli qog'ozlar chiqarilishi haqida ma'lumot beruvchi rasmiy hujjat.","Проспект эмиссии","Официальный документ с информацией об эмитенте и условиях выпуска ценных бумаг.","Prospectus","An official document describing the issuer and terms of a securities offering."],["inv","Portfelni qayta balanslash","Portfel ulushlarini dastlabki maqsadli nisbatga qaytarish.","Ребалансировка портфеля","Возвращение долей активов в портфеле к первоначальным целевым пропорциям.","Rebalancing","Adjusting a portfolio back to its target asset proportions."],["inv","Sharp koeffitsiyenti","Portfelning bir birlik riskka to'g'ri keladigan qo'shimcha daromadini o'lchaydi.","Коэффициент Шарпа","Показатель избыточной доходности портфеля на единицу принимаемого риска.","Sharpe ratio","A measure of a portfolio's excess return per unit of risk taken."],["inv","Alfa","Portfelning bozor daromadidan ortiqcha qo'shimcha daromadi.","Альфа","Дополнительная доходность портфеля сверх доходности, объяснимой рыночным риском.","Alpha","The return of an investment above what its market risk would predict."],["inv","Sof joriy qiymat (NPV)","Kelajakdagi pul oqimlarining diskontlangan qiymati bilan boshlang'ich xarajat o'rtasidagi farq.","Чистая приведённая стоимость (NPV)","Разница между дисконтированными будущими денежными потоками и первоначальными затратами.","Net present value (NPV)","The difference between the discounted value of future cash flows and the initial cost."],["inv","Ichki daromad normasi (IRR)","Loyiha sof joriy qiymatini nolga tenglashtiradigan diskont stavkasi.","Внутренняя норма доходности (IRR)","Ставка дисконтирования, при которой чистая приведённая стоимость проекта равна нулю.","Internal rate of return (IRR)","The discount rate at which a project's net present value equals zero."],["inv","G'aznachilik veksellari","Davlat tomonidan chiqariladigan qisqa muddatli, diskont bilan sotiladigan qarz qimmatli qog'ozlari.","Казначейские векселя","Краткосрочные государственные долговые бумаги, продаваемые с дисконтом.","Treasury bills","Short-term government debt securities sold at a discount and repaid at face value."],["inv","Xedj-fond","Murakkab strategiyalar va leveridjdan foydalanadigan, malakali investorlar uchun yopiq fond.","Хедж-фонд","Закрытый фонд для квалифицированных инвесторов, применяющий сложные стратегии и кредитное плечо.","Hedge fund","A private fund for qualified investors using complex strategies and leverage to seek high returns."],["inv","Indeks fondi","Muayyan indeks tarkibini takrorlaydigan va past xarajatli paychi fond.","Индексный фонд","Недорогой фонд, который повторяет состав выбранного рыночного индекса.","Index fund","A low-cost fund designed to replicate the composition of a market index."],["inv","Suveren boylik fondi","Davlat daromadlari, masalan resurs eksportidan tushgan mablag'larni investitsiya qiladigan davlat fondi.","Суверенный фонд благосостояния","Государственный фонд, инвестирующий доходы страны, например от экспорта ресурсов.","Sovereign wealth fund","A state-owned investment fund that invests national revenues such as resource export income."],["inv","Leveridj (moliyaviy yuk)","Investitsiya hajmini oshirish uchun qarz mablag'laridan foydalanish.","Финансовый рычаг (леверидж)","Использование заёмных средств для увеличения объёма инвестиций и потенциальной доходности.","Leverage","Using borrowed money to increase the size of an investment and its potential return."],["inv","Marja talabi (margin call)","Broker garov yetishmasa, mijozdan hisobni qo'shimcha mablag' bilan to'ldirishni talab qilishi.","Маржин-колл","Требование брокера пополнить счёт, когда обеспечения для позиции становится недостаточно.","Margin call","A broker's demand that an investor add funds when account collateral falls too low."],["inv","Bozor pufagi","Aktiv narxining uning haqiqiy qiymatidan keskin oshib ketishi, keyin esa qulashi.","Рыночный пузырь","Ситуация, когда цена актива резко превышает его реальную стоимость, после чего обычно рушится.","Market bubble","A situation where asset prices rise far above fundamental value and later collapse."],["inv","Bozor qulashi","Qimmatli qog'ozlar narxining qisqa vaqtda keskin tushib ketishi.","Обвал рынка","Резкое падение цен на ценные бумаги за короткий период.","Market crash","A sudden and steep drop in securities prices over a short time."],["inv","Insayder savdo","Ommaga oshkor etilmagan muhim axborotdan foydalanib qimmatli qog'ozlar bilan bitim qilish.","Инсайдерская торговля","Сделки с ценными бумагами на основе существенной непубличной информации.","Insider trading","Trading securities using material information that is not yet public."],["inv","Benchmark (taqqoslash ko'rsatkichi)","Portfel natijalarini baholash uchun taqqoslanadigan standart, odatda indeks.","Бенчмарк","Эталонный показатель, обычно индекс, с которым сравнивают результаты портфеля.","Benchmark","A standard, usually an index, against which portfolio performance is compared."],["inv","Savdo hajmi","Muayyan davrda sotilgan qimmatli qog'ozlar soni yoki umumiy qiymati.","Объём торгов","Количество или общая стоимость ценных бумаг, проданных за определённый период.","Trading volume","The number or total value of securities traded during a given period."],["inv","Narx trendi","Aktiv narxining muayyan davrda barqaror yo'nalishda harakatlanishi.","Ценовой тренд","Устойчивое направление движения цены актива за определённый период.","Price trend","The sustained direction of an asset's price movement over time."],["inv","Qo'llab-quvvatlash va qarshilik darajalari","Texnik tahlilda narx odatda to'xtab yoki orqaga qaytadigan pastki va yuqori darajalar.","Уровни поддержки и сопротивления","Ценовые уровни в техническом анализе, у которых рост или падение часто останавливается.","Support and resistance levels","Price levels in technical analysis where falling or rising prices often stall or reverse."],["inv","Harakatlanuvchi o'rtacha","Narxning ma'lum davr uchun o'rtacha qiymati, trendni yumshatib ko'rsatadi.","Скользящая средняя","Средняя цена за выбранный период, сглаживающая колебания и показывающая тренд.","Moving average","The average price over a chosen period, smoothing fluctuations to reveal the trend."],["inv","Oltin (qimmatbaho metall)","Qadimdan qiymat saqlash va inflyatsiyadan himoyalanish vositasi hisoblangan metall.","Золото (драгоценный металл)","Металл, издавна считающийся средством сохранения стоимости и защиты от инфляции.","Gold (precious metal)","A metal traditionally used to store value and protect against inflation."],["inv","Bitkoin","2009-yilda yaratilgan, blokcheynda ishlaydigan birinchi va eng mashhur kriptovalyuta.","Биткоин","Первая и самая известная криптовалюта, созданная в 2009 году и работающая на блокчейне.","Bitcoin","The first and best-known cryptocurrency, launched in 2009 and run on a blockchain."],["inv","Stablkoin","Qiymati dollar kabi barqaror aktivga bog'langan kriptovalyuta.","Стейблкоин","Криптовалюта, стоимость которой привязана к стабильному активу, например к доллару.","Stablecoin","A cryptocurrency whose value is pegged to a stable asset such as the US dollar."],["inv","Smart-kontrakt","Shartlar bajarilganda blokcheynda avtomatik ijro etiladigan dastur kodi.","Смарт-контракт","Программный код в блокчейне, автоматически исполняющийся при выполнении заданных условий.","Smart contract","Code on a blockchain that automatically executes when predefined conditions are met."],["inv","Mayning (kripto qazib olish)","Hisoblash quvvati yordamida blokcheyn tranzaksiyalarini tasdiqlab, yangi tangalar olish jarayoni.","Майнинг","Процесс подтверждения блокчейн-транзакций с помощью вычислительной мощности и получения новых монет.","Crypto mining","The process of validating blockchain transactions with computing power and earning new coins as a reward."],["inv","Token","Blokcheynda chiqarilgan va qiymat yoki huquqni ifodalovchi raqamli birlik.","Токен","Цифровая единица в блокчейне, представляющая стоимость или право.","Token","A digital unit issued on a blockchain that represents value or a right."],["inv","Kriptobirja","Kriptovalyutalarni sotib olish, sotish va almashtirish uchun onlayn platforma.","Криптобиржа","Онлайн-платформа для покупки, продажи и обмена криптовалют.","Crypto exchange","An online platform for buying, selling and exchanging cryptocurrencies."],["inv","REIT (ko'chmas mulk investitsiya trasti)","Daromad keltiruvchi ko'chmas mulkka egalik qiluvchi va aksiyalari birjada sotiladigan kompaniya.","REIT (фонд недвижимости)","Компания, владеющая доходной недвижимостью, акции которой торгуются на бирже.","REIT (real estate investment trust)","A company that owns income-producing property and whose shares trade on an exchange."],["inv","Biznes-anjel","Boshlang'ich bosqichdagi startapga o'z mablag'ini kapital ulushi evaziga kiritadigan shaxsiy investor.","Бизнес-ангел","Частный инвестор, вкладывающий личные средства в стартап на раннем этапе в обмен на долю.","Angel investor","A private individual who invests personal funds in an early-stage startup in exchange for equity."],["inv","Yunikorn","Qiymati 1 milliard dollardan oshgan, birjada ro'yxatdan o'tmagan startap.","Единорог","Нелистингуемый стартап, оценённый более чем в 1 миллиард долларов.","Unicorn","A privately held startup valued at over one billion US dollars."],["inv","Qo'shilish va qo'shib olish (M&A)","Kompaniyalarning birlashishi yoki bir kompaniyaning boshqasini sotib olishi.","Слияния и поглощения (M&A)","Объединение компаний или приобретение одной компании другой.","Mergers and acquisitions (M&A)","Transactions in which companies combine or one company buys another."],["inv","Konvertatsiyalanadigan obligatsiya","Egasi muddatdan oldin uni belgilangan miqdordagi aksiyalarga almashtirishi mumkin bo'lgan obligatsiya.","Конвертируемая облигация","Облигация, которую владелец может обменять на заранее определённое число акций.","Convertible bond","A bond that the holder may exchange for a set number of shares."],["inv","Kuponsiz obligatsiya","Foiz to'lamaydigan, nominaldan arzon narxda sotilib, muddatda to'liq to'lanadigan obligatsiya.","Бескупонная облигация","Облигация без процентных выплат, продаваемая со скидкой и погашаемая по номиналу.","Zero-coupon bond","A bond that pays no interest, sold at a discount and redeemed at face value."],["inv","Yevroobligatsiya","Emitent mamlakati valyutasidan boshqa valyutada xalqaro bozorda chiqariladigan obligatsiya.","Еврооблигация","Облигация, выпускаемая на международном рынке в валюте, отличной от валюты страны эмитента.","Eurobond","A bond issued internationally in a currency other than that of the issuer's home country."],["inv","Depozitar rasidlar","Xorijiy kompaniya aksiyalarini mahalliy bozorda ifodalovchi savdo qilinadigan sertifikat.","Депозитарные расписки","Обращающиеся сертификаты, представляющие акции иностранной компании на местном рынке.","Depositary receipts","Tradable certificates representing shares of a foreign company on a local market."],["inv","Robo-maslahatchi","Investorga portfel tuzish va boshqarishda avtomatik algoritmlar yordamida xizmat ko'rsatadigan platforma.","Робо-советник","Платформа, которая с помощью алгоритмов автоматически формирует и ведёт портфель инвестора.","Robo-advisor","An online platform that builds and manages portfolios for investors using algorithms."],["inv","Muntazam teng summali xarid","Narxdan qat'i nazar, belgilangan davrlarda doimiy summaga aktiv sotib olish strategiyasi.","Усреднение стоимости (DCA)","Стратегия регулярной покупки актива на одну и ту же сумму независимо от цены.","Dollar-cost averaging","Investing a fixed amount at regular intervals regardless of the asset's price."],["inv","Passiv investitsiya","Bozorni yengishga urinmay, indeksni takrorlab uzoq muddatga ushlab turish strategiyasi.","Пассивное инвестирование","Стратегия долгосрочного удержания активов, повторяющих индекс, без попыток обыграть рынок.","Passive investing","A long-term strategy of tracking a market index rather than trying to beat it."],["inv","Faol investitsiya","Bozor daromadidan oshib ketish maqsadida aktivlarni tez-tez tanlab, sotib olish va sotish strategiyasi.","Активное инвестирование","Стратегия частого выбора и торговли активами с целью превзойти доходность рынка.","Active investing","A strategy of frequently selecting and trading assets in an attempt to outperform the market."],["inv","Erkin muomaladagi aksiyalar","Strategik egalarda emas, keng investorlar qo'lida bo'lib, erkin savdo qilinadigan aksiyalar ulushi.","Акции в свободном обращении","Доля акций, находящихся у широкого круга инвесторов и свободно торгуемых на рынке.","Free float","The portion of a company's shares available for trading by the public."],["inv","Balans qiymati","Kompaniya aktivlaridan majburiyatlarini ayirgandagi buxgalteriya hisobidagi sof qiymati.","Балансовая стоимость","Стоимость компании по бухгалтерскому учёту: активы за вычетом обязательств.","Book value","A company's accounting net worth: total assets minus liabilities."],["inv","P/B koeffitsiyenti","Aksiyaning bozor narxining uning balans qiymatiga nisbati.","Коэффициент P/B","Отношение рыночной цены акции к её балансовой стоимости.","Price-to-book (P/B) ratio","The ratio of a stock's market price to its book value per share."],["inv","Inflyatsiyaga indekslangan obligatsiya","Asosiy summasi yoki foizi narxlar o'sishiga qarab moslashtiriladigan obligatsiya.","Облигация, индексируемая на инфляцию","Облигация, номинал или проценты по которой корректируются с ростом цен.","Inflation-linked bond","A bond whose principal or interest adjusts with inflation."],["inv","Aksiyadorlik kapitali","Kompaniya egalari, ya'ni aksiyadorlar kiritgan va ularga tegishli mablag'lar.","Акционерный капитал","Средства, внесённые владельцами компании (акционерами) и принадлежащие им.","Equity","The ownership value in a company belonging to its shareholders."],["inv","Emitent","Qimmatli qog'ozlarni chiqaruvchi va ular bo'yicha majburiyat oluvchi tashkilot yoki davlat.","Эмитент","Организация или государство, выпускающее ценные бумаги и отвечающее по ним.","Issuer","An organization or government that issues securities and is liable for them."],["inv","Investor","Daromad olish maqsadida mablag'ini aktivlarga joylashtiruvchi shaxs yoki tashkilot.","Инвестор","Лицо или организация, вкладывающие средства в активы ради получения дохода.","Investor","A person or organization that puts money into assets to earn a return."],["inv","Spekulyatsiya","Narx o'zgarishidan qisqa muddatda foyda olish uchun yuqori xatar bilan qilinadigan savdo.","Спекуляция","Рискованная торговля активами ради получения краткосрочной прибыли от изменения цен.","Speculation","Risky short-term trading aimed at profiting from price changes."],["inv","Kapital o'sishi","Aktiv sotilganda uning sotib olish narxidan oshgan qismi.","Прирост капитала","Превышение цены продажи актива над ценой его покупки.","Capital gain","The profit realized when an asset is sold for more than its purchase price."],["inv","Investitsiya gorizonti","Investor mablag'ni qancha vaqt ushlab turishni rejalashtirgan davr.","Инвестиционный горизонт","Период, на который инвестор планирует вложить средства.","Investment horizon","The length of time an investor plans to hold an investment."],["inv","Baholash (valuatsiya)","Kompaniya yoki aktivning qiymatini turli usullar bilan aniqlash jarayoni.","Оценка стоимости","Процесс определения стоимости компании или актива различными методами.","Valuation","The process of estimating the worth of a company or asset."],["sol","To'g'ridan-to'g'ri soliq","Soliq to'lovchining daromadi yoki mol-mulkidan bevosita undiriladigan va uning zimmasida qoladigan soliq turi.","Прямой налог","Налог, взимаемый непосредственно с доходов или имущества налогоплательщика и несомый им самим.","Direct tax","A tax charged directly on a person's income or property and borne by the taxpayer who pays it."],["sol","Proporsional soliq","Daromad miqdoridan qat'i nazar, bir xil stavkada undiriladigan soliq.","Пропорциональный налог","Налог, взимаемый по единой ставке независимо от размера дохода.","Proportional tax","A tax charged at the same rate regardless of the size of income."],["sol","Regressiv soliq","Daromad oshgan sari soliq stavkasi kamayadigan, kam daromadlilarga nisbatan og'irroq soliq.","Регрессивный налог","Налог, ставка которого снижается с ростом дохода, поэтому он тяжелее для малообеспеченных.","Regressive tax","A tax whose rate falls as income rises, so it weighs more heavily on low earners."],["sol","Yagona stavka (flat tax)","Barcha daromad darajalari uchun bir xil foiz stavkasi qo'llaniladigan soliq tizimi.","Плоская шкала налога","Система, при которой для всех уровней дохода применяется одна и та же процентная ставка.","Flat tax","A tax system applying a single percentage rate to all levels of income."],["sol","Daromad solig'i","Jismoniy shaxslarning olgan daromadlaridan undiriladigan soliq.","Подоходный налог","Налог, взимаемый с доходов, полученных физическими лицами.","Income tax","A tax levied on the income earned by individuals."],["sol","Jismoniy shaxslardan olinadigan daromad solig'i","Ish haqi va boshqa daromadlardan fuqarolar to'laydigan asosiy soliq.","Налог на доходы физических лиц","Основной налог, который граждане уплачивают с заработной платы и иных доходов.","Personal income tax","The main tax citizens pay on wages and other income."],["sol","Bojxona bojlari","Davlat chegarasidan olib o'tiladigan tovarlarga undiriladigan to'lov.","Таможенная пошлина","Платёж, взимаемый с товаров, перемещаемых через государственную границу.","Customs duty","A charge imposed on goods moved across a national border."],["sol","Import bojxona boji","Mamlakatga olib kiriladigan tovarlarga solinadigan bojxona to'lovi.","Ввозная таможенная пошлина","Таможенный платёж, взимаемый с товаров, ввозимых в страну.","Import duty","A customs charge levied on goods brought into a country."],["sol","Eksport bojxona boji","Mamlakatdan olib chiqiladigan tovarlarga solinadigan bojxona to'lovi.","Вывозная таможенная пошлина","Таможенный платёж, взимаемый с товаров, вывозимых из страны.","Export duty","A customs charge levied on goods taken out of a country."],["sol","Mol-mulk solig'i","Jismoniy va yuridik shaxslarning binolar kabi mol-mulkiga solinadigan soliq.","Налог на имущество","Налог, взимаемый с имущества физических и юридических лиц, например зданий и сооружений.","Property tax","A tax charged on the property owned by individuals and businesses, such as buildings."],["sol","Yer solig'i","Yer uchastkalaridan foydalanuvchilar yoki egalari to'laydigan soliq.","Земельный налог","Налог, который уплачивают владельцы и пользователи земельных участков.","Land tax","A tax paid by owners or users of land plots."],["sol","Suv resurslaridan foydalanganlik uchun soliq","Suvdan foydalanish hajmiga qarab to'lanadigan resurs solig'i.","Налог за пользование водными ресурсами","Ресурсный налог, уплачиваемый в зависимости от объёма использованной воды.","Water usage tax","A resource tax paid according to the volume of water used."],["sol","Yer osti boyliklaridan foydalanganlik solig'i","Foydali qazilmalarni qazib olganlik uchun to'lanadigan resurs solig'i.","Налог на недропользование","Ресурсный налог за добычу полезных ископаемых.","Subsoil use tax","A resource tax paid for extracting minerals."],["sol","Soliq bazasi","Soliq stavkasi qo'llaniladigan qiymat, jismoniy yoki boshqa ko'rsatkichdagi ifoda.","Налоговая база","Стоимостная, физическая или иная характеристика объекта, к которой применяется налоговая ставка.","Tax base","The value or quantity of an object to which the tax rate is applied."],["sol","Soliq ob'ekti","Soliq to'lash majburiyatini keltirib chiqaradigan daromad, mol-mulk yoki operatsiya.","Объект налогообложения","Доход, имущество или операция, с которых возникает обязанность уплатить налог.","Taxable object","The income, property or transaction that gives rise to a duty to pay tax."],["sol","Soliq to'lovchi","Qonunga ko'ra soliq to'lash majburiyati yuklatilgan jismoniy yoki yuridik shaxs.","Налогоплательщик","Физическое или юридическое лицо, на которое законом возложена обязанность уплачивать налог.","Taxpayer","An individual or legal entity legally obliged to pay tax."],["sol","Soliq stavkasi","Soliq bazasining birligiga to'g'ri keladigan soliq miqdori yoki foizi.","Налоговая ставка","Размер налога на единицу налоговой базы, чаще всего в процентах.","Tax rate","The amount or percentage of tax charged per unit of the tax base."],["sol","Chegaraviy soliq stavkasi","Qo'shimcha daromad birligiga to'lanadigan soliq ulushi.","Предельная налоговая ставка","Доля налога, уплачиваемая с каждой дополнительной единицы дохода.","Marginal tax rate","The share of tax paid on each additional unit of income."],["sol","Samarali soliq stavkasi","To'langan soliqning jami daromadga nisbatan o'rtacha foizi.","Эффективная налоговая ставка","Отношение суммы уплаченного налога ко всему доходу, выраженное в процентах.","Effective tax rate","The total tax paid expressed as a percentage of total income."],["sol","Soliq imtiyozlari","Ayrim to'lovchilarga soliqni kamaytirish yoki to'lashdan ozod etish shaklida beriladigan qulaylik.","Налоговые льготы","Преимущества отдельным налогоплательщикам в виде снижения налога или освобождения от него.","Tax incentives","Benefits granted to certain taxpayers as a reduction of tax or exemption from it."],["sol","Soliq chegirmasi","Soliq bazasini kamaytiradigan qonuniy xarajatlar yoki summalar.","Налоговый вычет","Законные суммы или расходы, уменьшающие налоговую базу.","Tax deduction","A legal amount or expense that reduces the taxable base."],["sol","Soliq krediti","To'lanishi lozim bo'lgan soliq summasidan bevosita ayriladigan miqdor.","Налоговый кредит","Сумма, непосредственно вычитаемая из начисленного налога к уплате.","Tax credit","An amount subtracted directly from the tax that is owed."],["sol","Soliqdan ozod etish","Muayyan shaxs yoki operatsiyani soliq to'lashdan to'liq chiqarish.","Налоговое освобождение","Полное освобождение определённого лица или операции от уплаты налога.","Tax exemption","Complete relief of a person or transaction from paying a tax."],["sol","Soliqdan bo'yin tovlash","Soliqni to'lamaslik uchun daromadni yashirish kabi qonunga xilof harakatlar.","Уклонение от уплаты налогов","Незаконные действия, например сокрытие доходов, с целью не платить налоги.","Tax evasion","Illegal actions, such as hiding income, to avoid paying taxes."],["sol","Soliqni optimallashtirish","Soliq yukini qonuniy usullar bilan kamaytirish.","Налоговая оптимизация","Законное снижение налоговой нагрузки с помощью допустимых способов.","Tax avoidance","Legally reducing one's tax burden using methods the law allows."],["sol","Soliq yuki","Soliq to'lovlarining daromad yoki yalpi ichki mahsulotga nisbati.","Налоговая нагрузка","Отношение суммы налоговых платежей к доходу или валовому внутреннему продукту.","Tax burden","The ratio of tax payments to income or to gross domestic product."],["sol","Soliq kodeksi","Soliqlarni undirish tartibi va tomonlarning huquq va majburiyatlarini belgilaydigan qonun.","Налоговый кодекс","Закон, определяющий порядок взимания налогов, права и обязанности сторон.","Tax code","The law that sets out how taxes are collected and the rights and duties of the parties."],["sol","Soliq organi","Soliqlarning to'g'ri hisoblanishi va to'lanishini nazorat qiluvchi davlat idorasi.","Налоговый орган","Государственный орган, контролирующий правильность исчисления и уплаты налогов.","Tax authority","A government body that supervises the correct calculation and payment of taxes."],["sol","Soliq deklaratsiyasi","To'lovchi daromadi va hisoblangan soliq to'g'risida soliq organiga topshiradigan hisobot.","Налоговая декларация","Отчёт налогоплательщика налоговому органу о доходах и исчисленном налоге.","Tax return","A report submitted to the tax authority about income and tax calculated."],["sol","Soliq tekshiruvi","Soliq organining to'lovchi hisobotlari va to'lovlarini qonunga muvofiqligini tekshirishi.","Налоговая проверка","Контроль налоговым органом правильности отчётности и уплаты налогов налогоплательщиком.","Tax audit","An inspection by the tax authority of whether a taxpayer's records and payments comply with law."],["sol","Soliq qarzi","To'lovchining belgilangan muddatda to'lanmagan soliq majburiyati.","Налоговая задолженность","Неуплаченная в срок сумма налога, числящаяся за налогоплательщиком.","Tax arrears","Tax that a taxpayer has failed to pay by the due date."],["sol","Penya","Soliq o'z vaqtida to'lanmagan kunlar uchun hisoblanadigan jarima to'lovi.","Пеня","Штрафной платёж, начисляемый за каждый день просрочки уплаты налога.","Late-payment penalty","A charge added for each day a tax payment is overdue."],["sol","Soliq to'lash muddati","Qonunda soliq to'lanishi lozim bo'lgan belgilangan sana.","Срок уплаты налога","Установленная законом дата, до которой налог должен быть уплачен.","Tax due date","The date set by law by which a tax must be paid."],["sol","Soliq tizimi","Mamlakatda amal qiladigan soliqlar, ularni undirish usullari va qoidalarining yig'indisi.","Налоговая система","Совокупность налогов, принципов и методов их взимания в стране.","Tax system","The set of taxes, rules and methods for collecting them in a country."],["sol","Soliq siyosati","Davlatning soliqlar orqali iqtisodiyotga ta'sir ko'rsatish borasidagi chora-tadbirlari.","Налоговая политика","Меры государства по воздействию на экономику с помощью налогов.","Tax policy","Government measures that use taxes to influence the economy."],["sol","Laffer egri chizig'i","Soliq stavkasi va byudjet tushumlari o'rtasidagi bog'liqlikni ko'rsatuvchi nazariy egri chiziq.","Кривая Лаффера","Теоретическая кривая, показывающая связь между налоговой ставкой и поступлениями в бюджет.","Laffer curve","A theoretical curve showing the link between the tax rate and government revenue."],["sol","Ikki karra soliq solish","Bir xil daromadga ikki marta soliq solinishi holati.","Двойное налогообложение","Ситуация, когда один и тот же доход облагается налогом дважды.","Double taxation","A situation in which the same income is taxed twice."],["sol","Ikki karra soliq solishni bartaraf etish to'g'risidagi bitim","Davlatlar o'rtasida bir daromaddan ikki marta soliq undirilmasligi haqidagi shartnoma.","Соглашение об избежании двойного налогообложения","Договор между государствами, не допускающий повторного обложения одного дохода налогом.","Double taxation treaty","An agreement between countries preventing the same income from being taxed twice."],["sol","Soliq jannati (offshor)","Soliq stavkalari juda past yoki umuman yo'q bo'lgan hudud.","Налоговая гавань (офшор)","Территория с очень низкими налогами или их отсутствием.","Tax haven","A jurisdiction with very low or no taxes."],["sol","Transfert narx belgilash","Bir guruhdagi kompaniyalar o'rtasidagi operatsiyalar narxini belgilash tartibi.","Трансфертное ценообразование","Порядок установления цен в сделках между компаниями одной группы.","Transfer pricing","The setting of prices for transactions between companies in the same group."],["sol","Soddalashtirilgan soliq tizimi","Kichik biznes uchun hisob-kitobi yengillashtirilgan va stavkasi qulay soliq rejimi.","Упрощённая система налогообложения","Налоговый режим для малого бизнеса с облегчённым учётом и льготной ставкой.","Simplified tax regime","A tax regime for small business with easier bookkeeping and a lower rate."],["sol","Aylanmadan olinadigan soliq","Korxona tushumi (aylanmasi)dan, foydadan qat'i nazar, undiriladigan soliq.","Налог с оборота","Налог, взимаемый с выручки предприятия независимо от прибыли.","Turnover tax","A tax charged on a firm's revenue regardless of its profit."],["sol","Davlat boji","Davlat organlari yuridik ahamiyatga ega harakatlar uchun oladigan yig'im.","Государственная пошлина","Сбор, взимаемый государственными органами за юридически значимые действия.","State duty","A fee charged by state bodies for legally significant actions."],["sol","Yig'im","Muayyan huquq yoki xizmat berilishi uchun to'lanadigan majburiy badal.","Сбор","Обязательный взнос, уплачиваемый за предоставление определённого права или услуги.","Levy (fee)","A mandatory payment made in return for a specific right or service."],["sol","Byudjet daromadlari","Davlat byudjetiga soliqlar va boshqa manbalardan tushadigan mablag'lar.","Доходы бюджета","Средства, поступающие в бюджет от налогов и иных источников.","Budget revenue","Funds flowing into the budget from taxes and other sources."],["sol","Byudjet xarajatlari","Davlat vazifalarini bajarish uchun byudjetdan sarflanadigan mablag'lar.","Расходы бюджета","Средства, направляемые из бюджета на выполнение государственных функций.","Budget expenditure","Funds spent from the budget to carry out government functions."],["sol","Balanslashgan byudjet","Daromadlar va xarajatlar o'zaro teng bo'lgan byudjet.","Сбалансированный бюджет","Бюджет, в котором доходы равны расходам.","Balanced budget","A budget in which revenues equal expenditures."],["sol","Tarkibiy taqchillik","Iqtisodiy sikl ta'siridan tozalangan, doimiy xarakterdagi byudjet taqchilligi.","Структурный дефицит","Дефицит бюджета, очищенный от влияния экономического цикла и носящий устойчивый характер.","Structural deficit","The part of the deficit that remains after removing the effect of the economic cycle."],["sol","Birlamchi taqchillik","Qarz bo'yicha foiz to'lovlarini hisobga olmagandagi byudjet taqchilligi.","Первичный дефицит","Дефицит бюджета без учёта процентных платежей по государственному долгу.","Primary deficit","The budget deficit excluding interest payments on debt."],["sol","Ichki davlat qarzi","Davlatning o'z rezidentlari va banklari oldidagi qarz majburiyatlari.","Внутренний государственный долг","Долговые обязательства государства перед собственными резидентами и банками.","Domestic public debt","Government debt owed to its own residents and banks."],["sol","Tashqi davlat qarzi","Davlatning chet el kreditorlari va xalqaro tashkilotlar oldidagi qarzi.","Внешний государственный долг","Долг государства перед иностранными кредиторами и международными организациями.","External public debt","Government debt owed to foreign creditors and international organisations."],["sol","Davlat qarzini xizmat ko'rsatish","Davlat qarzi bo'yicha asosiy summa va foizlarni to'lash xarajatlari.","Обслуживание государственного долга","Расходы на выплату основной суммы и процентов по государственному долгу.","Debt service","The cost of paying principal and interest on public debt."],["sol","Davlat qisqa muddatli veksellari","Davlat tomonidan qisqa muddatga chiqariladigan va diskont bilan sotiladigan qimmatli qog'oz.","Государственные казначейские векселя","Краткосрочные ценные бумаги государства, продаваемые с дисконтом.","Treasury bills","Short-term government securities sold at a discount."],["sol","Davlat qarzi ulushi","Davlat qarzining yalpi ichki mahsulotga nisbati.","Отношение долга к ВВП","Соотношение государственного долга и валового внутреннего продукта.","Debt-to-GDP ratio","Public debt expressed as a share of gross domestic product."],["sol","Byudjetdan tashqari fondlar","Davlat byudjetidan alohida shakllantiriladigan va maqsadli sarflanadigan davlat mablag'lari.","Внебюджетные фонды","Государственные средства, формируемые отдельно от бюджета и расходуемые по целевому назначению.","Extra-budgetary funds","Government funds formed separately from the budget and spent for designated purposes."],["sol","Pensiya jamg'armasi","Pensiyalarni to'lash uchun badallar hisobiga shakllantiriladigan maqsadli fond.","Пенсионный фонд","Целевой фонд, формируемый за счёт взносов для выплаты пенсий.","Pension fund","A dedicated fund built from contributions to pay pensions."],["sol","Davlat maqsadli jamg'armasi","Muayyan vazifani moliyalashtirish uchun tashkil etilgan davlat fondi.","Государственный целевой фонд","Государственный фонд, созданный для финансирования конкретной задачи.","Government special-purpose fund","A state fund created to finance a specific task."],["sol","Barqarorlashtirish jamg'armasi","Daromadlar tushib ketgan paytlarda foydalanish uchun zaxira yig'iladigan davlat fondi.","Стабилизационный фонд","Государственный фонд резервов, используемый при падении бюджетных доходов.","Stabilization fund","A state reserve fund used when budget revenues fall."],["sol","Suveren boylik jamg'armasi","Davlat tomonidan investitsiya qilinadigan, odatda resurs daromadlaridan tashkil topgan fond.","Суверенный фонд благосостояния","Государственный инвестиционный фонд, обычно формируемый из ресурсных доходов.","Sovereign wealth fund","A state-owned investment fund usually built from resource revenues."],["sol","G'aznachilik","Davlat byudjeti mablag'lari hisobini yuritish va ijrosini ta'minlovchi organ.","Казначейство","Орган, ведущий учёт средств государственного бюджета и обеспечивающий его исполнение.","Treasury","The body that manages government funds and carries out budget execution."],["sol","G'aznachilik yagona hisobvarag'i","Byudjet tushumlari va to'lovlari jamlangan, g'aznachilik yuritadigan yagona hisob.","Единый казначейский счёт","Единый счёт казначейства, на котором консолидируются бюджетные поступления и платежи.","Treasury single account","One treasury-managed account that consolidates government receipts and payments."],["sol","Byudjet jarayoni","Byudjetni tuzish, ko'rib chiqish, tasdiqlash, ijro etish va hisobot berish bosqichlari.","Бюджетный процесс","Этапы составления, рассмотрения, утверждения, исполнения бюджета и отчётности по нему.","Budget process","The stages of drafting, reviewing, approving, executing and reporting on the budget."],["sol","Byudjet tasnifi","Byudjet daromadlari va xarajatlarining yagona tartibda guruhlanishi.","Бюджетная классификация","Единая группировка доходов и расходов бюджета.","Budget classification","A uniform grouping of budget revenues and expenditures."],["sol","Byudjet kodeksi","Byudjet tizimi va byudjet jarayonini tartibga soluvchi qonun.","Бюджетный кодекс","Закон, регулирующий бюджетную систему и бюджетный процесс.","Budget code","The law regulating the budget system and the budget process."],["sol","Byudjet tizimi","O'zaro bog'liq byudjetlar, jumladan respublika va mahalliy byudjetlar majmui.","Бюджетная система","Совокупность взаимосвязанных бюджетов, включая республиканский и местные.","Budget system","The set of linked budgets, including national and local ones."],["sol","Mahalliy byudjetlar","Viloyat, tuman va shahar hokimliklari daromadlari va xarajatlarini aks ettiruvchi byudjetlar.","Местные бюджеты","Бюджеты областей, районов и городов, отражающие их доходы и расходы.","Local budgets","Budgets of regions, districts and cities showing their revenues and spending."],["sol","Respublika byudjeti","Davlat miqyosidagi vazifalarni moliyalashtiradigan markaziy byudjet.","Республиканский бюджет","Центральный бюджет, финансирующий общегосударственные задачи.","National budget","The central budget that finances nationwide government functions."],["sol","Byudjetlararo transfertlar","Yuqori byudjetdan quyi byudjetlarga beriladigan moliyaviy yordam mablag'lari.","Межбюджетные трансферты","Средства, передаваемые из вышестоящего бюджета нижестоящим.","Intergovernmental transfers","Funds passed from a higher-level budget to lower-level budgets."],["sol","Dotatsiya","Byudjet taqchilligini qoplash uchun yuqori byudjetdan beriladigan qaytarilmas mablag'.","Дотация","Безвозвратные средства из вышестоящего бюджета для покрытия бюджетного дефицита.","Grant (budget subsidy)","A non-repayable allocation from a higher budget to cover a shortfall."],["sol","Subvensiya","Aniq maqsadga sarflash sharti bilan beriladigan byudjet mablag'i.","Субвенция","Бюджетные средства, выделяемые с условием расходования на конкретную цель.","Earmarked grant","Budget funds provided on condition they are spent on a specific purpose."],["sol","Davlat xarid qilishlari","Davlat ehtiyojlari uchun tovar, ish va xizmatlarni belgilangan tartibda sotib olish.","Государственные закупки","Приобретение товаров, работ и услуг для государственных нужд в установленном порядке.","Public procurement","The purchase of goods, works and services for government needs under set rules."],["sol","Tender","Eng yaxshi shartlarni taklif qilgan yetkazib beruvchini tanlash uchun o'tkaziladigan tanlov.","Тендер","Конкурс для выбора поставщика, предложившего наилучшие условия.","Tender","A competitive bidding process for choosing the supplier with the best offer."],["sol","Imtiyoz (konsessiya)","Davlat mulkidan foydalanish huquqining shartnoma asosida xususiy tomonga berilishi.","Концессия","Передача частной стороне по договору права пользования государственным имуществом.","Concession","A contract granting a private party the right to use or operate state property."],["sol","Ijtimoiy sug'urta","Mehnat qobiliyatini yo'qotish, ishsizlik kabi holatlarda daromadni qoplashga qaratilgan tizim.","Социальное страхование","Система, возмещающая утраченный доход при потере трудоспособности, безработице и иных случаях.","Social insurance","A system that replaces lost income in cases such as disability or unemployment."],["sol","Ijtimoiy ta'minot","Muhtoj va zaif aholi qatlamlarini davlat tomonidan moddiy qo'llab-quvvatlash tizimi.","Социальное обеспечение","Система государственной материальной поддержки нуждающихся и уязвимых слоёв населения.","Social security","A state system of financial support for people in need and vulnerable groups."],["sol","Ijtimoiy nafaqa","Davlat tomonidan muayyan toifadagi fuqarolarga beriladigan pul to'lovi.","Социальное пособие","Денежная выплата государства отдельным категориям граждан.","Social benefit","A cash payment from the state to certain categories of citizens."],["sol","Pensiya","Keksalik, nogironlik yoki boquvchisini yo'qotish tufayli muntazam to'lanadigan pul ta'minoti.","Пенсия","Регулярная денежная выплата по старости, инвалидности или потере кормильца.","Pension","A regular payment made due to old age, disability or loss of a breadwinner."],["sol","Yashash minimumi","Inson hayoti uchun zarur bo'lgan oziq-ovqat va xizmatlarning minimal to'plami qiymati.","Прожиточный минимум","Стоимость минимального набора продуктов и услуг, необходимых для жизни человека.","Subsistence minimum","The cost of the minimum set of food and services needed to live."],["sol","Daromadlar tengsizligi","Aholi guruhlari o'rtasida daromadlarning notekis taqsimlanishi.","Неравенство доходов","Неравномерное распределение доходов между группами населения.","Income inequality","The uneven distribution of income among groups of the population."],["sol","Davlat xarajatlari multiplikatori","Davlat xarajati o'zgarishi natijasida yalpi daromadning necha marta o'zgarishini ko'rsatuvchi koeffitsiyent.","Мультипликатор государственных расходов","Коэффициент, показывающий, во сколько раз изменится совокупный доход при изменении госрасходов.","Government spending multiplier","A coefficient showing how much total income changes when government spending changes."],["sol","Kengaytiruvchi fiskal siyosat","Iqtisodiy o'sishni rag'batlantirish uchun xarajatlarni oshirish yoki soliqlarni kamaytirish.","Стимулирующая фискальная политика","Увеличение расходов или снижение налогов для стимулирования экономического роста.","Expansionary fiscal policy","Raising spending or cutting taxes to stimulate economic growth."],["sol","Cheklovchi fiskal siyosat","Inflyatsiyani jilovlash uchun xarajatlarni qisqartirish yoki soliqlarni oshirish.","Сдерживающая фискальная политика","Сокращение расходов или повышение налогов для сдерживания инфляции.","Contractionary fiscal policy","Cutting spending or raising taxes to hold down inflation."],["sol","Davlat tovarlari","Hamma foydalanadigan va undan birovni chetlatib bo'lmaydigan, masalan mudofaa kabi tovarlar.","Общественные блага","Блага, которыми пользуются все и из потребления которых нельзя исключить, например оборона.","Public goods","Goods everyone can use and no one can be excluded from, such as national defence."],["sol","Tashqi ta'sirlar (eksternaliyalar)","Bitim ishtirokchisi bo'lmagan uchinchi shaxslarga tushadigan qoplanmagan foyda yoki zarar.","Внешние эффекты (экстерналии)","Невозмещаемые выгоды или издержки, которые несут третьи лица, не участвующие в сделке.","Externalities","Uncompensated benefits or costs that fall on third parties outside a transaction."],["sol","Pigu solig'i","Salbiy tashqi ta'sir keltiruvchi faoliyatga uning zararini qoplash uchun solinadigan soliq.","Налог Пигу","Налог на деятельность с отрицательными внешними эффектами, компенсирующий причиняемый вред.","Pigouvian tax","A tax on an activity with negative side effects, set to offset the harm it causes."],["sol","Ekologik soliq","Atrof-muhitni ifloslantirish yoki tabiiy resurslardan foydalanish uchun to'lanadigan soliq.","Экологический налог","Налог за загрязнение окружающей среды или использование природных ресурсов.","Environmental tax","A tax paid for polluting the environment or using natural resources."],["sol","Byudjet ijrosi","Tasdiqlangan byudjetda ko'zda tutilgan daromadlarni yig'ish va xarajatlarni amalga oshirish.","Исполнение бюджета","Сбор доходов и осуществление расходов, предусмотренных утверждённым бюджетом.","Budget execution","Collecting revenue and making payments as set out in the approved budget."],["sol","Davlat moliyaviy nazorati","Byudjet mablag'larining qonuniy va samarali sarflanishini tekshirish faoliyati.","Государственный финансовый контроль","Проверка законности и эффективности использования бюджетных средств.","Public financial audit","The checking that budget funds are spent lawfully and efficiently."],["sol","Natijaga yo'naltirilgan byudjetlashtirish","Xarajatlarni erishiladigan natijalar bilan bog'lab rejalashtirish usuli.","Бюджетирование, ориентированное на результат","Метод планирования расходов в увязке с ожидаемыми результатами.","Performance-based budgeting","A method of planning spending according to the results it is meant to achieve."],["sol","Ishtirokchilik byudjeti","Aholi byudjet mablag'larini taqsimlashda bevosita ishtirok etadigan mexanizm.","Партисипаторный (инициативный) бюджет","Механизм, при котором жители напрямую участвуют в распределении бюджетных средств.","Participatory budgeting","A mechanism in which residents directly help decide how public funds are spent."],["sol","Qurilishdagi kapital xarajatlar","Infratuzilma va asosiy fondlarni yaratishga yo'naltirilgan uzoq muddatli byudjet xarajatlari.","Капитальные расходы бюджета","Долгосрочные расходы бюджета на создание инфраструктуры и основных фондов.","Capital expenditure (public)","Long-term government spending on creating infrastructure and fixed assets."],["sol","Joriy xarajatlar","Ish haqi, kommunal to'lovlar kabi davlat muassasalarining kundalik faoliyati xarajatlari.","Текущие расходы бюджета","Расходы на повседневную деятельность учреждений, например зарплаты и коммунальные услуги.","Current expenditure","Spending on day-to-day operations, such as wages and utilities."],["sol","Davlat xizmatlari narxi","Davlat muassasalari ko'rsatadigan pullik xizmatlar uchun belgilangan to'lov.","Плата за государственные услуги","Установленный платёж за платные услуги государственных учреждений.","Public service fee","The set charge for paid services provided by government bodies."],["sol","Soliqsiz daromadlar","Byudjetga soliqlardan tashqari tushadigan mablag'lar, masalan mulkdan daromad va jarimalar.","Неналоговые доходы","Поступления в бюджет, не являющиеся налогами, например доходы от имущества и штрафы.","Non-tax revenue","Budget receipts other than taxes, such as property income and fines."],["sol","Inflyatsiya solig'i","Pul qadrsizlanishi tufayli aholi va korxonalar daromadlarining yashirin tarzda kamayishi.","Инфляционный налог","Скрытое снижение реальных доходов населения и предприятий из-за обесценения денег.","Inflation tax","The hidden loss of real income and savings caused by the falling value of money."],["sol","Soliq amnistiyasi","Oldin yashirilgan daromadni ixtiyoriy oshkor etganlarni javobgarlikdan ozod qilish.","Налоговая амнистия","Освобождение от ответственности лиц, добровольно раскрывших ранее скрытые доходы.","Tax amnesty","Relief from penalties for people who voluntarily disclose previously hidden income."],["biz","Korxona","Mahsulot ishlab chiqarish, ish bajarish yoki xizmat ko'rsatish uchun tashkil etilgan yuridik shaxs.","Предприятие","Юридическое лицо, созданное для производства продукции, выполнения работ или оказания услуг.","Enterprise","A legal entity set up to produce goods, perform work or provide services."],["biz","Yakka tartibdagi tadbirkor (YaTT)","Yuridik shaxs tuzmasdan, o'z nomidan va o'z javobgarligi bilan tadbirkorlik qiluvchi jismoniy shaxs.","Индивидуальный предприниматель (ИП)","Физическое лицо, которое ведёт предпринимательскую деятельность от своего имени и на свою ответственность без создания юридического лица.","Sole proprietorship","A business owned and run by one person, who is personally liable for all of its debts."],["biz","Mas'uliyati cheklangan jamiyat (MChJ)","Ustav kapitali ulushlarga bo'lingan va ishtirokchilar faqat o'z ulushi doirasida javob beradigan jamiyat.","Общество с ограниченной ответственностью (ООО)","Компания с уставным капиталом, разделённым на доли, участники которой отвечают только в пределах своих долей.","Limited liability company (LLC)","A company whose owners are liable for its debts only up to the amount they invested."],["biz","Aksiyadorlik jamiyati (AJ)","Ustav kapitali aksiyalarga bo'lingan va aksiyadorlari o'z aksiyalari qiymati doirasida javob beradigan jamiyat.","Акционерное общество (АО)","Компания с уставным капиталом, разделённым на акции, акционеры которой рискуют лишь стоимостью своих акций.","Joint-stock company","A company whose capital is divided into shares and whose shareholders risk only the value of their shares."],["biz","Biznes-reja","Biznes maqsadlari, bozori, moliyaviy ko'rsatkichlari va ularga erishish yo'llarini bayon qiluvchi hujjat.","Бизнес-план","Документ, описывающий цели бизнеса, рынок, финансовые показатели и способы их достижения.","Business plan","A document that sets out a business's goals, market, finances and the steps needed to reach them."],["biz","SWOT-tahlil","Tashkilotning kuchli va zaif tomonlari hamda imkoniyat va xavflarini baholash usuli.","SWOT-анализ","Метод оценки сильных и слабых сторон организации, а также возможностей и угроз внешней среды.","SWOT analysis","A method of assessing an organization's strengths, weaknesses, opportunities and threats."],["biz","PESTEL-tahlil","Siyosiy, iqtisodiy, ijtimoiy, texnologik, ekologik va huquqiy tashqi omillarni o'rganish usuli.","PESTEL-анализ","Метод изучения политических, экономических, социальных, технологических, экологических и правовых факторов внешней среды.","PESTEL analysis","A method of studying political, economic, social, technological, environmental and legal factors in a company's environment."],["biz","Strategiya","Tashkilot uzoq muddatli maqsadlarga erishish uchun resurslarni qanday yo'naltirishini belgilovchi umumiy reja.","Стратегия","Общий план того, как организация распределяет ресурсы для достижения долгосрочных целей.","Strategy","A long-term plan for how an organization will use its resources to achieve its goals."],["biz","Missiya","Tashkilotning mavjud bo'lish sababi va u kimga qanday foyda keltirishini ifodalovchi bayonot.","Миссия","Заявление о том, зачем существует организация и какую пользу она приносит клиентам и обществу.","Mission statement","A statement of why an organization exists and what value it provides."],["biz","Viziya","Tashkilot kelajakda qanday bo'lishni istashini ko'rsatuvchi istiqbol tasviri.","Видение","Образ желаемого будущего организации, к которому она стремится.","Vision","A picture of what an organization wants to become in the future."],["biz","KPI (asosiy samaradorlik ko'rsatkichi)","Maqsadga erishish darajasini o'lchaydigan asosiy miqdoriy ko'rsatkich.","KPI (ключевой показатель эффективности)","Ключевой количественный показатель, измеряющий степень достижения поставленной цели.","KPI (key performance indicator)","A key measurable value that shows how well a person or company is achieving its objectives."],["biz","OKR (maqsadlar va asosiy natijalar)","Ambitsiyali maqsad va uning bajarilishini o'lchaydigan bir nechta aniq natijalardan iborat boshqaruv usuli.","OKR (цели и ключевые результаты)","Метод управления, где амбициозная цель подкрепляется несколькими измеримыми ключевыми результатами.","OKR (objectives and key results)","A management method that pairs an ambitious goal with a few measurable results that show progress."],["biz","Menejment","Maqsadlarga erishish uchun odamlar va resurslarni rejalashtirish, tashkil etish, rag'batlantirish va nazorat qilish.","Менеджмент","Планирование, организация, мотивация и контроль людей и ресурсов для достижения целей.","Management","The process of planning, organizing, motivating and controlling people and resources to achieve goals."],["biz","Rejalashtirish","Maqsadlarni belgilash va ularga erishish yo'llarini oldindan tanlash boshqaruv funksiyasi.","Планирование","Функция управления, состоящая в определении целей и выборе путей их достижения заранее.","Planning","The management function of setting goals and deciding in advance how to achieve them."],["biz","Tashkil etish","Vazifalar, vakolatlar va resurslarni tartibga solib, ish uchun tuzilma yaratish funksiyasi.","Организация (функция)","Функция управления, упорядочивающая задачи, полномочия и ресурсы и создающая структуру для работы.","Organizing","The management function of arranging tasks, authority and resources into a working structure."],["biz","Rag'batlantirish (motivatsiya)","Xodimlarni maqsadga erishish uchun ishlashga undaydigan omillar tizimi.","Мотивация","Система факторов, побуждающих работников действовать для достижения целей организации.","Motivation","The forces that drive employees to put effort into achieving organizational goals."],["biz","Nazorat","Natijalarni rejalar bilan solishtirib, chetga chiqishlarni tuzatish boshqaruv funksiyasi.","Контроль","Функция управления, сравнивающая результаты с планами и исправляющая отклонения.","Controlling","The management function of comparing results with plans and correcting deviations."],["biz","Liderlik","Boshqalarni umumiy maqsad sari ilhomlantirish va yo'naltirish qobiliyati.","Лидерство","Способность вдохновлять и направлять других людей к общей цели.","Leadership","The ability to inspire and guide others toward a shared goal."],["biz","Maslou ehtiyojlar piramidasi","Ehtiyojlar fiziologikdan o'zini namoyon qilishgacha besh pog'onada joylashadi, deydigan motivatsiya nazariyasi.","Пирамида потребностей Маслоу","Теория мотивации, по которой потребности выстроены в пять уровней от физиологических до самореализации.","Maslow's hierarchy of needs","A motivation theory that arranges human needs in five levels, from physical survival to self-actualization."],["biz","Gertsbergning ikki omilli nazariyasi","Mehnatdan qoniqishni gigiyena va motivatsion omillar belgilaydi, deydigan nazariya.","Двухфакторная теория Герцберга","Теория, согласно которой удовлетворённость трудом определяется гигиеническими и мотивирующими факторами.","Herzberg's two-factor theory","A theory saying job satisfaction depends on motivators, while hygiene factors only prevent dissatisfaction."],["biz","Makgregorning X va Y nazariyasi","Rahbarlar xodimlarga ikki xil qarashi mumkinligini tushuntiruvchi nazariya: X dangasa, Y mas'uliyatli deb hisoblaydi.","Теория X и Y Макгрегора","Теория о двух взглядах руководителей на работников: по X люди ленивы, по Y они ответственны.","McGregor's Theory X and Theory Y","A theory contrasting managers who assume workers dislike work (X) with those who assume workers are self-motivated (Y)."],["biz","Vrumning kutish nazariyasi","Xodim ish natijasi mukofotga olib kelishiga ishonsa, ko'proq harakat qiladi, deydigan nazariya.","Теория ожиданий Врума","Теория, по которой работник старается сильнее, если верит, что усилия приведут к результату и награде.","Expectancy theory","A theory that people work harder when they believe effort leads to good performance and a valued reward."],["biz","Inson resurslarini boshqarish (HRM)","Xodimlarni jalb qilish, o'qitish, baholash va rag'batlantirish bilan shug'ullanuvchi boshqaruv sohasi.","Управление человеческими ресурсами (HRM)","Область управления, связанная с привлечением, обучением, оценкой и стимулированием сотрудников.","Human resource management (HRM)","The area of management that recruits, trains, evaluates and rewards employees."],["biz","Rekrutment","Tashkilot uchun mos nomzodlarni qidirish va ishga tanlash jarayoni.","Рекрутинг","Процесс поиска и отбора подходящих кандидатов на вакантные должности.","Recruitment","The process of finding and selecting suitable candidates for job openings."],["biz","Korporativ madaniyat","Tashkilot a'zolari o'rtasida qabul qilingan qadriyatlar, urf-odatlar va xulq-atvor qoidalari majmui.","Корпоративная культура","Совокупность ценностей, традиций и норм поведения, принятых в организации.","Corporate culture","The shared values, habits and behavior norms that shape how people work in an organization."],["biz","Ta'minot zanjiri","Xomashyodan to oxirgi iste'molchigacha mahsulot o'tadigan barcha ishtirokchilar va bosqichlar tizimi.","Цепь поставок","Система участников и этапов, через которые продукт проходит от сырья до конечного потребителя.","Supply chain","The network of suppliers, producers and distributors that moves a product from raw materials to the customer."],["biz","Logistika","Tovar, axborot va resurslar harakatini eng kam xarajat bilan boshqarish.","Логистика","Управление движением товаров, информации и ресурсов с минимальными затратами.","Logistics","The management of how goods, information and resources move at the lowest possible cost."],["biz","Zaxiralar boshqaruvi","Ombordagi tovar va xomashyo miqdorini ortiqcha yoki yetishmay qolmaydigan darajada ushlab turish.","Управление запасами","Поддержание объёма товаров и сырья на складе на уровне, исключающем избыток и дефицит.","Inventory management","Keeping stocks of goods and materials at a level that avoids both excess and shortage."],["biz","Autsorsing","Ba'zi biznes funksiyalarini tashqi ixtisoslashgan kompaniyaga shartnoma asosida topshirish.","Аутсорсинг","Передача отдельных бизнес-функций внешней специализированной компании по договору.","Outsourcing","Hiring an outside specialized company under contract to perform some business functions."],["biz","Brend","Mahsulotni raqobatchilardan ajratib turuvchi nom, belgi va iste'molchi ongidagi obraz.","Бренд","Название, знак и образ в сознании потребителей, отличающие товар от конкурентов.","Brand","The name, symbol and image in customers' minds that sets a product apart from competitors."],["biz","Bozorni segmentlash","Iste'molchilarni o'xshash ehtiyoj va xususiyatlariga ko'ra guruhlarga ajratish.","Сегментирование рынка","Разделение потребителей на группы со сходными потребностями и характеристиками.","Market segmentation","Dividing customers into groups that share similar needs or characteristics."],["biz","Maqsadli bozorni tanlash (targeting)","Kompaniya xizmat ko'rsatishga qaror qilgan eng istiqbolli mijozlar segmentini tanlash.","Выбор целевого рынка (таргетинг)","Выбор наиболее перспективных сегментов клиентов, которых компания решила обслуживать.","Targeting","Choosing the most promising customer segments that a company decides to serve."],["biz","Pozitsiyalash","Mahsulotning iste'molchi ongida raqobatchilardan ajralib turuvchi o'rnini shakllantirish.","Позиционирование","Формирование особого места продукта в сознании потребителей относительно конкурентов.","Positioning","Shaping a distinct place for a product in customers' minds compared with competitors."],["biz","Marketing miksi (4P)","Mahsulot, narx, taqsimot va ilgari surish: marketingning to'rt asosiy vositasi.","Маркетинг-микс (4P)","Четыре основных инструмента маркетинга: продукт, цена, место (сбыт) и продвижение.","Marketing mix (4Ps)","The four main marketing tools: product, price, place and promotion."],["biz","Mijozlar bilan munosabatlarni boshqarish (CRM)","Mijozlar haqidagi ma'lumotlarni yig'ib, ular bilan aloqani yaxshilashga xizmat qiluvchi tizim va yondashuv.","Управление взаимоотношениями с клиентами (CRM)","Система и подход, собирающие данные о клиентах и помогающие улучшать работу с ними.","Customer relationship management (CRM)","A system and approach for collecting customer data and improving relationships with customers."],["biz","B2B","Kompaniyalar o'rtasida, ya'ni biznesdan biznesga amalga oshiriladigan savdo modeli.","B2B (бизнес для бизнеса)","Модель торговли, при которой одна компания продаёт товары или услуги другой компании.","B2B (business to business)","A model in which one business sells goods or services to another business."],["biz","B2C","Kompaniya mahsulotini bevosita oxirgi iste'molchilarga sotadigan savdo modeli.","B2C (бизнес для потребителя)","Модель торговли, при которой компания продаёт товары или услуги напрямую конечным потребителям.","B2C (business to consumer)","A model in which a company sells directly to individual consumers."],["biz","Birlik iqtisodiyoti","Bitta mijoz yoki mahsulot birligidan olinadigan daromad va xarajatlarni hisoblash orqali biznes foydaliligini baholash.","Юнит-экономика","Оценка прибыльности бизнеса через расчёт доходов и расходов на одного клиента или единицу товара.","Unit economics","Judging a business's profitability by the revenues and costs of a single customer or unit sold."],["biz","Mijoz jalb qilish narxi (CAC)","Bitta yangi mijozni jalb qilish uchun sarflangan o'rtacha marketing va sotuv xarajatlari.","Стоимость привлечения клиента (CAC)","Средние затраты на маркетинг и продажи, необходимые для привлечения одного нового клиента.","Customer acquisition cost (CAC)","The average marketing and sales spending needed to win one new customer."],["biz","Mijozning umr bo'yi qiymati (LTV)","Mijoz kompaniya bilan hamkorlik davomida keltiradigan jami daromad miqdori.","Пожизненная ценность клиента (LTV)","Общий доход, который клиент приносит компании за всё время сотрудничества.","Customer lifetime value (LTV)","The total revenue a customer is expected to bring a company over the whole relationship."],["biz","MVP (minimal hayotga layoqatli mahsulot)","Asosiy g'oyani sinab ko'rish uchun eng zarur imkoniyatlarga ega mahsulotning dastlabki varianti.","MVP (минимально жизнеспособный продукт)","Первая версия продукта с минимальным набором функций для проверки основной идеи на реальных пользователях.","MVP (minimum viable product)","The simplest version of a product that has just enough features to test the idea with real users."],["biz","Pitch (taqdimot)","Investorlarni ishontirish uchun g'oya va biznesni qisqa va ta'sirchan tarzda taqdim etish.","Питч","Короткая убедительная презентация идеи или бизнеса, цель которой привлечь инвестора.","Pitch","A short, persuasive presentation of an idea or business aimed at winning over investors."],["biz","Lean startup (tejamkor startap)","G'oyani tez sinab, mijozlar fikriga qarab takomillashtirishga asoslangan startap yaratish usuli.","Бережливый стартап (Lean startup)","Метод создания стартапа через быструю проверку гипотез и доработку продукта по отзывам клиентов.","Lean startup","A method of building a startup by quickly testing ideas and improving them from customer feedback."],["biz","Ustama (nasxa)","Sotuv narxini hosil qilish uchun tannarxga qo'shiladigan summa yoki foiz.","Наценка","Сумма или процент, добавляемые к себестоимости для получения цены продажи.","Markup","An amount or percentage added to cost to arrive at the selling price."],["biz","Narx belgilashning xarajatga asoslangan usuli","Narx tannarxga ma'lum foyda ustamasi qo'shish orqali belgilanadi.","Затратный метод ценообразования","Цена устанавливается путём добавления желаемой прибыли к себестоимости продукта.","Cost-plus pricing","Setting a price by adding a fixed profit percentage to the cost of the product."],["biz","Skimming narx strategiyasi","Yangi mahsulotga dastlab yuqori narx qo'yib, keyinchalik uni pasaytirib borish.","Стратегия «снятия сливок»","Установление высокой цены на новый товар с постепенным её снижением со временем.","Price skimming","Launching a new product at a high price and lowering it over time."],["biz","Penetratsion narx strategiyasi","Bozorni tez egallash uchun yangi mahsulotga dastlab past narx belgilash.","Стратегия проникновения","Установление низкой начальной цены на новый товар для быстрого захвата рынка.","Penetration pricing","Setting a low initial price on a new product to win market share quickly."],["biz","Raqobat afzalligi","Kompaniyaga raqobatchilardan ustun bo'lish imkonini beradigan noyob xususiyat yoki resurs.","Конкурентное преимущество","Уникальное качество или ресурс, позволяющие компании превосходить конкурентов.","Competitive advantage","A unique quality or resource that lets a company outperform its rivals."],["biz","Birlashish va qo'shib olish (M&A)","Kompaniyalarning bitta tuzilmaga qo'shilishi yoki bir kompaniyaning boshqasini sotib olishi.","Слияния и поглощения (M&A)","Объединение компаний в одну или приобретение одной компании другой.","Mergers and acquisitions (M&A)","Deals in which companies combine into one or one company buys another."],["biz","Korporativ boshqaruv","Kompaniya rahbariyati, aksiyadorlar va boshqa tomonlar o'rtasidagi munosabatlar va qarorlar qabul qilish qoidalari tizimi.","Корпоративное управление","Система правил и отношений между руководством, акционерами и другими сторонами при принятии решений в компании.","Corporate governance","The system of rules and relationships by which a company is directed and controlled."],["biz","Korporativ ijtimoiy mas'uliyat (KIM)","Kompaniyaning jamiyat va atrof-muhit oldidagi foyda olishdan tashqari ixtiyoriy mas'uliyati.","Корпоративная социальная ответственность (КСО)","Добровольная ответственность компании перед обществом и окружающей средой сверх получения прибыли.","Corporate social responsibility (CSR)","A company's voluntary commitment to act in ways that benefit society and the environment."],["biz","ESG","Kompaniya faoliyatini ekologik, ijtimoiy va boshqaruv mezonlari bo'yicha baholash tizimi.","ESG","Система оценки деятельности компании по экологическим, социальным критериям и качеству управления.","ESG","A framework for judging a company on environmental, social and governance criteria."],["biz","Porterning besh kuch modeli","Soha raqobatbardoshligini raqobatchilar, yangi kirish, o'rinbosarlar, xaridorlar va yetkazib beruvchilar kuchi orqali tahlil qilish.","Модель пяти сил Портера","Анализ конкуренции в отрасли через силу конкурентов, новичков, заменителей, покупателей и поставщиков.","Porter's five forces","A model that analyzes industry competition through rivals, new entrants, substitutes, buyers and suppliers."],["biz","Qiymat zanjiri","Mahsulotga qiymat qo'shadigan kompaniyaning barcha asosiy va yordamchi faoliyat turlari ketma-ketligi.","Цепочка создания стоимости","Последовательность основных и вспомогательных видов деятельности компании, добавляющих ценность продукту.","Value chain","The series of activities a company performs to add value to a product."],["biz","BCG matritsasi","Kompaniya mahsulotlarini bozor o'sishi va ulushiga qarab yulduz, sigir, savol va it guruhlariga ajratish.","Матрица БКГ","Классификация продуктов по росту рынка и доле на звёзды, дойных коров, трудных детей и собак.","BCG matrix","A tool that sorts products into stars, cash cows, question marks and dogs by market growth and share."],["biz","Vertikal integratsiya","Kompaniyaning ta'minot zanjiridagi oldingi yoki keyingi bosqichlarni o'z nazoratiga olishi.","Вертикальная интеграция","Взятие компанией под контроль предыдущих или последующих этапов цепочки поставок.","Vertical integration","A company taking control of earlier or later stages of its supply chain."],["biz","Biznes-model","Kompaniya qiymat yaratish, uni mijozga yetkazish va daromad olish usulining tavsifi.","Бизнес-модель","Описание того, как компания создаёт ценность, доставляет её клиентам и зарабатывает деньги.","Business model","A description of how a company creates value, delivers it to customers and earns money."],["biz","Qiymat taklifi","Mijoz nima uchun aynan shu mahsulotni tanlashi kerakligini ko'rsatuvchi asosiy foyda.","Ценностное предложение","Главная выгода, объясняющая клиенту, почему стоит выбрать именно этот продукт.","Value proposition","The main benefit that explains why a customer should choose a particular product."],["biz","Biznes-model kanvasi","Biznes-modelni to'qqiz blokda bir sahifada tasvirlovchi vizual shablon.","Канвас бизнес-модели","Визуальный шаблон, описывающий бизнес-модель в девяти блоках на одной странице.","Business model canvas","A one-page template that maps a business model in nine building blocks."],["biz","Aksiyador","Kompaniya aksiyalariga ega bo'lib, uning mulki va foydasida ulushga ega shaxs.","Акционер","Владелец акций компании, имеющий долю в её собственности и прибыли.","Shareholder","A person or entity that owns shares and therefore a part of a company."],["biz","Kuzatuv kengashi (direktorlar kengashi)","Aksiyadorlar nomidan kompaniya rahbariyati faoliyatini nazorat qiluvchi va strategik qarorlar qabul qiluvchi organ.","Совет директоров","Орган, который от имени акционеров определяет стратегию и контролирует работу руководства.","Board of directors","A body elected by shareholders to set strategy and oversee a company's management."],["biz","Bozor ulushi","Kompaniya sotuvlarining butun bozor sotuvlaridagi ulushi.","Доля рынка","Доля продаж компании в общем объёме продаж на рынке.","Market share","The portion of total market sales that belongs to one company."],["biz","Brend kapitali","Brend nomining mahsulotga qo'shimcha qiymat va sodiq mijozlar keltirishi.","Капитал бренда","Дополнительная ценность и лояльность клиентов, которые приносит продукту известное имя бренда.","Brand equity","The extra value and customer loyalty a well-known brand name adds to a product."],["biz","Reklama","Mahsulot yoki xizmat haqida pullik va shaxssiz usulda keng auditoriyani xabardor qilish.","Реклама","Платное неличное информирование широкой аудитории о товаре или услуге.","Advertising","Paid, non-personal communication that tells a wide audience about a product or service."],["biz","Jamoatchilik bilan aloqalar (PR)","Kompaniya haqida jamoatchilikda ijobiy obraz va ishonch shakllantirish faoliyati.","Связи с общественностью (PR)","Деятельность по формированию положительного образа компании и доверия к ней в обществе.","Public relations (PR)","Activity aimed at building a positive public image and trust for an organization."],["biz","SMM (ijtimoiy tarmoqlar marketingi)","Mahsulotni ijtimoiy tarmoqlar orqali ilgari surish va auditoriya bilan muloqot qilish.","SMM (маркетинг в социальных сетях)","Продвижение продукта и общение с аудиторией через социальные сети.","Social media marketing","Promoting a product and engaging with an audience through social networks."],["biz","SEO","Veb-saytni qidiruv tizimlarida yuqoriroq o'rinda chiqishi uchun optimallashtirish.","SEO (поисковая оптимизация)","Оптимизация сайта для более высокой позиции в результатах поисковых систем.","SEO (search engine optimization)","Improving a website so that it ranks higher in search engine results."],["biz","Kontent-marketing","Foydali va qiziqarli materiallar yaratish orqali mijozlarni jalb qilish va ushlab turish.","Контент-маркетинг","Привлечение и удержание клиентов с помощью полезных и интересных материалов.","Content marketing","Attracting and keeping customers by creating useful and interesting material."],["biz","Konversiya","Mijoz bo'lishi mumkin bo'lgan tashrif buyuruvchilarning haqiqiy xaridorga aylangan ulushi.","Конверсия","Доля потенциальных клиентов или посетителей, совершивших целевое действие, например покупку.","Conversion rate","The share of visitors or prospects who take a desired action, such as buying."],["biz","Mijozlar sodiqligi","Mijozning boshqa variantlar bo'lsa ham bir brenddan takror xarid qilishga moyilligi.","Лояльность клиентов","Склонность покупателя повторно выбирать один и тот же бренд, даже если есть альтернативы.","Customer loyalty","A customer's tendency to keep buying from the same brand despite other options."],["biz","NPS (mijozlar tavsiya indeksi)","Mijozlar kompaniyani do'stlariga tavsiya qilish ehtimolini o'lchaydigan sodiqlik ko'rsatkichi.","NPS (индекс потребительской лояльности)","Показатель лояльности, измеряющий готовность клиентов рекомендовать компанию знакомым.","Net promoter score (NPS)","A loyalty measure based on how likely customers are to recommend a company."],["biz","Mahsulotning hayot sikli","Mahsulot bozorda joriy etish, o'sish, yetuklik va pasayish bosqichlaridan o'tadi, degan tushuncha.","Жизненный цикл продукта","Концепция, по которой товар проходит этапы внедрения, роста, зрелости и спада.","Product life cycle","The idea that a product passes through introduction, growth, maturity and decline."],["biz","Assortiment","Kompaniya taklif qiladigan mahsulot turlari va guruhlari majmui.","Ассортимент","Набор видов и групп товаров, которые предлагает компания.","Product assortment","The full range of product types and lines a company offers."],["biz","Taqsimot kanali","Mahsulot ishlab chiqaruvchidan iste'molchiga yetib boradigan vositachilar zanjiri.","Канал сбыта","Цепочка посредников, через которую товар попадает от производителя к потребителю.","Distribution channel","The chain of intermediaries through which a product reaches the consumer."],["biz","Ulgurji savdo","Tovarlarni qayta sotish yoki ishlatish uchun katta partiyalarda sotish.","Оптовая торговля","Продажа товаров крупными партиями для перепродажи или производственного использования.","Wholesale","Selling goods in large lots to businesses for resale or further use."],["biz","Chakana savdo","Tovarlarni oxirgi iste'molchiga shaxsiy ehtiyoj uchun kichik hajmda sotish.","Розничная торговля","Продажа товаров конечным потребителям небольшими партиями для личного использования.","Retail","Selling goods in small quantities directly to final consumers."],["biz","Elektron tijorat","Tovar va xizmatlarni internet orqali sotish va sotib olish.","Электронная коммерция","Покупка и продажа товаров и услуг через интернет.","E-commerce","Buying and selling goods and services over the internet."],["biz","Marketpleys","Ko'plab sotuvchilar o'z tovarlarini bitta onlayn platformada xaridorlarga taklif qiladigan maydon.","Маркетплейс","Онлайн-площадка, на которой множество продавцов предлагают свои товары покупателям.","Marketplace","An online platform where many sellers offer their products to buyers."],["biz","Sifat menejmenti (TQM)","Barcha xodimlarni jalb qilib, mahsulot va jarayonlar sifatini doimiy yaxshilashga qaratilgan boshqaruv.","Управление качеством (TQM)","Подход, при котором все сотрудники постоянно работают над улучшением качества продукции и процессов.","Total quality management (TQM)","A management approach in which everyone works continuously to improve product and process quality."],["biz","Tejamkor ishlab chiqarish (Lean)","Isrofgarchilikni kamaytirib, mijoz uchun qiymat yaratishga e'tibor qaratadigan boshqaruv usuli.","Бережливое производство (Lean)","Метод управления, нацеленный на сокращение потерь и создание ценности для клиента.","Lean production","A management method that cuts waste and focuses on creating value for the customer."],["biz","Six Sigma","Nuqsonlarni deyarli nolgacha kamaytirish uchun statistik tahlilga asoslangan sifat usuli.","Шесть сигм","Метод повышения качества, использующий статистику, чтобы довести количество дефектов почти до нуля.","Six Sigma","A statistics-based quality method for reducing defects to nearly zero."],["biz","Kaizen","Kichik, ammo uzluksiz yaxshilanishlar orqali jarayonlarni takomillashtirishning yapon falsafasi.","Кайдзен","Японская философия постоянного улучшения процессов через небольшие, но непрерывные изменения.","Kaizen","A Japanese philosophy of improving processes through small, continuous changes."],["biz","Aynan o'z vaqtida (Just-in-time)","Zaxira xarajatlarini kamaytirish uchun materiallarni faqat kerak bo'lgan paytda yetkazib berish tizimi.","Точно в срок (Just-in-time)","Система поставки материалов строго тогда, когда они нужны, чтобы сократить затраты на запасы.","Just-in-time (JIT)","A system that delivers materials only when needed in order to cut inventory costs."],["biz","Loyiha menejmenti","Aniq maqsad, muddat va byudjet doirasida loyihani rejalashtirish va amalga oshirishni boshqarish.","Управление проектами","Планирование и руководство выполнением проекта в рамках заданных цели, сроков и бюджета.","Project management","Planning and leading a project so it meets its goal within set time and budget."],["biz","Agile","Ishni qisqa bosqichlarda bajarib, doimiy fikr-mulohaza asosida moslashuvchan boshqarish yondashuvi.","Agile (гибкая методология)","Гибкий подход к управлению, при котором работа делается короткими циклами с постоянной обратной связью.","Agile","A flexible management approach that delivers work in short cycles and adapts to feedback."],["biz","Qaror qabul qilish","Bir nechta muqobil variantlar ichidan maqsadga eng mos keladiganini tanlash jarayoni.","Принятие решений","Процесс выбора наиболее подходящего варианта из нескольких альтернатив.","Decision making","The process of choosing the best option among several alternatives."],["biz","Vakolat topshirish (delegatsiya)","Rahbarning vazifa va vakolatlarning bir qismini quyi xodimlarga o'tkazishi.","Делегирование","Передача руководителем части задач и полномочий подчинённым.","Delegation","A manager handing part of their tasks and authority to subordinates."],["biz","Tashkiliy tuzilma","Tashkilotdagi bo'linmalar, lavozimlar va ular o'rtasidagi bo'ysunish munosabatlari sxemasi.","Организационная структура","Схема подразделений, должностей и отношений подчинения внутри организации.","Organizational structure","The arrangement of departments, positions and reporting lines inside an organization."],["biz","Matritsali tuzilma","Xodimlar ham funksional bo'lim, ham loyiha rahbariga bo'ysunadigan tashkiliy tuzilma.","Матричная структура","Организационная структура, где сотрудники подчиняются одновременно функциональному руководителю и руководителю проекта.","Matrix structure","An organization design in which employees report to both a functional manager and a project manager."],["biz","Biznes-jarayon","Kirishni mijoz uchun qimmatli natijaga aylantiradigan o'zaro bog'liq harakatlar ketma-ketligi.","Бизнес-процесс","Последовательность взаимосвязанных действий, превращающая входные ресурсы в ценный для клиента результат.","Business process","A sequence of linked activities that turns inputs into a result valued by the customer."],["biz","Reinjiniring","Samaradorlikni keskin oshirish uchun biznes-jarayonlarni tubdan qayta ko'rib chiqish.","Реинжиниринг","Радикальное перепроектирование бизнес-процессов для резкого повышения эффективности.","Business process reengineering","A radical redesign of business processes to achieve dramatic improvement."],["biz","Biznes-inkubator","Yosh tadbirkorlarga ish joyi, maslahat va aloqalar bilan yordam beradigan tashkilot.","Бизнес-инкубатор","Организация, помогающая начинающим предпринимателям рабочим местом, консультациями и связями.","Business incubator","An organization that helps new entrepreneurs with workspace, mentoring and contacts."],["biz","Masshtablash","Xarajatlarni mutanosib oshirmasdan biznes hajmi va daromadini kengaytirish.","Масштабирование","Расширение объёма бизнеса и доходов без пропорционального роста затрат.","Scaling","Growing a business's size and revenue without a proportional rise in costs."],["biz","Pivot","Bozor f
