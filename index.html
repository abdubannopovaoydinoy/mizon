hyot.","Аналитический счёт","Счёт, детализирующий данные синтетического счёта по отдельным объектам.","Subsidiary account","A detailed account breaking down a control account by individual item."],["buh","Buxgalteriya yozuvi","Operatsiyani debetlanadigan va kreditlanadigan schyotlar hamda summa ko'rsatilgan holda qayd etish.","Бухгалтерская проводка","Запись операции с указанием дебетуемого и кредитуемого счетов и суммы.","Journal entry","A record of a transaction showing the debited and credited accounts and amounts."],["buh","Jurnal","Operatsiyalar xronologik tartibda dastlab yoziladigan buxgalteriya registri.","Журнал операций","Учётный регистр, в котором операции записываются в хронологическом порядке.","Journal","The book of original entry recording transactions in chronological order."],["buh","Bosh kitob","Barcha schyotlar bo'yicha yozuvlar jamlanadigan asosiy buxgalteriya registri.","Главная книга","Основной учётный регистр, где сводятся записи по всем счетам.","General ledger","The main record that compiles the entries of all accounts."],["buh","Sinov balansi","Barcha schyotlar qoldiqlari va aylanmalarining debet va kredit tengligini tekshiruvchi qaydnoma.","Оборотно-сальдовая ведомость","Ведомость остатков и оборотов по счетам, проверяющая равенство дебета и кредита.","Trial balance","A list of account balances used to verify that total debits equal total credits."],["buh","Birlamchi hujjat","Xo'jalik operatsiyasi sodir bo'lganini tasdiqlovchi dastlabki hujjat.","Первичный документ","Документ, подтверждающий факт совершения хозяйственной операции.","Source document","A document providing initial evidence that a transaction occurred."],["buh","Hisob siyosati","Tashkilot hisobni yuritish va hisobot tuzishda qo'llaydigan tamoyil va usullar to'plami.","Учётная политика","Совокупность принципов и методов, применяемых организацией при ведении учёта и составлении отчётности.","Accounting policy","The principles and methods an entity adopts in keeping accounts and preparing reports."],["buh","Hisoblash usuli","Daromad va xarajatlarni pul kelgan yoki ketgan paytdan qat'i nazar, yuz bergan davrda tan olish usuli.","Метод начисления","Метод признания доходов и расходов в периоде их возникновения независимо от движения денег.","Accrual basis","Recognizing revenues and expenses when earned or incurred, regardless of cash timing."],["buh","Kassa usuli","Daromad va xarajatlarni pul haqiqatda olingan yoki to'langan paytda tan olish usuli.","Кассовый метод","Метод признания доходов и расходов в момент фактического получения или выплаты денег.","Cash basis","Recognizing revenues and expenses only when cash is received or paid."],["buh","Daromadni tan olish","Tushumni qaysi davrda va qanday shartlarda hisobotda aks ettirish qoidasi.","Признание выручки","Правило определения периода и условий отражения выручки в отчётности.","Revenue recognition","The rule for deciding when and how revenue is reported."],["buh","Moslik tamoyili","Xarajatlarni ular keltirgan daromad bilan bir davrda tan olish talabi.","Принцип соответствия","Требование признавать расходы в том же периоде, что и связанные с ними доходы.","Matching principle","The requirement to recognize expenses in the same period as the related revenue."],["buh","Faoliyatning uzluksizligi","Tashkilot yaqin kelajakda faoliyatini davom ettiradi degan hisob farazi.","Допущение непрерывности деятельности","Допущение, что организация продолжит деятельность в обозримом будущем.","Going concern","The assumption that an entity will continue operating for the foreseeable future."],["buh","Ehtiyotkorlik tamoyili","Daromad va aktivlarni oshirib, xarajat va majburiyatlarni kamaytirib ko'rsatmaslik talabi.","Принцип осмотрительности","Требование не завышать доходы и активы и не занижать расходы и обязательства.","Prudence","The requirement not to overstate income and assets or understate expenses and liabilities."],["buh","Muhimlilik","Axborotni chetlab o'tish yoki noto'g'ri ko'rsatish foydalanuvchilar qaroriga ta'sir qilishi mumkinligi.","Существенность","Свойство информации, пропуск или искажение которой может повлиять на решения пользователей.","Materiality","The extent to which omitting or misstating information could affect users' decisions."],["buh","Aylanma aktivlar","Bir yil yoki operatsion sikl ichida pulga aylanishi kutiladigan aktivlar.","Оборотные активы","Активы, которые предполагается обратить в деньги в течение года или операционного цикла.","Current assets","Assets expected to be turned into cash within a year or the operating cycle."],["buh","Uzoq muddatli aktivlar","Bir yildan ortiq muddat davomida foydalaniladigan aktivlar.","Внеоборотные активы","Активы, используемые в течение срока более одного года.","Non-current assets","Assets expected to be used for longer than one year."],["buh","Asosiy vositalar","Ishlab chiqarish yoki boshqaruvda uzoq muddat foydalaniladigan moddiy aktivlar.","Основные средства","Материальные активы, длительно используемые в производстве или управлении.","Property, plant and equipment","Tangible assets used for a long period in production or administration."],["buh","Eskirish","Asosiy vositalar qiymatini foydali xizmat muddati davomida xarajatga o'tkazish jarayoni.","Амортизация основных средств","Процесс отнесения стоимости основных средств на расходы в течение срока полезного использования.","Depreciation","The allocation of a fixed asset's cost to expense over its useful life."],["buh","Nomoddiy aktivlar amortizatsiyasi","Nomoddiy aktivlar qiymatini foydalanish muddati davomida xarajatga o'tkazish.","Амортизация нематериальных активов","Отнесение стоимости нематериальных активов на расходы в течение срока использования.","Amortization","The allocation of an intangible asset's cost to expense over its useful life."],["buh","To'g'ri chiziqli usul","Eskirishni foydali xizmat muddati davomida har yili teng miqdorda hisoblash usuli.","Линейный метод","Метод начисления амортизации равными суммами в каждый год срока полезного использования.","Straight-line method","A depreciation method charging an equal amount each year of the useful life."],["buh","Kamayuvchi qoldiq usuli","Eskirishni qoldiq qiymatga doimiy foiz qo'llab, dastlabki yillarda ko'proq hisoblash usuli.","Метод уменьшаемого остатка","Метод амортизации, применяющий постоянную ставку к остаточной стоимости, с большими суммами в первые годы.","Declining balance method","An accelerated method applying a fixed rate to the remaining book value."],["buh","Ishlab chiqarish hajmiga mutanosib usul","Eskirishni mahsulot hajmi yoki ishlash soatiga qarab hisoblash usuli.","Производительный метод","Метод амортизации в зависимости от объёма продукции или отработанных часов.","Units of production method","A depreciation method based on output or hours actually used."],["buh","Tugatish qiymati","Foydali xizmat muddati oxirida aktivdan olinishi kutilgan taxminiy summa.","Ликвидационная стоимость","Сумма, которую ожидается получить от актива по окончании срока его полезного использования.","Residual value","The estimated amount obtainable from an asset at the end of its useful life."],["buh","Boshlang'ich qiymat","Aktivni sotib olish va foydalanishga tayyorlash uchun sarflangan xarajatlar yig'indisi.","Первоначальная стоимость","Сумма затрат на приобретение актива и приведение его в состояние готовности к использованию.","Historical cost","The total amount spent to acquire an asset and make it ready for use."],["buh","Qoldiq qiymat","Boshlang'ich qiymatdan jamlangan eskirish chiqarilgandan keyingi aktiv qiymati.","Остаточная стоимость","Стоимость актива за вычетом накопленной амортизации.","Carrying amount","The asset's cost less accumulated depreciation."],["buh","Qayta baholash","Aktivlarni joriy haqiqiy qiymatga muvofiqlashtirib balans qiymatini o'zgartirish.","Переоценка","Изменение балансовой стоимости активов в соответствии с их текущей справедливой стоимостью.","Revaluation","Adjusting an asset's carrying amount to reflect its current fair value."],["buh","Qadrsizlanish","Aktiv qoldiq qiymati uning qoplanadigan qiymatidan oshib ketishi va zararni tan olish.","Обесценение активов","Ситуация, когда балансовая стоимость актива превышает возмещаемую, и признаётся убыток.","Impairment","A loss recognized when an asset's carrying amount exceeds its recoverable amount."],["buh","Foydali xizmat muddati","Aktiv tashkilot uchun naf keltirishi kutiladigan davr.","Срок полезного использования","Период, в течение которого актив, как ожидается, приносит выгоду организации.","Useful life","The period over which an asset is expected to benefit the entity."],["buh","Nomoddiy aktivlar","Jismoniy shaklga ega bo'lmagan, lekin naf keltiradigan aktivlar, masalan patent yoki dasturiy ta'minot.","Нематериальные активы","Активы без физической формы, приносящие выгоду, например патенты или программное обеспечение.","Intangible assets","Non-physical assets that provide benefits, such as patents or software."],["buh","Gudvill","Biznesni sotib olishda to'langan narxning sotib olingan sof aktivlar haqiqiy qiymatidan ortiq qismi.","Гудвилл","Превышение цены приобретения бизнеса над справедливой стоимостью приобретённых чистых активов.","Goodwill","The excess of a business's purchase price over the fair value of its net assets."],["buh","FIFO usuli","Birinchi kelgan zaxiralar birinchi sarflanadi deb hisoblaydigan baholash usули.","Метод ФИФО","Метод оценки запасов, исходя из того, что первыми списываются первые поступившие запасы.","FIFO method","An inventory method assuming the earliest purchased items are used or sold first."],["buh","LIFO usuli","Oxirgi kelgan zaxiralar birinchi sarflanadi deb hisoblaydigan baholash usули.","Метод ЛИФО","Метод оценки запасов, исходя из того, что первыми списываются последние поступившие запасы.","LIFO method","An inventory method assuming the most recently purchased items are used or sold first."],["buh","O'rtacha tortilgan tannarx usuli","Zaxiralarni ularning o'rtacha vaznli tannarxi bo'yicha baholash usули.","Метод средневзвешенной стоимости","Метод оценки запасов по их средневзвешенной себестоимости.","Weighted average cost method","An inventory method valuing items at their weighted average cost."],["buh","Inventarizatsiya","Aktivlar va majburiyatlarning haqiqiy mavjudligini hisob ma'lumotlari bilan tekshirish.","Инвентаризация","Проверка фактического наличия активов и обязательств и сопоставление с данными учёта.","Stocktaking","Verifying the actual existence of assets and liabilities against accounting records."],["buh","Sotilgan mahsulot tannarxi","Davrda sotilgan tovar yoki mahsulotni ishlab chiqarish yoki sotib olish bilan bog'liq xarajatlar.","Себестоимость проданной продукции","Затраты на производство или приобретение товаров и продукции, реализованных за период.","Cost of goods sold","The direct costs of producing or buying the goods sold during a period."],["buh","Debitorlik qarzlari","Mijozlar va boshqa shaxslarning tashkilot oldidagi to'lanmagan qarzlari.","Дебиторская задолженность","Неоплаченная задолженность покупателей и других лиц перед организацией.","Accounts receivable","Amounts owed to the entity by customers and other parties."],["buh","Kreditorlik qarzlari","Tashkilotning yetkazib beruvchilar va boshqa shaxslar oldidagi to'lanmagan qarzlari.","Кредиторская задолженность","Неоплаченная задолженность организации перед поставщиками и другими лицами.","Accounts payable","Amounts the entity owes to suppliers and other parties."],["buh","Shubhali qarzlar zaxirasi","Debitorlik qarzining to'lanmay qolish xavfi uchun tuziladigan zaxira.","Резерв по сомнительным долгам","Резерв, создаваемый на случай неоплаты дебиторской задолженности.","Allowance for doubtful accounts","A reserve set aside for receivables that may not be collected."],["buh","Umidsiz qarzni hisobdan chiqarish","Undirib bo'lmaydigan qarzni balansdan chiqarish.","Списание безнадёжного долга","Исключение из баланса задолженности, взыскание которой невозможно.","Bad debt write-off","Removing a receivable from the books because it cannot be collected."],["buh","Uzoq muddatli majburiyatlar","To'lov muddati bir yildan oshadigan majburiyatlar.","Долгосрочные обязательства","Обязательства со сроком погашения более одного года.","Non-current liabilities","Obligations due for settlement after more than one year."],["buh","Zaxira","Muddati yoki summasi noaniq bo'lgan kelgusi majburiyat uchun tan olinadigan majburiyat.","Оценочное обязательство","Обязательство с неопределённым сроком или суммой, признаваемое в учёте.","Provision","A liability of uncertain timing or amount recognized in the accounts."],["buh","Shartli majburiyat","Kelajakdagi noaniq hodisaga bog'liq bo'lgan va balansda tan olinmaydigan potensial majburiyat.","Условное обязательство","Потенциальное обязательство, зависящее от неопределённого будущего события и не признаваемое в балансе.","Contingent liability","A possible obligation depending on an uncertain future event, not recognized on the balance sheet."],["buh","Hisoblangan xarajatlar","Yuz bergan, ammo hali to'lanmagan yoki hujjatlashtirilmagan xarajatlar.","Начисленные расходы","Расходы, которые уже возникли, но ещё не оплачены или не оформлены документально.","Accrued expenses","Expenses incurred but not yet paid or invoiced."],["buh","Kechiktirilgan daromad","Pul olingan, ammo hali ishlab topilmagan daromad, majburiyat sifatida aks etadi.","Доходы будущих периодов","Полученные деньги за ещё не оказанные товары или услуги, отражаемые как обязательство.","Deferred revenue","Cash received for goods or services not yet delivered, shown as a liability."],["buh","Oldindan to'langan xarajatlar","Kelgusi davrlarga tegishli bo'lib, oldindan to'langan xarajatlar.","Расходы будущих периодов","Расходы, оплаченные заранее и относящиеся к последующим периодам.","Prepaid expenses","Costs paid in advance that relate to future periods."],["buh","Ustav kapitali","Ta'sischilar tomonidan tashkilot faoliyatini ta'minlash uchun kiritilgan, ro'yxatdan o'tgan kapital.","Уставный капитал","Зарегистрированный капитал, внесённый учредителями для обеспечения деятельности организации.","Share capital","The registered capital contributed by founders to start and support the company."],["buh","Qo'shimcha kapital","Aksiyalarning nominaldan yuqori sotilishidan va qayta baholashdan hosil bo'lgan kapital.","Добавочный капитал","Капитал, образующийся от продажи акций выше номинала и от переоценки.","Additional paid-in capital","Capital arising from share issues above par value and similar sources."],["buh","Xazina aksiyalari","Emitent tomonidan qayta sotib olingan o'z aksiyalari.","Выкупленные собственные акции","Собственные акции, повторно выкупленные у акционеров эмитентом.","Treasury shares","A company's own shares that it has repurchased."],["buh","Qo'shilgan qiymat solig'i hisobi","Xarid va sotuvdagi QQS summalarini alohida schyotlarda yuritib, byudjet bilan hisob-kitob qilish.","Учёт налога на добавленную стоимость","Ведение сумм НДС по покупкам и продажам на отдельных счетах и расчёты с бюджетом.","VAT accounting","Tracking VAT on purchases and sales in separate accounts and settling the net with the budget."],["buh","Kirim QQS","Xaridlar bo'yicha yetkazib beruvchiga to'langan va hisobga olinadigan QQS summasi.","Входной НДС","Сумма НДС, уплаченная поставщику при покупке и принимаемая к зачёту.","Input VAT","VAT paid to suppliers on purchases that can be offset."],["buh","Chiqim QQS","Sotilgan tovar va xizmatlar bo'yicha xaridordan olinib, byudjetga to'lanadigan QQS.","Исходящий НДС","НДС, начисленный покупателю при реализации и подлежащий уплате в бюджет.","Output VAT","VAT charged to customers on sales and owed to the tax authority."],["buh","Ish haqi hisobi","Xodimlarga mehnat uchun hisoblangan to'lovlar, ushlanmalar va to'lovlarni qayd etish.","Учёт расчётов по оплате труда","Учёт начисленных работникам выплат, удержаний и фактических расчётов.","Payroll accounting","Recording employees' wages earned, deductions withheld and payments made."],["buh","Ushlanmalar","Ish haqidan soliqlar, aliment va boshqa asoslar bo'yicha ayirib qolinadigan summalar.","Удержания","Суммы, вычитаемые из заработной платы по налогам, алиментам и другим основаниям.","Payroll deductions","Amounts withheld from wages for taxes, support payments and other reasons."],["buh","Jismoniy shaxslardan daromad solig'i","Xodimlarning daromadidan ushlanib byudjetga o'tkaziladigan shaxsiy soliq.","Подоходный налог с физических лиц","Налог с доходов работников, удерживаемый работодателем и перечисляемый в бюджет.","Personal income tax","A tax on individuals' earnings, withheld by the employer and paid to the budget."],["buh","Ijtimoiy soliq","Ish beruvchi ish haqi fondidan to'laydigan ijtimoiy ta'minot uchun soliq.","Социальный налог","Налог на фонд оплаты труда, уплачиваемый работодателем на социальное обеспечение.","Social tax","A payroll-based tax paid by employers to fund social security."],["buh","Foyda solig'i","Tashkilotning soliqqa tortiladigan foydasidan to'lanadigan soliq.","Налог на прибыль","Налог, уплачиваемый с налогооблагаемой прибыли организации.","Corporate income tax","A tax levied on a company's taxable profit."],["buh","Kechiktirilgan soliq","Buxgalteriya va soliq hisobi orasidagi vaqtinchalik farqlardan kelib chiqadigan soliq summasi.","Отложенный налог","Сумма налога, возникающая из временных различий между бухгалтерским и налоговым учётом.","Deferred tax","Tax arising from temporary differences between accounting and tax profit."],["buh","Yalpi foyda","Daromaddan sotilgan mahsulot tannarxi ayirilgandan keyingi foyda.","Валовая прибыль","Прибыль после вычета себестоимости проданной продукции из выручки.","Gross profit","Revenue minus the cost of goods sold."],["buh","Operatsion foyda","Yalpi foydadan operatsion xarajatlar chiqarilgandan keyingi foyda.","Операционная прибыль","Прибыль после вычета операционных расходов из валовой прибыли.","Operating profit","Gross profit less operating expenses."],["buh","Sof foyda","Barcha xarajatlar va soliqlar chiqarilgandan keyin qoladigan yakuniy foyda.","Чистая прибыль","Итоговая прибыль после вычета всех расходов и налогов.","Net profit","The final profit remaining after all expenses and taxes."],["buh","EBITDA","Foiz, soliq, eskirish va amortizatsiyadan oldingi foyda, operatsion samaradorlik ko'rsatkichi.","EBITDA","Прибыль до вычета процентов, налогов, износа и амортизации, показатель операционной эффективности.","EBITDA","Earnings before interest, taxes, depreciation and amortization, a measure of operating performance."],["buh","Davr xarajatlari","Mahsulot tannarxiga kiritilmay, paydo bo'lgan davrda xarajat deb tan olinadigan sarflar.","Периодические расходы","Затраты, не включаемые в себестоимость и признаваемые расходами периода возникновения.","Period costs","Costs expensed in the period incurred rather than included in product cost."],["buh","Bevosita xarajatlar","Muayyan mahsulot yoki xizmatga to'g'ridan-to'g'ri bog'lash mumkin bo'lgan xarajatlar.","Прямые затраты","Затраты, которые можно непосредственно отнести на конкретный продукт или услугу.","Direct costs","Costs that can be traced directly to a specific product or service."],["buh","Egri xarajatlar","Bir nechta mahsulotga tegishli bo'lib, taqsimlash orqali bog'lanadigan xarajatlar.","Косвенные затраты","Затраты, относящиеся к нескольким продуктам и распределяемые между ними.","Indirect costs","Costs shared by several products and allocated among them."],["buh","Umumishlab chiqarish xarajatlari","Ishlab chiqarishga xizmat qiladigan, bevosita bog'lanmaydigan xarajatlar, masalan sex ijarasi.","Накладные расходы","Затраты на обслуживание производства, не относимые напрямую, например аренда цеха.","Overhead","Production-support costs not directly traceable, such as factory rent."],["buh","Xarajatlar hisobi","Mahsulot va xizmatlar tannarxini shakllantiruvchi xarajatlarni yig'ish va taqsimlash tizimi.","Учёт затрат","Система сбора и распределения затрат, формирующих себестоимость продукции и услуг.","Cost accounting","A system collecting and allocating costs to determine the cost of products and services."],["buh","Tannarx kalkulyatsiyasi","Mahsulot birligi tannarxini xarajat moddalari bo'yicha hisoblash.","Калькуляция себестоимости","Расчёт себестоимости единицы продукции по статьям затрат.","Product costing","Calculating the cost of one product unit by cost element."],["buh","Buyurtma bo'yicha hisob","Xarajatlarni alohida buyurtma yoki loyihalar bo'yicha yig'ish usули.","Позаказный метод учёта","Метод сбора затрат по отдельным заказам или проектам.","Job costing","Accumulating costs for individual orders or projects."],["buh","Jarayon bo'yicha hisob","Xarajatlarni ishlab chiqarish bosqichlari bo'yicha yig'ib, o'xshash mahsulotga taqsimlash usули.","Попроцессный метод учёта","Метод сбора затрат по стадиям производства с распределением на однородную продукцию.","Process costing","Accumulating costs by production stage and spreading them over identical units."],["buh","Standart xarajatlar","Oldindan belgilangan me'yoriy tannarx, haqiqiy xarajatlar bilan solishtirish uchun ishlatiladi.","Нормативные затраты","Заранее установленная нормативная себестоимость, сопоставляемая с фактическими затратами.","Standard costing","Using predetermined costs as benchmarks to compare with actual costs."],["buh","Faoliyat asosidagi xarajatlar hisobi","Egri xarajatlarni ularni keltirib chiqargan faoliyat turlari bo'yicha taqsimlovchi usул (ABC).","Функциональный учёт затрат","Метод распределения косвенных затрат по видам деятельности, их вызывающим (ABC).","Activity-based costing","A method assigning overhead to products based on the activities that drive costs."],["buh","Boshqaruv hisobi","Rahbariyat qarorlari uchun ichki foydalanishga mo'ljallangan axborot tizimi.","Управленческий учёт","Система информации для внутреннего использования, предназначенная для управленческих решений.","Managerial accounting","Accounting information prepared for internal management decisions."],["buh","Moliyaviy hisob","Tashkilot haqida tashqi foydalanuvchilar uchun standartlar asosida hisobot tayyorlash.","Финансовый учёт","Подготовка отчётности об организации для внешних пользователей по установленным стандартам.","Financial accounting","Preparing standardized reports for external users of an organization's finances."],["buh","Byudjetlashtirish","Kelgusi davr daromad, xarajat va resurslarini rejalashtirish va nazorat qilish jarayoni.","Бюджетирование","Процесс планирования и контроля доходов, расходов и ресурсов на будущий период.","Budgeting","The process of planning and controlling future revenues, expenses and resources."],["buh","Moslashuvchan byudjet","Faoliyat hajmi o'zgarishiga qarab qayta hisoblanadigan byudjet.","Гибкий бюджет","Бюджет, пересчитываемый в зависимости от фактического объёма деятельности.","Flexible budget","A budget adjusted for the actual level of activity."],["buh","Chetlanishlar tahlili","Haqiqiy va rejalashtirilgan ko'rsatkichlar farqini va uning sabablarini o'rganish.","Анализ отклонений","Изучение разницы между фактическими и плановыми показателями и её причин.","Variance analysis","Examining differences between actual and planned results and their causes."],["buh","Qoplash marjasi","Sotuv daromadidan o'zgaruvchan xarajatlar ayirilgan qoldiq, doimiy xarajatlarni qoplaydi.","Маржинальная прибыль","Выручка за вычетом переменных затрат, покрывающая постоянные затраты.","Contribution margin","Sales revenue minus variable costs, available to cover fixed costs."],["buh","Xavfsizlik zaxirasi","Haqiqiy sotuvning zararsizlik nuqtasidan ortiq qismi.","Запас финансовой прочности","Превышение фактических продаж над точкой безубыточности.","Margin of safety","The amount by which actual sales exceed break-even sales."],["buh","Konsolidatsiya","Bosh va sho'ba tashkilotlar hisobotini yagona guruh hisoboti sifatida birlashtirish.","Консолидация","Объединение отчётности материнской и дочерних организаций в единую отчётность группы.","Consolidation","Combining parent and subsidiary statements into one set of group statements."],["buh","Sho'ba korxona","Boshqa tashkilot nazorat qiladigan korxona.","Дочерняя компания","Компания, контролируемая другой организацией.","Subsidiary","An entity controlled by another entity."],["buh","Nazorat bo'lmagan ulush","Konsolidatsiyalangan sho'ba kapitalining bosh tashkilotga tegishli bo'lmagan qismi.","Неконтролирующая доля","Часть капитала консолидируемой дочерней компании, не принадлежащая материнской.","Non-controlling interest","The part of a subsidiary's equity not owned by the parent."],["buh","Biznesni birlashtirish","Bir tashkilotning boshqa biznesni nazorat qilish huquqini sotib olishi.","Объединение бизнеса","Приобретение одной организацией контроля над другим бизнесом.","Business combination","A transaction in which an acquirer obtains control of another business."],["buh","Kapitaldagi ulush usuli","Sheriklik investitsiyasini sherik foydasidagi ulush hisobiga yangilab boruvchi hisob usули.","Метод долевого участия","Метод учёта инвестиции, корректируемой на долю инвестора в результатах объекта вложений.","Equity method","An investment method adjusted for the investor's share of the investee's results."],["buh","Moliyaviy ijara","Aktivga egalik xavf va naflarining deyarli barchasi ijarachiga o'tadigan ijara.","Финансовая аренда","Аренда, при которой практически все риски и выгоды владения активом переходят арендатору.","Finance lease","A lease transferring substantially all ownership risks and rewards to the lessee."],["buh","Operatsion ijara","Egalik xavf va naflari ijaraga beruvchida qoladigan ijara.","Операционная аренда","Аренда, при которой риски и выгоды владения остаются у арендодателя.","Operating lease","A lease where ownership risks and rewards stay with the lessor."],["buh","Haqqoniy qiymat","Bozor ishtirokchilari orasidagi odatiy bitimda aktiv sotilishi mumkin bo'lgan narx.","Справедливая стоимость","Цена, по которой актив мог бы быть продан в обычной сделке между участниками рынка.","Fair value","The price at which an asset could be sold in an orderly market transaction."],["buh","Valyuta kursi farqi","Chet el valyutasidagi operatsiyalarni kurs o'zgarishi tufayli qayta hisoblashdan kelib chiqadigan farq.","Курсовая разница","Разница, возникающая при пересчёте операций в иностранной валюте из-за изменения курса.","Exchange difference","A gain or loss from translating foreign-currency items at changing rates."],["buh","Moliyaviy hisobotning xalqaro standartlari","Xalqaro buxgalteriya standartlari kengashi chiqargan, ko'p mamlakatlarda qo'llanuvchi hisobot standartlari (XHXS).","Международные стандарты финансовой отчётности","Стандарты отчётности, выпускаемые Советом по МСФО и применяемые во многих странах (МСФО).","IFRS","International Financial Reporting Standards issued by the IASB and used in many countries."],["buh","Buxgalteriya hisobining milliy standartlari","O'zbekistonda hisobni yuritishning majburiy tartibini belgilovchi milliy standartlar (BHMS).","Национальные стандарты бухгалтерского учёта","Национальные стандарты Узбекистана, определяющие обязательный порядок ведения учёта (НСБУ).","National accounting standards","Country-specific standards setting mandatory bookkeeping rules, such as Uzbekistan's NAS."],["buh","GAAP","AQShda qo'llaniladigan, umume'tirof etilgan buxgalteriya hisobi tamoyillari to'plami.","GAAP","Свод общепринятых принципов бухгалтерского учёта, применяемых в США.","GAAP","Generally Accepted Accounting Principles, the accounting rules used in the United States."],["buh","Audit","Moliyaviy hisobotning ishonchliligi bo'yicha mustaqil fikr bildirish uchun o'tkaziladigan tekshiruv.","Аудит","Независимая проверка отчётности для выражения мнения о её достоверности.","Audit","An independent examination of financial statements to express an opinion on their fairness."],["buh","Auditor","Audit o'tkazish huquqiga ega bo'lgan mustaqil malakali mutaxassis.","Аудитор","Независимый квалифицированный специалист, имеющий право проводить аудит.","Auditor","An independent qualified professional who performs audits."],["buh","Auditor xulosasi","Auditorning hisobot ishonchliligi haqidagi rasmiy fikri.","Аудиторское заключение","Официальное мнение аудитора о достоверности отчётности.","Auditor's report","The auditor's formal opinion on whether the statements are fairly presented."],["buh","Audit riski","Auditor moddiy xatolar mavjud hisobotga noto'g'ri ijobiy fikr berish xavfi.","Аудиторский риск","Риск того, что аудитор выразит неверное мнение о отчётности с существенными искажениями.","Audit risk","The risk of giving an incorrect opinion on materially misstated statements."],["buh","Audit dalillari","Auditor fikrini asoslash uchun to'plangan ma'lumot va hujjatlar.","Аудиторские доказательства","Информация и документы, собранные аудитором для обоснования своего мнения.","Audit evidence","Information gathered by the auditor to support the audit opinion."],["buh","Audit namunasi","Barcha operatsiyalarni emas, ularning bir qismini tekshirish orqali xulosa chiqarish usули.","Аудиторская выборка","Метод формирования вывода путём проверки части, а не всех операций.","Audit sampling","Drawing conclusions by testing part of a population of transactions."],["buh","Ichki nazorat","Tashkilot maqsadlariga erishish, aktivlarni saqlash va hisob ishonchliligini ta'minlovchi tartiblar tizimi.","Внутренний контроль","Система процедур, обеспечивающих достижение целей, сохранность активов и достоверность учёта.","Internal control","Procedures that protect assets, ensure reliable records and support organizational goals."],["buh","Ichki audit","Tashkilot ichida nazorat va boshqaruv samaradorligini mustaqil baholash faoliyati.","Внутренний аудит","Независимая деятельность по оценке эффективности контроля и управления внутри организации.","Internal audit","Independent in-house assessment of controls and governance effectiveness."],["buh","Vazifalarni ajratish","Operatsiyaning turli bosqichlarini turli xodimlarga topshirib, firibgarlik xavfini kamaytirish.","Разделение обязанностей","Распределение этапов операции между разными работниками для снижения риска мошенничества.","Segregation of duties","Assigning different stages of a process to different people to reduce fraud risk."],["buh","Firibgarlik","Moliyaviy manfaat olish maqsadida qasddan aldash yoki hisobotni buzib ko'rsatish.","Мошенничество","Умышленный обман или искажение отчётности с целью получения финансовой выгоды.","Fraud","Intentional deception or misstatement for financial gain."],["buh","Moliyaviy tahlil koeffitsientlari","Hisobot ma'lumotlari asosida likvidlik, rentabellik va to'lovga layoqatlikni baholovchi nisbatlar.","Финансовые коэффициенты","Показатели, оценивающие ликвидность, рентабельность и платёжеспособность по данным отчётности.","Financial ratios","Ratios from statements assessing liquidity, profitability and solvency."],["buh","Sof aylanma kapital","Aylanma aktivlar bilan qisqa muddatli majburiyatlar orasidagi farq.","Чистый оборотный капитал","Разность между оборотными активами и краткосрочными обязательствами.","Net working capital","Current assets minus current liabilities."],["buh","Kassa operatsiyalari hisobi","Naqd pulning kirim va chiqimini kassa hujjatlari asosida qayd etish.","Учёт кассовых операций","Регистрация поступлений и выдач наличных денег на основании кассовых документов.","Cash accounting records","Recording cash receipts and payments from cash documents."],["buh","Bank bilan solishtirish","Kompaniya pul schyoti qoldig'ini bank ko'chirmasi bilan tekshirib, farqlarni aniqlash.","Банковская сверка","Сопоставление остатка по счёту организации с банковской выпиской для выявления расхождений.","Bank reconciliation","Comparing the company's cash records with the bank statement to explain differences."],["buh","Buxgalteriya hisobining tartib-qoidasi","Hisobni yuritishning umumiy qoidalari: ob'ektlarni baholash, hujjatlashtirish va saqlash talablari.","Правила ведения бухгалтерского учёта","Общие правила учёта: требования к оценке, документированию и хранению данных.","Bookkeeping rules","General rules for valuing, documenting and retaining accounting records."],["buh","Yillik hisobot","Tashkilotning yil yakunidagi moliyaviy holati va natijalarini ko'rsatuvchi hisobotlar to'plami.","Годовая отчётность","Комплект отчётов о финансовом положении и результатах организации по итогам года.","Annual report","A set of reports on a company's financial position and results for the year."],["buh","Hisobot davri","Moliyaviy hisobot tuziladigan vaqt oralig'i, odatda bir yil.","Отчётный период","Промежуток времени, за который составляется отчётность, обычно год.","Reporting period","The time span covered by financial statements, usually one year."],["buh","Yopish yozuvlari","Davr oxirida daromad va xarajat schyotlarini yopib, natijani kapitalga o'tkazuvchi yozuvlar.","Закрытие счетов","Проводки в конце периода, закрывающие счета доходов и расходов и переносящие результат в капитал.","Closing entries","Entries that close revenue and expense accounts and move the result to equity."],["buh","Tuzatish yozuvlari","Davr oxirida hisoblash tamoyiliga muvofiq daromad va xarajatlarni to'g'rilovchi yozuvlar.","Корректирующие проводки","Проводки на конец периода, приводящие доходы и расходы в соответствие с методом начисления.","Adjusting entries","Period-end entries that align revenues and expenses with the accrual basis."],["buh","Soliq hisobi","Soliq bazasini va soliq summalarini qonunchilikka muvofiq aniqlash uchun yuritiladigan hisob.","Налоговый учёт","Учёт для определения налоговой базы и сумм налогов в соответствии с законодательством.","Tax accounting","Accounting kept to determine taxable income and tax due under tax law."],["buh","Transfert narxlash hujjatlari","Bog'liq tomonlar orasidagi bitimlar narxining bozor darajasiga mosligini asoslovchi hujjat.","Документация по трансфертному ценообразованию","Документ, обосновывающий соответствие цен сделок между связанными сторонами рыночному уровню.","Transfer pricing documentation","Records showing that prices between related parties match market levels."],["buh","Moliyaviy instrumentlar","Bir tomonda moliyaviy aktiv, boshqa tomonda majburiyat yoki kapital hosil qiluvchi shartnomalar.","Финансовые инструменты","Договоры, создающие у одной стороны финансовый актив, а у другой обязательство или капитал.","Financial instruments","Contracts giving rise to a financial asset for one party and a liability or equity for another."],["bnk","Bank","Pul mablag'larini jalb qilish, kreditlash va to'lovlarni amalga oshirish bilan shug'ullanuvchi litsenziyalangan moliyaviy tashkilot.","Банк","Лицензированная финансовая организация, которая привлекает средства, выдаёт кредиты и проводит платежи.","Bank","A licensed financial institution that accepts deposits, makes loans and processes payments."],["bnk","Qarz (ssuda)","Qarz oluvchi belgilangan muddatda asosiy summani va foizni qaytarishga majbur bo'lgan pul summasi.","Ссуда","Сумма денег, которую заёмщик обязан вернуть в срок вместе с процентами.","Loan","A sum of money lent that the borrower must repay with interest by an agreed date."],["bnk","Annuitet to'lovi","Kredit muddati davomida har oy bir xil miqdorda to'lanadigan, asosiy qarz va foizdan iborat to'lov.","Аннуитетный платёж","Равный ежемесячный платёж по кредиту, включающий часть основного долга и проценты.","Annuity payment","A fixed monthly loan payment that covers both interest and part of the principal."],["bnk","Differensial to'lov","Asosiy qarz teng ulushlarda, foiz esa qoldiq qarzdan hisoblanadigan, vaqt o'tishi bilan kamayuvchi to'lov.","Дифференцированный платёж","Платёж, при котором основной долг гасится равными частями, а проценты считаются на остаток и снижаются.","Differentiated payment","A repayment scheme with equal principal portions and interest on the balance, so payments decline over time."],["bnk","Effektiv foiz stavkasi","Barcha komissiya va to'lovlarni hisobga olgan holda kreditning haqiqiy yillik qiymatini ko'rsatuvchi stavka.","Эффективная процентная ставка","Ставка, показывающая реальную годовую стоимость кредита с учётом всех комиссий и платежей.","Effective interest rate (APR)","The true yearly cost of a loan including all fees and charges, not just the nominal rate."],["bnk","Kafil","Qarz oluvchi majburiyatini bajarmasa, uning o'rniga qarzni to'lashga majbur bo'lgan shaxs.","Поручитель","Лицо, которое обязуется погасить долг заёмщика, если тот не выполнит обязательства.","Guarantor","A person who promises to repay a borrower's debt if the borrower fails to do so."],["bnk","Kredit skoringi","Mijozning qarzni qaytarish ehtimolini ball bilan baholaydigan statistik tizim.","Кредитный скоринг","Статистическая система, оценивающая в баллах вероятность возврата кредита клиентом.","Credit score","A numerical rating of a borrower's likelihood of repaying debt, based on credit data."],["bnk","Kredit byurosi","Qarz oluvchilarning kredit tarixini to'playdigan, saqlaydigan va banklarga taqdim etadigan tashkilot.","Кредитное бюро","Организация, которая собирает, хранит и предоставляет банкам кредитные истории заёмщиков.","Credit bureau","An agency that collects and supplies lenders with borrowers' credit histories."],["bnk","Muammoli kredit (NPL)","Asosiy qarz yoki foiz to'lovlari uzoq muddat, odatda 90 kundan ortiq kechiktirilgan kredit.","Проблемный кредит (NPL)","Кредит, по которому платежи просрочены надолго, обычно более 90 дней.","Non-performing loan (NPL)","A loan whose payments are overdue, typically by more than 90 days, with doubtful repayment."],["bnk","Overdraft","Mijozga hisobvaraqdagi mablag'dan ortiq summani vaqtincha sarflashga ruxsat beruvchi qisqa muddatli kredit.","Овердрафт","Краткосрочный кредит, позволяющий клиенту временно потратить больше, чем есть на счёте.","Overdraft","A short-term facility letting a customer spend more than the balance in their account."],["bnk","Debet karta","Egasining bankdagi shaxsiy mablag'idan to'lov qilish imkonini beradigan to'lov kartasi.","Дебетовая карта","Платёжная карта, позволяющая расплачиваться собственными деньгами владельца со счёта.","Debit card","A payment card that spends the holder's own money directly from their bank account."],["bnk","Kredit karta","Bank belgilagan limit doirasida qarz hisobiga to'lov qilishga imkon beradigan to'lov kartasi.","Кредитная карта","Платёжная карта, позволяющая расплачиваться в пределах лимита за счёт средств банка.","Credit card","A payment card letting the holder borrow from the bank up to a set limit."],["bnk","Ekvayring","Savdo va xizmat shaxobchalarida bank kartalari orqali to'lovni qabul qilish xizmati.","Эквайринг","Услуга по приёму оплаты банковскими картами в торговых и сервисных точках.","Acquiring","A service that lets merchants accept payments by bank card."],["bnk","Emissiya (kartalar)","Bankning to'lov kartalarini chiqarishi va mijozlarga berishi.","Эмиссия карт","Выпуск банком платёжных карт и передача их клиентам.","Card issuing","A bank's issuance of payment cards to its customers."],["bnk","IBAN","Hisobvaraqni xalqaro to'lovlarda bir xil tarzda aniqlash uchun ishlatiladigan xalqaro bank hisobvaraq raqami.","IBAN","Международный номер банковского счёта, однозначно идентифицирующий счёт при трансграничных платежах.","IBAN","An international bank account number format that identifies an account uniquely in cross-border payments."],["bnk","SWIFT","Banklar o'rtasida xalqaro to'lov xabarlarini xavfsiz almashish tizimi va banklarning noyob kodlari.","SWIFT","Система безопасного обмена платёжными сообщениями между банками мира и уникальные коды банков.","SWIFT","A global messaging network and bank code system used for secure international payment instructions."],["bnk","Korrespondent hisobvaraq","Bankning boshqa bankda ochgan, o'zaro hisob-kitoblar uchun ishlatiladigan hisobvarag'i.","Корреспондентский счёт","Счёт одного банка в другом банке для проведения взаимных расчётов.","Correspondent account","An account one bank holds with another bank to settle transactions between them."],["bnk","Eskrou","Pulni uchinchi tomon saqlab, bitim shartlari bajarilgandan keyin sotuvchiga o'tkazadigan hisobvaraq.","Эскроу","Счёт, на котором третья сторона хранит деньги и переводит их продавцу после выполнения условий сделки.","Escrow","An arrangement where a third party holds funds until the terms of a deal are met."],["bnk","Faktoring","Korxona to'lov muddati kelmagan debitorlik qarzini moliyaviy tashkilotga sotib, pulni darhol oladigan xizmat.","Факторинг","Услуга, при которой компания уступает финансовой организации долги покупателей и сразу получает деньги.","Factoring","Selling unpaid customer invoices to a financial firm to receive cash immediately."],["bnk","Lizing","Mulk egasi uni belgilangan haq evaziga uzoq muddatga foydalanishga beradigan, keyin sotib olish imkoni mavjud ijara.","Лизинг","Долгосрочная аренда имущества за плату, часто с правом последующего выкупа.","Leasing","A long-term rental of equipment or property, often with an option to buy it at the end."],["bnk","Bazel kelishuvlari","Banklarning kapitali, likvidligi va risklarini nazorat qilish bo'yicha xalqaro standartlar to'plami.","Базельские соглашения","Набор международных стандартов по капиталу, ликвидности и рискам банков.","Basel accords","International standards for bank capital, liquidity and risk management."],["bnk","Kapital yetarliligi","Bank xususiy kapitalining uning risk bilan tortilgan aktivlariga nisbati, yo'qotishlarga chidamlilik o'lchovi.","Достаточность капитала","Отношение собственного капитала банка к его активам, взвешенным по риску; мера устойчивости к убыткам.","Capital adequacy","The ratio of a bank's capital to its risk-weighted assets, measuring its ability to absorb losses."],["bnk","Likvidlik koeffitsiyenti","Bankning qisqa muddatli majburiyatlarini bajarish uchun yetarli tez realizatsiya qilinadigan aktivlari borligini ko'rsatuvchi nisbat.","Коэффициент ликвидности","Показатель, отражающий, хватает ли банку быстро реализуемых активов для краткосрочных обязательств.","Liquidity ratio","A measure of whether a bank holds enough liquid assets to meet short-term obligations."],["bnk","Depozitlarni sug'urtalash","Bank to'xtab qolsa, omonatchilarga belgilangan summagacha pulini qaytarib berishni kafolatlovchi tizim.","Страхование вкладов","Система, гарантирующая вкладчикам возврат денег в пределах установленной суммы при банкротстве банка.","Deposit insurance","A scheme guaranteeing depositors' savings up to a limit if a bank fails."],["bnk","Majburiy zaxira talabi","Banklar depozitlarining bir qismini markaziy bankda saqlashga majbur bo'lgan norma.","Обязательные резервы","Норма, обязывающая банки хранить часть привлечённых депозитов в центральном банке.","Reserve requirement","The share of deposits that banks must hold as reserves at the central bank."],["bnk","Inflyatsiyani nishonlash","Markaziy bank inflyatsiyaning aniq maqsadli darajasini e'lon qilib, siyosatini unga erishishga yo'naltirishi.","Таргетирование инфляции","Режим, при котором центральный банк объявляет целевой уровень инфляции и подчиняет ему политику.","Inflation targeting","A policy framework where the central bank announces an inflation goal and steers policy toward it."],["bnk","Bank hisobvarag'i","Mijoz pul mablag'larini saqlash va hisob-kitoblarni amalga oshirish uchun bankda ochgan hisob.","Банковский счёт","Счёт, открытый клиентом в банке для хранения денег и проведения расчётов.","Bank account","An account opened with a bank for holding money and making transactions."],["bnk","Joriy hisobvaraq","Kundalik to'lovlar va tushumlar uchun ishlatiladigan, odatda past yoki nol foizli hisobvaraq.","Текущий счёт","Счёт для ежедневных платежей и поступлений, обычно с низким или нулевым процентом.","Current account","An account for everyday payments and receipts, usually paying little or no interest."],["bnk","Jamg'arma hisobvarag'i","Pulni to'plash va foiz olish uchun mo'ljallangan, kundalik to'lovlar uchun kam ishlatiladigan hisobvaraq.","Сберегательный счёт","Счёт для накопления денег и получения процентов, редко используемый для повседневных платежей.","Savings account","An interest-bearing account designed for accumulating money rather than daily spending."],["bnk","Muddatli depozit","Belgilangan muddat tugaguncha qaytarib olinmaydigan, yuqoriroq foiz to'lanadigan omonat.","Срочный депозит","Вклад, который нельзя забрать до конца срока, но по нему выплачивается повышенный процент.","Term deposit","A deposit locked for a fixed period in exchange for a higher interest rate."],["bnk","Talab qilib olinguncha depozit","Egasi istalgan vaqtda qaytarib olishi mumkin bo'lgan, odatda past foizli omonat.","Депозит до востребования","Вклад, который владелец может забрать в любой момент; процент обычно низкий.","Demand deposit","A deposit the holder can withdraw at any time, typically paying low interest."],["bnk","Bank o'tkazmasi","Pulni bir hisobvaraqdan boshqasiga bank orqali o'tkazish amali.","Банковский перевод","Операция по перечислению денег с одного счёта на другой через банк.","Bank transfer","The movement of money from one account to another through a bank."],["bnk","Bank kafolati","Bank mijoz majburiyati bajarilmasa, uchinchi shaxsga belgilangan summani to'lashga bergan yozma va'dasi.","Банковская гарантия","Письменное обязательство банка выплатить третьему лицу сумму, если клиент не выполнит обязательство.","Bank guarantee","A bank's written promise to pay a third party if its client fails to meet an obligation."],["bnk","Akkreditiv","Bank xaridor topshirig'iga ko'ra sotuvchiga hujjatlar taqdim etilganda to'lovni amalga oshirish majburiyati.","Аккредитив","Обязательство банка по поручению покупателя оплатить продавцу при предъявлении документов.","Letter of credit","A bank's commitment to pay a seller once the required shipping documents are presented."],["bnk","Veksel","Qarzdorning belgilangan muddatda ma'lum summani to'lash haqidagi so'zsiz majburiyatini ifodalovchi qimmatli qog'oz.","Вексель","Ценная бумага с безусловным обязательством должника оплатить сумму в установленный срок.","Bill of exchange","A written order or promise to pay a fixed sum on a specified date."],["bnk","Chek","Chek beruvchining bankka ma'lum summani ko'rsatilgan shaxsga to'lash haqidagi yozma buyrug'i.","Чек","Письменное распоряжение чекодателя банку выплатить указанную сумму предъявителю.","Cheque","A written instruction to a bank to pay a specified amount to the named person."],["bnk","Kliring","Banklar o'rtasidagi o'zaro talab va majburiyatlarni hisobga olib, faqat sof farqni to'lash tizimi.","Клиринг","Система взаимного зачёта требований и обязательств между банками с оплатой лишь чистой разницы.","Clearing","Offsetting mutual claims between banks so that only the net difference is settled."],["bnk","Yalpi hisob-kitob tizimi (RTGS)","Yirik to'lovlarni real vaqt rejimida, har birini alohida va qaytarib bo'lmas tarzda o'tkazuvchi tizim.","Система валовых расчётов (RTGS)","Система проведения крупных платежей в реальном времени, по каждому отдельно и безотзывно.","Real-time gross settlement (RTGS)","A system settling large payments individually, instantly and irrevocably."],["bnk","Mobil banking","Bank xizmatlaridan smartfon ilovasi orqali foydalanish imkoniyati.","Мобильный банкинг","Возможность пользоваться банковскими услугами через приложение на смартфоне.","Mobile banking","Access to banking services through a smartphone app."],["bnk","Internet-banking","Bank operatsiyalarini internet orqali masofadan bajarish xizmati.","Интернет-банкинг","Услуга удалённого проведения банковских операций через интернет.","Online banking","A service for carrying out bank transactions remotely over the internet."],["bnk","POS-terminal","Do'konlarda bank kartasi orqali to'lovni qabul qilishda ishlatiladigan qurilma.","POS-терминал","Устройство для приёма оплаты банковскими картами в торговых точках.","POS terminal","A device in shops used to accept card payments."],["bnk","Bankomat","Mijozlarga naqd pul yechish, kartaga pul qo'yish va boshqa operatsiyalarni xodimsiz bajarishga imkon beruvchi avtomat.","Банкомат","Автомат для снятия и внесения наличных и других операций без участия сотрудника банка.","ATM","A self-service machine for withdrawing cash, depositing money and other basic banking operations."],["bnk","Milliy to'lov tizimi","Mamlakat ichida kartalar va to'lovlarni qayta ishlovchi, Uzcard va Humo kabi infratuzilma.","Национальная платёжная система","Инфраструктура внутри страны для обработки карт и платежей, например Uzcard и Humo.","National payment system","Domestic infrastructure that processes card and other payments, such as Uzcard and Humo in Uzbekistan."],["bnk","Fintex","Moliyaviy xizmatlarni yaxshilash uchun zamonaviy texnologiyalardan foydalanadigan kompaniyalar va yechimlar.","Финтех","Компании и решения, использующие современные технологии для улучшения финансовых услуг.","Fintech","Companies and solutions using modern technology to improve or automate financial services."],["bnk","Neobank","Filiallarsiz, faqat raqamli kanallar orqali ishlaydigan bank.","Необанк","Банк без отделений, работающий только через цифровые каналы.","Neobank","A bank that operates entirely online without physical branches."],["bnk","Ochiq banking","Mijoz roziligi bilan bank ma'lumotlariga uchinchi tomon xizmatlari kirishiga imkon beruvchi tizim.","Открытый банкинг","Модель, при которой сторонние сервисы получают доступ к банковским данным клиента с его согласия.","Open banking","A system giving third-party services access to bank data with the customer's consent."],["bnk","Kredit liniyasi","Bank mijozga belgilangan limit doirasida qismlarga bo'lib kredit olish huquqini beradigan kelishuv.","Кредитная линия","Соглашение, позволяющее заёмщику получать кредит частями в пределах установленного лимита.","Credit line","An agreement allowing a borrower to draw funds as needed up to a set limit."],["bnk","Sindikatlashgan kredit","Bir nechta bank birgalikda yirik mijozga beradigan kredit.","Синдицированный кредит","Крупный кредит, который несколько банков совместно предоставляют одному заёмщику.","Syndicated loan","A large loan provided jointly by a group of banks to one borrower."],["bnk","Iste'mol krediti","Aholiga shaxsiy ehtiyojlar, masalan, maishiy texnika yoki ta'lim uchun beriladigan kredit.","Потребительский кредит","Кредит населению на личные нужды, например на технику или обучение.","Consumer loan","A loan to individuals for personal needs such as appliances or education."],["bnk","Avtokredit","Avtomobil sotib olish uchun beriladigan, odatda shu avtomobil garovi bilan ta'minlangan kredit.","Автокредит","Кредит на покупку автомобиля, обычно обеспеченный залогом самого автомобиля.","Auto loan","A loan for buying a car, usually secured by the vehicle itself."],["bnk","Kreditni restrukturizatsiya qilish","Qarzdorning to'lov qiyinchiliklari tufayli kredit shartlari, masalan, muddati yoki grafigini o'zgartirish.","Реструктуризация кредита","Изменение условий кредита, например срока или графика платежей, из-за трудностей заёмщика.","Loan restructuring","Changing a loan's terms, such as maturity or schedule, because the borrower faces payment difficulties."],["bnk","Jarima foizi (penya)","Shartnomada belgilangan to'lov muddati buzilganda qarzdordan undiriladigan qo'shimcha haq.","Пеня","Дополнительная плата с должника за просрочку платежа сверх срока, установленного договором.","Late payment penalty","An extra charge levied on a borrower who pays after the due date."],["bnk","Imtiyozli davr","Kredit olingandan keyin asosiy qarz yoki foiz to'lanmaydigan dastlabki muddat.","Льготный период","Начальный срок кредита, в течение которого основной долг или проценты не выплачиваются.","Grace period","An initial period of a loan during which principal or interest payments are not required."],["bnk","Kreditni muddatidan oldin so'ndirish","Qarzni shartnomada belgilangan muddatdan oldin to'liq yoki qisman qaytarish.","Досрочное погашение","Полный или частичный возврат кредита раньше срока, предусмотренного договором.","Early repayment","Paying off a loan fully or partly before its scheduled maturity."],["bnk","Bank kapitali","Bankning o'z mablag'lari: ustav kapitali, zaxiralar va taqsimlanmagan foyda yig'indisi.","Капитал банка","Собственные средства банка: уставный капитал, резервы и нераспределённая прибыль.","Bank capital","A bank's own funds: share capital, reserves and retained earnings that absorb losses."],["bnk","Bank balansi","Bankning aktivlari, majburiyatlari va kapitalini muayyan sanada ko'rsatuvchi hisobot.","Баланс банка","Отчёт об активах, обязательствах и капитале банка на определённую дату.","Bank balance sheet","A statement of a bank's assets, liabilities and capital at a given date."],["bnk","Sof foiz marjasi","Bank olgan foiz daromadlari va to'lagan foiz xarajatlari o'rtasidagi farqning aktivlarga nisbati.","Чистая процентная маржа","Разница между процентными доходами и расходами банка, отнесённая к его активам.","Net interest margin","The gap between interest earned and interest paid, relative to a bank's earning assets."],["bnk","Banklarga ommaviy murojaat","Omonatchilar bankka ishonchni yo'qotib, bir vaqtda pullarini yechib olishga shoshilishi.","Паника вкладчиков (набег на банк)","Одновременное массовое изъятие вкладов из-за потери доверия к банку.","Bank run","A sudden mass withdrawal of deposits by customers who fear the bank will fail."],["bnk","Bankrotlik","Qarzdorning kreditorlar oldidagi majburiyatlarini to'lashga qodir emasligi.","Банкротство","Неспособность должника расплатиться по своим обязательствам перед кредиторами.","Bankruptcy","A legal state in which a debtor cannot pay its debts to creditors."],["bnk","Moliyaviy vositachilik","Jamg'armalarni egalaridan olib, qarz oluvchilarga yo'naltiradigan bank va boshqa institutlar faoliyati.","Финансовое посредничество","Деятельность банков и других институтов по перераспределению сбережений от владельцев к заёмщикам.","Financial intermediation","The channelling of savings from savers to borrowers by banks and other institutions."],["bnk","Bank litsenziyasi","Markaziy bank beradigan, bank faoliyati bilan shug'ullanish huquqini beruvchi ruxsatnoma.","Банковская лицензия","Разрешение центрального банка на осуществление банковской деятельности.","Banking licence","Official permission from the central bank to carry on banking business."],["bnk","Mijozni aniqlash (KYC)","Bank mijozning shaxsini va faoliyatini tekshirib, firibgarlik va qonunbuzarlikning oldini olish jarayoni.","Идентификация клиента (KYC)","Процедура проверки личности и деятельности клиента банком для предотвращения мошенничества и нарушений.","Know your customer (KYC)","The process by which a bank verifies a customer's identity and activity to prevent fraud and abuse."],["bnk","Pul yuvishga qarshi kurash (AML)","Jinoiy yo'l bilan topilgan daromadlarni qonuniy ko'rsatishga qarshi qaratilgan chora-tadbirlar.","Противодействие отмыванию денег (AML)","Меры против легализации доходов, полученных преступным путём.","Anti-money laundering (AML)","Rules and measures that prevent criminals from disguising illegal proceeds as legitimate money."],["bnk","Bank siri","Bankning mijozlari hisobvaraqlari va operatsiyalari haqidagi ma'lumotlarni sir saqlash majburiyati.","Банковская тайна","Обязанность банка хранить в тайне сведения о счетах и операциях клиентов.","Banking secrecy","A bank's duty to keep customers' accounts and transactions confidential."],["bnk","Bank nazorati","Markaziy bankning tijorat banklari faoliyatining qonun va me'yorlarga mosligini kuzatishi.","Банковский надзор","Контроль центрального банка за соблюдением коммерческими банками законов и нормативов.","Banking supervision","Oversight by the central bank to ensure commercial banks follow laws and prudential rules."],["bnk","Stress-test","Bank iqtisodiy inqiroz kabi og'ir stsenariylarga chidamliligini baholovchi hisob-kitoblar.","Стресс-тестирование","Расчёты, оценивающие устойчивость банка к тяжёлым сценариям, например экономическому кризису.","Stress test","A simulation assessing whether a bank can withstand severe economic scenarios."],["bnk","Operatsion risk","Xodimlar xatosi, tizim nosozligi yoki tashqi hodisalar tufayli yuzaga keladigan yo'qotish xavfi.","Операционный риск","Риск потерь из-за ошибок персонала, сбоев систем или внешних событий.","Operational risk","The risk of loss from human error, system failures or external events."],["bnk","Sug'urta mukofoti","Sug'urtalanuvchi sug'urta himoyasi uchun sug'urtalovchiga to'laydigan haq.","Страховая премия","Плата, которую страхователь вносит страховщику за страховую защиту.","Insurance premium","The amount a policyholder pays the insurer for coverage."],["bnk","Sug'urta polisi","Sug'urta shartnomasi tuzilganini va uning shartlarini tasdiqlovchi hujjat.","Страховой полис","Документ, подтверждающий заключение договора страхования и его условия.","Insurance policy","The document confirming an insurance contract and stating its terms."],["bnk","Sug'urtalovchi","Sug'urta shartnomasi bo'yicha zararni qoplash majburiyatini oluvchi sug'urta kompaniyasi.","Страховщик","Страховая компания, принимающая на себя обязательство возместить ущерб по договору.","Insurer","The company that accepts the risk and pays claims under an insurance contract."],["bnk","Sug'urtalanuvchi","Sug'urta shartnomasini tuzgan va mukofot to'laydigan shaxs.","Страхователь","Лицо, заключившее договор страхования и уплачивающее премию.","Policyholder","The person or business that buys the insurance policy and pays the premium."],["bnk","Sug'urta hodisasi","Shartnomada nazarda tutilgan, yuz berganda sug'urta to'lovi amalga oshiriladigan voqea.","Страховой случай","Предусмотренное договором событие, при наступлении которого выплачивается страховое возмещение.","Insured event","An occurrence covered by the policy that triggers an insurance payout."],["bnk","Sug'urta summasi","Sug'urtalovchi hodisa yuz berganda to'lashi mumkin bo'lgan eng yuqori pul miqdori.","Страховая сумма","Максимальная сумма, которую страховщик обязан выплатить при наступлении страхового случая.","Sum insured","The maximum amount the insurer will pay when a covered event occurs."],["bnk","Sug'urta tovoni","Sug'urta hodisasi natijasida ko'rilgan zararni qoplash uchun to'lanadigan pul.","Страховое возмещение","Деньги, выплачиваемые для покрытия ущерба от страхового случая.","Insurance claim payout","The money paid to the insured to compensate a loss from a covered event."],["bnk","Franshiza","Zararning sug'urtalanuvchi o'zi qoplaydigan, sug'urtalovchi to'lamaydigan qismi.","Франшиза","Часть ущерба, которую страхователь покрывает сам и которую страховщик не возмещает.","Deductible","The part of a loss that the policyholder pays before insurance coverage applies."],["bnk","Qayta sug'urta","Sug'urtalovchi o'z riskining bir qismini boshqa sug'urta kompaniyasiga o'tkazishi.","Перестрахование","Передача страховщиком части принятого риска другой страховой компании.","Reinsurance","Insurance bought by an insurer to pass part of its risk to another insurer."],["bnk","Aktuariy","Sug'urta tariflari va zaxiralarini matematik-statistik usullar bilan hisoblaydigan mutaxassis.","Актуарий","Специалист, рассчитывающий страховые тарифы и резервы математическими и статистическими методами.","Actuary","A professional who uses mathematics and statistics to price insurance and assess risk."],["bnk","Kasko","Avtomobilning o'g'irlanishi, shikastlanishi va boshqa zararlarini qoplaydigan ixtiyoriy sug'urta.","КАСКО","Добровольное страхование автомобиля от угона, повреждений и других ущербов.","Comprehensive car insurance (CASCO)","Voluntary insurance that covers a car against theft, damage and other losses."],["bnk","Hayotni sug'urtalash","Sug'urtalanuvchi vafot etsa yoki belgilangan yoshga yetsa to'lov kafolatlaydigan sug'urta turi.","Страхование жизни","Вид страхования, гарантирующий выплату при смерти застрахованного или достижении им оговорённого возраста.","Life insurance","Insurance that pays a sum on the insured person's death or at a set age."],["bnk","Mulkni sug'urtalash","Uy, avtomobil, jihoz kabi mol-mulkni yong'in, o'g'rilik va boshqa xavflardan sug'urtalash.","Имущественное страхование","Страхование имущества, например жилья и техники, от пожара, кражи и других рисков.","Property insurance","Insurance protecting homes, vehicles and belongings against fire, theft and other risks."],["bnk","Tibbiy sug'urta","Kasallik holatida tibbiy xizmat xarajatlarini sug'urtalovchi qoplaydigan sug'urta.","Медицинское страхование","Страхование, при котором страховщик оплачивает расходы на лечение при болезни.","Health insurance","Insurance that covers the cost of medical care when the insured falls ill."],["bnk","Javobgarlikni sug'urtalash","Sug'urtalanuvchi boshqalarga yetkazgan zarar uchun to'lov majburiyatini sug'urtalash.","Страхование ответственности","Страхование обязанности возместить ущерб, причинённый страхователем другим лицам.","Liability insurance","Insurance covering the policyholder's legal responsibility for harm caused to others."],["bnk","Majburiy sug'urta","Qonunga ko'ra har bir tegishli shaxs yoki tashkilot tuzishi shart bo'lgan sug'urta.","Обязательное страхование","Страхование, которое по закону обязаны оформлять определённые лица и организации.","Compulsory insurance","Insurance that the law requires certain people or organizations to buy."],["bnk","Ixtiyoriy sug'urta","Taraflarning o'z xohishiga ko'ra shartnoma tuzish asosida amalga oshiriladigan sug'urta.","Добровольное страхование","Страхование, которое заключается по желанию сторон на основе договора.","Voluntary insurance","Insurance purchased by choice rather than because the law requires it."],["bnk","Sug'urta brokeri","Mijoz manfaatida sug'urta shartnomasi tuzishda vositachilik qiluvchi mustaqil shaxs yoki kompaniya.","Страховой брокер","Независимое лицо или компания, посредничающая между клиентом и страховщиком в интересах клиента.","Insurance broker","An independent intermediary who arranges insurance for clients, acting in their interest."],["bnk","Andderrayting","Sug'urtalovchining riskni baholab, shartnoma tuzish yoki tuzmaslikni va narxini belgilash jarayoni.","Андеррайтинг","Процесс оценки риска страховщиком и решения о заключении договора и его цене.","Underwriting","The insurer's process of assessing risk and deciding whether to accept it and at what price."],["bnk","Sug'urta zaxiralari","Sug'urtalovchining kelgusi to'lovlarni bajarish uchun shakllantiradigan mablag'lari.","Страховые резервы","Средства, формируемые страховщиком для выполнения будущих страховых выплат.","Insurance reserves","Funds an insurer sets aside to pay future claims."],["bnk","Pensiya tizimi","Keksayganda, nogironlik yoki boquvchisini yo'qotganda fuqarolarga muntazam to'lovlarni ta'minlovchi tizim.","Пенсионная система","Система, обеспечивающая гражданам регулярные выплаты в старости, при инвалидности или потере кормильца.","Pension system","A system providing regular income to people in old age, disability or loss of a breadwinner."],["bnk","Taqsimlovchi pensiya tizimi","Hozirgi ishlayotganlar badallari hisobidan hozirgi pensionerlarga to'lov to'lanadigan pensiya tizimi.","Распределительная пенсионная система","Система, в которой пенсии нынешним пенсионерам выплачиваются из взносов работающих сегодня.","Pay-as-you-go pension system","A scheme where current workers' contributions fund the pensions of current retirees."],["bnk","Jamg'ariladigan pensiya tizimi","Har bir kishi badallari shaxsiy hisobvaraqda yig'ilib, investitsiya qilinadigan pensiya tizimi.","Накопительная пенсионная система","Система, в которой взносы копятся на индивидуальном счёте и инвестируются.","Funded pension system","A scheme where each person's contributions are accumulated and invested in an individual account."],["bnk","Nodavlat pensiya fondi","Aholining ixtiyoriy pensiya badallarini qabul qilib, investitsiya qiluvchi xususiy fond.","Негосударственный пенсионный фонд","Частный фонд, принимающий добровольные пенсионные взносы граждан и инвестирующий их.","Private pension fund","A private fund that collects voluntary retirement contributions and invests them."],["bnk","Pensiya yoshi","Qonunda belgilangan, yetganda fuqaro pensiya olish huquqiga ega bo'ladigan yosh.","Пенсионный возраст","Установленный законом возраст, по достижении которого гражданин получает право на пенсию.","Retirement age","The legally set age at which a person becomes eligible for a pension."],["bnk","Pensiya badallari","Ish beruvchi va xodim tomonidan pensiya tizimiga muntazam to'lanadigan mablag'lar.","Пенсионные взносы","Регулярные платежи работодателя и работника в пенсионную систему.","Pension contributions","Regular payments made by employers and employees into a pension scheme."],["inv","IPO (dastlabki ommaviy taklif)","Kompaniya aksiyalarini birinchi marta keng jamoatchilikka sotishi.","IPO (первичное публичное размещение)","Первая продажа акций компании неограниченному кругу инвесторов на бирже.","IPO (initial public offering)","The first sale of a company's shares to the public on a stock exchange."],["inv","Broker","Mijoz topshirig'i bilan qimmatli qog'ozlar oldi-sotdisini amalga oshiruvchi vositachi.","Брокер","Посредник, совершающий сделки с ценными бумагами по поручению клиента.","Broker","An intermediary who buys and sells securities on behalf of clients for a fee."],["inv","Ko'tarilish bozori (buqa bozori)","Narxlar uzoq vaqt o'sib, investorlar optimizmi yuqori bo'lgan bozor holati.","Бычий рынок","Состояние рынка, при котором цены длительно растут, а настроения инвесторов оптимистичны.","Bull market","A market period in which prices rise steadily and investor optimism is high."],["inv","Tushish bozori (ayiq bozori)","Narxlar kamida 20 foizga tushib, pessimizm hukm surgan bozor holati.","Медвежий рынок","Состояние рынка, при котором цены падают на 20 процентов и более на фоне пессимизма.","Bear market","A market period in which prices fall by around 20 percent or more amid pessimism."],["inv","Volatillik","Aktiv narxining vaqt davomida o'zgarish darajasi va keskinligi.","Волатильность","Степень и скорость колебаний цены актива за определённый период.","Volatility","The degree to which an asset's price fluctuates over time."],["inv","Beta koeffitsiyenti","Aksiya daromadining umumiy bozor daromadiga nisbatan sezgirligini o'lchaydigan ko'rsatkich.","Бета-коэффициент","Показатель чувствительности доходности акции к изменениям доходности рынка в целом.","Beta","A measure of how sensitively a stock's return moves relative to the overall market."],["inv","Portfel","Investor egalik qiladigan moliyaviy aktivlar majmui.","Портфель","Совокупность финансовых активов, принадлежащих инвестору.","Portfolio","The collection of financial assets held by an investor."],["inv","ETF (birjada savdo qilinadigan fond)","Indeksni takrorlab, aksiya kabi birjada sotiladigan investitsiya fondi.","ETF (биржевой фонд)","Инвестиционный фонд, повторяющий индекс и торгующийся на бирже как обычная акция.","ETF (exchange-traded fund)","An investment fund that tracks an index or basket of assets and trades on an exchange like a stock."],["inv","Paychi investitsiya fondi","Ko'p investorlar mablag'ini yig'ib, mutaxassislar boshqaruvida qimmatli qog'ozlarga joylashtiruvchi fond.","Паевой инвестиционный фонд","Фонд, объединяющий средства многих инвесторов и вкладывающий их в ценные бумаги под управлением профессионалов.","Mutual fund","A pooled investment vehicle managed by professionals that invests many investors' money in securities."],["inv","Derivativlar (hosilaviy moliyaviy vositalar)","Qiymati boshqa aktiv narxiga bog'liq bo'lgan moliyaviy shartnomalar.","Производные финансовые инструменты","Финансовые контракты, стоимость которых зависит от цены другого базового актива.","Derivatives","Financial contracts whose value depends on the price of an underlying asset."],["inv","Svop","Tomonlar kelajakdagi pul oqimlarini o'zaro almashtirishga kelishadigan shartnoma.","Своп","Соглашение, по которому стороны обмениваются будущими денежными потоками.","Swap","An agreement in which two parties exchange future cash flows, such as fixed for floating interest payments."],["inv","Xedjirlash","Narx yoki kurs o'zgarishidan ko'riladigan zararni kamaytirish uchun qarama-qarshi pozitsiya ochish.","Хеджирование","Открытие противоположной позиции для снижения риска убытков от изменения цен или курсов.","Hedging","Taking an offsetting position to reduce the risk of losses from adverse price or rate movements."],["inv","Arbitraj","Bir aktivning turli bozorlardagi narx farqidan xatarsiz foyda olish.","Арбитраж","Получение безрисковой прибыли за счёт разницы цен одного и того же актива на разных рынках.","Arbitrage","Earning risk-free profit by exploiting price differences of the same asset in different markets."],["inv","Qisqa savdo (short sotuv)","Qarzga olingan aktivni sotib, narx tushganda arzonroq qaytarib sotib olish orqali foyda ko'rish strategiyasi.","Короткая продажа","Стратегия продажи заимствованного актива с расчётом выкупить его позже дешевле.","Short selling","A strategy of selling a borrowed asset in hope of buying it back later at a lower price."],["inv","Marja","Investorning o'z mablag'i hisobidan qoplanadigan, qarz bilan savdo qilishda talab etiladigan garov qismi.","Маржа","Часть собственных средств инвестора, вносимая в качестве обеспечения при торговле с заёмными деньгами.","Margin","The investor's own funds deposited as collateral when trading with borrowed money."],["inv","Bozor kapitalizatsiyasi","Kompaniya muomaladagi barcha aksiyalarining umumiy bozor qiymati.","Рыночная капитализация","Совокупная рыночная стоимость всех находящихся в обращении акций компании.","Market capitalization","The total market value of a company's outstanding shares."],["inv","P/E koeffitsiyenti","Aksiya narxining bir aksiyaga to'g'ri keladigan foydaga nisbati.","Коэффициент P/E","Отношение цены акции к прибыли на одну акцию.","Price-to-earnings (P/E) ratio","A valuation ratio dividing a stock's price by its earnings per share."],["inv","EPS (bir aksiyaga foyda)","Sof foydaning muomaladagi aksiyalar soniga nisbati.","EPS (прибыль на акцию)","Чистая прибыль компании, делённая на число акций в обращении.","Earnings per share (EPS)","A company's net profit divided by the number of its outstanding shares."],["inv","ROE (xususiy kapital rentabelligi)","Sof foydaning aksiyadorlar kapitaliga nisbati.","ROE (рентабельность капитала)","Отношение чистой прибыли к собственному капиталу акционеров.","Return on equity (ROE)","Net income divided by shareholders' equity, showing how efficiently equity generates profit."],["inv","ROA (aktivlar rentabelligi)","Sof foydaning kompaniya umumiy aktivlariga nisbati.","ROA (рентабельность активов)","Отношение чистой прибыли к общей величине активов компании.","Return on assets (ROA)","Net income divided by total assets, showing how efficiently assets generate profit."],["inv","ROI (investitsiya rentabelligi)","Investitsiyadan olingan sof foydaning sarflangan mablag'ga nisbati.","ROI (рентабельность инвестиций)","Отношение чистой прибыли от инвестиции к сумме вложений.","Return on investment (ROI)","The net gain from an investment divided by its cost."],["inv","CAPM (kapital aktivlarini baholash modeli)","Aktivning kutilayotgan daromadini risksiz stavka, beta va bozor risk mukofoti orqali hisoblaydigan model.","CAPM (модель оценки капитальных активов)","Модель, определяющая ожидаемую доходность актива через безрисковую ставку, бету и рыночную премию за риск.","CAPM (capital asset pricing model)","A model estimating an asset's expected return from the risk-free rate, its beta and the market risk premium."],["inv","Samarali bozor gipotezasi","Aktivlar narxi barcha mavjud axborotni to'liq aks ettiradi, degan nazariya.","Гипотеза эффективного рынка","Теория, согласно которой цены активов полностью отражают всю доступную информацию.","Efficient market hypothesis","The theory that asset prices already reflect all available information."],["inv","Texnik tahlil","Kelajakdagi narxni o'tmishdagi narx va savdo hajmi grafiklari asosida bashorat qilish usuli.","Технический анализ","Метод прогнозирования цен на основе графиков прошлых цен и объёмов торгов.","Technical analysis","A method of forecasting prices using charts of past prices and trading volume."],["inv","Fundamental tahlil","Aktivning haqiqiy qiymatini kompaniya moliyaviy holati va iqtisodiy omillar orqali baholash usuli.","Фундаментальный анализ","Метод оценки внутренней стоимости актива по финансовому состоянию компании и экономическим факторам.","Fundamental analysis","A method of estimating an asset's intrinsic value from financial statements and economic factors."],["inv","Xususiy kapital (private equity)","Birjada ro'yxatdan o'tmagan kompaniyalarga yoki ularni sotib olishga yo'naltirilgan investitsiya.","Прямые инвестиции (private equity)","Инвестиции в компании, не торгующиеся на бирже, либо в их выкуп.","Private equity","Investment in companies not listed on public exchanges, or in buyouts of such companies."],["inv","Kraudfanding","Loyiha uchun mablag'ni internet platformasi orqali ko'plab kishilardan yig'ish.","Краудфандинг","Сбор средств на проект от большого числа людей через интернет-платформу.","Crowdfunding","Raising small amounts of money from many people through an online platform to fund a project."],["inv","Blokcheyn","Yozuvlar bloklari zanjiri sifatida taqsimlangan holda saqlanadigan o'zgartirib bo'lmaydigan ma'lumotlar bazasi.","Блокчейн","Распределённая база данных, хранящая записи в виде цепочки блоков, которую практически невозможно изменить.","Blockchain","A distributed ledger that records transactions in linked blocks that are very hard to alter."],["inv","Tovar aktivlari (commodities)","Neft, oltin, bug'doy kabi standartlashtirilgan va birjada savdo qilinadigan xomashyo.","Сырьевые товары","Стандартизированное сырьё, такое как нефть, золото или пшеница, торгуемое на биржах.","Commodities","Standardized raw materials such as oil, gold or wheat traded on exchanges."],["inv","Forex (valyuta bozori)","Valyutalar bir-biriga almashtiriladigan global bozor.","Форекс (валютный рынок)","Глобальный рынок, на котором одни валюты обмениваются на другие.","Forex (foreign exchange market)","The global market where currencies are exchanged for one another."],["inv","Ko'chmas mulkka investitsiya","Daromad yoki qiymat o'sishi uchun yer, uy yoki tijorat binolarini sotib olish.","Инвестиции в недвижимость","Покупка земли, жилья или коммерческих объектов ради дохода от аренды или роста стоимости.","Real estate investing","Buying land, homes or commercial property to earn rental income or gain from price growth."],["inv","Investitsiya riski","Haqiqiy daromad kutilganidan past bo'lishi yoki mablag' yo'qolishi ehtimoli.","Инвестиционный риск","Вероятность того, что фактическая доходность окажется ниже ожидаемой или вложения будут потеряны.","Investment risk","The chance that actual returns will be lower than expected or that capital will be lost."],["inv","Risk mukofoti","Investorga risksiz aktivdan ko'ra xatarli aktivni tanlagani uchun to'lanadigan qo'shimcha daromad.","Премия за риск","Дополнительная доходность, компенсирующая инвестору выбор рискованного актива вместо безрискового.","Risk premium","The extra return investors expect for holding a risky asset instead of a risk-free one."],["inv","Imtiyozli aksiya","Qat'iy yoki oldindan belgilangan dividend beradigan, odatda ovoz berish huquqisiz aksiya.","Привилегированная акция","Акция с фиксированным или приоритетным дивидендом, обычно без права голоса.","Preferred stock","A share with priority claim on dividends and assets, usually without voting rights."],["inv","Oddiy aksiya","Egasiga ovoz berish huquqini va o'zgaruvchan dividendni beradigan aksiya.","Обыкновенная акция","Акция, дающая право голоса и переменный дивиденд в зависимости от прибыли.","Common stock","A share that carries voting rights and variable dividends tied to company profit."],["inv","Davlat obligatsiyasi","Davlat byudjet taqchilligini qoplash uchun chiqaradigan qarz qimmatli qog'ozi.","Государственная облигация","Долговая ценная бумага, выпускаемая государством для финансирования бюджетных расходов.","Government bond","A debt security issued by a government to finance its spending."],["inv","Korporativ obligatsiya","Kompaniya faoliyatini moliyalashtirish uchun chiqaradigan qarz qimmatli qog'ozi.","Корпоративная облигация","Долговая ценная бумага, выпускаемая компанией для финансирования своей деятельности.","Corporate bond","A debt security issued by a company to raise funds."],["inv","So'ndirishgacha daromadlilik","Obligatsiyani muddatigacha ushlab turganda olinadigan umumiy yillik daromad.","Доходность к погашению","Совокупная годовая доходность облигации при удержании её до срока погашения.","Yield to maturity","The total annual return from a bond if held until it matures."],["inv","Kredit reytingi","Qarz oluvchining qarzni o'z vaqtida to'lash qobiliyatiga berilgan baho.","Кредитный рейтинг","Оценка способности заёмщика своевременно погашать долговые обязательства.","Credit rating","An assessment of a borrower's ability to repay its debts on time."],["inv","Kol opsioni","Aktivni belgilangan narxda sotib olish huquqini beradigan opsion.","Опцион колл","Опцион, дающий право купить актив по фиксированной цене.","Call option","An option giving the holder the right to buy an asset at a fixed price."],["inv","Put opsioni","Aktivni belgilangan narxda sotish huquqini beradigan opsion.","Опцион пут","Опцион, дающий право продать актив по фиксированной цене.","Put option","An option giving the holder the right to sell an asset at a fixed price."],["inv","Ishlatish narxi (strayk)","Opsion bo'yicha aktiv sotib olinadigan yoki sotiladigan oldindan belgilangan narx.","Цена исполнения (страйк)","Заранее установленная цена, по которой по опциону покупается или продаётся актив.","Strike price","The predetermined price at which an option holder may buy or sell the underlying asset."],["inv","Opsion mukofoti","Opsion xaridori sotuvchiga huquq uchun to'laydigan narx.","Опционная премия","Плата, которую покупатель опциона вносит продавцу за получаемое право.","Option premium","The price a buyer pays the seller for the rights granted by an option."],["inv","Forvard shartnomasi","Aktivni kelajakda kelishilgan narxda yetkazish bo'yicha birjadan tashqarida tuziladigan shartnoma.","Форвардный контракт","Внебиржевое соглашение о поставке актива в будущем по согласованной цене.","Forward contract","A private agreement to buy or sell an asset at a set price on a future date."],["inv","Birjadan tashqari bozor","Savdo birja orqali emas, bevosita ishtirokchilar o'rtasida o'tkaziladigan bozor.","Внебиржевой рынок","Рынок, где сделки заключаются напрямую между участниками, минуя биржу.","Over-the-counter (OTC) market","A market where trades are made directly between parties rather than on an exchange."],["inv","Bid-ask spredi","Xaridor taklif qilgan eng yuqori narx bilan sotuvchi so'ragan eng past narx o'rtasidagi farq.","Спред между ценой покупки и продажи","Разница между наивысшей ценой покупателя и наименьшей ценой продавца.","Bid-ask spread","The difference between the highest price a buyer offers and the lowest price a seller asks."],["inv","Bozor orderi","Aktivni hozirgi bozor narxida darhol sotib olish yoki sotish topshirig'i.","Рыночный ордер","Поручение купить или продать актив немедленно по текущей рыночной цене.","Market order","An instruction to buy or sell immediately at the best available current price."],["inv","Limit orderi","Aktivni faqat belgilangan yoki undan yaxshi narxda bajarish topshirig'i.","Лимитный ордер","Поручение сове
